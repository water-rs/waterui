[package]
name = "webview-cef-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "CEF-backed standard WebView example for WaterUI"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib"]


[lints]
workspace = true

[dependencies]
waterui = { workspace = true, features = ["gpu", "assets", "snackbar", "highlight", "locale-datetime", "locale-list"] }
waterui-browser-cef = { workspace = true, features = ["webview"] }
webview-example = { path = "../webview", default-features = false }
