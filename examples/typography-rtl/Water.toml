waterui_path = "../.."

[package]
name = "Typography RTL"
bundle_identifier = "dev.waterui.typographyrtl"

# A browser has no system fonts, so a web build carries a face for every
# script the specimens use beyond Roboto's Latin; the native backends draw
# them with the platform's own. Each Han face is the locale's own design, as
# the locale-aware specimens require.
[[assets.font]]
name = "Noto Sans CJK SC"
platforms = ["web"]

[[assets.font]]
name = "Noto Sans CJK TC"
platforms = ["web"]

[[assets.font]]
name = "Noto Sans CJK JP"
platforms = ["web"]

[[assets.font]]
name = "Noto Sans CJK KR"
platforms = ["web"]

[[assets.font]]
name = "Noto Sans Arabic"
platforms = ["web"]

[[assets.font]]
name = "Noto Sans Hebrew"
platforms = ["web"]
