[package]
name = "dew-esp32s3-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace]

[dependencies]
kurbo = "0.13"
peniko = "0.6"
vello_cpu = { version = "0.0.9", features = ["f32_pipeline"] }
esp-idf-svc = "0.52"
log = "0.4"
waterui-core = { path = "../../../core" }
waterui-dew = { path = "../../../backends/dew", default-features = false }
waterui-graphics = { path = "../../../components/visual/graphics", default-features = false }
waterui-layout = { path = "../../../components/foundation/layout" }

[build-dependencies]
embuild = "0.33"

# The dev profile builds with full optimization: frame timings on the
# emulated 240 MHz Xtensa core are the point of this demo, and unoptimized
# vello_cpu is not representative.
# The Xtensa LLVM backend miscompiles the vello rasterization stack at
# opt-level >= 2 (corrupted strip indices surfacing as bytemuck cast
# panics or LoadProhibited; opt-level 3 even crashes the compiler in
# XtensaSizeReduce). Size-optimize everything until the upstream backend
# is fixed.
[profile.dev]
opt-level = 2
lto = "fat"
debug-assertions = false
overflow-checks = false

