[package]
name = "dew-esp32c3-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace]

[dependencies]
kurbo = "0.13"
peniko = "0.6"
vello_cpu = { version = "0.0.9", features = ["f32_pipeline"] }
esp-idf-svc = "0.52"
log = "0.4"
waterui-core = { path = "../../../core" }
waterui-dew = { path = "../../../backends/dew", default-features = false }
waterui-graphics = { path = "../../../components/visual/graphics", default-features = false }
waterui-layout = { path = "../../../components/foundation/layout" }

[build-dependencies]
embuild = "0.33"

# ESP32-C3 is a RISC-V chip, so codegen uses LLVM's mainline RISC-V backend
# (not the Xtensa fork that miscompiles the vello rasterization stack). The
# engine therefore builds and runs correctly here at full optimization,
# which is the point of this demo: real frame timings on a 160 MHz core.
[profile.dev]
opt-level = 2
debug-assertions = false
overflow-checks = false
