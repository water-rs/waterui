[package]
name = "waterkit-camera-filters-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "WaterUI + Waterkit camera filter playground example"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["ui", "framework", "example", "camera", "waterkit"]
