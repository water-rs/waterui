[package]
name = "locale-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "Locale and i18n example for WaterUI framework"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ui", "framework", "example", "i18n", "locale"]
categories = ["gui", "internationalization"]
publish = false


[lints]
workspace = true

[dependencies]
jiff.workspace = true
waterui = { workspace = true, features = ["gpu", "assets", "snackbar", "highlight", "locale-datetime", "locale-list", "locale-relative-time", "picker"] }
# The example formats dates, relative times, and unit quantities.
waterui-locale = { workspace = true, features = ["datetime", "number", "relative-time"] }
