[package]
name = "webview-system-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "WebView example for WaterUI framework"
license.workspace = true
repository.workspace = true
keywords = ["ui", "framework", "example", "webview"]
categories = ["gui"]
publish = false

[features]
default = []
dev = ["waterui/dynamic_linking"]

[dependencies]
waterui = { workspace = true, features = ["webview", "gpu", "assets", "snackbar", "highlight", "locale-datetime", "locale-list"] }
serde = { workspace = true, features = ["derive"] }
