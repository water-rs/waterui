[package]
name = "waterkit-camera-filters-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "WaterUI + Waterkit camera filter playground example"
license.workspace = true
repository.workspace = true
keywords = ["ui", "framework", "example", "camera", "waterkit"]
categories = ["gui"]
publish = false

[features]
dev = ["waterui/dynamic_linking"]

[dependencies]
waterui.workspace = true
waterkit-camera.workspace = true
waterkit-permission.workspace = true
shaderloom.workspace = true
futures.workspace = true
wgpu.workspace = true

[build-dependencies]
shaderloom = { workspace = true, features = ["build"] }

# `shaderloom` is used directly by build.rs; cargo-machete 0.9 does not scan build.rs.
[package.metadata.cargo-machete]
ignored = ["shaderloom"]
