[package]
name = "waterkit-camera-filters-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "WaterUI + Waterkit camera filter example"
license.workspace = true
repository.workspace = true
keywords = ["ui", "framework", "example", "camera", "waterkit"]
categories = ["gui"]
publish = false

[features]
dev = ["waterui/dynamic_linking"]

[lints]
workspace = true

[dependencies]
waterui = { workspace = true, features = ["gpu", "assets", "snackbar", "highlight", "locale-datetime", "locale-list"] }
waterkit-camera.workspace = true
waterkit-permission.workspace = true
shaderloom = { workspace = true, features = ["runtime"] }
futures.workspace = true
executor-core.workspace = true
wgpu.workspace = true

[build-dependencies]
shaderloom = { workspace = true, features = ["build"] }
