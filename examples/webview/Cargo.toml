[package]
name = "webview-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "WebView example for WaterUI framework"
license.workspace = true
repository.workspace = true
keywords = ["ui", "framework", "example", "webview"]
categories = ["gui"]
publish = false

[features]
default = ["wpe"]
dev = ["waterui/dynamic_linking"]
# The bundled WPE WebKit engine, for a Linux build with no system engine to
# bridge. The CEF variant of this example turns it off and installs CEF instead,
# so its package stages one browser runtime rather than two.
wpe = ["dep:waterui-browser-wpe"]

[dependencies]
waterui = { workspace = true, features = ["webview", "gpu", "assets", "snackbar", "highlight", "locale-datetime", "locale-list"] }

# The page API's types; the web build has no page API (a cross-origin frame
# cannot be scripted).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde = { workspace = true, features = ["derive"] }

# Linux has no system web engine to bridge outside GTK, so the app brings one.
[target.'cfg(target_os = "linux")'.dependencies]
waterui-browser-wpe = { workspace = true, optional = true, features = ["webview"] }
