[package]
name = "anchored-overlay-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "Anchored overlay example for WaterUI framework"
license.workspace = true
repository.workspace = true
keywords = ["ui", "framework", "example", "overlay"]
categories = ["gui"]
publish = false

[features]
dev = ["waterui/dynamic_linking"]

[dependencies]
waterui = { workspace = true, features = ["gpu", "assets", "snackbar", "highlight", "locale-datetime", "locale-list"] }
