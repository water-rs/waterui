[package]
name = "icons-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "Icon system example for WaterUI framework"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["ui", "framework", "example", "icons"]
categories = ["gui"]
publish = false

[features]
dev = ["waterui/dynamic_linking"]

[dependencies]
waterui.workspace = true
waterui-icons-fontawesome7.workspace = true
waterui-icons-material-icon.workspace = true
waterui-icons-lucide.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
waterui-icons-sf-symbol.workspace = true
