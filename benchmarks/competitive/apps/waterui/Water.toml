waterui_path = "../../../.."

[package]
name = "WaterUI Bench"
bundle_identifier = "dev.waterui.bench"

# Release signing for `water package`: the debug keystore is generated by
# the runner at build time (standard AGP debug credentials), never
# committed. Passwords come from WATERUI_ANDROID_STORE_PASSWORD /
# WATERUI_ANDROID_KEY_PASSWORD.
[signing.android]
keystore = "debug.keystore"
key_alias = "androiddebugkey"
