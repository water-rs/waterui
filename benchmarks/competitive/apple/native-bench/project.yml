name: NativeBench
# The native iOS contestants. Built on the build host for the iphoneos SDK,
# unsigned (`bench.py build`); the device host signs each with the bundle
# id manifest.json declares. NativeBench.xcodeproj is generated from this
# spec by xcodegen at bootstrap and never committed. The XCTest UI runner
# is a separate project (../xctest/project.yml) built on the device host.
options:
  bundleIdPrefix: dev.bench
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: $(TARGET_NAME)
    # CFBundleShortVersionString / CFBundleVersion of the generated
    # Info.plist — the device host's thinning export reads both
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BenchSwiftUI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources/SwiftUI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bench.swiftui
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/NotifyBridge.h"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  BenchUIKit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources/UIKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bench.native
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/NotifyBridge.h"
        # Scene-based app: without this manifest the SceneDelegate never
        # runs and the app has no window at all.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
schemes:
  BenchApps:
    build:
      targets:
        BenchSwiftUI: all
        BenchUIKit: all
