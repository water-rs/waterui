# Competitive benchmark — Android platform manifest.
# The runner reads this file; every version below is a hard pin.
# Contestant source code hardcodes the same workload constants listed here
# so that the five apps render identical UI.

[benchmark]
issue = "water-rs/waterui#1262"
harness_issue = "water-rs/waterui#1864"
repetitions = 5            # minimum; each measurement is the median of >=5 runs
workloads = ["w1", "w2", "w3", "w4", "w5", "w6"]

# The waterui contestants are built by the `water` CLI compiled from THIS
# checkout (`cargo install --locked --path cli` — cli/ is a workspace
# member). Framework, CLI and backend identity is the checkout's HEAD sha;
# the runner records it plus the root Cargo.toml's android-backend-revision
# for the `android` (Kotlin runtime) backend. There is nothing to pin here.
#
# The normative workload definition every contestant implements is
# ../WORKLOADS.md — the [workloads.*] tables below declare the harness
# parameters this leg consumes with the spec's values.

[toolchain.flutter]
version = "3.47.5"
dart_version = "3.13.4"
sdk_root = "~/flutter"        # <sdk_root>/bin/flutter must report the pins above

[toolchain.reactnative]
version = "0.81.6"          # New Architecture + Hermes; pins the lockfile
cli_version = "20.0.0"      # @react-native-community/cli — generates android/
# sha256 over the generated template files the app materializes (root files
# minus the authored set — relpath+content digest, lib/toolchain.py
# rn_template_digest): `init` re-resolving to different content fails loudly.
template_sha256 = "29b1ccee1d2054aabfff8792cd35782a65753a026c38d25d9ab8199d2a10c10f"
node_version = "24.21.0"
node_root = "~/node"         # <node_root>/bin/node must report v<node_version>

[toolchain.native]          # Jetpack Compose + Android Views contestants
agp_version = "9.3.0"
kotlin_version = "2.3.21"
compose_bom = "2025.09.01"
compile_sdk = 37
min_sdk = 26
target_sdk = 37
gradle_version = "9.6.1"    # gradle wrapper; contestants that pin their own
                          # wrapper record it in [contestant.*] below

[toolchain.android]
sdk_root = "~/Android/Sdk"
build_tools = "36.0.0"
ndk_version = "29.0.14206865"   # WaterUI Rust cross-compile; also RN .so builds
java_home = "~/jdk21"           # Temurin 21.0.12+1
jdk_version = "21"              # `java -version` must report a 21.x runtime
emulator_image = "system-images;android-36;google_apis;x86_64"
emulator_avd = "bench"
emulator_api = 36

[toolchain.bundletool]
version = "1.18.1"
sha256 = "675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c"   # bundletool-all-1.18.1.jar

# ---------------------------------------------------------------------------
# Contestants
# ---------------------------------------------------------------------------

# The shared WaterUI app (apps/waterui) is two contestants: the CLI's
# default `android` backend (Kotlin water-rs/android-backend runtime, pinned
# by android-backend-revision in the root Cargo.toml) and `--backend
# hydrolysis`. Both run every workload and report as separate columns.
[contestants.waterui]
dir = "../apps/waterui"
backend = "android"
package = "dev.waterui.bench"
activity = ".MainActivity"
kind = "waterui"
# `water package --platform android --arch <abi>` builds one ABI per
# invocation; each artifact is recorded separately under its ABI name.
abi_apks = { arm64 = "app-arm64.apk", x86_64 = "app-x86_64.apk" }
aab = "app-release.aab"
gradle_project = "backends/android"

[contestants.waterui-hydrolysis]
dir = "../apps/waterui"
backend = "hydrolysis"
package = "dev.waterui.bench"
activity = ".MainActivity"
kind = "waterui"
abi_apks = { arm64 = "app-arm64.apk", x86_64 = "app-x86_64.apk" }
aab = "app-release.aab"
gradle_project = "backends/hydrolysis"

[contestants.flutter]
dir = "../apps/flutter"
package = "dev.bench.bench_flutter"
activity = ".MainActivity"
kind = "flutter"
abi_apks = { arm64 = "app-arm64-v8a-release.apk", x86_64 = "app-x86_64-release.apk" }
aab = "app-release.aab"
gradle_project = "android"

[contestants.reactnative]
dir = "../apps/react-native"
package = "com.rnbench"
activity = ".MainActivity"
kind = "reactnative"
abi_apks = { arm64 = "app-arm64-v8a-release.apk", x86_64 = "app-x86_64-release.apk" }
aab = "app-release.aab"
gradle_project = "android"
# RN 0.81.6 ships its own Gradle wrapper; other contestants use the
# [toolchain.native] gradle_version.

[contestants.compose]
dir = "compose"
package = "dev.bench.compose"
activity = ".MainActivity"
kind = "native"
abi_apks = { arm64 = "app-arm64-v8a-release.apk", x86_64 = "app-x86_64-release.apk" }
aab = "app-release.aab"
gradle_project = "."

[contestants.views]
dir = "views"
package = "dev.bench.views"
activity = ".MainActivity"
kind = "native"
abi_apks = { arm64 = "app-arm64-v8a-release.apk", x86_64 = "app-x86_64-release.apk" }
aab = "app-release.aab"
gradle_project = "."

# ---------------------------------------------------------------------------
# Harness workload parameters — the normative definition (geometry,
# palette, text, motion model, readiness) is ../WORKLOADS.md; every
# contestant hardcodes it. These tables declare only the pacing values
# this leg's runner consumes.
#
# w1..w4 are captured by measure_rep (fixed windows in bench.py); w5/w6
# step geometrically — ONE step per `am start` (`--es workload w5 --es
# step <n>`; WaterUI reads waterui.env.BENCH_STEP), settle then hold.
# A step "collapses" (runner stops stepping) when fewer than
# collapse_frac of its presents fall inside TWO 60 Hz budgets (33.3 ms) —
# drawing slower than ~30 fps — or the capture errors.
# ---------------------------------------------------------------------------

[workloads.w1]
name = "Hello"

[workloads.w2]
name = "Feed"

[workloads.w3]
name = "Motion"

[workloads.w4]
name = "Text"

[workloads.w5]
name = "Motion capacity"
steps = [200, 400, 800, 1600, 3200, 6400, 12800, 25600]
settle_ms = 1000
hold_ms = 4000
collapse_frac = 0.5

[workloads.w6]
name = "Feed capacity"
steps = [1, 2, 4, 8, 16, 32, 64]
settle_ms = 1000
# hold covers the full shared fling program plus margin — the W2/W4 drive
# in [fling] runs during each step's hold window.
hold_ms = 17000
collapse_frac = 0.5

# The shared fling protocol (../WORKLOADS.md), declared once for every
# scrolling workload on this platform: OS-level `adb shell input swipe`
# outside the app — 8 flings down then 2 up, 75%→15% of the surface
# height, 250 ms gesture, 350 ms pause — identical for every contestant.
[fling]
down_swipes = 8
up_swipes = 2
margin_x_frac = 0.5
start_y_frac = 0.75
end_y_frac = 0.15
duration_ms = 250
pause_between_ms = 350
