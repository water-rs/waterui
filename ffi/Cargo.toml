[package]
name = "waterui-ffi"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"
description = "FFI bindings for the WaterUI cross-platform UI framework"
keywords = ["ffi", "ui", "framework", "gui", "cross-platform"]
categories = ["gui", "api-bindings"]

[dependencies]
waterui.workspace = true
waterui-core.workspace = true
waterui-text.workspace = true
waterui-form.workspace = true
waterui-navigation.workspace = true
waterui-media.workspace = true
waterui-color.workspace = true
waterui-layout.workspace = true
nami.workspace = true
executor-core.workspace = true
cbindgen = { version = "0.29.0", optional = true }
waterui-graphics.workspace = true
wgpu.workspace = true

[[bin]]
name = "generate_header"
path = "generate_header.rs"
required-features = ["cbindgen"]

[features]
default = []

[target.'cfg(all(not(target_arch = "wasm32"), any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "watchos")))'.dependencies]
native-executor = { version = "0.5.3" }

[target.'cfg(all(not(target_arch = "wasm32"), not(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "watchos"))))'.dependencies]
async-executor = "1.13"
futures-lite = "2.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
