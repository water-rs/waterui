[advisories]
# These remain only through `mathcat` (via `waterui-math`), whose releases
# require `zip` <9. With the `include-zip` feature WaterUI enables, MathCAT
# reads its rule archive from memory and its `extract()` path is not
# compiled. The entries are removed when a MathCAT release requiring `zip`
# >=9 is adopted.
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
