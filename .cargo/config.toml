[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-Clinker-flavor=lld-link"]


# `aarch64-apple-ios-sim` reaches clang as `arm64-apple-ios-sim`, whose
# 'sim' ABI spelling clang rejects; bindgen (tracing-oslog) needs the
# canonical '-simulator' triple instead. Later -target wins over the one
# bindgen synthesizes.
[env]
BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim = "-target arm64-apple-ios-simulator"
# Cherenkov's native Apple contract (graphics/cherenkov/docs/api.md) requires
# OS 26 APIs. The deployment agreement test checks these against the framework
# metadata in Cargo.toml.
MACOSX_DEPLOYMENT_TARGET = "26.0"
IPHONEOS_DEPLOYMENT_TARGET = "26.0"

# Android 15+ kernels run with 16 KB pages; every aarch64 ELF the cherenkov
# family ships or runs over adb (the planes libraries, cherenkov-bench, and
# the vulkan_external_android test binary) must have 16 KB-aligned LOAD
# segments or the loader refuses it with "ELF alignment check failed".
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# `cargo test` and `cargo nextest run` on an Apple target hand each built
# test binary to the runner below, which executes it on the destination —
# a cross-compiled artifact is never the test. The wrapper execs the
# `water test-runner` plumbing inside the `water` build `WATER_BIN` names
# (required; cargo cannot expand variables and a `water` found on PATH can
# be an older install than the checkout under test).
#
# `aarch64-apple-ios-sim` runs inside a booted iOS Simulator named by
# WATERUI_IOS_SIM_UDID, which the caller owns and creates.
#
# `aarch64-apple-ios` runs on the paired physical device named by
# WATERUI_IOS_DEVICE (a CoreDevice identifier, UDID, or name), signed with
# the already-installed development profile for the identity
# WATERUI_IOS_DEVICE_BUNDLE_ID / WATERUI_IOS_DEVICE_TEAM_ID name; the
# runner never provisions or uninstalls.
#
# `aarch64-apple-ios-macabi` runs on the host Mac: a marked binary is
# staged as a `.app` and launched through LaunchServices (`open -n -W`) —
# a Catalyst UIApplication only connects its scene under a real
# application launch — so it needs a GUI session.
[target.aarch64-apple-ios-sim]
runner = [".github/scripts/water-test-runner.sh", "simulator"]

[target.aarch64-apple-ios]
runner = [".github/scripts/water-test-runner.sh", "device"]

[target.aarch64-apple-ios-macabi]
runner = [".github/scripts/water-test-runner.sh", "catalyst"]
