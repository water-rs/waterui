[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-Clinker-flavor=lld-link"]


# `aarch64-apple-ios-sim` reaches clang as `arm64-apple-ios-sim`, whose
# 'sim' ABI spelling clang rejects; bindgen (tracing-oslog) needs the
# canonical '-simulator' triple instead. Later -target wins over the one
# bindgen synthesizes.
[env]
BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim = "-target arm64-apple-ios-simulator"
# Cherenkov's native Apple contract (graphics/cherenkov/docs/api.md) requires
# OS 26 APIs. The deployment agreement test checks these against the framework
# metadata in Cargo.toml.
MACOSX_DEPLOYMENT_TARGET = "26.0"
IPHONEOS_DEPLOYMENT_TARGET = "26.0"

# Android 15+ kernels run with 16 KB pages; every aarch64 ELF the cherenkov
# family ships or runs over adb (the planes libraries, cherenkov-bench, and
# the vulkan_external_android test binary) must have 16 KB-aligned LOAD
# segments or the loader refuses it with "ELF alignment check failed".
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# `cargo test --target aarch64-apple-ios-sim` and `cargo nextest run
# --target aarch64-apple-ios-sim` hand each built test binary to this
# runner, which executes it inside a booted iOS Simulator — a
# cross-compiled artifact is never the test. The runner requires
# WATERUI_IOS_SIM_UDID to name the simulator the caller owns.
[target.aarch64-apple-ios-sim]
runner = [".github/scripts/nextest-ios-sim.sh"]
