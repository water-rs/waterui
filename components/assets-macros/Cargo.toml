[package]
name = "waterui-assets-macros"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Procedural macros for WaterUI asset management (asset! macro)"
keywords = ["assets", "macros", "proc-macro", "ui"]
categories = ["gui", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
waterui-assets.workspace = true
waterui-assets-planner.workspace = true

[lints]
workspace = true
