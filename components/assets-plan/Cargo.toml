[package]
name = "waterui-assets-plan"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Shared WaterUI asset discovery and planning"
keywords = ["assets", "bundle", "planner", "waterui"]
categories = ["gui", "development-tools"]

[dependencies]
heck = "0.5"
serde = { workspace = true, features = ["derive"] }
syn = { version = "2", features = ["full", "visit", "parsing"] }
thiserror.workspace = true
toml = "0.8"
walkdir = "2.5"
waterui-assets.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.26"
