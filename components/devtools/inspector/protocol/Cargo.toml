[package]
name = "waterui-inspector-protocol"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../../README.md"
repository.workspace = true
description = "Shared protocol for WaterUI inspector runtime streaming"
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[dependencies]
serde = { workspace = true, features = ["derive", "std"] }
bincode = { version = "2.0.1", features = ["serde"] }
bitflags = { workspace = true, features = ["serde"] }
thiserror.workspace = true
futures-lite = "2.6"
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `kill(pid, 0)` has no Windows equivalent, so the liveness check there opens
# the process and asks whether its handle has been signalled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[lints]
workspace = true
