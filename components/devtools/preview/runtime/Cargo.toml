[package]
name = "waterui-preview"
version = "0.1.2"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../../../README.md"
repository.workspace = true
description = "Preview view component for WaterUI"
keywords.workspace = true
categories.workspace = true

[dependencies]
waterui-core.workspace = true
waterui-internal.workspace = true
waterui-layout.workspace = true
waterui-preview-protocol.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
async-channel = "2.5"
indexmap = "2"
blocking = "1.7"
async-fs = "2.2.0"
async-process = "2.5.0"
serde_json = "1.0"

# Async runtime
async-io = "2.6"
executor-core.workspace = true
futures-lite = "2.6"

# Dynamic library loading
libloading = "0.9"

# PNG encoding
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# TypeScript views in a preview: a `#[preview]` that returns a `tsx!` view
# renders when `water preview` names the bundle it built in
# `WATERUI_TS_BUNDLE` (an absolute path, since the support app is not a cargo
# test process). The support app is built with this feature exactly when the
# previewed project uses TypeScript views, which keeps the JavaScript engine
# out of every other project's support app.
ts = ["waterui-internal/ts"]

[lints]
workspace = true
