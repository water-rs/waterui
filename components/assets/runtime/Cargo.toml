[package]
name = "waterui-assets"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Asset management for WaterUI (Data, LargeFile, caching)"
keywords = ["assets", "resources", "mmap", "ui", "components"]
categories = ["gui", "caching"]

[dependencies]
waterui-core.workspace = true
waterui-url = { workspace = true, features = ["std"] }
waterui-media.workspace = true
waterui-video.workspace = true
tracing.workspace = true
blocking = "1.6.2"

# Caching
sha2 = "0.11"
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"
tempfile = "3.27"
dirs.workspace = true

[features]
default = ["std"]
std = ["waterui-core/std"]

[lints]
workspace = true
