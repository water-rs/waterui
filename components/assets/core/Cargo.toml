[package]
name = "waterui-assets-core"
version = "0.5.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Media-free WaterUI asset primitives (AssetKind, AssetError, remote download, atomic writes)"
keywords = ["assets", "io", "waterui"]
categories = ["gui", "filesystem"]

[dependencies]
waterui-url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blocking = { version = "1.7.0", optional = true }
tempfile = { version = "3.27", optional = true }

[features]
default = ["std"]
std = ["waterui-url/std", "dep:blocking", "dep:tempfile"]

[lints]
workspace = true
