[package]
name = "waterui-assets"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Asset management for WaterUI (Data, LargeFile, caching)"
keywords = ["assets", "resources", "mmap", "ui", "components"]
categories = ["gui", "caching"]

[dependencies]
waterui-core.workspace = true
waterui-url = { workspace = true, features = ["std"] }
waterui-media.workspace = true
waterui-video.workspace = true
thiserror.workspace = true
tracing.workspace = true
executor-core.workspace = true
blocking = "1.6.2"

# Memory mapping for large files
memmap2 = "0.9"

# Caching
sha2 = "0.10"
hex = "0.4"

# Async filesystem
smol = "2.0"
tempfile = "3.26"
waterkit-fs.workspace = true

[features]
default = ["std"]
std = ["waterui-core/std"]

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["executor-core", "thiserror"]
