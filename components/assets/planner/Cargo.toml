[package]
name = "waterui-assets-planner"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Shared WaterUI asset discovery and planning"
keywords = ["assets", "bundle", "planner", "waterui"]
categories = ["gui", "development-tools"]

[features]
# `dependency_font_declarations`: the font declarations a resolved Cargo graph
# carries. Off by default so the asset proc macro does not build
# `cargo_metadata`.
font-declarations = ["dep:cargo_metadata"]

[dependencies]
cargo_metadata = { workspace = true, optional = true }
heck = "0.5"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml = "1.1"
walkdir = "2.5"
waterui-assets-core.workspace = true
# The artifact-channel record format bundle metadata rides in — a
# `waterui_meta_*` static's bytes are a `name`, NUL, `payload`, NUL record in
# the `.wmeta` section, so one record shape serves objects, rlibs, and linked
# images (a linked PE keeps no symbol table to name a static).
waterui-meta.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27"
