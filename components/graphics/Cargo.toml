[package]
name = "waterui-graphics"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Graphic components for WaterUI"
keywords = ["graphics", "2d", "ui", "waterui"]
categories = ["gui"]

[features]
default = []
svg-render = ["dep:resvg", "dep:usvg", "dep:tiny-skia"]

[dependencies]
waterui-core.workspace = true
waterui-str.workspace = true
nami.workspace = true
pastey.workspace = true
wgpu.workspace = true
bytemuck = "1.14"
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.45", optional = true }
usvg = { version = "0.45", optional = true }
tiny-skia = { workspace = true, optional = true }

[lints]
workspace = true
