[package]
name = "waterui-shape"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Shape primitives and filled shapes for WaterUI using Lyon tessellation"
keywords = ["shape", "graphics", "waterui", "lyon", "hdr"]
categories = ["gui"]

[dependencies]
waterui-core.workspace = true
waterui-graphics.workspace = true
wgpu.workspace = true
tracing.workspace = true
nami.workspace = true
bytemuck = { version = "1.25", features = ["derive"] }
num-traits = { version = "0.2", default-features = false }

[dev-dependencies]
waterui.workspace = true
waterui-testing.workspace = true

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["tracing"]
