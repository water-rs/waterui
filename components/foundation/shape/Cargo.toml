[package]
name = "waterui-shape"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Shape primitives and filled shapes for WaterUI using Lyon tessellation"
keywords = ["shape", "graphics", "waterui", "lyon", "hdr"]
categories = ["gui"]

[features]
default = ["gpu"]
# GPU-backed morphing-shape renderer (wgpu). When disabled, morph shapes still
# emit their `ResolvedMorphShape` native semantic object for backends to render,
# but no in-crate GPU fallback is compiled, so wgpu/vello are not pulled in.
gpu = ["waterui-graphics/gpu", "dep:wgpu", "dep:bytemuck", "dep:num-traits"]

[dependencies]
waterui-core.workspace = true
waterui-graphics = { workspace = true, default-features = false }
wgpu = { workspace = true, optional = true }
tracing.workspace = true
nami.workspace = true
bytemuck = { version = "1.25", features = ["derive"], optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
waterui.workspace = true
waterui-testing.workspace = true

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["tracing"]
