[package]
name = "waterui-interaction"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../../README.md"
repository.workspace = true
description = "Interaction, gesture, event, and keyboard semantics for WaterUI"
keywords = ["interaction", "gesture", "event", "keyboard", "ui", "waterui"]
categories = ["gui"]

[dependencies]
bitflags.workspace = true
executor-core = { workspace = true, optional = true }
keyboard-types.workspace = true
nami.workspace = true
suiteki.workspace = true
tracing = { workspace = true, optional = true }
waterkit-haptic = { workspace = true, optional = true }
waterui-core = { workspace = true, default-features = false }
waterui-url.workspace = true

[features]
haptics = ["dep:executor-core", "dep:tracing", "dep:waterkit-haptic"]

[lints]
workspace = true
