[package]
name = "waterui-form"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Form components for WaterUI (inputs, buttons, validation)"
keywords = ["form", "input", "validation", "ui", "components"]
categories = ["gui"]


[dependencies]
jiff.workspace = true
waterui-locale.workspace = true
waterui-core.workspace = true
waterui-layout.workspace = true
nami.workspace = true
waterui-controls.workspace = true
waterui-text.workspace = true
waterui-url.workspace = true
waterui-graphics.workspace = true
waterui-shape.workspace = true
waterui-macros.workspace = true
waterkit-dialog = { workspace = true, optional = true }
tracing.workspace = true
zeroize = { version = "1.8.2", default-features = false }
bcrypt = "0.17.1"
regex = "1.12.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }

[features]
default = ["std"]
std = ["dep:waterkit-dialog"]

[dev-dependencies]
hydrolysis-m3.workspace = true
waterui.workspace = true
waterui-testing.workspace = true


[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["getrandom", "waterui-macros"]
