[package]
name = "waterui-controls"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Controls and interactive widgets for WaterUI"
keywords = ["ui", "controls", "widgets", "interactive"]
categories = ["gui"]


[dependencies]
waterui-core.workspace = true
waterui-color.workspace = true
waterui-accessibility.workspace = true
waterui-interaction.workspace = true
waterui-macros.workspace = true
waterui-layout.workspace = true
nami.workspace = true
waterui-text.workspace = true
waterui-locale.workspace = true
executor-core.workspace = true
native-executor = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
thiserror = { version = "2.0.21", default-features = false }
tracing = { workspace = true, optional = true }
unicode-segmentation = { version = "1.13", optional = true }
waterui-contract = { workspace = true, optional = true }
waterui-shape = { workspace = true, default-features = false, optional = true }
waterui-url = { workspace = true, optional = true }


[features]
default = ["all"]
all = [
    "avatar",
    "dialog",
    "image",
    "link",
    "list",
    "menu",
    "slider",
    "snackbar",
    "stepper",
    "table",
    "text-field",
    "toggle",
]
avatar = ["dep:unicode-segmentation", "dep:waterui-shape"]
dialog = ["dep:waterui-contract"]
highlight = ["waterui-text/highlight"]
image = ["dep:waterui-url"]
link = ["dep:waterui-url"]
list = ["dep:waterui-contract"]
menu = []
slider = []
snackbar = ["dep:native-executor", "dep:tracing"]
stepper = []
table = ["list"]
text-field = ["menu"]
toggle = []
# Serialize `ContentType` (camelCase names) — the Hydrolysis Android publish
# and the MCP snapshot tree both cross a JSON boundary with it.
serde = ["dep:serde"]

[dev-dependencies]
waterui = { path = "../../.." }
waterui-testing = { path = "../../../testing" }


[lints]
workspace = true