[package]
name = "waterui-controls"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Form components for WaterUI (inputs, buttons, validation)"
keywords = ["form", "input", "validation", "ui", "components"]
categories = ["gui"]


[dependencies]
waterui-core.workspace = true
waterui-macros.workspace = true
waterui-layout.workspace = true
nami.workspace = true
waterui-text.workspace = true
waterui-locale.workspace = true
waterui-icon.workspace = true
executor-core.workspace = true
serde = { workspace = true, optional = true, features = ["derive"] }


[features]
default = []
# Serialize `ContentType` (camelCase names) — the Hydrolysis Android publish
# and the MCP snapshot tree both cross a JSON boundary with it.
serde = ["dep:serde"]

[dev-dependencies]
waterui = { path = "../../.." }
waterui-testing = { path = "../../../testing" }


[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["waterui-macros"]