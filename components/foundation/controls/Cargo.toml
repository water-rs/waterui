[package]
name = "waterui-controls"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Controls and interactive widgets for WaterUI"
keywords = ["ui", "controls", "widgets", "interactive"]
categories = ["gui"]


[dependencies]
waterui-core.workspace = true
waterui-macros.workspace = true
waterui-layout.workspace = true
nami.workspace = true
waterui-text.workspace = true
waterui-locale.workspace = true
waterui-icon.workspace = true
executor-core.workspace = true
serde = { workspace = true, optional = true, features = ["derive"] }
thiserror = { version = "2.0.21", default-features = false }


[features]
default = ["all"]
all = ["menu", "slider", "stepper", "text-field", "toggle"]
menu = []
slider = []
stepper = []
text-field = ["menu"]
toggle = []
# Serialize `ContentType` (camelCase names) — the Hydrolysis Android publish
# and the MCP snapshot tree both cross a JSON boundary with it.
serde = ["dep:serde"]

[dev-dependencies]
waterui = { path = "../../.." }
waterui-testing = { path = "../../../testing" }


[lints]
workspace = true