[package]
name = "waterui-layout"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Layout components for WaterUI"
keywords = ["layout", "ui", "components", "flexbox"]
categories = ["gui"]


[dependencies]
waterui-core.workspace = true
nami.workspace = true
smallvec.workspace = true
waterui-graphics.workspace = true
num-traits = { version = "0.2", default-features = false }

[dev-dependencies]
waterui = { path = "../../..", default-features = false }


[lints]
workspace = true

# The facade is used by the crate's compiled rustdoc examples; cargo-machete does not scan those imports.
[package.metadata.cargo-machete]
ignored = ["waterui"]
