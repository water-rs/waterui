[package]
name = "waterui-layout"
version = "0.2.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Layout components for WaterUI"
keywords = ["layout", "ui", "components", "flexbox"]
categories = ["gui"]


[features]
# Parallelize child measurement across CPU cores (honoring SubView::require_main_thread).
# Pulls in std via rayon; leave disabled for no_std/embedded (dew) which measures serially.
parallel = ["dep:rayon"]

[dependencies]
waterui-core.workspace = true
nami.workspace = true
waterui-graphics.workspace = true
num-traits = { version = "0.2", default-features = false }
rayon = { version = "1.12", optional = true }

[dev-dependencies]
hydrolysis-m3.workspace = true
waterui.workspace = true
waterui-testing.workspace = true


[lints]
workspace = true
