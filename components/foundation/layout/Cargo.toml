[package]
name = "waterui-layout"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Layout components for WaterUI"
keywords = ["layout", "ui", "components", "flexbox"]
categories = ["gui"]


[dependencies]
waterui-core.workspace = true
nami.workspace = true
smallvec.workspace = true
waterui-graphics.workspace = true
num-traits = { version = "0.2", default-features = false }

[dev-dependencies]
# `snackbar` for the bar's container-width-bounds tests; the rest of the
# facade surface these tests touch (stacks, scroll, text, controls) is
# feature-free.
waterui = { path = "../../..", default-features = false, features = ["snackbar"] }
# The tests mount the components this crate owns on the shared headless
# runtimes — semantic for tree assertions, `TestStyle` offscreen where the
# contract is geometry (water-rs/waterui#1673).
waterui-testing = { path = "../../../testing" }


[lints]
workspace = true

# The facade is used by the crate's compiled rustdoc examples; cargo-machete does not scan those imports.
[package.metadata.cargo-machete]
ignored = ["waterui"]
