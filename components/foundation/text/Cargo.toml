[package]
name = "waterui-text"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Text and typography components for WaterUI"
keywords = ["text", "typography", "ui", "components"]
categories = ["gui", "text-processing"]

[dependencies]
waterui-core.workspace = true
waterui-macros.workspace = true
waterui-graphics.workspace = true
suiteki.workspace = true
waterui-locale.workspace = true
nami.workspace = true
syntect = { version = "5", default-features = false, features = ["default-themes", "regex-fancy"], optional = true }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"], optional = true }
pulldown-cmark = { version = "0.13", optional = true }
smallvec.workspace = true
# The font database behind `collection::FontCollection`, the one collection a
# host installs and every self-drawing text component shares. Optional, and off
# by default: an application whose text is drawn by the platform's own engine
# never reaches for a `parley` collection and must not carry the font stack
# behind it. `libm` rather than `std` because the collection is equally the one
# an embedded renderer installs; a build that also enables `parley/std` gets
# std's implementations regardless.
parley = { workspace = true, optional = true, features = ["libm"] }
# `Code`, the fenced-code widget, composes its block out of the layout
# primitives and reports clipboard failures through `tracing`. Both sit behind
# `highlight`, the feature the widget itself is behind.
waterui-layout = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# The workspace clipboard (waterkit-clipboard). Unlike the per-call
# `arboard::Clipboard` this replaces, its desktop backend keeps serving the
# selection after `set_text` returns — an X11 worker thread owns it for the
# process's life and a forked child owns it on Wayland — so copied text
# survives the handle that wrote it. The crate builds only where a system
# clipboard exists; other targets use a no-op copy in src/code.rs.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos", target_os = "ios", target_os = "android", target_arch = "wasm32"))'.dependencies]
waterkit-clipboard = { workspace = true, optional = true }

[features]
default = ["highlight"]
# `DefaultHighlighter`, the bundled syntect/two-face syntax highlighter, and
# with it the syntax and theme definitions those two crates carry, plus `Code`,
# the fenced-code widget built on it, with the layout primitives it composes
# and the platform clipboard its copy button writes to. `Language`, the
# `Highlighter` trait and `HighlightChunk` stay unconditional, so an
# application that installs its own highlighter — or renders code plain — can
# drop the bundled one without losing the vocabulary the rest of the API speaks.
highlight = [
    "dep:syntect",
    "dep:two-face",
    "dep:waterui-layout",
    "dep:tracing",
    "dep:waterkit-clipboard",
]
# Markdown parsing: `StyledStr::from_markdown` and the `pulldown-cmark` types
# its inline builder is driven by.
markdown = ["dep:pulldown-cmark"]
# `collection::FontCollection`: the one `parley` font collection a host installs
# into the environment and every component that shapes or typesets text itself
# reads back out. Turned on by those components (`waterui-math` and friends),
# not by applications.
font-collection = ["dep:parley"]
# Discovering the platform's fonts, which is how a host that owns no font stack
# of its own — the native Apple, Android and GTK backends — obtains the
# collection it installs. A renderer that registers its own faces (hydrolysis,
# dew) installs those instead and leaves this off.
system-fonts = ["font-collection", "parley/system"]

[dev-dependencies]
waterui = { path = "../../.." }
waterui-testing = { path = "../../../testing" }
# This crate's own tests cover the Markdown parser, which is not in `default`.
# A dev-dependency on itself turns the feature on for this crate's test targets
# without turning it on for anything that depends on the crate.
waterui-text = { path = ".", features = ["markdown", "system-fonts"] }

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = [
    "waterui-macros",
    # The dev-dependency on itself, which turns `markdown` on for this crate's
    # own test targets. cargo-machete looks for `use waterui_text` in the
    # sources and never finds one, because the crate is already `crate`.
    "waterui-text",
]
