[package]
name = "waterui-text"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Text and typography components for WaterUI"
keywords = ["text", "typography", "ui", "components"]
categories = ["gui", "text-processing"]

[dependencies]
waterui-core.workspace = true
waterui-macros.workspace = true
waterui-graphics.workspace = true
waterui-str.workspace = true
waterui-locale.workspace = true
nami.workspace = true
syntect = { version = "5", default-features = false, features = ["default-themes", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark = "0.13"
smallvec.workspace = true

[dev-dependencies]
waterui = { path = "../../.." }
waterui-testing = { path = "../../../testing" }

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["waterui-macros"]
