[package]
name = "waterui-webview"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../../README.md"
repository = "https://github.com/water-rs/waterui"
description = "WebView component for WaterUI"
keywords = ["webview", "browser", "ui", "waterui", "gui"]
categories = ["gui"]

[dependencies]
waterui-core.workspace = true
waterui-layout.workspace = true
waterui-url.workspace = true
waterui-str = { workspace = true, features = ["serde"] }
thiserror.workspace = true
tracing.workspace = true
executor-core.workspace = true
cookie = "0.18.1"
base64 = "0.22"
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[dev-dependencies]
hydrolysis-m3.workspace = true
# `#[js_api]` expands to `::waterui::webview::…` paths, so testing it means
# reaching this crate back through the facade the way an application does.
waterui = { workspace = true, features = ["webview"] }
waterui-testing.workspace = true
# `waterui/webview` only enables the component; the renderer that turns a
# `WebView` into a node lives in the backend, behind hydrolysis's own webview
# feature. Without it the harness reaches `Native<WebView>` with nothing to
# render and fast-fails, so these end-to-end tests must ask for it explicitly.
hydrolysis = { path = "../../../backends/hydrolysis", features = ["webview-default"] }

[lints]
workspace = true

# `hydrolysis` above is a feature-activation dev-dependency (see its comment):
# it is never named in code, so cargo-machete cannot see why it exists.
[package.metadata.cargo-machete]
ignored = ["hydrolysis"]

[[bench]]
name = "bridge"
harness = false
