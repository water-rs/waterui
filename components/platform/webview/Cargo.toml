[package]
name = "waterui-webview"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../../README.md"
repository = "https://github.com/water-rs/waterui"
description = "WebView component for WaterUI"
keywords = ["webview", "browser", "ui", "waterui", "gui"]
categories = ["gui"]

[dependencies]
waterui-core.workspace = true
waterui-layout.workspace = true
waterui-url.workspace = true
waterui-apple-os.workspace = true
suiteki = { workspace = true, features = ["serde"] }
waterui-watcher-set.workspace = true
thiserror.workspace = true
tracing.workspace = true
executor-core.workspace = true
futures.workspace = true
percent-encoding = "2.3"
base64 = "0.23"
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
# Serves the conformance pages from a thread of its own.
tiny_http = { version = "0.12", optional = true }

# Cookies belong to the bridge APIs, which a browser cannot provide for the
# page in a cross-origin frame, so the web build has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cookie = "0.18.2"
robius-open.workspace = true

# `AnsweredNavigations` holds weak `WKNavigation`s — the type exists only
# where `WKWebView` does.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "WKNavigation",
] }

[features]
# The checks an engine's real-engine suite runs against the contracts this
# crate states; assertions, so off by default and on in test binaries only.
conformance = ["dep:tiny_http"]

[dev-dependencies]
divan = "0.1"
tempfile = "3.27"
toml.workspace = true
# `#[js_api]` expands to `::waterui::webview::…` paths, so testing it means
# reaching this crate back through the facade the way an application does.
waterui = { path = "../../..", features = ["webview"] }
waterui-testing = { path = "../../../testing" }

[lints]
workspace = true

[[bench]]
name = "bridge"
harness = false
