[package]
name = "waterui-ts"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../../README.md"
repository.workspace = true
description = "TypeScript views for WaterUI: a JavaScript runtime embedded in-process"
keywords = ["typescript", "javascript", "waterui", "ui", "gui"]
categories = ["gui"]

[dependencies]
waterui-ts-engine.workspace = true
waterui-ts-schema.workspace = true
waterui-core.workspace = true
# The theme the mounted module sees: `ColorScheme` and the environment's
# colour tokens. `default-features = false` keeps the GPU stack out — this
# crate reads colour values, it never draws.
waterui-graphics = { workspace = true, default-features = false }
waterui-locale.workspace = true
nami.workspace = true
suiteki.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The bundle loader verifies every bundle's manifest — the baseline's too —
# against the binary's requirement: the manifest is JSON, and the bundle
# file's identity inside it is a SHA-256 digest.
serde_json.workspace = true
sha2 = { version = "0.11", default-features = false }

# Everything below is the over-the-air client, behind `ota`: the store a
# downloaded bundle is cached in (its state file is a serde JSON store), the
# signature check, and the fetch itself. A baseline-only application leaves
# the feature off and links none of it.
serde = { workspace = true, features = ["derive", "std"], optional = true }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"], optional = true }
waterkit-fs = { workspace = true, optional = true }
url = { workspace = true, optional = true }
executor-core = { workspace = true, optional = true }
blocking = { workspace = true, optional = true }

# The HTTP client is `zenwave`, with the per-target TLS split every fetching
# crate in the workspace uses: the platform's own TLS on Apple, rustls
# everywhere else that has a socket, and the browser's fetch on wasm.
[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { workspace = true, features = ["native-tls"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
zenwave = { workspace = true, features = ["rustls"], optional = true }

[target.'cfg(not(any(target_arch = "wasm32", target_vendor = "apple", target_os = "android")))'.dependencies]
zenwave = { workspace = true, features = ["rustls"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
zenwave = { workspace = true, optional = true }

[features]
# The over-the-air update client: fetches a signed manifest and the bundle it
# names, verifies both, and caches them for the next launch. Off by default;
# the loader, the requirement manifest and the baseline are always present.
ota = [
    "dep:serde",
    "dep:ed25519-dalek",
    "dep:waterkit-fs",
    "dep:url",
    "dep:executor-core",
    "dep:blocking",
    "dep:zenwave",
]

# Apple platforms use the system JavaScriptCore — zero added binary size.
# watchOS is excluded: it ships no JavaScriptCore and the runtime is
# unsupported there, which `compile_error!` in the crate states directly.
[target.'cfg(all(target_vendor = "apple", not(target_os = "watchos")))'.dependencies]
waterui-ts-engine-jsc.workspace = true

# Everywhere else — Android, Linux, Windows — the embedded QuickJS-NG engine.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
waterui-ts-engine-quickjs.workspace = true

[dev-dependencies]
# The equivalence tests mount the JSX form and the Rust form of every catalog
# entry and compare accessibility trees, so they need both the facade's host
# table — `waterui::ts::Components`, which is where the component vocabulary
# lives — and the facade's own views to compare it against. A dev-dependency
# may close the cycle the library one cannot.
waterui = { path = "../../..", features = ["ts", "media"] }
waterui-testing = { path = "../../../testing" }
# The catalog test reads `waterui_meta_ts_catalog` back out of the test
# executable's own symbol table, which is the path the `water` CLI takes
# through a user crate's rlib.
object = { version = "0.37", default-features = false, features = ["read", "std"] }
rustc-demangle = "0.1"
# The OTA tests sign real bundles with a key generated in the test, serve
# them from a socket the test owns, and cache them in a directory that goes
# away with the test.
getrandom.workspace = true
tempfile = "3"
futures-lite.workspace = true

[lints]
workspace = true
