[package]
name = "waterui-text"
version = "0.2.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Text and typography components for WaterUI"
keywords = ["text", "typography", "ui", "components"]
categories = ["gui", "text-processing"]

[dependencies]
waterui-core.workspace = true
waterui-macros.workspace = true
waterui-graphics.workspace = true
waterui-str.workspace = true
waterui-locale.workspace = true
nami.workspace = true
jiff.workspace = true
syntect = { version = "5", default-features = false, features = ["default-themes", "regex-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark = "0.13"

[dev-dependencies]
waterui.workspace = true
waterui-testing.workspace = true

[lints]
workspace = true
