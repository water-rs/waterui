[package]
name = "waterui-icons-lucide"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "ISC"
repository.workspace = true
description = "Lucide icons for WaterUI"
keywords = ["icons", "lucide", "waterui"]
categories = ["gui"]
readme = "README.md"

[features]
default = ["svg"]
svg = ["waterui-icon/svg"]
webfont = []

[dependencies]
waterui-icon.workspace = true

[build-dependencies]
serde_json = "1.0"
waterui-build-support.workspace = true

[lints]
workspace = true

# Font asset declarations for WaterUI CLI
# Font is only downloaded when the "webfont" feature is enabled.
[package.metadata.waterui.assets]

[[package.metadata.waterui.assets.font]]
name = "lucide"
remote_path = "https://github.com/lucide-icons/lucide/releases/download/0.562.0/lucide-font-0.562.0.zip"
required-feature = "webfont"
[package.metadata.cargo-machete]
ignored = ["serde_json", "waterui-build-support"]

[dev-dependencies]
waterui = { path = "../../.." }
waterui-testing = { path = "../../../testing" }
