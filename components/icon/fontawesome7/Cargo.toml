[package]
name = "waterui-icons-fontawesome7"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "CC-BY-4.0"
repository.workspace = true
description = "Font Awesome 7 Free icons for WaterUI"
keywords = ["icons", "fontawesome", "fa", "waterui"]
categories = ["gui"]
readme = "../../../README.md"

[features]
default = ["webfont"]
svg = ["dep:waterui-svg"]
webfont = ["dep:waterui-icon"]

[dependencies]
# Only the two rendering entry points are linked: the generated modules refer
# to `crate::Svg` (svg feature) and the re-exported `IconGlyph` (webfont).
waterui-svg = { workspace = true, optional = true }
waterui-icon = { workspace = true, optional = true }

# cargo-machete does not follow build.rs, so the build-script dependencies
# are listed here, as in the sibling icon crates.
[package.metadata.cargo-machete]
ignored = ["serde", "serde_json", "arkiv", "dirs", "waterui-icons-codegen"]

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arkiv = { version = "0.7", features = ["download"] }
dirs = "6"
waterui-icons-codegen.workspace = true

[lints]
workspace = true

# Font asset declarations for WaterUI CLI
# CLI downloads fonts to ~/.water/cache/fontawesome/ before compilation.
# Font names must match the actual font family names in the OTF files.
# Fonts are only downloaded when the "webfont" feature is enabled.
[package.metadata.waterui.assets]

[[package.metadata.waterui.assets.font]]
name = "Font Awesome 7 Free Solid"
remote_path = "https://github.com/FortAwesome/Font-Awesome/releases/download/7.1.0/fontawesome-free-7.1.0-desktop.zip"
required-feature = "webfont"

[[package.metadata.waterui.assets.font]]
name = "Font Awesome 7 Free"
remote_path = "https://github.com/FortAwesome/Font-Awesome/releases/download/7.1.0/fontawesome-free-7.1.0-desktop.zip"
required-feature = "webfont"

[[package.metadata.waterui.assets.font]]
name = "Font Awesome 7 Brands"
remote_path = "https://github.com/FortAwesome/Font-Awesome/releases/download/7.1.0/fontawesome-free-7.1.0-desktop.zip"
required-feature = "webfont"
