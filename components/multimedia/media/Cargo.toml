[package]
name = "waterui-media"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Media components for WaterUI (images, videos, audio)"
keywords = ["media", "image", "video", "ui", "components"]
categories = ["gui", "multimedia"]


[dependencies]
waterui-core.workspace = true
waterui-macros.workspace = true
waterui-url.workspace = true
waterui-image.workspace = true
waterui-layout.workspace = true
waterui-controls.workspace = true
waterui-text.workspace = true
waterui-video = { workspace = true, optional = true }
waterkit-dialog = { workspace = true, optional = true }
filtrate-core.workspace = true
executor-core.workspace = true
tracing.workspace = true
futures.workspace = true
blocking = "1.7.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { workspace = true, features = ["native-tls"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
zenwave = { workspace = true, features = ["rustls"], optional = true }

[target.'cfg(not(any(target_arch = "wasm32", target_vendor = "apple", target_os = "android")))'.dependencies]
zenwave = { workspace = true, features = ["rustls"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
zenwave = { workspace = true, optional = true }
# The browser has no `std::fs`, so a local photo URL is read back through the
# kit's IndexedDB-backed file system instead of `blocking::unblock`.
waterkit-fs.workspace = true

[features]
default = ["std"]
std = ["waterui-core/std", "dep:waterkit-dialog"]
# Video playback (`Video`, `VideoPlayer`, `LivePhoto`, video picks in the media
# picker) re-exports `waterui-video`. Off by default so an image-only
# application carries no video graph.
video = ["dep:waterui-video"]
# Remote media sources (`Photo`/`video` pointed at web URLs) link the `zenwave`
# HTTP client. Off by default so an application showing only bundled media
# carries no HTTP client.
remote = ["dep:zenwave", "waterui-url/remote"]
# Offscreen image rasterizing (`Image::render_offscreen`), which links the GPU
# stack. `waterui/gpu` enables it.
gpu = ["waterui-image/gpu"]

[dev-dependencies]
futures-lite.workspace = true
waterui = { path = "../../..", features = ["video-gpu"] }
waterui-testing = { path = "../../../testing" }
# This crate's own tests cover `LivePhoto` and `Media::Video`, which are behind
# `video`, not in `default`. A dev-dependency on itself turns the feature on for
# this crate's test targets without turning it on for anything that depends on
# the crate.
waterui-media = { path = ".", features = ["video"] }
waterkit-codec = { version = "0.1.2", features = ["software-decode"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }


[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["waterui-macros"]
