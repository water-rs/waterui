[package]
name = "waterui-video-gpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Self-drawn GPU realization for WaterUI Video and VideoPlayer"
keywords = ["video", "player", "gpu", "wgpu", "waterui"]
categories = ["gui", "multimedia::video", "rendering"]

[dependencies]
async-channel.workspace = true
futures-timer.workspace = true
waterui-video.workspace = true
waterui-core.workspace = true
waterui-layout.workspace = true
waterui-controls.workspace = true
waterui-graphics = { workspace = true, features = ["gpu"] }
shaderloom.workspace = true
waterui-text.workspace = true
waterkit-video.workspace = true
waterkit-codec.workspace = true
waterkit-audio = { workspace = true, features = ["streaming"] }
waterkit-fs.workspace = true
futures.workspace = true
executor-core.workspace = true
nami.workspace = true
num-traits = { version = "0.2", default-features = false }
tracing.workspace = true
uuid.workspace = true
wgpu.workspace = true

[build-dependencies]
waterui-build-support.workspace = true
waterkit-codec.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
waterkit-audio = { workspace = true, features = ["he-aac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
hydrolysis-m3.workspace = true
pollster.workspace = true
waterui.workspace = true
waterui-testing.workspace = true

[lints]
workspace = true

# `waterui-build-support` is used directly by build.rs; cargo-machete 0.9 does not scan build.rs.
[package.metadata.cargo-machete]
ignored = ["waterui-build-support"]
