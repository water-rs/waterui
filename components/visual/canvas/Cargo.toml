[package]
name = "waterui-canvas"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../../README.md"
repository.workspace = true
description = "Canvas 2D vector graphics for WaterUI using Vello"
keywords = ["canvas", "2d", "graphics", "waterui", "vello"]
categories = ["gui"]

[dependencies]
waterui-core.workspace = true
waterui-graphics = { workspace = true, features = ["gpu"] }
nami.workspace = true
kurbo.workspace = true
peniko.workspace = true
parley = { workspace = true, features = ["system"] }
# Only `image::ImageError` is named here — decoding itself is delegated to
# `waterui-graphics`. The codec list mirrors that crate's; `avif` is an encoder
# nothing in the workspace calls.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }

[dev-dependencies]
waterui = { path = "../../.." }
waterui-testing = { path = "../../../testing" }
pollster.workspace = true
wgpu.workspace = true

[lints]
workspace = true
