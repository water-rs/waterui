[package]
name = "waterui-graphics"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Graphic components for WaterUI"
keywords = ["graphics", "2d", "ui", "waterui"]
categories = ["gui"]

[features]
default = ["gpu"]
gpu = [
    "dep:filtrate",
    "dep:filtrate-core",
    "dep:futures",
    "dep:wgpu",
    "dep:vello",
    "dep:kurbo",
    "dep:peniko",
    "dep:bytemuck",
    "dep:encase",
    "dep:tracing",
    "dep:image",
    "dep:png",
    "dep:parking_lot",
    "dep:rayon",
    "dep:mp4parse",
    "dep:shaderloom",
]

[dependencies]
waterui-core.workspace = true
nami.workspace = true
filtrate = { workspace = true, optional = true }
filtrate-core = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
pastey.workspace = true
wgpu = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
bytemuck = { version = "1.25", optional = true }
encase = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "avif", "tiff"], optional = true }
png = { version = "0.18", optional = true }
parking_lot = { version = "0.12", optional = true }
rayon = { version = "1.12", optional = true }
mp4parse = { version = "0.17", optional = true }
shaderloom = { workspace = true, optional = true }
num-traits = { version = "0.2", default-features = false }

[build-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
waterui-build-support.workspace = true

[dev-dependencies]
pollster.workspace = true
waterui.workspace = true
waterui-testing.workspace = true
divan = "0.1"

[[bench]]
name = "filter_runtime"
harness = false

[lints]
workspace = true

# `waterui-build-support` and `naga` are used directly by build.rs; cargo-machete 0.9 does not scan build.rs.
[package.metadata.cargo-machete]
ignored = ["naga", "waterui-build-support"]
