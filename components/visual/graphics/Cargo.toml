[package]
name = "waterui-graphics"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Graphic components for WaterUI"
keywords = ["graphics", "2d", "ui", "waterui"]
categories = ["gui"]

[features]
default = ["gpu"]
# Rasterises a `Picture` on the CPU through `cherenkov-cpu`: what the FFI
# backends need to show a `Picture` in a platform image view. Independent of
# `gpu`.
cpu = ["dep:cherenkov-cpu"]
gpu = [
    "dep:cherenkov-gpu",
    "dep:filtrate",
    "dep:filtrate-core",
    "dep:futures",
    "dep:wgpu",
    "dep:bytemuck",
    "dep:encase",
    "dep:tracing",
    "dep:image",
    "dep:png",
    "dep:parking_lot",
    "dep:rayon",
    "dep:mp4parse",
    "dep:shaderloom",
    "dep:naga",
    "dep:ash",
    "dep:wgpu-hal",
    "dep:libc",
    "dep:pollster",
    # The shared GPU context still rasterises Vello scenes for the retiring
    # `GpuSurface` path; these leave with it.
    "dep:vello",
    "dep:vello_hybrid",
    "dep:vello_common",
    "dep:glifo",
]

[dependencies]
waterui-core.workspace = true
nami.workspace = true
cherenkov.workspace = true
cherenkov-cpu = { workspace = true, optional = true }
cherenkov-gpu = { workspace = true, optional = true }
color.workspace = true
filtrate = { workspace = true, optional = true }
filtrate-core = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
pastey.workspace = true
wgpu = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
vello_hybrid = { workspace = true, optional = true }
vello_common = { workspace = true, optional = true }
glifo = { workspace = true, optional = true }
kurbo.workspace = true
keyboard-types.workspace = true
bytemuck = { version = "1.25", optional = true }
encase = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# `avif` is `image`'s AVIF *encoder* (ravif -> rav1e), not its decoder
# (`avif-native`). `image_decode` only decodes, and its HEIF retry hands the
# patched container to the platform decoder, so the encoder was pure weight.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }
png = { version = "0.18", optional = true }
parking_lot = { version = "0.12", optional = true }
rayon = { version = "1.12", optional = true }
mp4parse = { version = "0.17", optional = true }
shaderloom = { workspace = true, optional = true }
num-traits = { version = "0.2", default-features = false }
# Device-loss recovery rebuilds the GPU context from inside `context()`, a
# synchronous call, so adapter/device setup needs a block_on that works on the
# caller's thread.
pollster = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# Android view capture reads a captured subtree out of an `AHardwareBuffer`,
# which needs `VK_ANDROID_external_memory_android_hardware_buffer` and
# `VK_EXT_queue_family_foreign` enabled on the device. wgpu does not enable
# either, so the device is opened through the HAL adapter instead of
# `Adapter::request_device`, and that is spelled in `ash`/`wgpu-hal` terms.
ash = { workspace = true, optional = true }
wgpu-hal = { workspace = true, features = ["vulkan"], optional = true }
# `__system_property_get` is how the GPU path recognises an emulator guest.
libc = { version = "0.2", optional = true }

[build-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"], optional = true }
shaderloom = { workspace = true, features = ["build"], optional = true }

[dev-dependencies]
# Tests record against `cherenkov::testing::Null` engines.
cherenkov = { workspace = true, features = ["testing"] }
# `mesh_gradient.wgsl` layout parity test parses the real shader source.
naga = { version = "30.0.1", features = ["wgsl-in"] }
pollster.workspace = true
divan = "0.1"
# The glyph-run recording test maps a character to a glyph id in a real font.
ttf-parser = "0.25"

[[bench]]
name = "filter_runtime"
harness = false

[lints]
workspace = true

# `shaderloom` and `naga` are used directly by build.rs; cargo-machete 0.9 does not scan build.rs.
[package.metadata.cargo-machete]
ignored = ["naga", "shaderloom"]