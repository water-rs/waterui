[package]
name = "waterui-graphics"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Graphic components for WaterUI"
keywords = ["graphics", "2d", "ui", "waterui"]
categories = ["gui"]

[features]
default = ["gpu"]
# Filters on views (`.filter(F)`, `.blur(..)`, …) and the portable description
# a backend reads from them: the filter's stages with their WGSL snippets, its
# parameters and their reactive bindings, and its auxiliary images. It needs no
# device, so a render target that lowers filters into its own primitives builds
# it without the GPU stack.
effects = ["dep:filtrate", "dep:arc-swap"]
# GPU-only surfaces: user GPU content, running filters through `filtrate`'s
# executor, arbitrary GPU effects on views, offscreen rendering through
# `Engine<Gpu>`, and image decoding. Everything else — colours, gradients,
# scenes, pictures and shader paints — records Cherenkov `Content` and needs no
# device here.
gpu = [
    "effects",
    "filtrate/gpu",
    "dep:cherenkov-gpu",
    "dep:thiserror",
    "dep:wgpu",
    "dep:bytemuck",
    "dep:image",
    "dep:mp4parse",
    "dep:tracing",
    "dep:pollster",
    "dep:shaderloom",
]
# Offscreen rendering through `Engine<Raster>`: pictures rasterised for hosts
# whose image views take bitmaps.
cpu = ["dep:cherenkov-cpu", "dep:thiserror", "dep:image"]

[dependencies]
arc-swap = { workspace = true, optional = true }
waterui-core.workspace = true
nami.workspace = true
cherenkov.workspace = true
cherenkov-gpu = { workspace = true, optional = true }
cherenkov-cpu = { workspace = true, optional = true }
color.workspace = true
filtrate = { workspace = true, optional = true }
pastey.workspace = true
wgpu = { workspace = true, optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
keyboard-types.workspace = true
thiserror = { workspace = true, optional = true }
# `avif` is `image`'s AVIF *encoder* (ravif -> rav1e), not its decoder
# (`avif-native`). `image_decode` only decodes, and its HEIF retry hands the
# patched container to the platform decoder, so the encoder was pure weight.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"], optional = true }
mp4parse = { version = "0.17", optional = true }
tracing = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
# Only the runtime half: `build` pulls naga, which a device consumer never
# needs — the shared device asks shaderloom which features its native shader
# artifacts require (`shaderloom::required_features`).
shaderloom = { workspace = true, optional = true, features = ["runtime"] }

[dev-dependencies]
# Tests record against `cherenkov::testing::Null` engines.
cherenkov = { workspace = true, features = ["testing"] }
pollster.workspace = true
# The glyph-run recording test maps a character to a glyph id in a real font.
ttf-parser = "0.25"
# The external-frame tests count the device's live textures and read back
# `Rgba16Float` host targets.
wgpu = { workspace = true, features = ["counters"] }
half = "2"
# The accessibility-semantics tests mount graphics views in the Hydrolysis
# semantic tree.
waterui = { path = "../../.." }
waterui-testing = { path = "../../../testing" }

# The external-frame tests import real `IOSurface`-backed `CVPixelBuffer`
# planes onto the Metal device.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-io-surface"] }
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }

[lints]
workspace = true
