[package]
name = "waterui-markdown"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../../README.md"
repository.workspace = true
description = "Markdown and streaming rich-text rendering components for WaterUI"
keywords = ["markdown", "rich-text", "ui", "waterui", "gui"]
categories = ["gui", "text-processing"]

[features]
default = []
# Mathematical formulas in Markdown: `$…$` and `$$…$$` are parsed and typeset
# through `waterui-math`. Off by default, and deliberately so — it brings a
# layout engine, an OpenType `MATH` table reader, a LaTeX parser and MathCAT's
# speech rules (about 2.7 MiB of release artifact), and the component declares a
# math font for the asset pipeline to bundle.
math = ["dep:waterui-math"]
# Renders Markdown images (`![alt](src)`) using `waterui-media::Photo`.
media = ["dep:waterui-media"]

[dependencies]
executor-core.workspace = true
nami.workspace = true
native-executor.workspace = true
pulldown-cmark.workspace = true
suiteki.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-md.workspace = true
waterkit-deeplink.workspace = true
waterui-color.workspace = true
waterui-controls.workspace = true
waterui-core.workspace = true
waterui-layout.workspace = true
waterui-math = { workspace = true, optional = true }
waterui-media = { workspace = true, optional = true }
waterui-text = { workspace = true, features = ["highlight", "markdown"] }

[lints]
workspace = true
