[package]
name = "waterui-image"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Image primitives and decode pipeline for WaterUI"
keywords = ["image", "media", "gpu", "waterui"]
categories = ["gui", "multimedia"]

[dependencies]
waterui-core.workspace = true
waterui-graphics = { workspace = true, features = ["gpu"] }
shaderloom.workspace = true
waterui-layout.workspace = true
waterkit-codec = { workspace = true, features = ["software-fallback"] }
tracing.workspace = true
wgpu.workspace = true
num-traits = { version = "0.2", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "avif", "tiff"] }
mp4-atom = "0.10.1"

[build-dependencies]
waterui-build-support.workspace = true

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
zenwave = { workspace = true, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dev-dependencies]
zenwave = { workspace = true, features = ["rustls"] }

[target.'cfg(not(any(target_vendor = "apple", target_os = "android")))'.dev-dependencies]
zenwave = { workspace = true, features = ["rustls"] }

[dev-dependencies]
waterui.workspace = true
waterui-testing.workspace = true

[lints]
workspace = true
