[package]
name = "waterui-video"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Video views and player components for WaterUI"
keywords = ["video", "player", "ui", "components"]
categories = ["gui", "multimedia::video"]

[dependencies]
waterui-core.workspace = true
waterui-layout.workspace = true
waterui-controls.workspace = true
waterui-graphics.workspace = true
waterui-url.workspace = true
waterui-text.workspace = true
waterui-macros.workspace = true
waterkit-video.workspace = true
waterkit-codec.workspace = true
waterkit-audio.workspace = true
futures.workspace = true
native-executor.workspace = true
executor-core.workspace = true
nami.workspace = true
tracing.workspace = true
uuid = { version = "1.21.0", features = ["v4"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { workspace = true, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
zenwave = { workspace = true, features = ["rustls"] }

[target.'cfg(not(any(target_vendor = "apple", target_os = "android")))'.dependencies]
zenwave = { workspace = true, features = ["rustls"] }

[features]
default = []

[dev-dependencies]
tracing-subscriber.workspace = true
waterui.workspace = true
waterui-testing.workspace = true

[lints]
workspace = true
