# `^` requirements — they join the `waterui` version group like every
# other `waterui-*` crate (#600, #2688), which sets their first release
# at the group version.
[[package]]
name = "waterui-ts-schema"
version_group = "waterui"

[[package]]
name = "waterui-ts-engine"
version_group = "waterui"

[[package]]
name = "waterui-ts-engine-jsc"
version_group = "waterui"

[[package]]
name = "waterui-ts-engine-quickjs"
version_group = "waterui"

[[package]]
name = "waterui-ts"
version_group = "waterui"

# Tooling

# The CLI is in the waterui version group: it depends on group crates
# through workspace `^` requirements, so an independent line could ship a
# patch release whose dependency edge crosses a `0.x` minor — a breaking
# move for consumers that no published-version bump on the CLI itself
# would signal (#2688). Sharing the group version makes every release
# that moves those edges a minor bump by construction. Tag naming stays
# namespaced — `cli/v*` tags (bare `v*` belongs to the facade,
# `hydrolysis-v*` to Hydrolysis) — so release.yml can tell the CLI's
# release from the framework's. Publishing stays in-band: this
# repository's `release` job runs on the `main` push itself, so crates.io
# trusted publishing issues it an OIDC token, and release-plz publishes
# `waterui-cli` in dependency order after the workspace crates it
# path-depends on — the standalone repository had to defer `cargo publish`
# to a dispatch because its tag was minted under `workflow_run`, a token
# crates.io refuses. `release.yml` reads the tag out of the report to drive
# the `water` binary builds.
[[package]]
name = "waterui-cli"
version_group = "waterui"
git_release_name = "cli/v{{ version }}"
git_tag_name = "cli/v{{ version }}"
