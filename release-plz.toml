[workspace]
pr_draft = false
pr_labels = ["release"]
git_release_name = "{{ package }}-v{{ version }}"
publish = true
release_always = true
git_tag_enable = true
changelog_update = true

# Facade

[[package]]
name = "waterui"
version_group = "waterui"
git_release_name = "v{{ version }}"
git_tag_name = "v{{ version }}"
changelog_path = "docs/CHANGELOG.md"

