
[workspace]
members = [
    "core",
    "components/assets/*",
    "components/data/*",
    "components/devtools/*/*",
    "components/foundation/*",
    "components/multimedia/*",
    "components/platform/*",
    # The `ts` family directory holds more than one crate, so its members are
    # listed one by one; the glob above picks up `components/platform/ts`
    # itself and stops there.
    "components/platform/ts/schema",
    "components/platform/ts/engine",
    "components/platform/ts/engine/jsc",
    "components/platform/ts/engine/quickjs",
    "components/visual/*",
    "utils/*",
    "src",
    "cli",
    "testing",
    "ffi",
    "ffi/generator",
    "macros",
    "examples/*",
    ".claude/skills/waterui/skill_snippets",
    "backends/apple",
    "backends/apple/cocoa-ui",
    "backends/apple/Examples/liquid_glass",
    "backends/apple/Tests/IOSTestHost",
    "backends/core",
    "backends/hydrolysis",
    # The Android debug app's Rust half is a package nested inside the
    # backend's directory, so it joins the workspace explicitly.
    "backends/hydrolysis/android/test-app/rust",
    # The engine family under `graphics/` (#1449): the `cherenkov` crates in
    # `graphics/cherenkov/` and the `filtrate` family in `graphics/filtrate/`.
    # The stand-alone apps under `graphics/cherenkov/gpu/examples/` and the
    # iOS bench project under `graphics/cherenkov/bench/ios/` carry their own
    # manifests and are not members, matching upstream's `exclude`.
    "graphics/cherenkov",
    "graphics/cherenkov/record",
    "graphics/cherenkov/shader",
    "graphics/cherenkov/gpu",
    "graphics/cherenkov/cpu",
    "graphics/cherenkov/scene",
    "graphics/cherenkov/oracle",
    "graphics/cherenkov/bench",
    "graphics/filtrate",
    "graphics/filtrate/core",
    "graphics/filtrate/derive",
    "tests/layout-twins/waterui",
    "components/icon/*",
]
exclude = [
  "derive",
  ".github",
  "*.png",
]



resolver = "2"

[package]
name = "waterui"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "A modern UI framework for Rust"
keywords = ["ui", "framework", "rust", "gui", "water"]
categories = ["gui"]

# WaterUI framework release policy shared by the `water` CLI and release
# automation. This table is the framework's own scaffold metadata: the
# `framework_manifest.py` generator copies it verbatim into the published
# `framework.json`, and `water create --channel dev`/`--waterui-path` derive
# the same facts from the checked-out manifest directly.
[package.metadata.waterui]
# The lowest CLI version that may consume this framework revision.
# 0.4.4 understands `apple-backend-path` and `hydrolysis-path`.
minimum-cli-version = "0.4.4"
# The Android API floor the native runtime supports; the backend's Gradle
# `minSdk` must agree.
android-min-api-level = 31
# The Gradle release every project this framework assembles runs — the
# scaffolded `gradle-wrapper.properties` renders it and the in-tree Hydrolysis
# host pins it, so the version CI exercises is the one users' `./gradlew`
# downloads.
android-gradle-version = "9.7.1"
# The objc2 Rust backend (`waterui-apple`) lives in-tree at
# `backends/apple`; it rides the framework's own commit — consumed as a path
# package of the selected source — and the CLI preserves that location when
# scaffolding a project. This revision has no waterui-ffi or generated
# C-header dependency.
apple-backend-path = "backends/apple"
# The self-drawn Hydrolysis backend is an in-tree workspace member too
# (#1635): `hydrolysis-path` names its crate directory so a scaffolded
# project's `hydrolysis` dependency — and the `hydrolysis` requirement an
# independent crate like `hydrolysis-m3` carries — resolves to the selected
# framework revision, never a crates.io release or the independent
# `water-rs/hydrolysis` repository.
hydrolysis-path = "backends/hydrolysis"
android-backend-url = "https://github.com/water-rs/android-backend.git"
android-backend-revision = "d3cad6430809d6a10341ee35d10e902f17b106d6"
# The Hydrolysis Android host the `water` CLI composites into a generated
# Gradle project for `--platform android --backend hydrolysis`. The host
# lives in this repository now (#1428): the framework revision the manifest
# certifies is already the revision the Kotlin host's JNI schema must match,
# so no second pin exists — `subdirectory` names the Gradle composite root
# inside this checkout.
hydrolysis-android-host-subdirectory = "backends/hydrolysis/android"
# Crates released from their own repositories whose requirement a scaffolded
# project pins; the requirement string itself is read from
# `[workspace.dependencies]` below. `hydrolysis` is absent deliberately: it
# is an in-tree member resolved through `hydrolysis-path`, not a scaffold
# package with a requirement of its own.
scaffold-packages = [
    "hydrolysis-m3",
    "waterui-dew",
    "waterui-gtk",
    "waterui-winui",
]

[lib]
path = "facade.rs"

[workspace.package]
version = "0.5.1"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/waterui"
description = "A modern UI framework for Rust"
keywords = ["ui", "framework", "rust", "gui", "water"]
categories = ["gui"]

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
clippy.undocumented_unsafe_blocks = "warn"
clippy.multiple_crate_versions =  { level = "allow", priority = 1 }



[workspace.dependencies]
aither-core = "0.4"
aither-mcp = { version = "0.4", default-features = false }
arc-swap = "1.9.2"
# Held at 2 on purpose. `bincode` 3.0.0 is not a release: it is a name
# reservation whose entire `lib.rs` is a `compile_error!`, with no dependencies
# and no features, so `cargo upgrade --incompatible` proposes it and every
# consumer that takes it stops compiling. 2.0.1 is the maintained line.
bincode = { version = "2.0.1", features = ["serde"] }
bitflags = "2.13.2"
# Colour-space conversion (`AlphaColor::convert`) for `color::working`: the
# same `color` crate `cherenkov` carries, so `LinearSrgb`/`LinearDisplayP3`
# are one type in the graph.
color = "0.3.3"
blocking = "1.7.0"
cargo_metadata = "0.23.1"
# FNV-1a that evaluates in a `const` context, which is what the TypeScript
# props contract hash needs: the same hash is computed by the compiler into the
# binary and by the CLI from the artifact.
const-fnv1a-hash = "1.1.0"
crossbeam-channel = "0.5"
executor-core = { version = "0.7.1", features = ["std"]}
# No crate in this workspace runs a future on `futures`' own executor — every
# host installs its own `LocalExecutor` — so the default `executor` feature is
# off. (waterkit keeps it: its streaming code does `block_on`.)
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
futures-lite = "2.6"
geo = { version = "0.33", default-features = false }
getrandom = "0.4"
geo-types = "0.7"
lru = "0.18"
maplibre-expr = "0.3.2"
mvt-reader = "2.5.0"
# W3C UI Events key/code/modifier vocabulary, shared by the GPU-surface input
# contract and every backend that feeds it.
keyboard-types = { version = "0.8.3", default-features = false }
# winit -> `keyboard-types` translation, maintained alongside `keyboard-types`
# by the Linebender/rust-windowing side. Keeps the key/code tables out of here.
ui-events-winit = "0.3.0"
serde_json = "1.0"
# Held at the exact major `aither-core` 0.4 uses: `Tool::Arguments` must
# implement this crate's `JsonSchema`, so a different major would not satisfy
# the trait bound.
schemars = { version = "1.2", features = ["derive"] }
smallvec = "1.16"
nami = "0.12"
nami-core = "0.4"
# The 2D engine WaterUI's self-drawn content records and renders through
# (water-rs/hydrolysis#205, water-rs/waterui#1449): recording, resource
# registration, the layer tree and GPU content. The whole `cherenkov` family
# lives in this repository under `graphics/` — path members, not crates.io.
cherenkov = { version = "0.0.0", path = "graphics/cherenkov" }
cherenkov-cpu = { version = "0.0.0", path = "graphics/cherenkov/cpu" }
cherenkov-gpu = { version = "0.0.0", path = "graphics/cherenkov/gpu" }
cherenkov-record = { version = "0.0.0", path = "graphics/cherenkov/record" }
pin-project-lite = "0.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0.20"
url = "2.5"
uuid = { version = "1.26.1", default-features = false, features = ["v4", "std"] }
waterui-core = { version = "0.5.1", path = "core" }
# Renamed and extracted to water-rs/suiteki.
suiteki = { version = "0.1", features = ["nami"] }
waterui-url = { version = "0.5.1", path = "utils/url" }
waterui-watcher-set = { version = "0.5.1", path = "utils/watcher-set" }
waterui-text = { version = "0.5.1", path = "components/foundation/text", default-features = false }
waterui-media = { version = "0.5.1", path = "components/multimedia/media" }
waterui-image = "0.5.0"
waterui-video = { version = "0.5.1", path = "components/multimedia/video" }
waterui-video-gpu = "0.4.0"
waterui-form = { version = "0.5.1", path = "components/foundation/form" }
waterui-controls = { version = "0.5.1", path = "components/foundation/controls"}
waterui-graphics = { version = "0.5.1", path = "components/visual/graphics", default-features = false }
waterui-canvas = "0.2.0"
waterui-shape = { version = "0.5.1", path = "components/foundation/shape", default-features = false }
waterui-svg = "0.4.0"
waterui-math = "0.2.0"
waterui-ffi = { version = "0.5.2", path = "ffi" }
waterui-layout = { version = "0.5.1", path = "components/foundation/layout" }
waterui-navigation = { version = "0.5.1", path = "components/foundation/navigation" }
waterui-webview = { version = "0.5.1", path = "components/platform/webview" }
waterui-chromium = { version = "0.5.1", path = "components/platform/chromium" }
waterui-browser-cef = { version = "0.5.1", path = "components/platform/browser-cef", default-features = false }
waterui-browser-wpe = { version = "0.5.1", path = "components/platform/browser-wpe", default-features = false }
wgpu-external-frame = "0.3.0"
waterui-icon = { version = "0.5.1", path = "components/foundation/icon" }
waterui-icons-sf-symbol = { version = "0.5.1", path = "components/icon/sf_symbol" }
waterui-icons-material-icon = { version = "0.5.1", path = "components/icon/material" }
waterui-icons-fontawesome7 = { version = "0.5.1", path = "components/icon/fontawesome7" }
waterui-icons-lucide = { version = "0.5.1", path = "components/icon/lucide" }
waterui-icons-native = { version = "0.5.1", path = "components/icon/native" }
waterui-locale = { version = "0.5.1", path = "utils/locale" }
waterui-map = { version = "0.5.1", path = "components/data/map" }
waterui-meta = { version = "0.5.1", path = "utils/meta" }
waterkit-location = "0.1.4"
waterkit-screen = "0.1.4"
waterkit-audio = { version = "0.1.4", default-features = false }
waterkit-clipboard = "0.1.4"
waterkit-permission = "0.1.4"
waterkit-dialog = "0.1.4"
waterkit-fs = "0.1.4"
waterkit-haptic = "0.1.4"
waterkit-camera = "0.1.4"
waterkit-codec = { version = "0.1.4", default-features = false }
waterkit-video = { version = "0.1.4", features = ["streaming"] }
waterkit-build = "0.1.4"
# Unreleased: `0.1.4` is the crate's own manifest version, and the
# `[patch.crates-io]` git pin below supplies the source.
waterkit-menu = "0.1.4"
waterui-backend-core = { version = "0.5.2", path = "backends/core", default-features = false }
# The `filtrate` family — the filter library `.filter(F)`/`.effect(E)` and
# Cherenkov share — lives in-tree under `graphics/filtrate/` (#1449). Every
# filtrate in the graph must come from this same source or a filter type
# built on one side is a different type on the other.
filtrate = { version = "0.2.1", path = "graphics/filtrate", default-features = false }
filtrate-core = { version = "0.2.0", path = "graphics/filtrate/core" }
filtrate-derive = { version = "0.1.0", path = "graphics/filtrate/derive" }
waterui-barcode = "0.3.0"
waterui-particle = "0.2.0"
waterui-chart = "0.3.0"
waterui-map-gpu = "0.3.0"
waterui-assets = { version = "0.5.1", path = "components/assets/runtime" }
waterui-assets-core = { version = "0.5.1", path = "components/assets/core" }
waterui-assets-planner = { version = "0.5.1", path = "components/assets/planner" }
waterui-assets-macros = { version = "0.5.1", path = "components/assets/macros" }
waterui-inspector-protocol = { version = "0.5.1", path = "components/devtools/inspector/protocol" }
waterui-inspector-app = { version = "0.5.2", path = "components/devtools/inspector/app" }
waterui-preview-protocol = { version = "0.5.1", path = "components/devtools/preview/protocol" }
waterui-mcp-protocol = { version = "0.5.1", path = "components/devtools/mcp/protocol" }
waterui-mcp = { version = "0.5.1", path = "components/devtools/mcp/server" }
# Nothing in this workspace links the GTK, WinUI or Dew backends: the `water`
# CLI reads these entries to scaffold a launcher crate. Each pins the
# backend's nami-migration head — the published releases still require the
# pre-rename nami line (`^0.11.2` and peers) — so `dev`, `nightly` and
# local-checkout scaffolds declare the commit directly while `stable`
# withholds the packages under `experimental-packages`. All three heads are
# on nami 0.12 (water-rs/gtk-backend#144, water-rs/waterui-winui#84,
# water-rs/dew#25).
# Drop the `git`/`rev` half once each backend releases a migrated version.
waterui-gtk = { version = "0.2.1", git = "https://github.com/water-rs/gtk-backend", rev = "0173db0e8e066305ff49bc4e12197c1056321831" }
waterui-winui = { version = "0.1.0", git = "https://github.com/water-rs/waterui-winui", rev = "4c8c82bb133940d1d2671c1d29c5b448ad035255" }
waterui-testing = { path = "testing" }
waterui-internal = { version = "0.5.1", path = "src", default-features = false }
waterui-dylib = { version = "0.5.1", path = "utils/dylib", default-features = false }
hydrolysis = { version = "0.3.1", path = "backends/hydrolysis", default-features = false }
waterui-dew = { version = "0.3.0", git = "https://github.com/water-rs/dew", rev = "c1ce5d79e34b1bf343f8008f05e43b49acd8d0b5" }
# default-features lives here, not on members: cargo rejects a member
# `default-features` override when the workspace entry does not declare
# one (the MSRV failure in #1551). Members name the features they need.
waterui = { version = "0.5.2", path = ".", default-features = false }
waterui-icons-codegen = { version = "0.5.1", path = "components/icon/codegen" }
# Members opt into `runtime` (links wgpu) and/or `build` (naga, for build scripts).
shaderloom = { version = "0.2.1", default-features = false }
hydrolysis-m3 = "0.3.1"
native-executor = { version = "0.8.0" }
waterui-macros = { version = "0.5.1", path = "macros" }
waterui-ts-schema = { version = "0.1.0", path = "components/platform/ts/schema" }
waterui-ts = { version = "0.1.0", path = "components/platform/ts" }
waterui-ts-engine = { version = "0.1.0", path = "components/platform/ts/engine" }
waterui-ts-engine-jsc = { version = "0.1.0", path = "components/platform/ts/engine/jsc" }
waterui-ts-engine-quickjs = { version = "0.1.0", path = "components/platform/ts/engine/quickjs" }
# QuickJS-NG through `rquickjs` — the embedded engine for every non-Apple
# target. (`rquickjs-sys` vendors the QuickJS-NG fork, not the original
# Bellard tree.)
rquickjs = "0.13"
# The system JavaScriptCore, reached through the objc2 family. Used only by
# `waterui-ts-engine-jsc`, which gates them on `target_vendor = "apple"`.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-javascript-core = "0.3"
serde = { version = "1.0", default-features = false, features = ["alloc"] }
erased-serde = { version = "0.4.10", default-features = false, features = ["alloc"] }
# 30, the exact minor `cherenkov-gpu` builds against: an application can link
# only one wgpu, and every `wgpu` type that crosses between the engine and a
# `GpuContent` producer must be one type.
wgpu = "30.0.1"
parley = { version = "0.11", default-features = false }
kurbo = "0.13"
skrifa = "0.47.0"
# The only crate in the Rust ecosystem that reads the OpenType `MATH` table.
# `read-fonts`/`skrifa` do not expose it (googlefonts/fontations#1269 has been
# open since 2024-11), and neither `rustybuzz` nor `harfrust` port HarfBuzz's
# `hb-ot-math`. Math layout is computed from that table, so it is depended on
# directly rather than reached through the text stack.
ttf-parser = "0.25"
# LaTeX front end. A pull parser over a public `Event` enum, so events are
# consumed straight into the math AST; the alternative (`math-core`) only emits
# a MathML string, which would have to be parsed back.
pulldown-latex = "0.8"
# Writes the MathML an accessibility tree carries. XML is structured output, so
# it goes through a writer that escapes and balances tags rather than through
# `push_str`/`format!` chains.
quick-xml = "0.42"
# Turns that MathML into the sentence a screen reader reads out — the ClearSpeak
# / MathSpeak engine assistive-technology vendors ship. `include-zip` compiles
# the speech rules into the binary as one bzip2 archive served from an in-memory
# filesystem, so the rules are not files anything has to install, bundle, or
# find at runtime; without it MathCAT looks for a `Rules` directory on disk.
mathcat = { version = "0.7.5", features = ["include-zip"] }
toml = "1.1.6"
lyon = "1.0"
wgpu-hal = { version = "30.0.1", features = ["gles", "metal"] }
# Must match the `glow` version wgpu-hal links against, or GLES handles from
# `wgpu::hal::gles` fail to unify with locally created ones.
# Tracks whatever `wgpu-hal` links, not the newest release: the GTK backend
# hands a `glow::NativeFramebuffer` straight to
# `wgpu::hal::gles::TextureInner::ExternalNativeFramebuffer`, so a different
# major here makes that a different type and the backend stops compiling.
glow = "0.17"
tiny-skia = "0.12"
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend"] }
futures-timer = "3"
pastey = "0.2.3"
tracing-panic = "0.1.2"
robius-open = { version = "0.3", default-features = false }
gtk4 = "0.11"
gdk4 = "0.11"
glib = "0.22"
pollster = "1.0"
rxing = { version = "0.9.2", default-features = false, features = ["decoders", "encoding_rs", "oned", "qrcode"] }
jiff = { version = "0.2", features = ["serde"] }
async-channel = "2.5"
rodio = { version = "0.22", features = ["symphonia-isomp4", "symphonia-aac"] }
cpal = "0.18"
rustc-hash = "2.1.3"
swift-bridge = "0.1"
swift-bridge-build = "0.1"
jni = "0.22"
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation"] }
zbus = "5"
web-time = "1.1"
cpu-time = "1.0"
# Only the process table is read (`ProcessesToUpdate`, `Pid`), so the disk,
# network, component-temperature and user backends are not built.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
sys-locale = "0.3"
iana-time-zone = "0.1"
dirs = "7"


[dependencies]
waterui-internal.workspace = true
waterui-dylib = { workspace = true, optional = true }


[dev-dependencies]
waterui-testing = { path = "testing" }
# `media` is opt-in, and the avatar tests exercise `Avatar::image`. A
# dev-dependency on this package turns it on for its own test targets only.
waterui = { path = ".", features = ["media"] }
# Writes the test portrait the avatar visual acceptance renders. PNG only:
# the encoder is all these tests need.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[features]
default = [
    "gpu",
    "assets",
    "snackbar",
    "highlight",
    "locale-datetime",
    "locale-list",
]
# The locale formatters reachable through `waterui::locale`. Default-on so the
# module keeps its full surface; a lean build starts from
# `default-features = false` and names what it needs.
locale-datetime = ["waterui-internal/locale-datetime", "waterui-dylib?/locale-datetime"]
locale-list = ["waterui-internal/locale-list", "waterui-dylib?/locale-list"]
# GPU rendering stack (wgpu via waterui-graphics' Cherenkov engine +
# waterui-svg). Default-on so every existing consumer is unaffected. Disable
# it to cross-compile a lean WaterUI app for embedded targets without the GPU
# stack.
gpu = ["effects", "waterui-internal/gpu", "waterui-dylib?/gpu"]
# Filters on views and their portable description, without the GPU stack.
# Implied by `gpu`.
effects = ["waterui-internal/effects", "waterui-dylib?/effects"]
# The `Code` widget and the bundled syntect highlighter behind it. Default-on
# because `code(…)` is a plain authoring API; opting out drops syntect, two-face
# and the syntax and theme tables they carry.
highlight = ["waterui-internal/highlight", "waterui-dylib?/highlight"]
# The devtools Inspector hub. Opt-in for packaged builds: `water run` and
# other development sessions get it through the linkage the CLI selects, while
# a release package that never attaches the hub leaves its server stack out.
inspector = ["waterui-internal/inspector", "waterui-dylib?/inspector"]
inspector-signals = ["inspector", "waterui-internal/inspector-signals"]
snackbar = ["waterui-internal/snackbar", "waterui-dylib?/snackbar"]
assets = ["waterui-internal/assets", "waterui-dylib?/assets"]
media = ["waterui-internal/media", "waterui-dylib?/media"]
video = ["waterui-internal/video", "waterui-dylib?/video"]
# Remote fetching (`Url::fetch`, `Data::from_remote`/`LargeFile::from_remote`,
# `Photo` pointed at a web URL) links the `zenwave` HTTP client through
# `waterui-url`/`waterui-media`. Deliberately not in `default`: an application
# that never names a remote URL must carry no HTTP client — principle 5.
remote = ["waterui-internal/remote", "waterui-dylib?/remote"]
# WaterUI's own GPU video player as the video realization. Deliberately not
# implied by `video`/`media`: a platform that bridges a native player must not
# link it. The backend without one selects this.
video-gpu = ["waterui-internal/video-gpu", "waterui-dylib?/video-gpu"]
webview = ["waterui-internal/webview", "waterui-dylib?/webview"]
# The TypeScript props contract schema (`waterui::ts::schema`): the
# `TsType`/`TsProps` derives whose encoded contract the `water` CLI reads back
# out of a debug artifact.
ts = ["waterui-internal/ts", "waterui-dylib?/ts"]
navigation-restoration = [
    "waterui-internal/navigation-restoration",
    "waterui-dylib?/navigation-restoration",
]
flow-markdown = ["waterui-internal/flow-markdown", "waterui-dylib?/flow-markdown"]
# Mathematical formulas in Markdown. Deliberately outside `all`: it brings a
# layout engine, an OpenType `MATH` table reader, a LaTeX parser and MathCAT's
# speech rules — about 2.7 MiB — and a bundled math font for the asset pipeline,
# and `all` is what every full-feature CI leg builds on every platform.
markdown-math = ["waterui-internal/markdown-math", "waterui-dylib?/markdown-math"]
std = ["waterui-internal/std", "waterui-dylib?/std"]
dynamic_linking = ["dep:waterui-dylib"]
canvas = ["waterui-internal/canvas", "waterui-dylib?/canvas"]
chart = ["waterui-internal/chart", "waterui-dylib?/chart"]
barcode = ["waterui-internal/barcode", "waterui-dylib?/barcode"]
particle = ["waterui-internal/particle", "waterui-dylib?/particle"]
# Every feature the framework offers an application. `dynamic_linking` is
# deliberately absent: it is a build strategy — one shared copy of the framework
# for the preview system — not a capability, and `waterui-dylib` exports more
# symbols than a PE export table can hold, so a Windows build of it cannot link
# at all. `--all-features` therefore cannot be used on Windows; `--features all`
# is what CI asks for instead. `ts` is absent too: the TypeScript runtime will
# link a JavaScript engine and a bundle loader, so an application that mounts
# TypeScript view modules opts in explicitly rather than paying for them through
# the full-feature set — the same reasoning that keeps `markdown-math` out.
all = [
    "canvas",
    "chart",
    "barcode",
    "particle",
    "std",
    "gpu",
    "highlight",
    "locale-datetime",
    "locale-list",
    "inspector",
    "inspector-signals",
    "assets",
    "media",
    "webview",
    "flow-markdown",
    "video-gpu",
    "navigation-restoration",
    "snackbar",
    "remote",
]


[lints]
workspace = true

# Optimize release builds for size
# Development builds of this repository. Cargo only honours profiles from the
# top-level workspace, so none of this reaches an application built against the
# published crates — it tunes how WaterUI itself is developed.
[profile.dev]
# sccache refuses to cache incremental compilation, so leaving it on means this
# workspace pays for a cache it can never use — and pays again in every agent
# workspace, each of which then compiles the tree from scratch. Off, the shared
# cache actually serves them, and the per-crate incremental directories (easily
# tens of gigabytes across a few checkouts) stop existing.
incremental = false
# Backtraces still resolve to file and line; what goes is the full type and
# variable debug info, which dominates artifact size and is rarely how a layout
# or rendering bug gets diagnosed here.
debug = "line-tables-only"

# Dependencies are debugged even more rarely than they are stepped into, and the
# graph carries wgpu and parley — the bulk of the debug info by far. They are,
# however, on every frame's hot path: at opt-level 0 the wgpu encode-and-submit
# alone costs several milliseconds per frame and a debug `water run` visibly
# drops frames while scrolling. Optimizing dependencies keeps workspace crates
# fully debuggable while the rendering stack runs at real speed, and sccache
# still caches the results (non-incremental).
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.ci-check]
inherits = "dev"
debug = false

[profile.ci-check.package."*"]
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"    # Optimize for size
strip = true       # Strip symbols

# cargo-dist builds release binaries with `--profile=dist`; the profile must
# exist in the root manifest or every `dist build` leg fails. This is the
# profile `dist init` generates.
[profile.dist]
inherits = "release"
lto = "thin"

# xcb 1.7.0 still builds with vulnerable quick-xml 0.30. Upstream has migrated
# to quick-xml 0.41, but has not released that change yet.
[patch.crates-io]
# Extracted crates on crates.io (waterui-canvas #185, waterui-chart #188, …) depend on the
# registry `waterui-core` and `waterui-graphics`; the workspace must resolve
# those to its own copies or the graph carries two of each and every `View`
# is a different type on either side. Publishing ignores this table, so the
# published crates keep their registry pins.
waterui-core = { path = "core" }
waterui-graphics = { path = "components/visual/graphics" }
waterui-layout = { path = "components/foundation/layout" }
waterui-shape = { path = "components/foundation/shape" }
waterui-text = { path = "components/foundation/text" }
waterui-map = { path = "components/data/map" }
waterui-url = { path = "utils/url" }
waterui-controls = { path = "components/foundation/controls" }
waterui-video = { path = "components/multimedia/video" }
waterui-macros = { path = "macros" }
# The Hydrolysis renderer lives in this workspace at `backends/hydrolysis`
# (#1428); its Material 3 theme is still external (#481) and pulls the rest
# of the framework from the registry, so every crate it names needs an entry
# here or the workspace builds a second `waterui` beside its own.
waterui = { path = "." }
waterui-assets = { path = "components/assets/runtime" }
waterui-assets-core = { path = "components/assets/core" }
waterui-backend-core = { path = "backends/core" }
waterui-form = { path = "components/foundation/form" }
waterui-icon = { path = "components/foundation/icon" }
waterui-inspector-protocol = { path = "components/devtools/inspector/protocol" }
waterui-locale = { path = "utils/locale" }
waterui-navigation = { path = "components/foundation/navigation" }
waterui-webview = { path = "components/platform/webview" }
# `hydrolysis-m3` declares its renderer requirement against the registry;
# this entry makes it resolve to the in-tree backend so the graph carries
# exactly one hydrolysis. The registry 0.3.1 theme implements the
# four-argument `draw_button_chrome` removed on this branch; the pinned
# revision carries the icon-button contract (water-rs/hydrolysis#115) and the
# split tabs-bar surface and divider calls (#1982). Drop the git pin once a
# release has both changes.
hydrolysis = { path = "backends/hydrolysis" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "9ade35272de87da502ae0e038e00bb4936bd0d7e" }
# `waterkit-codec` linked `cros-codecs`(vaapi) unconditionally on Linux, so
# turning on `assets` (still images) built `cros-libva` against the system
# libva headers and broke any SDK older than 2.20 — water-rs/waterui#1190.
# These revs carry the fix: the codec gates VA-API behind a `vaapi` feature
# that the player requests, and `waterui-image` asks for the codec with its
# defaults off. Every waterkit crate the video/audio graph shares types
# across rides the same rev — a registry `waterkit-audio` beside the pinned
# `waterkit-video` gives two `DecodedAudioFrame` types — and `waterkit-core`
# keeps the whole waterkit graph on one source; drop these entries once
# registry releases carry the change.
# waterkit-* and waterui-image are pinned by the migration block at the
# bottom of this table.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
# `block` 0.1.6 declares the Blocks ABI symbol as an uninhabited extern
# static. This pinned fork changes only that declaration to the symbol's byte
# storage and takes its address as the opaque class pointer.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# The `cherenkov`/`filtrate` families live in this repository under
# `graphics/` (water-rs/waterui#1449). Components pinned from sibling
# repositories declare them as crates.io requirements — `cherenkov` is
# unpublished and `filtrate`'s published release is an older API — so the
# requirements resolve to the in-tree sources instead. Every filtrate in the
# graph must come from one source: a filter type built on the published
# crate is a different type from one built in-tree.
cherenkov = { path = "graphics/cherenkov" }
cherenkov-cpu = { path = "graphics/cherenkov/cpu" }
cherenkov-gpu = { path = "graphics/cherenkov/gpu" }
filtrate = { path = "graphics/filtrate" }
filtrate-core = { path = "graphics/filtrate/core" }
filtrate-derive = { path = "graphics/filtrate/derive" }


# The suite's vello baseline is the fork WaterUI and Hydrolysis actually
# ship, not crates.io. `vello` carries our Mali Vulkan device-loss fix
# (linebender/vello#1817, still open upstream) plus the glifo canonical-location
# hint-cache fix applied to vello_encoding's GlyphCache (branch
# `glifo-canonical-location-classic`, on the Mali rev), and this rev adds the
# bump-buffer overflow re-render on top of what cherenkov pinned (7f5e1ca5);
# it is the rev the rest of the WaterUI graph already resolves. The
# sparse-strip crates and glifo sit on the same canonical-location fix at
# `glifo-canonical-location` — without it, an explicit all-default location
# (`[0, 0, …]`) never matched a stored hint entry and every glyph run repaid
# a HintingInstance reconfigure. `cherenkov-bench` measures against these.
vello = { git = "https://github.com/lexoliu/vello", rev = "76292095f408cf04b901023c2053f8d424652f06" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }

# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). Mirrored from cherenkov's own workspace
# patch (water-rs/cherenkov#229): `[patch]` in a dependency's manifest does not
# apply downstream, so without these entries this graph resolves the crashing
# crates.io build while cherenkov resolves the fork. Drop them once wgpu-hal
# 30.0.2 ships the backport.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }

