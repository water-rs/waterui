
[workspace]
members = [
    "core",
    "components/*",
    "utils/*",
    "testing",
    "ffi",
    "macros",
    "cli",
    "examples/*",
    "backends/core",
    "backends/gtk",
    "backends/hydrolysis",
    "icon-packs/*",
]
exclude = [
  "hydrolysis",
  "derive",
  ".github",
  ".claude",
  "*.png",
  "kit",
  "utils/nami",
]



resolver = "2"

[package]
name = "waterui"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "A modern UI framework for Rust"
keywords = ["ui", "framework", "rust", "gui", "water"]
categories = ["gui"]

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/waterui"
description = "A modern UI framework for Rust"
keywords = ["ui", "framework", "rust", "gui", "water"]
categories = ["gui"]

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
clippy.multiple_crate_versions =  { level = "allow", priority = 1 }



[workspace.dependencies]
executor-core = { version = "0.7.1", features = ["std"]}
futures = "0.3"
# Local vendored dependency overrides via git submodule.
nami = { version = "0.10.1", path = "utils/nami" }
nami-core = { version = "0.3.2", path = "utils/nami/core" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0.18"
waterui-core = { version = "0.2.0", path = "core" }
waterui-str = { version = "0.2.1", path = "utils/str" }
waterui-url = { version = "0.2.1", path = "utils/url" }
waterui-text = { version = "0.2.2", path = "components/text" }
waterui-media = { version = "0.2.1", path = "components/media" }
waterui-video = { version = "0.2.1", path = "components/video" }
waterui-form = { version = "0.2.1", path = "components/form" }
waterui-controls = { version = "0.2.1", path = "components/controls"}
waterui-graphics = { version = "0.2.1", path = "components/graphics" }
waterui-canvas = { version = "0.1.0", path = "components/canvas" }
waterui-shape = { version = "0.1.0", path = "components/shape" }
waterui-svg = { version = "0.1.0", path = "components/svg" }
waterui-ffi = { version = "0.2.1", path = "ffi" }
waterui-layout = { version = "0.2.2", path = "components/layout" }
waterui-navigation = { version = "0.2.1", path = "components/navigation" }
waterui-webview = { version = "0.2.0", path = "components/webview" }
waterui-icon = { version = "0.2.0", path = "components/icon" }
waterui-icons-sf-symbol = { version = "0.1.0", path = "icon-packs/sf-symbol" }
waterui-icons-material-icon = { version = "0.1.0", path = "icon-packs/material-icon" }
waterui-icons-fontawesome7 = { version = "0.1.0", path = "icon-packs/fontawesome7" }
waterui-icons-lucide = { version = "0.1.0", path = "icon-packs/lucide" }
waterui-icons-native = { version = "0.1.0", path = "icon-packs/native" }
waterui-locale = { version = "0.1.0", path = "utils/locale" }
waterui-map = { version = "0.1.0", path = "components/map" }
waterkit-location = { version = "0.1.0", path = "kit/location" }
waterkit-screen = { version = "0.1.0", path = "kit/screen" }
waterkit-audio = { version = "0.1.0", path = "kit/audio" }
waterkit-clipboard = { version = "0.1.0", path = "kit/clipboard" }
waterkit-permission = { version = "0.1.0", path = "kit/permission" }
waterkit-dialog = { version = "0.1.0", path = "kit/dialog" }
waterkit-fs = { version = "0.1.0", path = "kit/fs" }
waterkit-haptic = { version = "0.1.0", path = "kit/haptic" }
waterkit-codec = { version = "0.1.0", path = "kit/codec", default-features = false }
waterkit-video = { version = "0.1.0", path = "kit/video" }
waterkit-regional = { version = "0.1.0", path = "kit/regional" }
waterkit-build = { version = "0.1.0", path = "kit/waterkit-build" }
waterui-backend-core = { version = "0.1.0", path = "backends/core" }
filtrate = { version = "0.1.0", path = "utils/filtrate" }
filtrate-core = { version = "0.1.0", path = "utils/filtrate-core" }
waterui-barcode = { version = "0.1.0", path = "components/barcode" }
waterui-particle = { version = "0.1.0", path = "components/particle" }
waterui-chart = { version = "0.1.0", path = "components/chart" }
waterui-assets = { version = "0.1.0", path = "components/assets" }
waterui-assets-plan = { version = "0.1.0", path = "components/assets-plan" }
waterui-assets-macros = { version = "0.1.0", path = "components/assets-macros" }
waterui-inspector-protocol = { version = "0.1.0", path = "components/inspector-protocol" }
waterui-gtk = { version = "0.1.0", path = "backends/gtk" }
waterui-testing = { version = "0.2.1", path = "testing" }
waterui = { version = "0.2.1", path = "." }
waterui-build-support = { version = "0.1.0", path = "utils/build-support" }
native-executor = { version = "0.7.0" }
waterui-macros = { version = "0.2.1", path = "macros" }
serde = { version = "1.0", default-features = false, features = ["alloc"] }
wgpu = "27"
encase = { version = "0.10", features = ["glam"] }
vello = "0.7"
parley = "0.7"
vello_svg = "0.9.0"
kurbo = "0.13"
peniko = "0.6"
lyon = "1.0"
wgpu-hal = { version = "27", features = ["gles", "metal"] }
glow = "0.16"
tiny-skia = "0.11"
zenwave = { version = "0.3.0", default-features = false, features = ["hyper-backend", "ws"] }
skyzen = { version = "0.1.0", default-features = false }
pastey = "0.2.1"
tracing-panic = "0.1.2"
robius-open = { version = "0.1", default-features = false }
gtk4 = "0.9"
gdk4 = "0.9"
glib = "0.20"
cairo-rs = { version = "0.20", features = ["v1_18"] }
pollster = "0.4"
jiff = { version = "0.2", features = ["serde"] }
async-channel = "2.5"
rodio = { version = "0.19", features = ["symphonia-isomp4", "symphonia-aac"] }
cpal = "0.15"
swift-bridge = "0.1"
swift-bridge-build = "0.1"
jni = "0.21"
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation"] }
zbus = "5"
minstant = "0.1"
cpu-time = "1.0"


[dependencies]
nami.workspace = true
waterui-core.workspace = true
waterui-str.workspace = true
waterui-url.workspace = true
waterui-layout.workspace = true
waterui-text.workspace = true
waterui-media = { workspace = true, optional = true }
waterui-video = { workspace = true, optional = true }
native-executor.workspace = true
waterui-navigation.workspace = true
waterui-form.workspace = true
waterui-controls.workspace = true
waterui-webview = { workspace = true, optional = true }
waterui-locale.workspace = true
waterkit-screen.workspace = true
executor-core.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true
minstant.workspace = true
cpu-time.workspace = true
pulldown-cmark = "0.13"
waterui-macros.workspace = true
libloading = "0.9"
waterui-graphics.workspace = true
waterui-icon.workspace = true
waterui-shape.workspace = true
waterui-svg.workspace = true
waterui-assets = { workspace = true, optional = true }
waterui-assets-macros = { workspace = true, optional = true }
waterui-inspector-protocol.workspace = true
waterkit-haptic = { workspace = true, optional = true }

async-fs = "2.2.0"
robius-open.workspace = true
pastey.workspace = true
tree-sitter = { version = "0.25", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-bash = { version = "0.23", optional = true }
tree-sitter-sequel = { version = "0.3.11", optional = true }



[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { workspace = true, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
zenwave = { workspace = true, features = ["rustls"] }
android_clipboard = "0.1.0"

[target.'cfg(not(any(target_vendor = "apple", target_os = "android")))'.dependencies]
zenwave = { workspace = true, features = ["rustls"] }


[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
arboard = "3.6.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window"] }



[features]
default = ["assets", "media", "webview", "flow-markdown"]
assets = ["dep:waterui-assets", "dep:waterui-assets-macros"]
media = ["dep:waterui-media", "video"]
video = ["dep:waterui-video"]
webview = ["dep:waterui-webview"]
flow-markdown = [
    "dep:tree-sitter",
    "dep:tree-sitter-md",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-json",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-sequel",
]
std = ["dep:waterkit-haptic"]
all = ["std", "assets", "media", "webview", "flow-markdown"]


[lints]
workspace = true

# Optimize release builds for size
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"    # Optimize for size
strip = true       # Strip symbols
panic = "abort"    # Smaller panic handling

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
