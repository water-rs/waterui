waterui-icons-lucide = { version = "0.1.0", path = "components/icon/lucide" }
waterui-icons-native = { version = "0.1.0", path = "components/icon/native" }
waterui-locale = { version = "0.1.0", path = "utils/locale" }
waterui-map = { version = "0.1.0", path = "components/data/map" }
waterkit-location = { version = "0.1.0", path = "kit/device/location" }
waterkit-screen = { version = "0.1.0", path = "kit/platform/screen" }
waterkit-audio = { version = "0.1.0", path = "kit/multimedia/audio", default-features = false }
waterkit-clipboard = { version = "0.1.0", path = "kit/platform/clipboard" }
waterkit-permission = { version = "0.1.0", path = "kit/platform/permission" }
waterkit-dialog = { version = "0.1.0", path = "kit/sharing/dialog" }
waterkit-fs = { version = "0.1.0", path = "kit/platform/fs" }
waterkit-haptic = { version = "0.1.0", path = "kit/device/haptic" }
waterkit-camera = { version = "0.1.0", path = "kit/device/camera" }
waterkit-codec = { version = "0.1.0", path = "kit/multimedia/codec", default-features = false }
waterkit-video = { version = "0.1.0", path = "kit/multimedia/video", features = ["streaming"] }
waterkit-build = { version = "0.1.0", path = "kit/utils/build" }
waterui-backend-core = { version = "0.1.0", path = "backends/core", default-features = false }
filtrate = "0.2.0"
filtrate-core = "0.2.0"
filtrate-derive = "0.1.0"
waterui-barcode = "0.1.0"
waterui-particle = { version = "0.1.0", path = "components/effects/particle" }
waterui-chart = "0.1.0"
waterui-map-gpu = "0.1.0"
