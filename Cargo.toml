[dependencies]
waterui-internal.workspace = true
waterui-dylib = { workspace = true, optional = true }


[dev-dependencies]
waterui-testing = { path = "testing" }
hydrolysis-m3 = { path = "backends/hydrolysis_m3" }

[features]
default = ["gpu", "assets", "media", "inspector", "snackbar"]
# GPU rendering stack (wgpu/vello via waterui-graphics + waterui-svg). Default-on
# so every existing consumer is unaffected. Disable it to cross-compile a lean
# WaterUI app for embedded targets without the GPU stack.
gpu = ["waterui-internal/gpu", "waterui-dylib?/gpu"]
inspector = ["waterui-internal/inspector", "waterui-dylib?/inspector"]
inspector-signals = ["inspector", "waterui-internal/inspector-signals"]
snackbar = ["waterui-internal/snackbar", "waterui-dylib?/snackbar"]
assets = ["waterui-internal/assets", "waterui-dylib?/assets"]
media = ["waterui-internal/media", "waterui-dylib?/media", "video"]
video = ["waterui-internal/video", "waterui-dylib?/video"]
webview = ["waterui-internal/webview", "waterui-dylib?/webview"]
chart = ["waterui-internal/chart", "waterui-dylib?/chart"]
barcode = ["waterui-internal/barcode", "waterui-dylib?/barcode"]
map = ["waterui-internal/map", "waterui-dylib?/map"]
particle = ["waterui-internal/particle", "waterui-dylib?/particle"]
navigation-restoration = [
    "waterui-internal/navigation-restoration",
    "waterui-dylib?/navigation-restoration",
]
flow-markdown = ["waterui-internal/flow-markdown", "waterui-dylib?/flow-markdown"]
std = ["waterui-internal/std", "waterui-dylib?/std"]
dynamic_linking = ["dep:waterui-dylib"]
# Every feature the framework offers an application. `dynamic_linking` is
# deliberately absent: it is a build strategy — one shared copy of the framework
# for the preview system — not a capability, and `waterui-dylib` exports more
# symbols than a PE export table can hold, so a Windows build of it cannot link
# at all. `--all-features` therefore cannot be used on Windows; `--features all`
# is what CI asks for instead.
all = [
    "std",
    "gpu",
    "inspector",
    "inspector-signals",
    "assets",
    "media",
    "webview",
    "flow-markdown",
    "chart",
    "barcode",
    "map",
    "particle",
    "navigation-restoration",
    "snackbar",
]


[lints]
workspace = true

# Optimize release builds for size
# Development builds of this repository. Cargo only honours profiles from the
# top-level workspace, so none of this reaches an application built against the
# published crates — it tunes how WaterUI itself is developed.
[profile.dev]
# sccache refuses to cache incremental compilation, so leaving it on means this
# workspace pays for a cache it can never use — and pays again in every agent
# workspace, each of which then compiles the tree from scratch. Off, the shared
# cache actually serves them, and the per-crate incremental directories (easily
# tens of gigabytes across a few checkouts) stop existing.
incremental = false
# Backtraces still resolve to file and line; what goes is the full type and
# variable debug info, which dominates artifact size and is rarely how a layout
# or rendering bug gets diagnosed here.
debug = "line-tables-only"

# Dependencies are debugged even more rarely than they are stepped into, and the
# graph carries wgpu, vello and parley — the bulk of the debug info by far.
# They are, however, on every frame's hot path: at opt-level 0 the vello/wgpu
# encode-and-submit alone costs several milliseconds per frame and a debug
# `water run` visibly drops frames while scrolling. Optimizing dependencies
# keeps workspace crates fully debuggable while the rendering stack runs at
# real speed, and sccache still caches the results (non-incremental).
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"    # Optimize for size
strip = true       # Strip symbols
panic = "abort"    # Smaller panic handling

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# xcb 1.7.0 still builds with vulnerable quick-xml 0.30. Upstream has migrated
# to quick-xml 0.41, but has not released that change yet.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
# `block` 0.1.6 declares the Blocks ABI symbol as an uninhabited extern
# static. This pinned fork changes only that declaration to the symbol's byte
# storage and takes its address as the opaque class pointer.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# vello 0.9 loses the Vulkan device on Mali (select's discarded arm computes an
# underflowed workgroup-array index; Mali page-faults on it). Fixed upstream in
# linebender/vello#1817; drop this patch when a release containing it ships.
vello = { git = "https://github.com/lexoliu/vello", branch = "fix-select-index-underflow" }
# From the same checkout, so both engines are built from one tree.
vello_hybrid = { git = "https://github.com/lexoliu/vello", branch = "fix-select-index-underflow" }
# `waterui-graphics` names glifo directly and `vello_hybrid` exposes its glyph
# builder types. Keep both edges on the same checkout while this Vello patch is
# active; published manifests still resolve the matching crates.io releases.
glifo = { git = "https://github.com/lexoliu/vello", branch = "fix-select-index-underflow" }

# Arm's proprietary Vulkan driver (r54p2 on Pixel 9 Pro / Android 16)
# rasterizes as if viewport heights were positive, ignoring the negative-height
# viewport wgpu uses to flip Y, so every render pass comes out upside down.
# This branch flips Y in the vertex shader on that driver instead; drop the
# patch when upstream ships an equivalent workaround.
wgpu = { git = "https://github.com/lexoliu/wgpu", branch = "mali-negative-viewport" }
wgpu-core = { git = "https://github.com/lexoliu/wgpu", branch = "mali-negative-viewport" }
wgpu-hal = { git = "https://github.com/lexoliu/wgpu", branch = "mali-negative-viewport" }
wgpu-types = { git = "https://github.com/lexoliu/wgpu", branch = "mali-negative-viewport" }
naga = { git = "https://github.com/lexoliu/wgpu", branch = "mali-negative-viewport" }
