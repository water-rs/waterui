
[workspace]
members = [
    "core",
    "components/assets/*",
    "components/codes/*",
    "components/data/*",
    "components/devtools/*/*",
    "components/effects/*",
    "components/foundation/*",
    "components/multimedia/*",
    "components/platform/*",
    "components/visual/*",
    "utils/*",
    "utils/filtrate/core",
    "utils/filtrate/derive",
    "src",
    "testing",
    "ffi",
    "macros",
    "cli",
    "examples/*",
    "backends/core",
    "backends/dew",
    "backends/gtk",
    "backends/hydrolysis",
    "backends/hydrolysis_m3",
    "components/icon/*",
]
exclude = [
  "hydrolysis",
  "derive",
  ".github",
  ".claude",
  "*.png",
  "kit",
  "utils/nami",
]



resolver = "2"

[package]
name = "waterui"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "A modern UI framework for Rust"
keywords = ["ui", "framework", "rust", "gui", "water"]
categories = ["gui"]

[lib]
path = "src/runtime/facade.rs"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/waterui"
description = "A modern UI framework for Rust"
keywords = ["ui", "framework", "rust", "gui", "water"]
categories = ["gui"]

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
clippy.undocumented_unsafe_blocks = "warn"
clippy.multiple_crate_versions =  { level = "allow", priority = 1 }



