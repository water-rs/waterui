
[workspace]
members = [
    "core",
    "components/assets/*",
    "components/data/*",
    "components/devtools/*/*",
    "components/effects/*",
    "components/foundation/*",
    "components/multimedia/*",
    "components/platform/*",
    "components/visual/*",
    "utils/*",
    "src",
    "testing",
    "ffi",
    "macros",
    "cli",
    "examples/*",
    ".claude/skills/waterui/skill_snippets",
    "backends/core",
    "backends/dew",
    "backends/gtk",
    "backends/hydrolysis",
    "backends/hydrolysis_m3",
    "components/icon/*",
]
exclude = [
  "hydrolysis",
  "derive",
  ".github",
  "*.png",
  "kit",
  "utils/nami",
]



resolver = "2"

[package]
name = "waterui"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "A modern UI framework for Rust"
keywords = ["ui", "framework", "rust", "gui", "water"]
categories = ["gui"]

[lib]
path = "facade.rs"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/waterui"
description = "A modern UI framework for Rust"
keywords = ["ui", "framework", "rust", "gui", "water"]
categories = ["gui"]

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
clippy.undocumented_unsafe_blocks = "warn"
clippy.multiple_crate_versions =  { level = "allow", priority = 1 }



[workspace.dependencies]
bitflags = "2.13.1"
blocking = "1.6.2"
executor-core = { version = "0.7.1", features = ["std"]}
# No crate in this workspace runs a future on `futures`' own executor — every
# host installs its own `LocalExecutor` — so the default `executor` feature is
# off. (waterkit keeps it: its streaming code does `block_on`.)
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
futures-lite = "2.6"
geo = { version = "0.32", default-features = false }
getrandom = "0.2"
geo-types = "0.7"
lru = "0.16"
maplibre-expr = "0.3.2"
mvt-reader = "2.4.0"
# W3C UI Events key/code/modifier vocabulary, shared by the GPU-surface input
# contract and every backend that feeds it.
keyboard-types = { version = "0.8.3", default-features = false }
# winit -> `keyboard-types` translation, maintained alongside `keyboard-types`
# by the Linebender/rust-windowing side. Keeps the key/code tables out of here.
ui-events-winit = "0.3.0"
serde_json = "1.0"
smallvec = "1.15"
# Local vendored dependency overrides via git submodule.
nami = "0.11.0"
nami-core = "0.3.3"
pin-project-lite = "0.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0.19"
url = "2.5"
uuid = { version = "1.24.0", default-features = false, features = ["v4", "std"] }
waterui-core = { version = "0.3.0", path = "core" }
waterui-str = { version = "0.3.0", path = "utils/str" }
waterui-url = { version = "0.3.0", path = "utils/url" }
waterui-watcher-set = { version = "0.1.0", path = "utils/watcher-set" }
waterui-text = { version = "0.3.0", path = "components/foundation/text" }
waterui-media = { version = "0.3.0", path = "components/multimedia/media" }
waterui-image = "0.3.0"
waterui-video = { version = "0.3.0", path = "components/multimedia/video" }
waterui-video-gpu = { version = "0.3.0", path = "components/multimedia/video_gpu" }
waterui-form = { version = "0.3.0", path = "components/foundation/form" }
waterui-controls = { version = "0.3.0", path = "components/foundation/controls"}
waterui-graphics = { version = "0.3.0", path = "components/visual/graphics", default-features = false }
waterui-canvas = "0.1.0"
waterui-mermaid = { version = "0.1.0", path = "components/data/mermaid" }
# Mermaid parsing, semantic model and diagram layout. Consumed from our fork
# while `typed-layout-projection` is unreleased upstream: `merman-render`'s only
# public exit from the layout stage is `layout_json`, whose `#[serde(skip)]`
# fields drop geometry a self-drawing host needs — a sequence diagram's
# loop/alt fragment boxes among them. The branch makes the typed projection
# public and changes nothing else. See water-rs/waterui#217.
merman-core = { git = "https://github.com/water-rs/merman", rev = "a6f41d47b497c05844003a0e765a3cf78df6678d" }
merman-render = { git = "https://github.com/water-rs/merman", rev = "a6f41d47b497c05844003a0e765a3cf78df6678d", default-features = false }
waterui-shape = { version = "0.1.0", path = "components/foundation/shape", default-features = false }
waterui-svg = { version = "0.1.0", path = "components/visual/svg" }
waterui-math = { version = "0.1.0", path = "components/visual/math" }
waterui-ffi = { version = "0.3.0", path = "ffi" }
waterui-layout = { version = "0.3.0", path = "components/foundation/layout" }
waterui-navigation = { version = "0.3.0", path = "components/foundation/navigation" }
waterui-webview = { version = "0.3.0", path = "components/platform/webview" }
waterui-chromium = { version = "0.1.0", path = "components/platform/chromium" }
waterui-browser-cef = { version = "0.1.0", path = "components/platform/browser-cef", default-features = false }
waterui-browser-wpe = { version = "0.1.0", path = "components/platform/browser-wpe", default-features = false }
# Zero-copy import of an externally produced GPU frame into a wgpu texture.
# Deliberately free of every waterui dependency: it is a general interop layer
# and lives in its own repository at water-rs/wgpu-external-frame.
wgpu-external-frame = "0.1.1"
waterui-icon = { version = "0.3.0", path = "components/foundation/icon" }
waterui-icons-sf-symbol = { version = "0.1.0", path = "components/icon/sf_symbol" }
waterui-icons-material-icon = { version = "0.1.0", path = "components/icon/material" }
