[package]
name = "cherenkov-bench"
version = "0.0.0"
description = "Engine adapters and render/measure CLI for the Cherenkov cross-engine suite"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
vello-classic = ["dep:vello", "dep:vello_common", "dep:wgpu29", "dep:pollster", "dep:ash"]
vello-hybrid = ["dep:vello_hybrid", "dep:vello_common", "dep:wgpu29", "dep:pollster", "dep:glifo", "dep:ash"]
vello-cpu = ["dep:vello_cpu", "dep:vello_common"]
# `skia-safe` backend features stay in the feature lists, not on the
# dependency: `skia-bindings` downloads a prebuilt Skia keyed on the whole
# enabled set, and only the published combos (e.g. `metal,graphite`) have
# binaries — an ad-hoc `vulkan,ganesh,metal,graphite` set falls back to a
# full Skia source build. `skia-bindings/no-compile` turns that fallback
# into a panic so every bench build linking Skia must use the prebuilt
# binaries.
skia = ["dep:skia-safe", "dep:ash", "dep:skia-bindings", "skia-safe/vulkan", "skia-safe/ganesh"]
skia-metal = ["dep:skia-safe", "dep:objc2", "dep:objc2-metal", "dep:skia-bindings", "skia-safe/metal", "skia-safe/graphite"]
# The platform-buffer producers `external-cost` uses are target-gated
# below; their `dep:` entries resolve only on the matching target.
cherenkov = [
    "dep:cherenkov", "dep:cherenkov-gpu", "cherenkov-gpu/bench", "dep:wgpu", "dep:ash",
    "dep:half", "dep:filtrate", "cherenkov-scene/text",
    "dep:objc2", "dep:objc2-metal", "dep:objc2-core-video",
    "dep:objc2-io-surface", "dep:objc2-core-foundation", "dep:ndk-sys",
]
cherenkov-cpu = ["dep:cherenkov", "dep:cherenkov-cpu", "dep:filtrate", "cherenkov-scene/text"]

[dependencies]
cherenkov = { path = "..", optional = true }
cherenkov-gpu = { path = "../gpu", optional = true }
cherenkov-cpu = { path = "../cpu", optional = true }
cherenkov-scene = { path = "../scene" }
cherenkov-oracle = { path = "../oracle" }
filtrate = { path = "../../filtrate", optional = true }
kurbo = "0.13"
nami = { version = "0.11.1", default-features = false, features = ["std", "kurbo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decodes `powermetrics --format plist` output for `measure --energy`.
plist = "1.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# The fork pinned in the workspace `[patch.crates-io]` declares 0.9.0 — the
# requirement Hydrolysis itself uses.
vello = { version = "0.9", optional = true, features = ["wgpu-profiler"] }
vello_hybrid = { version = "0.2", optional = true }
vello_cpu = { version = "0.2", optional = true, features = ["f32_pipeline"] }
vello_common = { version = "0.2", optional = true }
skia-safe = { version = "0.153", optional = true }
# `no-compile` unifies onto skia-safe's transitive skia-bindings.
skia-bindings = { version = "0.153", optional = true, default-features = false, features = ["no-compile"] }
ash = { version = "0.38", optional = true }

wgpu = { version = "30.0.1", optional = true }
# The `vello-classic`/`vello-hybrid` baselines stay on wgpu 29: the pinned
# lexoliu/vello forks require `wgpu ^29`. Both majors link into the bench;
# each engine keeps its own device.
wgpu29 = { package = "wgpu", version = "29", optional = true }
pollster = { version = "0.4", optional = true }
peniko = "0.6"
skrifa = "0.44"
read-fonts = "0.41"
png = "0.18"
bytemuck = "1"
half = { version = "2", optional = true }
glifo = { version = "0.3", optional = true }
# Minimal surface: CPU list + brand string for `cpu_model`.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# `sched_setaffinity` / `sched_getcpu` for `measure --cpu`; `kill` to
# stop `powermetrics` for `measure --energy`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `AHardwareBuffer` producer for `external-cost` (#168).
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.6", optional = true }

# `external-cost`'s `CVPixelBuffer`/`IOSurface` producer (#168) and
# skia-metal's Metal handle plumbing.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6.3", optional = true, default-features = false }
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = [
    "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer",
    # `CFTimeInterval` for `MTLCommandBuffer::GPUStartTime`/`GPUEndTime`.
    "objc2-core-foundation",
    # `external-cost`'s IOSurface plane textures (#168).
    "MTLTexture", "MTLPixelFormat", "MTLResource", "MTLAllocation", "objc2-io-surface",
] }
objc2-core-video = { version = "0.3", optional = true, default-features = false, features = [
    "std", "objc2-io-surface", "CVBase", "CVBuffer", "CVImageBuffer",
    "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn",
] }
objc2-io-surface = { version = "0.3", optional = true }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std", "CFBase", "CFString", "CFNumber", "CFDictionary",
] }

# `staticlib` for hosts that cannot run a command-line binary — the iOS
# bench app (`bench/ios`) links `cherenkov_bench_run` out of the .a.
[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "cherenkov-bench"
path = "src/bin.rs"

[[bin]]
name = "cherenkov-import-frame"
path = "src/bin/import_frame.rs"
required-features = ["cherenkov"]

[[example]]
name = "gamut_gpu_sweep"
required-features = ["cherenkov"]
