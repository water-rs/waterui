[package]
name = "apple-planes"
version = "0.0.0"
description = "On-device verification harness for Apple system-compositor planes (#90)"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

# A standalone workspace, like android_planes: the example keeps its own
# lockfile so host builds and the iOS staticlib resolve identically.
[workspace]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[lints]
workspace = true

# Same pins as the repo root: `nami-core`'s `kurbo` feature is unreleased
# (water-rs/nami#27), and the wgpu fork carries the v30 Metal colour-space
# fix (gfx-rs/wgpu#10175) that surface negotiation on Apple needs.
[patch.crates-io]
nami = { git = "https://github.com/water-rs/nami", rev = "6908aac816de14ee5aff23bfffd7d2b109d08fea" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "6908aac816de14ee5aff23bfffd7d2b109d08fea" }
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }

[dependencies]
cherenkov = { path = "../../.." }
cherenkov-gpu = { path = "../.." }
cherenkov-bench = { path = "../../../bench" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std", "fmt"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFString", "CFDictionary", "CFArray", "CFNumber"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "objc2-io-surface", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSProcessInfo", "NSThread"] }
objc2-io-surface = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "UIScreen", "UIView", "UIWindow"] }

[dev-dependencies]
wgpu = "30.0.1"
