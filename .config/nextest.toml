# Generated test fixtures are produced by nextest setup scripts (#2386), so
# a local run and a CI leg share one path: each generator below is pinned,
# hash-verified, and a cheap no-op once its output exists and verifies.
experimental = ["setup-scripts"]

# Local runs keep nextest's defaults.
[profile.default]
# The AppKit/UIKit-touching native tests share process-wide framework state;
# report failures at the end of output rather than mid-stream.
failure-output = "immediate-final"
# Surface anything pathologically slow rather than letting CI hang on it.
slow-timeout = { period = "60s", terminate-after = 10 }

# A test is "leaky" when its stdout/stderr pipe is still open after the
# process has exited. Nothing on the test side of this workspace can do that:
# the only child process any test infrastructure spawns is Hydrolysis'
# Linux-only `busctl` query, which is reaped with `.output()` before the test
# continues, and threads cannot outlive their process. So a leak report here
# is nextest's own pipe reader losing the race for the window under load
# (#456: one random pure-geometry test per `-j 32` run on a machine running
# several cargo builds, clean 12/12 in isolation). The default 100 ms window is
# widened to what a loaded developer machine or CI runner needs, and past that
# window the report is a failure, not a passing test with a footnote, so a real
# escaped handle can no longer hide behind "the usual noise".
leak-timeout = { period = "500ms", result = "fail" }

# `#[waterui::bench]` tests are long by design in full-measurement mode:
# `water bench` drives hundreds of frames per repetition, and on a software
# rasterizer (llvmpipe on CI's Linux runners) a heavy scene runs at seconds
# per frame — the stress bench hit the default 600s terminate ceiling there.
# Mark them slow later and give them a far higher terminate ceiling instead
# of letting the general-test watchdog kill a legitimate measurement run.
[[profile.default.overrides]]
filter = "test(waterui_bench_)"
slow-timeout = { period = "300s", terminate-after = 8 }

[profile.ci]
# Report every failure in one run: stopping at the first turns a multi-failure
# break into one CI round trip per failure.
fail-fast = false
failure-output = "immediate-final"
# `slow` prints each test's name as it crosses the slow-timeout threshold
# and `pass` prints one line per finished test binary, so a dominant test
# or binary is identifiable from the log alone — `retry` showed only
# retried tests, which is how a 24-minute Windows phase named none of
# its seven slow tests.
status-level = "slow"
final-status-level = "pass"
slow-timeout = { period = "120s", terminate-after = 5 }

# Same bench exemption as the default profile: smoke-mode benches are cheap,
# but a heavy scene's first GPU mount on a software rasterizer can still be
# slow, and a measurement run must never be killed by the general watchdog.
[[profile.ci.overrides]]
filter = "test(waterui_bench_)"
slow-timeout = { period = "300s", terminate-after = 8 }

# `trybuild` contract tests, which are compilers rather than tests.
#
# Each `cases.pass(...)` / `cases.compile_fail(...)` shells out to a full
# `cargo build` of a fixture crate that depends on `waterui`, into trybuild's
# own target directory — so a cold run builds the framework from scratch and
# blows straight through the general 600s ceiling. Observed on a CI ubuntu run:
# both contract tests hit `TMT [600.011s]`, were killed, and then passed on the
# retry in 107s and 184s, because the attempt that was killed is what warmed
# the cache. The retry made this green while costing 600s of wall clock twice
# per run.
#
# The ceiling is raised rather than the tests changed: they are legitimately
# slow the first time and fast afterwards, which is exactly what a raised
# ceiling is for and exactly what a watchdog should not kill.
[[profile.ci.overrides]]
filter = 'package(waterui-macros)'
slow-timeout = { period = "120s", terminate-after = 15 }

# GPU- and process-backed tests are occasionally flaky on shared runners — a
# WARP device losing the memory race on Windows, Metal's shader cache racing
# another process on a developer machine — so they get a retry, and the retry
# is reported. Everything else is deterministic: a failure there is real, and
# an unconditional retry would only double the runtime of a genuinely broken
# suite while hiding the first failure's evidence. The set is the `gpu-device`
# test group below minus `hydrolysis`: the backend mounts
# a GPU per test and is the suite most tempted by a retry, but retrying a GPU
# test hides flakiness rather than fixing it — a red hydrolysis leg is the
# honest state until the device race is fixed (#1441 review).
[[profile.ci.overrides]]
filter = 'package(waterui) or package(waterui-browser-cef) or package(waterui-browser-wpe) or package(waterui-controls) or package(waterui-ffi) or package(waterui-form) or package(waterui-graphics) or package(waterui-icon) or package(waterui-icons-lucide) or package(waterui-icons-material-icon) or package(waterui-inspector-app) or package(waterui-map) or package(waterui-mcp) or package(waterui-media) or package(waterui-navigation) or package(waterui-shape) or package(waterui-testing) or package(waterui-text) or package(waterui-webview) or package(gallery-example) or package(list-example) or package(reply-example) or package(stress-example) or package(typography-rtl-example)'
retries = { backoff = "fixed", count = 2, delay = "1s" }

# The CLI's tests shell out to cargo and git — `cargo metadata`, `git clone`,
# the `water` binary under test — which are occasionally flaky on shared
# runners; a retry keeps that from failing the branch, and the retry is
# reported through `final-status-level`. The standalone repository retried
# the whole suite unconditionally for the same reason; here the retry is
# scoped to the package, the way every other flaky-backed suite above is.
[[profile.ci.overrides]]
filter = 'package(waterui-cli)'
retries = { backoff = "fixed", count = 2, delay = "1s" }

# How many wgpu devices may exist at once on the Windows runner.
#
# Every package in the filter mounts a `waterui-testing` host or creates a
# `wgpu` device in its tests, and each host requests its own `wgpu::Device`.
# On a runner with a real GPU that is cheap; on `windows-latest` there is no
# GPU at all, so every device is a WARP device living in the machine's 16 GB
# alongside three others on its four cores. The suite ran out:
# `selected_tooltip_exposes_accessibility_labels` and its neighbours failed in
# `request_device` with `Core(Device(OutOfMemory))`, exhausted their retries,
# and the same tests passed on retry in earlier runs — the signature of
# sitting exactly at a memory limit rather than of a defect.
#
# A cap, not a skip: every test still runs, the device-bearing ones two at a
# time instead of four, so the peak number of live WARP devices halves while
# the CPU-only suites — parsers, data structures, the macro contract tests —
# keep full parallelism. This lengthens the device-bearing leg of the Windows
# job, which is the cost of the runner having no GPU.
#
# Scoped to Windows because it is the only platform without one — the Linux
# runners rasterize on llvmpipe, which is far cheaper per device, and macOS has
# Metal.
#
# The package list is the workspace's direct dependents of `waterui-testing`,
# `wgpu` and `hydrolysis` — the only ways a test binary here can hold a
# device — minus the ones whose test code cannot run it:
# `waterui-macros` carries `trybuild` compilers and pure derive tests,
# `skill_snippets`' host-mounting transcriptions are compile-gated and never
# run, and `waterkit-camera-filters-example` has no tests at all.
# `rdeps(waterui-testing)` is not the filter: guppy's graph walks
# dev-dependency edges transitively, which pulls in the whole workspace
# through `waterui`'s dev-dependency. Keep the list in sync when a package's
# dependency on the GPU stack changes.
#
# `hydrolysis-m3` is not named: while it stays an external dependency rather
# than a workspace member, `package(hydrolysis-m3)` fails the whole
# expression at parse time — add it if the crate ever lands in-tree.
[test-groups.gpu-device]
max-threads = 2

# How many processes may compile Metal shaders at once on macOS.
#
# Every test process that mounts a `waterui-testing` host builds its own
# `wgpu::Device`, and each device runs the engine's shader initialisation. On
# macOS that is `newLibraryWithSource`, which goes through Metal's on-disk
# shader-compiler cache — a single file shared by every process on the machine.
# Metal does not survive many processes reading and writing it at once: a run of
# the mermaid suite aborted with
#
#     SIGBUS, subtype "FS pagein error: 22 Invalid argument"
#     thread "shader initialisation worker thread"
#       MTLCompilerFSCache::getElementImpl
#       MTLLibraryBuilder::newLibraryWithSource
#       wgpu_hal::metal::Device::load_shader
#
# on a machine that also had three cargo builds running (#434). The faulting
# page belongs to that cache file, not to anything WaterUI allocated: a reader
# paged it in while another process rewrote it.
#
# The cap costs nothing, which is what makes it the right answer rather than a
# trade. These tests all queue on one GPU, so parallelism past a handful buys no
# wall clock — measured on the mermaid suite, twice each:
#
#     -j 32   3.415s  2.797s
#     -j 8    2.265s  2.624s
#     -j 4    2.496s  2.425s
#
# Scoped to the packages that mount a host, so the many fast non-GPU tests on
# macOS keep full parallelism. The cap only ever binds on a developer machine —
# GitHub's macOS runners have three or four cores, so nextest already runs at or
# below four processes there — and a developer machine with a dozen cores is
# exactly where the process storm happens.
[test-groups.metal-shader-compile]
max-threads = 4

[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'package(waterui) or package(waterui-testing)'
test-group = 'metal-shader-compile'

[[profile.ci.overrides]]
platform = 'cfg(target_os = "windows")'
filter = 'package(waterui) or package(waterui-browser-cef) or package(waterui-browser-wpe) or package(waterui-controls) or package(waterui-ffi) or package(waterui-form) or package(waterui-graphics) or package(waterui-icon) or package(waterui-icons-lucide) or package(waterui-icons-material-icon) or package(waterui-inspector-app) or package(waterui-map) or package(waterui-mcp) or package(waterui-media) or package(waterui-navigation) or package(waterui-shape) or package(waterui-testing) or package(waterui-text) or package(waterui-webview) or package(gallery-example) or package(list-example) or package(reply-example) or package(stress-example) or package(typography-rtl-example) or package(hydrolysis)'
test-group = 'gpu-device'

# How many `native_app` cases may run at once on the iOS Simulator.
#
# A `native_app` harness runs its cases inside a launched `UIApplication`:
# the `nextest-ios-sim.sh` target runner installs the binary as an `.app`
# and `simctl launch`es it, one case per launch. A simulator keeps one
# installed copy of a bundle identifier and shows one application in the
# foreground, so two launches at once would replace or terminate each other.
# The group declares that serialization to nextest, which then keeps its
# other slots for the bare `simctl spawn` binaries; the runner's own lock is
# only the guard for `cargo test` or two separate runs sharing one device.
[test-groups.ios-sim-app]
max-threads = 1

[[profile.default.overrides]]
platform = 'cfg(target_os = "ios")'
filter = 'binary(native_app)'
test-group = 'ios-sim-app'

[[profile.ci.overrides]]
platform = 'cfg(target_os = "ios")'
filter = 'binary(native_app)'
test-group = 'ios-sim-app'

# The pinned, hash-verified generators, one per uncommitted asset a suite
# needs. `uv run` reads each script's inline metadata the same way CI does.
[scripts.setup.test-fonts]
command = ["uv", "run", "backends/hydrolysis/test-fonts/install.py"]

[scripts.setup.live-photo-motion]
command = [
    "uv",
    "run",
    "backends/hydrolysis/tests/fixtures/generate-live-photo-motion.py",
    "backends/hydrolysis/tests/fixtures/live-photo-motion.mp4",
]

# The same generator, writing the copy waterui-media's e2e_semantics reads.
[scripts.setup.media-live-photo-motion]
command = [
    "uv",
    "run",
    "backends/hydrolysis/tests/fixtures/generate-live-photo-motion.py",
    "components/multimedia/media/tests/fixtures/live-photo-motion.mp4",
]

[scripts.setup.cli-roboto]
command = ["uv", "run", "cli/tests/fixtures/fonts/generate.py"]

# Which tests each generator serves. A run that reaches none of a rule's
# packages runs no generator. Every profile, `ci` included, applies the
# default profile's script rules, so they are written once.
#
# `test-fonts` serves the packages whose test binaries link
# `waterui-testing`, whose styled suites resolve the installed families
# through system font discovery. That set is a fact of the package graph,
# and `.github/tools/affected` (`affected nextest-fixtures`, run by the
# affected-scope job) fails CI naming every package this filter is missing
# or carries without cause. `rdeps(waterui-testing)` cannot replace the
# list: it follows dev-dependency edges at every hop, while cargo links a
# package's dev-dependencies into its own tests only.
#
# `live-photo-motion` and `media-live-photo-motion` run the same generator
# for the clip's two readers: hydrolysis's `tests/media.rs` and
# waterui-media's `tests/e2e_semantics.rs`. `cli-roboto` serves the
# waterui-cli platform test that copies the fixture into a generated
# project — a path membership, not a dependency edge.
[[profile.default.scripts]]
filter = '''
    package(gallery-example)
 or package(hydrolysis)
 or package(list-example)
 or package(reply-example)
 or package(skill_snippets)
 or package(stress-example)
 or package(typography-rtl-example)
 or package(waterui)
 or package(waterui-controls)
 or package(waterui-form)
 or package(waterui-graphics)
 or package(waterui-icon)
 or package(waterui-icons-lucide)
 or package(waterui-icons-material-icon)
 or package(waterui-inspector-app)
 or package(waterui-macros)
 or package(waterui-mcp)
 or package(waterui-media)
 or package(waterui-navigation)
 or package(waterui-testing)
 or package(waterui-text)
 or package(waterui-webview)
'''
setup = 'test-fonts'

[[profile.default.scripts]]
filter = 'package(hydrolysis)'
setup = 'live-photo-motion'

[[profile.default.scripts]]
filter = 'package(waterui-media)'
setup = 'media-live-photo-motion'

[[profile.default.scripts]]
filter = 'package(waterui-cli)'
setup = 'cli-roboto'
