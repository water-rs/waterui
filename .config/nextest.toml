# Local runs keep nextest's defaults.
[profile.default]
# Surface anything pathologically slow rather than letting CI hang on it.
slow-timeout = { period = "60s", terminate-after = 10 }

# `#[waterui::bench]` tests are long by design in full-measurement mode:
# `water bench` drives hundreds of frames per repetition, and on a software
# rasterizer (llvmpipe on CI's Linux runners) a heavy scene runs at seconds
# per frame — the stress bench hit the default 600s terminate ceiling there.
# Mark them slow later and give them a far higher terminate ceiling instead
# of letting the general-test watchdog kill a legitimate measurement run.
[[profile.default.overrides]]
filter = "test(waterui_bench_)"
slow-timeout = { period = "300s", terminate-after = 8 }

[profile.ci]
# Report every failure in one run: stopping at the first turns a multi-failure
# break into one CI round trip per failure.
fail-fast = false
failure-output = "immediate-final"
status-level = "retry"
# GPU and emulator-backed tests are occasionally flaky on shared runners; a
# retry keeps that from failing the branch, and the retry is reported.
retries = { backoff = "fixed", count = 2, delay = "1s" }
slow-timeout = { period = "120s", terminate-after = 5 }

# Same bench exemption as the default profile: smoke-mode benches are cheap,
# but a heavy scene's first GPU mount on a software rasterizer can still be
# slow, and a measurement run must never be killed by the general watchdog.
[[profile.ci.overrides]]
filter = "test(waterui_bench_)"
slow-timeout = { period = "300s", terminate-after = 8 }

# The Windows leg, which has no GPU.
#
# wgpu waits for the last submission to complete when a device is destroyed,
# through a fixed ladder of timeouts totalling 6.3s (`wgpu-core`'s
# `device/queue.rs`), and panics if it runs out — "We timed out while waiting on
# the last successful submission to complete!". There is no env var for it.
#
# A hosted Windows runner falls back to a software adapter, and nextest gives
# every test its own process and its own device, so four of them rasterizing at
# once is enough to blow that budget. It is the *teardown* that fails, not the
# test: every one of #152's remaining failures is a GPU-backed test panicking on
# drop. Halving the parallelism halves the simultaneous device count.
#
# This is the coarse instrument. The precise one is letting a test declare that
# it needs a GPU, so those alone are capped or skipped; that needs a marker the
# repository does not have yet.
[profile.ci-windows]
inherits = "ci"
test-threads = 2
