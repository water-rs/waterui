[package]
name = "waterui-internal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Internal implementation crate for WaterUI"
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[dependencies]
nami.workspace = true
waterui-core.workspace = true
waterui-str.workspace = true
waterui-url.workspace = true
waterui-layout.workspace = true
waterui-text.workspace = true
waterui-media = { workspace = true, optional = true }
waterui-video = { workspace = true, optional = true }
native-executor.workspace = true
waterui-navigation.workspace = true
waterui-form.workspace = true
waterui-controls.workspace = true
waterui-webview = { workspace = true, optional = true }
waterui-locale.workspace = true
waterkit-screen = { workspace = true, optional = true }
executor-core.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
async-channel.workspace = true
minstant.workspace = true
pulldown-cmark = "0.13"
waterui-macros.workspace = true
libloading = "0.9"
waterui-graphics = { workspace = true, default-features = false }
waterui-icon.workspace = true
waterui-shape = { workspace = true, default-features = false }
waterui-svg = { workspace = true, optional = true }
waterui-assets = { workspace = true, optional = true }
waterui-assets-macros = { workspace = true, optional = true }
waterui-inspector-protocol = { workspace = true, optional = true }
waterkit-haptic = { workspace = true, optional = true }
waterui-chart = { workspace = true, optional = true }
waterui-barcode = { workspace = true, optional = true }
waterui-map = { workspace = true, optional = true }
waterui-particle = { workspace = true, optional = true }

async-fs = "2.2.0"
pastey.workspace = true
tree-sitter = { version = "0.26", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-sequel = { version = "0.3.11", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { workspace = true, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
zenwave = { workspace = true, features = ["rustls"] }
android_clipboard = "0.1.0"

# ESP-IDF firmware does no remote image/media fetching, so the zenwave
# networking stack (rustls -> aws-lc-sys BoringSSL, which does not
# cross-compile under ESP-IDF newlib) is excluded on espidf targets.
[target.'cfg(not(any(target_vendor = "apple", target_os = "android", target_os = "espidf")))'.dependencies]
zenwave = { workspace = true, features = ["rustls"] }

# The system clipboard (arboard, via X11 on Linux) does not exist on bare
# embedded; espidf uses a no-op clipboard in widget/code.rs.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32"), not(target_os = "espidf")))'.dependencies]
arboard = "3.6.1"

# Opening a URL in a system handler (robius-open) has no meaning on bare
# embedded; espidf uses a no-op in component/link.rs.
[target.'cfg(not(target_os = "espidf"))'.dependencies]
robius-open.workspace = true

# CPU-time profiling (cpu-time) needs CLOCK_*_CPUTIME_ID, absent in ESP-IDF
# newlib; the runtime guard uses a zero-cost fallback there.
[target.'cfg(all(any(unix, windows), not(target_os = "espidf")))'.dependencies]
cpu-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window"] }

[features]
default = ["gpu", "assets", "media", "inspector"]
# The devtools Inspector hub and its wire protocol. Default-on for
# development hosts; embedded firmware disables it — the hub is desktop
# tooling, and its 64-bit sequence counters do not even exist on RV32
# targets.
inspector = ["dep:waterui-inspector-protocol", "dep:tracing-subscriber"]
# Reactive-graph tracing for the Inspector's `signals` channel. Development
# only: it attributes every state-owning signal node and reports every
# notification. Off by default so release builds pay nothing — see
# `nami_core::observe`.
inspector-signals = ["inspector", "nami/observability"]
# GPU rendering stack (wgpu/vello via waterui-graphics + waterui-svg). Default-on
# so every existing consumer is unaffected. Disabling it lets a WaterUI app
# cross-compile lean for embedded targets without the GPU stack.
gpu = [
    "waterui-graphics/gpu",
    "waterui-shape/gpu",
    "dep:waterui-svg",
    "dep:waterkit-screen",
]
assets = ["dep:waterui-assets", "dep:waterui-assets-macros"]
media = ["dep:waterui-media", "video"]
video = ["dep:waterui-video"]
webview = ["dep:waterui-webview"]
chart = ["dep:waterui-chart"]
barcode = ["dep:waterui-barcode"]
map = ["dep:waterui-map"]
particle = ["dep:waterui-particle"]
navigation-restoration = ["waterui-navigation/serde"]
flow-markdown = [
    "dep:tree-sitter",
    "dep:tree-sitter-md",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-json",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-sequel",
]
std = ["dep:waterkit-haptic"]
all = [
    "std",
    "gpu",
    "assets",
    "media",
    "webview",
    "flow-markdown",
    "chart",
    "barcode",
    "map",
    "particle",
    "navigation-restoration",
]

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["async-fs", "libloading", "serde", "zenwave"]
