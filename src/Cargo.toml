[package]
name = "waterui-internal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Internal implementation crate for WaterUI"
keywords.workspace = true
categories.workspace = true

[package.metadata.waterui.permissions]
internet = { reason = "serves the Inspector diagnostic endpoint", required-feature = "inspector" }

[lib]
path = "lib.rs"

[dependencies]
nami.workspace = true
waterui-core.workspace = true
waterui-capture.workspace = true
waterui-resources.workspace = true
suiteki.workspace = true
waterui-url.workspace = true
waterui-layout.workspace = true
waterui-text.workspace = true
waterui-media = { workspace = true, optional = true }
waterui-video = { workspace = true, optional = true }
native-executor.workspace = true
waterui-navigation = { workspace = true, optional = true }
waterui-form = { workspace = true, optional = true }
waterui-controls.workspace = true
waterui-backend-core = { workspace = true, default-features = false, optional = true }
waterui-webview = { workspace = true, optional = true }
waterui-map = { workspace = true, optional = true }
waterui-widgets = { workspace = true, optional = true }
# `number` is not optional here: `text!` interpolates every numeric argument
# through `waterui_locale::LocalizedArgument`, so a WaterUI application that
# formats a number into a string already depends on it.
waterui-locale = { workspace = true, features = ["number"] }
# `dir_static!` expansion lands inside the `assets` feature's generated
# code, so the record helpers it names ride that feature's gate.
waterui-meta = { workspace = true, optional = true }
executor-core.workspace = true
tracing.workspace = true
thiserror = { version = "2.0.21", default-features = false }
async-channel.workspace = true
web-time.workspace = true
waterui-macros.workspace = true
waterui-graphics = { workspace = true, default-features = false, features = ["text"] }
waterui-icon.workspace = true
waterui-shape = { workspace = true, default-features = false }
waterui-structural-transition.workspace = true
waterui-accessibility.workspace = true
waterui-interaction.workspace = true
waterui-svg = { workspace = true, optional = true }
waterui-chart = { workspace = true, optional = true }
waterui-barcode = { workspace = true, optional = true }
waterui-particle = { workspace = true, optional = true }
waterui-markdown = { workspace = true, optional = true }
waterui-assets = { workspace = true, optional = true }
waterui-assets-macros = { workspace = true, optional = true }
waterui-ts = { workspace = true, optional = true }
waterkit-haptic = { workspace = true, optional = true }
pastey.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The inspector endpoint is a TCP server that also launches the inspector
# application on the developer's machine; a browser page can do neither.
waterui-inspector-runtime = { workspace = true, optional = true }

# CPU-time profiling (cpu-time) needs a per-thread CPU clock; the runtime guard
# uses a zero-cost stand-in where there is none.
[target.'cfg(any(unix, windows))'.dependencies]
cpu-time = { workspace = true, optional = true }

[features]
form = ["dep:waterui-form", "waterui-core/form", "waterui-backend-core/form"]
link = ["waterui-controls/link", "waterui-core/link"]
avatar = ["waterui-controls/avatar", "waterui-core/avatar"]
cpu-time = ["dep:cpu-time", "waterui-core/cpu-time"]
list = ["waterui-controls/list", "waterui-core/list"]
table = ["list", "waterui-controls/table", "waterui-core/table"]
navigation = ["dep:waterui-navigation", "waterui-core/navigation", "waterui-backend-core/navigation"]
menu = ["waterui-controls/menu", "waterui-core/menu"]
calendar = ["form", "waterui-form/calendar", "waterui-core/calendar", "waterui-backend-core/calendar"]
color-picker = ["form", "waterui-form/color-picker", "waterui-core/color-picker", "waterui-backend-core/color-picker"]
date-picker = ["form", "waterui-form/date-picker", "waterui-core/date-picker", "waterui-backend-core/date-picker"]
file-picker = ["form", "waterui-form/file-picker", "waterui-core/file-picker"]
multi-date-picker = ["calendar", "waterui-form/multi-date-picker", "waterui-core/multi-date-picker", "waterui-backend-core/multi-date-picker"]
picker = ["form", "waterui-form/picker", "waterui-core/picker", "waterui-backend-core/picker"]
secure-field = ["form", "waterui-form/secure-field", "waterui-core/secure-field", "waterui-backend-core/secure-field"]
slider = ["form", "waterui-form/slider", "waterui-core/slider"]
stepper = ["form", "waterui-form/stepper", "waterui-core/stepper"]
text-field = ["menu", "form", "waterui-form/text-field", "waterui-core/text-field"]
toggle = ["form", "waterui-form/toggle", "waterui-core/toggle"]
validation = ["text-field", "waterui-form/validation", "waterui-core/validation"]
default = [
    "avatar",
    "cpu-time",
    "link",
    "list",
    "table",
    "navigation",
    "menu",
    "calendar",
    "color-picker",
    "date-picker",
    "file-picker",
    "multi-date-picker",
    "picker",
    "secure-field",
    "slider",
    "stepper",
    "text-field",
    "toggle",
    "validation",
    "canvas",
    "gpu",
    "assets",
    "dialog",
    "snackbar",
    "highlight",
    "locale-datetime",
    "locale-list",
    "locale-relative-time",
]
# `waterui::locale` is this crate's re-export of `waterui-locale`, so the
# formatters an application can reach through it are selected here. All three
# are default-on to keep that surface whole; a lean build already starts from
# `default-features = false` and names what it wants.
locale-datetime = ["waterui-locale/datetime", "waterui-core/locale-datetime"]
locale-list = ["waterui-locale/list", "waterui-core/locale-list"]
locale-relative-time = ["waterui-locale/relative-time", "waterui-core/locale-relative-time"]
# The `Code` widget and the bundled syntect highlighter behind it. Default-on,
# because `code(…)` is a plain authoring API; an application that shows no code
# drops syntect, two-face, and their syntax and theme tables by opting out.
highlight = ["waterui-text/highlight", "waterui-controls/highlight", "waterui-core/highlight"]
# The devtools Inspector hub and its wire protocol. Opt-in: a packaged
# application that never attaches an inspector leaves the hub and its server
# stack out, and embedded firmware disables it anyway — the hub is desktop
# tooling, and its 64-bit sequence counters do not even exist on RV32
# targets.
inspector = ["dep:waterui-inspector-runtime", "waterui-core/inspector"]
# Reactive-graph tracing for the Inspector's `signals` channel. Development
# only: it attributes every state-owning signal node and reports every
# notification. Off by default so release builds pay nothing — see
# `nami_core::observe`.
inspector-signals = ["inspector", "waterui-inspector-runtime/signals", "waterui-core/inspector-signals"]
# Window-modal confirmation / alert dialogs: the `Dialog` semantic and its
# composed card realization for self-drawn backends.
dialog = ["waterui-controls/dialog", "waterui-core/dialog"]
# Window-owned transient notifications. Embedded apps that do not select this
# feature omit the manager, overlay, timers, and code-widget feedback path.
snackbar = ["waterui-controls/snackbar", "waterui-core/snackbar"]
# Filters on views (`FilterViewExt`) and their portable description, without
# the GPU stack: a backend that lowers filters into its own primitives reads
# the description. Implied by `gpu`.
effects = ["waterui-graphics/effects", "waterui-core/effects"]
# GPU rendering stack (wgpu via waterui-graphics' Cherenkov engine +
# waterui-svg). Default-on so every existing consumer is unaffected.
# Disabling it lets a WaterUI app cross-compile lean for embedded targets
# without the GPU stack.
gpu = [
    "effects",
    "waterui-graphics/gpu",
    "dep:waterui-svg",
    "waterui-core/gpu",
]
# CPU rendering stack (waterui-graphics' Cherenkov engine on `cherenkov-cpu`),
# with no wgpu.
cpu = ["effects", "waterui-graphics/cpu", "waterui-core/cpu"]
# `asset!` expands image-kind assets into `waterui::media::Photo` (`ImageAsset`,
# behind `waterui-assets`' `media` feature) and video-kind assets into
# `waterui::video` (`VideoAsset`, behind `waterui-assets`' `video` feature);
# each is enabled only when both sides are present.
assets = ["dep:waterui-assets", "dep:waterui-assets-macros", "dep:waterui-meta", "waterui-core/assets"]
image = ["dep:waterui-media", "waterui-assets?/media", "waterui-controls/image", "waterui-graphics/image-decode", "waterui-markdown?/media", "waterui-core/image"]
video = ["dep:waterui-video", "waterui-media?/video", "waterui-assets?/video", "waterui-core/video", "waterui-backend-core/video"]
# Remote fetching (`Url::fetch`, `Data::from_remote`, remote `Photo` sources)
# links the `zenwave` HTTP client through `waterui-url`/`waterui-media`. Off by
# default so an application that never names a remote URL carries no HTTP
# client — framework principle 5.
remote = [
    "waterui-url/remote",
    "waterui-media?/remote",
    "waterui-assets?/remote",
    "waterui-core/remote",
]
# Selects `WaterUI`'s own GPU video player as the video realization where the
# platform has no player to bridge: the `water` CLI reads it and enables the
# self-drawn backend's player. Not implied by `video`: Apple bridges AVPlayer
# and the web the `<video>` element, so an application there would otherwise
# link and pay for a player it never runs.
video-gpu = ["video", "gpu", "waterui-core/video-gpu"]
webview = ["dep:waterui-webview", "waterui-core/webview", "waterui-backend-core/webview"]
# Maps (`waterui::map`).
map = ["dep:waterui-map", "waterui-core/map", "waterui-backend-core/map"]
# The `#[waterui::widget]` authoring surface and its `WidgetKit` snapshot
# schema (`waterui::widgets`). Off by default: an application that declares
# no widgets pays for none of the schema or its FFI glue — and the `water`
# CLI only generates an extension when the declaration records exist.
widgets = ["dep:waterui-widgets", "waterui-macros/widgets", "waterui-core/widgets"]
# The TypeScript runtime behind `waterui::ts`: the embedded JavaScript engine,
# the signal bridge, the component vocabulary a JSX tag resolves against, the
# `tsx!` mount, and the props contract schema (`waterui::ts::schema`) whose
# encoded form the `water` CLI reads back out of a debug artifact. Off by
# default: only a shell that mounts TypeScript view modules needs it, and it
# links a JavaScript engine. An application that writes no `tsx!` and leaves
# this off links none of it — `waterui-ts` is an optional dependency and no
# other feature pulls it in.
ts = ["dep:waterui-ts", "avatar", "link", "navigation", "table", "picker", "slider", "stepper", "text-field", "toggle", "waterui-core/ts"]
# The over-the-air update client for TypeScript view bundles: fetches a
# signed manifest and bundle, verifies them, and caches them for the next
# launch. Separate from `ts` because it links an HTTP client, a signature
# verifier and the file-system kit; an application that ships only its
# baseline bundle leaves it off and opens no connection by construction.
ts-ota = ["ts", "waterui-ts/ota", "waterui-core/ts-ota"]
navigation-restoration = ["navigation", "waterui-navigation/serde", "waterui-core/navigation-restoration"]
# Markdown rendering: `RichText` and `include_markdown!`, which parse CommonMark
# with `pulldown-cmark`, plus `FlowMarkdown`'s streaming renderer, which
# re-parses the document incrementally with the tree-sitter Markdown grammar.
# Off by default — a CommonMark parser and a document grammar are a lot of
# binary for an application that shows no Markdown.
flow-markdown = [
    "dep:waterui-markdown",
    # A fenced code block in a `RichText` renders through the `Code` widget.
    "highlight",
    "waterui-core/flow-markdown",
]
# Mathematical formulas in Markdown: `$…$` and `$$…$$` are parsed and typeset
# through `waterui-math`. Off by default, and deliberately so — it brings a
# layout engine, an OpenType `MATH` table reader, a LaTeX parser and MathCAT's
# speech rules (about 2.7 MiB of release artifact), and the component declares a
# math font for the asset pipeline to bundle. An application that shows no
# formulas should pay none of that.
#
# With this off the Markdown parser is built without `ENABLE_MATH`, so a dollar
# sign in prose stays a dollar sign, exactly as it does today.
markdown-math = ["flow-markdown", "waterui-markdown?/math", "waterui-core/markdown-math"]
# Haptic and sensory feedback (`waterui::haptic`, `Feedback`, `Haptic`, `Intensity`,
# `ViewExt::sensory_feedback`). Opt-in so applications without haptics pay none of it.
haptics = ["dep:waterkit-haptic", "waterui-core/haptics"]
std = ["waterui-core/std"]
# In-tree offscreen view capture (`CaptureHandle`, `CaptureScope`, `ViewExt::capture`)
# and `NativeBackend::offscreen` wiring. Opt-in so `route_metadata_dyn` does not pull
# the offscreen renderer into binaries that never capture views from inside the tree.
capture = ["waterui-core/capture", "waterui-backend-core/capture"]
# `waterui::canvas`: the target-neutral drawing API, `waterui_graphics::canvas`.
# Gates backend canvas realization (`waterui-apple/canvas`, Hydrolysis scene view).
canvas = ["waterui-core/canvas"]
chart = ["dep:waterui-chart", "waterui-core/chart"]
barcode = ["dep:waterui-barcode", "waterui-core/barcode"]
particle = ["dep:waterui-particle", "waterui-core/particle"]
# Build strategy: erase views at generic dispatch boundaries.
erased-dispatch = ["waterui-core/erased-dispatch", "waterui-layout/erased-dispatch"]
# `ts` is deliberately absent: the TypeScript runtime will link a JavaScript
# engine and a bundle loader, so an application that mounts TypeScript view
# modules opts in explicitly rather than paying for them through the
# full-feature set — the same reasoning `markdown-math` carries above.
all = [
    "avatar",
    "cpu-time",
    "link",
    "list",
    "table",
    "navigation",
    "menu",
    "calendar",
    "color-picker",
    "date-picker",
    "file-picker",
    "multi-date-picker",
    "picker",
    "secure-field",
    "slider",
    "stepper",
    "text-field",
    "toggle",
    "validation",
    "capture",
    "canvas",
    "chart",
    "barcode",
    "particle",
    "haptics",
    "std",
    "gpu",
    "highlight",
    "locale-datetime",
    "locale-list",
    "locale-relative-time",
    "inspector",
    "inspector-signals",
    "assets",
    "image",
    "webview",
    "map",
    "flow-markdown",
    "video-gpu",
    "navigation-restoration",
    "snackbar",
    "dialog",
    "remote",
]

[dev-dependencies]
futures.workspace = true
# Every doc example in this crate is written the way an application writes it —
# `use waterui::…` — because these docs are re-exported through that facade and
# are read there. A doctest compiles as a crate of its own, so it needs the
# facade linked or none of the examples resolve, which is what left them
# uncompiled. A dev-dependency is allowed to point back at a crate that depends
# on this one; only a cycle among normal dependencies is refused. `ts` is named
# alongside `all` so `tests/` can derive `TsProps` through the
# `waterui::ts::schema` facade path the macro emits for a facade consumer.
waterui = { path = "..", features = ["all", "ts"] }
# The bundle-metadata test walks the artifact's metadata directory records the
# way the CLI does — matching the `waterui_meta_bundle_` name, cutting the
# payload — from the linked test binary.
waterui-assets-planner.workspace = true
waterui-meta.workspace = true
object = { version = "0.40", default-features = false, features = ["read", "std"] }

[lints]
workspace = true
