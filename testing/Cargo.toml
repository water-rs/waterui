[package]
name = "waterui-testing"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Headless testing helpers for WaterUI"
keywords.workspace = true
categories.workspace = true

[dependencies]
hydrolysis = { workspace = true, features = ["accessibility", "testing"] }
# This crate depends on the theme for real, so it takes the versioned
# workspace entry — the published manifest must keep its registry
# requirement. Dev-deps use the same pin inline without a version instead,
# which `cargo package` strips.
hydrolysis-m3.workspace = true
waterui-core.workspace = true
waterui.workspace = true
wgpu.workspace = true
vello.workspace = true
accesskit = "0.25"
pollster.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
executor-core.workspace = true
sysinfo.workspace = true
waterui-preview-protocol.workspace = true
serde_json.workspace = true

[dev-dependencies]
async-io = "2.6"
bitflags.workspace = true
waterui_canvas.workspace = true
waterui-layout.workspace = true

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["bitflags", "executor-core"]
