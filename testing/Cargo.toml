[package]
name = "waterui-testing"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Headless testing helpers for WaterUI"
keywords.workspace = true
categories.workspace = true

[dependencies]
hydrolysis = { workspace = true, features = ["accessibility", "testing"] }
waterui-backend-core = { workspace = true, features = ["widgets"] }
waterui-controls.workspace = true
waterui-form.workspace = true
waterui-graphics.workspace = true
waterui-text.workspace = true
kurbo.workspace = true
peniko.workspace = true
waterui-core.workspace = true
waterui.workspace = true
wgpu.workspace = true
vello.workspace = true
accesskit = "0.25"
pollster.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
executor-core.workspace = true
sysinfo.workspace = true
waterui-preview-protocol.workspace = true
serde_json.workspace = true

[dev-dependencies]
async-io = "2.6"
bitflags.workspace = true
# This crate's own widget tests render through the Material 3 theme — a
# dev-only concern, so it takes the version-less alias `cargo package` strips.
hydrolysis_m3.workspace = true
waterui_canvas.workspace = true
waterui-layout.workspace = true

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["bitflags", "executor-core"]
