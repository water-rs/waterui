[package]
name = "waterui-conformance"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Unified visual, perceptual, and interaction conformance suite for WaterUI"
keywords.workspace = true
categories.workspace = true

[dependencies]
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = { version = "1.12.0", default-features = false }
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
thiserror.workspace = true

# Optional: cross-backend per-component `ViewRenderer` parity mode (`capture` feature).
pollster = { workspace = true, optional = true }
waterui-capture = { workspace = true, optional = true }
waterui-core = { workspace = true, optional = true }

# Optional: declarative showcase suites and Hydrolysis style conformance (`testing` feature).
waterui = { workspace = true, features = ["toggle", "slider", "stepper", "text-field", "picker", "list"], optional = true }
waterui-testing = { workspace = true, default-features = false, optional = true }

[features]
default = ["testing", "gpu"]
# Cross-backend per-component `ViewRenderer` parity runner.
capture = ["dep:pollster", "dep:waterui-capture", "dep:waterui-core"]
# Declarative showcase suites, gallery runner, and Hydrolysis style conformance.
testing = ["capture", "dep:waterui", "dep:waterui-testing"]
# Hydrolysis GPU offscreen painter for `GalleryRunner`.
gpu = ["testing", "waterui-testing/gpu"]
# Hydrolysis CPU offscreen painter for `GalleryRunner`.
cpu = ["testing", "waterui-testing/cpu"]

[lints]
workspace = true
