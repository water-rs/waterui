[package]
name = "waterui-cli"
version = "0.1.2"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage = "https://waterui.dev"
description = "Cross-platform tooling for WaterUI applications"
keywords.workspace = true
categories.workspace = true

[package.metadata.waterui-scaffold]
waterui-version = "0.2.1"
waterui-ffi-version = "0.2.1"
hydrolysis-version = "0.1.0"
waterui-dew-version = "0.1.0"
waterui-gtk-version = "0.1.0"
waterui-preview-version = "0.1.0"
android-kotlin-version = "2.3.21"
apple-backend-url = "https://github.com/water-rs/apple-backend.git"
apple-backend-commit = "4d9007db806a27110de6dca9e851faed0ca74b5c"
android-backend-url = "https://github.com/water-rs/android-backend.git"
android-backend-commit = "a6259762f65bbc5f46b7248dd943d894b2d59005"

[[bin]]
name = "water"
path = "src/terminal/main.rs"

[dependencies]
cargo_metadata = "0.23.1"
image = "0.25"  # For PNG reading/writing and pixel manipulation (diff feature)
cargo_toml = "1.0.0"
color-eyre = { version = "0.6.5", features = ["issue-url"]}
include_dir = "0.7.4"
futures.workspace = true
futures-lite = "2.6"
async-channel.workspace = true
async-lock = "3.4"
reflink = "0.1.3"
serde.workspace = true
serde_json = "1.0"
smol = "2.0.2"
syn = { version = "3", features = ["full"] }
target-lexicon = "0.13.5"
thiserror = "2.0.19"
jiff.workspace = true
toml = "1.1.3"
plist = "1.10"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
semver = "1.0"
serialport = "4"
which = "8.0.5"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

# Terminal UI dependencies
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
indicatif = "0.18"
anstream = "1.0"              # Auto-detected ANSI output stream
anstyle = "1"                 # ANSI styling without manual escape codes
ctrlc = "3.5"
whoami = "2.1"
heck = "0.5"                  # Case conversion (kebab-case, snake_case, etc.)

# Asset/font downloading dependencies
dirs = "6"                    # Platform-specific directories (cache, config, etc.)
hex = "0.4"                   # Hex encoding for hashes
sha2 = "0.11"                 # SHA256 hashing
sysinfo.workspace = true      # Preview support-process discovery
zip = "8.6"                   # ZIP archive extraction
roxmltree = "0.21"            # Android SDK repository XML parsing
fs_extra = "1.3"
askama = "0.16"
resvg = "0.47.0"
ttf-parser = "0.25"
ignore = "0.4"
remove_dir_all = "1.0"
waterui-assets.workspace = true
waterui-assets-planner.workspace = true
waterui-preview-protocol = { path = "../components/devtools/preview/protocol" }
waterui-inspector-protocol = { path = "../components/devtools/inspector/protocol" }
tempfile = "3.27"
walkdir = "2.5"
pathdiff = "0.2"
url = "2.5"

[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { workspace = true, features = ["native-tls"] }
core-graphics = "0.25"
core-foundation = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
zenwave = { workspace = true, features = ["rustls"] }

[build-dependencies]
toml = "1.1.3"

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["roxmltree", "waterui-inspector-protocol"]
