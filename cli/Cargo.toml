[package]
name = "waterui-cli"
version = "0.1.2"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "water"
path = "src/terminal/main.rs"

[dependencies]
cargo_metadata = "0.23.1"
image = "0.25"  # For PNG reading/writing and pixel manipulation (diff feature)
cargo_toml = "0.22.3"
color-eyre = { version = "0.6.5", features = ["issue-url"]}
include_dir = "0.7.4"
skyzen = { workspace = true, default-features = false, features = ["json", "ws", "hyper"] }
futures.workspace = true
futures-lite = "2.6"
reflink = "0.1.3"
serde.workspace = true
serde_json = "1.0"
smol = "2.0.2"
target-lexicon = "0.13.5"
thiserror = "2.0.18"
time = { workspace = true, features = ["serde"] }
toml = "0.9.12"
plist = "1.8"
tracing.workspace = true
semver = "1.0"
which = "8.0.0"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

# Terminal UI dependencies
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
indicatif = "0.18"
anstream = "0.6"              # Auto-detected ANSI output stream
anstyle = "1"                 # ANSI styling without manual escape codes
ctrlc = "3.5"
whoami = "1.6"
heck = "0.5"                  # Case conversion (kebab-case, snake_case, etc.)

# Asset/font downloading dependencies
dirs = "6"                    # Platform-specific directories (cache, config, etc.)
hex = "0.4"                   # Hex encoding for hashes
sha2 = "0.10"                 # SHA256 hashing
zip = "7.2"                   # ZIP archive extraction
fs_extra = "1.3"
askama = "0.14"
waterui-preview-protocol = { path = "../components/preview-protocol" }
waterui-inspector-protocol = { path = "../components/inspector-protocol" }

[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { workspace = true, features = ["native-tls"] }
core-graphics = "0.24"
core-foundation = "0.10"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
zenwave = { workspace = true, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.26"

[lints]
workspace = true
