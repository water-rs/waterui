[package]
name = "web-meta"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
# The lean facade: `include_web!` expands against `waterui::webview` and
# `waterui::Bundle`, nothing else of the framework is needed.
waterui = { path = "../../../..", default-features = false, features = [
    "webview",
    "assets",
] }

[patch.crates-io]
# Extracted crates on crates.io (waterui-canvas #185, waterui-chart #188, …) depend on the
# registry `waterui-core` and `waterui-graphics`; the workspace must resolve
# those to its own copies or the graph carries two of each and every `View`
# is a different type on either side. Publishing ignores this table, so the
# published crates keep their registry pins.
waterui-core = { path = "../../../../core" }
waterui-graphics = { path = "../../../../components/visual/graphics" }
waterui-layout = { path = "../../../../components/foundation/layout" }
waterui-shape = { path = "../../../../components/foundation/shape" }
waterui-text = { path = "../../../../components/foundation/text" }
waterui-map = { path = "../../../../components/data/map" }
waterui-url = { path = "../../../../utils/url" }
waterui-controls = { path = "../../../../components/foundation/controls" }
waterui-video = { path = "../../../../components/multimedia/video" }
waterui-macros = { path = "../../../../macros" }
# The Hydrolysis renderer and its Material 3 theme are extracted too (#480,
# #481) and pull the rest of the framework from the registry; every crate they
# name needs an entry here or the workspace builds a second `waterui` beside
# its own.
waterui = { path = "../../../../." }
waterui-assets = { path = "../../../../components/assets/runtime" }
waterui-backend-core = { path = "../../../../backends/core" }
waterui-form = { path = "../../../../components/foundation/form" }
waterui-icon = { path = "../../../../components/foundation/icon" }
waterui-inspector-protocol = { path = "../../../../components/devtools/inspector/protocol" }
waterui-locale = { path = "../../../../utils/locale" }
waterui-webview = { path = "../../../../components/platform/webview" }
waterkit-clipboard = { path = "../../../../kit/platform/clipboard" }
# The extracted image, visualizer and video-gpu crates depend on the registry
# waterkit crates; resolve those to the kit copies for the same reason.
waterkit-audio = { path = "../../../../kit/multimedia/audio" }
waterkit-build = { path = "../../../../kit/utils/build" }
waterkit-fs = { path = "../../../../kit/platform/fs" }
waterkit-codec = { path = "../../../../kit/multimedia/codec" }
waterkit-video = { path = "../../../../kit/multimedia/video" }
waterkit-video-container = { path = "../../../../kit/multimedia/video/container" }
waterkit-video-core = { path = "../../../../kit/multimedia/video/core" }
waterkit-video-player = { path = "../../../../kit/multimedia/video/player" }
waterkit-video-streaming = { path = "../../../../kit/multimedia/video/streaming" }
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
# The registry `hydrolysis`/`hydrolysis-m3` match `ShapeKind` exhaustively, so
# they stop compiling the moment this branch adds the fixed-radius variants;
# the companion branches on water-rs resolve them. Drop these entries once the
# releases carry the new kinds.
hydrolysis = { git = "https://github.com/water-rs/hydrolysis", rev = "e0cab32d0302877bbc9852cf504538fcf1534cb7" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "d8872e5" }
# `block` 0.1.6 declares the Blocks ABI symbol as an uninhabited extern
# static. This pinned fork changes only that declaration to the symbol's byte
# storage and takes its address as the opaque class pointer.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# vello loses the Vulkan device on Mali: `select`'s discarded arm computes an
# underflowed workgroup-array index and Mali page-faults on it. The fix is
# ours, offered upstream as linebender/vello#1817 and still open there, so this
# patch is what carries it — drop it when a release containing that PR ships.
#
# This rev is `v0.10.0` for every crate the workspace takes from it. The six
# commits between it and the tag are the version bump and five changes under
# `sparse_strips/`, which is `vello_hybrid`'s line and comes from a different
# rev below; not a line of `vello`, `vello_encoding` or `vello_shaders`
# differs. So the `vello = "0.9"` requirement above understates what is
# actually compiled, and moving it to "0.10" would buy no code — only a
# lockstep re-release of `waterui-graphics` and then `hydrolysis`, which
# consumes graphics from crates.io and requires `vello ^0.9`.
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }

# vello_hybrid 0.2.0 keeps only one physical layer in its image atlas off wasm,
# and wgpu's GL backend then makes that texture `TEXTURE_2D` while the shader
# samples a `texture_2d_array`, so every image brush renders black on a GL
# adapter (#366). It also clamps `Extend::Pad` to the last texel's leading
# corner and only then subtracts the half texel that turns a corner into a
# centre, so a bilinear image brush never reaches its final source row or
# column (#234). This rev is the 0.2.0 release plus a two-layer floor decided
# by the adapter backend and a pad that clamps to the texel centres. The other
# two sparse-strip crates come from the same rev because `vello_hybrid` names
# them by path there, and a second copy of `vello_common` would make its paint
# types different types. Drop when a release carrying both fixes ships —
# linebender/vello#1859 (one 2D texture per atlas) covers the first.
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
# `vello_hybrid`'s text API takes glyphs from `glifo`, which that repo also
# carries by path; the same rev keeps one `Glyph` type in the graph.
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
