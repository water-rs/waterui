[package]
name = "waterui-dylib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Dynamic-link anchor crate for WaterUI"
keywords.workspace = true
categories.workspace = true

[lib]
# The rlib is load-bearing, not redundant: Apple's host crate is built as a
# `staticlib`, and rustc requires every Rust dependency of a staticlib to be
# available in rlib form ("crate `waterui_dylib` required to be available in rlib
# format"). Dropping it breaks `water preview` and `water run` on Apple targets.
crate-type = ["dylib", "rlib"]

[dependencies]
waterui-internal = { path = "../../src", default-features = false }

[features]
default = ["gpu", "assets", "media", "webview", "inspector", "snackbar"]
gpu = ["waterui-internal/gpu"]
inspector = ["waterui-internal/inspector"]
assets = ["waterui-internal/assets"]
media = ["waterui-internal/media", "video"]
video = ["waterui-internal/video"]
webview = ["waterui-internal/webview"]
chart = ["waterui-internal/chart"]
barcode = ["waterui-internal/barcode"]
map = ["waterui-internal/map"]
particle = ["waterui-internal/particle"]
navigation-restoration = ["waterui-internal/navigation-restoration"]
snackbar = ["waterui-internal/snackbar"]
flow-markdown = ["waterui-internal/flow-markdown"]
std = ["waterui-internal/std"]
all = ["waterui-internal/all", "navigation-restoration"]

[lints]
workspace = true
