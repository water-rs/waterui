[package]
name = "waterui-dylib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Dynamic-link anchor crate for WaterUI"
keywords.workspace = true
categories.workspace = true

[lib]
# The rlib is load-bearing, not redundant: Apple's host crate is built as a
# `staticlib`, and rustc requires every Rust dependency of a staticlib to be
# available in rlib form ("crate `waterui_dylib` required to be available in rlib
# format"). Dropping it breaks `water preview` and `water run` on Apple targets.
crate-type = ["dylib", "rlib"]

[dependencies]
waterui-internal.workspace = true
# The layer chain: every family DLL resolves the crates embedded below it
# through the layer DLLs instead of embedding a second copy (#1615).
waterui-dylib-foundation = { path = "foundation" }
waterui-dylib-graphics = { path = "graphics" }
waterui-dylib-widgets = { path = "widgets" }
waterui-dylib-media = { path = "media", optional = true }
waterui-dylib-webview = { path = "webview", optional = true }
waterui-dylib-markdown = { path = "markdown", optional = true }
waterui-dylib-components = { path = "components", optional = true }

[features]
default = [
    "gpu",
    "assets",
    "webview",
    "snackbar",
    "highlight",
    "locale-datetime",
    "locale-list",
]
gpu = ["effects", "waterui-dylib-graphics/svg", "waterui-internal/gpu"]
effects = ["waterui-internal/effects"]
highlight = ["waterui-internal/highlight"]
locale-datetime = ["waterui-internal/locale-datetime"]
locale-list = ["waterui-internal/locale-list"]
inspector = ["waterui-internal/inspector"]
assets = ["waterui-internal/assets"]
media = ["dep:waterui-dylib-media", "waterui-internal/media"]
video = [
    "dep:waterui-dylib-media",
    "waterui-dylib-media?/video",
    "waterui-internal/video",
]
remote = ["waterui-internal/remote"]
video-gpu = [
    "video",
    "gpu",
    "dep:waterui-dylib-media",
    "waterui-dylib-media?/video-gpu",
    "waterui-internal/video-gpu",
]
webview = ["dep:waterui-dylib-webview", "waterui-internal/webview"]
ts = ["waterui-internal/ts"]
navigation-restoration = ["waterui-internal/navigation-restoration"]
snackbar = ["waterui-internal/snackbar"]
flow-markdown = ["dep:waterui-dylib-markdown", "waterui-internal/flow-markdown"]
markdown-math = [
    "flow-markdown",
    "waterui-dylib-markdown?/math",
    "waterui-internal/markdown-math",
]
std = ["waterui-internal/std"]
canvas = [
    "dep:waterui-dylib-components",
    "waterui-dylib-components?/canvas",
    "waterui-internal/canvas",
]
chart = [
    "dep:waterui-dylib-components",
    "waterui-dylib-components?/chart",
    "waterui-internal/chart",
]
barcode = [
    "dep:waterui-dylib-components",
    "waterui-dylib-components?/barcode",
    "waterui-internal/barcode",
]
particle = [
    "dep:waterui-dylib-components",
    "waterui-dylib-components?/particle",
    "waterui-internal/particle",
]
all = [
    "waterui-internal/all",
    "navigation-restoration",
    "highlight",
    "locale-datetime",
    "locale-list",
    "media",
    "video",
    "video-gpu",
    "webview",
    "canvas",
    "chart",
    "barcode",
    "particle",
    "flow-markdown",
    "markdown-math",
    "remote",
]

[lints]
workspace = true
