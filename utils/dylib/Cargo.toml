[package]
name = "waterui-dylib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Dynamic-link anchor crate for WaterUI"
keywords.workspace = true
categories.workspace = true

[lib]
# The rlib is load-bearing, not redundant: Apple's host crate is built as a
# `staticlib`, and rustc requires every Rust dependency of a staticlib to be
# available in rlib form ("crate `waterui_dylib` required to be available in rlib
# format"). Dropping it breaks `water preview` and `water run` on Apple targets.
crate-type = ["dylib", "rlib"]

[dependencies]
waterui-internal.workspace = true

[features]
form = ["waterui-internal/form"]
link = ["waterui-internal/link"]
avatar = ["waterui-internal/avatar"]
cpu-time = ["waterui-internal/cpu-time"]
list = ["waterui-internal/list"]
table = ["waterui-internal/table"]
navigation = ["waterui-internal/navigation"]
menu = ["waterui-internal/menu"]
calendar = ["waterui-internal/calendar"]
color-picker = ["waterui-internal/color-picker"]
date-picker = ["waterui-internal/date-picker"]
file-picker = ["waterui-internal/file-picker"]
multi-date-picker = ["waterui-internal/multi-date-picker"]
picker = ["waterui-internal/picker"]
secure-field = ["waterui-internal/secure-field"]
slider = ["waterui-internal/slider"]
stepper = ["waterui-internal/stepper"]
text-field = ["waterui-internal/text-field"]
toggle = ["waterui-internal/toggle"]
validation = ["waterui-internal/validation"]
default = [
    "avatar",
    "cpu-time",
    "link",
    "list",
    "table",
    "navigation",
    "menu",
    "calendar",
    "color-picker",
    "date-picker",
