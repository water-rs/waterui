[package]
name = "filtrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "GPU texture filters using wgpu - blur, brightness, saturation, and more"
keywords = ["gpu", "filter", "wgpu", "image", "video"]
categories = ["graphics", "multimedia::images", "rendering"]
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
wgpu.workspace = true
bytemuck = { version = "1", features = ["derive"] }
filtrate-core.workspace = true
