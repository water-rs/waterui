[package]
name = "filtrate-derive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "../README.md"
repository.workspace = true
description = "Procedural macros for the filtrate GPU filter library."
keywords = ["gpu", "filter", "derive", "proc-macro"]
categories = ["graphics", "rendering"]
license.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
trybuild = "1"
filtrate-core.workspace = true
