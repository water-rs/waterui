[package]
name = "waterui-url"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
waterui-str.workspace = true
nami-core.workspace = true
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
nami = { workspace = true, optional = true }
executor-core = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
mime_guess = { version = "2.0.5", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
std = [
    "dep:nami",
    "dep:executor-core",
    "dep:dirs",
    "dep:tracing",
    "dep:mime_guess",
    "dep:sha2",
    "dep:zenwave",
]

[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { workspace = true, features = ["native-tls"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
zenwave = { workspace = true, features = ["rustls"], optional = true }

[target.'cfg(not(any(target_vendor = "apple", target_os = "android")))'.dependencies]
zenwave = { workspace = true, features = ["rustls"], optional = true }

[dev-dependencies]
futures.workspace = true
[lints]
workspace = true
