[package]
name = "filtrate-multi-input"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
readme = "../../README.md"
repository = "https://github.com/water-rs/waterui"
description = "Multi-input GPU filter operations for the filtrate library: blends, transitions, displacement maps, LUT color grading."
keywords = ["gpu", "filter", "blend", "compositing", "transition"]
categories = ["graphics", "multimedia::images", "rendering"]
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
filtrate.workspace = true
filtrate-core.workspace = true
wgpu.workspace = true
bytemuck = { version = "1", features = ["derive"] }
num-traits = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tracing.workspace = true
