[package]
name = "wgpu-external-frame"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/wgpu-external-frame"
description = "Zero-copy import of externally produced GPU frames into wgpu textures: Linux DMA-BUF, macOS IOSurface, and Windows shared handles"
keywords = ["wgpu", "dmabuf", "iosurface", "zero-copy", "interop"]
categories = ["graphics", "rendering::graphics-api", "external-ffi-bindings"]

[dependencies]
wgpu.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
glow.workspace = true
libc = "0.2"
libloading = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_System_Threading",
] }

[lints]
workspace = true
