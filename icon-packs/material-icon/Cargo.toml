[package]
name = "waterui-icons-material-icon"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Material Design icons for WaterUI (Pictogrammers @mdi/svg)"
keywords = ["icons", "material", "mdi", "waterui"]
categories = ["gui"]
readme = "README.md"

[features]
default = ["svg"]
svg = []
webfont = []

[dependencies]
waterui-graphics.workspace = true
waterui-svg.workspace = true
waterui-text = { workspace = true, optional = true }
waterui-core.workspace = true
waterui-str.workspace = true

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
