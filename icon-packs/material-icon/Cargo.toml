[package]
name = "waterui-icons-material-icon"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Material Design icons for WaterUI (Pictogrammers @mdi/svg)"
keywords = ["icons", "material", "mdi", "waterui"]
categories = ["gui"]
readme = "README.md"

[features]
default = ["svg"]
svg = ["waterui-icon/svg"]
webfont = []

[dependencies]
waterui-icon.workspace = true

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
waterui-build-support.workspace = true

[lints]
workspace = true

# Font asset declarations for WaterUI CLI
# Font is only downloaded when the "webfont" feature is enabled.
[package.metadata.waterui.assets]

[[package.metadata.waterui.assets.font]]
name = "Material Design Icons"
remote_path = "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
required-feature = "webfont"
[package.metadata.cargo-machete]
ignored = ["regex", "serde", "serde_json", "waterui-build-support"]
