[package]
name = "waterui-icons-fontawesome7"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "CC-BY-4.0"
repository.workspace = true
description = "Font Awesome 7 Free icons for WaterUI"
keywords = ["icons", "fontawesome", "fa", "waterui"]
categories = ["gui"]
readme = "README.md"

[features]
default = ["webfont"]
svg = []
webfont = ["dep:waterui-icon"]

[dependencies]
waterui-graphics.workspace = true
waterui-text = { workspace = true, optional = true }
waterui-core.workspace = true
waterui-str.workspace = true
waterui-icon = { workspace = true, optional = true }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2"
zip = "2"
dirs = "6"
sha2 = "0.10"
hex = "0.4"

[lints]
workspace = true

# Font asset declarations for WaterUI CLI
# These fonts are automatically bundled with apps using this crate
[package.metadata.waterui.assets]

[[package.metadata.waterui.assets.font]]
name = "FontAwesome7Free-Solid"

[[package.metadata.waterui.assets.font]]
name = "FontAwesome7Free-Regular"

[[package.metadata.waterui.assets.font]]
name = "FontAwesome7Free-Brands"
