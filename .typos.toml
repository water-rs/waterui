[default.extend-words]
Alle = "Alle"
COSE = "COSE"
CLL = "CLL"
Dezember = "Dezember"
Fo = "Fo"
Favorit = "Favorit"
Sie = "Sie"
Spanisch = "Spanisch"
configuracion = "configuracion"
cose = "cose"
cros = "cros"
habe = "habe"
hel = "hel"
raison = "raison"
seeked = "seeked"
thr = "thr"
trak = "trak"
udid = "udid"

# Deliberate: the doc example is about catching a misspelled call.
gret = "gret"
# TrueType table names, alongside `glyf`.
loca = "loca"
# `mis-scaled`, a normal prefix.
mis = "mis"
# Split out of `PNGs`.
PN = "PN"
# A standard variant in technical prose.
unparseable = "unparseable"
# The OpenType width-variation axis tag (`wght`, `wdth`), not "width".
wdth = "wdth"
# A deliberately truncated "Archive" rendering in scroll test comments.
Archiv = "Archiv"
# A deliberately misspelled manifest key in a CLI parse-rejection test.
andriod = "andriod"
# The Windows `secur32` system library.
secur = "secur"
# Level of detail — the graphics term, not a dropped 'a'.
lod = "lod"
# The Paeth predictor, the PNG filtering algorithm's own name.
paeth = "paeth"
# Apple Neural Engine — a powermetrics energy rail name.
ane = "ane"
ANE = "ANE"
# fontTools' `otTables as ot` OpenType tables alias (scene font tools).
ot = "ot"
# The paired backdrop-test group `group_ba`, not a dropped 'y'.
ba = "ba"

[default.extend-identifiers]
NdefFormatable = "NdefFormatable"
# `mach_timebase_info.numer` is the official SDK field spelling.
numer = "numer"
formatable = "formatable"
thw = "thw"
trun = "trun"
# The ix/iy integer coordinate pair; `ix` passes, `iy` should too.
iy = "iy"
# fontTools' OpenType tables module name (scene font tools).
otTables = "otTables"
# A git short hash quoted in cpu-port-review.md (`ba` inside is not "by").
81ba2b8 = "81ba2b8"

[files]
extend-exclude = [
    "examples/locale/README.md",
    # Translation catalogues, wherever they live. Their values are other
    # languages, so English spelling rules do not apply: French "Seconde" is
    # correct and "correcting" it would break the translation.
    "**/i18n/*.toml",
    # Vendored icon-set source data: machine-generated identifiers, hex
    # codepoints and SVG path strings, not prose. `F1BA4` is a codepoint, not
    # a misspelling of "BY". Tracked so the icon crates build offline (#243).
    "components/icon/*/data/**",
]
