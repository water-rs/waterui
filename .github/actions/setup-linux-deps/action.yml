name: Setup Linux native dependencies
description: >
  Installs the native libraries a Linux build of the
  workspace needs: audio (ALSA, PipeWire), video (VA-API, nasm-assembled
  codecs), fonts, GTK4, EGL, and udev. Every job that builds on Linux needs
  this same list, so it lives here once instead of four independent `apt-get`
  invocations drifting apart.

inputs:
  gpu:
    description: >
      Also install the Vulkan ICD loader (mesa-vulkan-drivers, libvulkan1).
      Only jobs that actually run GPU-backed tests or benches need this; the
      software Vulkan implementation (llvmpipe/lavapipe) is what lets those
      run headless on a GitHub-hosted runner with no real GPU.
    required: false
    default: "false"
  gcc-version:
    description: >
      Install this GCC/G++ major. The caller selects it through explicit
      CC/CXX values. Leave empty for jobs that use the runner default.
    required: false
    default: ""
  extra-packages:
    description: >
      Further Ubuntu packages one job needs on top of the shared list, so the
      job installs them through the same verified path.
    required: false
    default: ""
  runtime-fonts:
    description: >
      Install the system fallback font faces used by rendering tests.
      Compile-only callers do not read these assets; font libraries and
      headers are always installed.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Resolve packages against the live mirror rather than the runner image's
    # baked index. The script path also works for cross-repository consumers.
    - name: Refresh the Ubuntu package index
      shell: bash
      run: bash "${{ github.action_path }}/../refresh-apt-index/refresh.sh"

    - name: Compute package list
      id: pkgs
      shell: bash
      run: |
        # libegl-dev carries egl.pc, which the `khronos-egl` build script needs
        # (xcap -> waterkit-screen pulls it in under --all-features). It has so
        # far arrived only as a transitive dependency of libgtk-4-dev; declare
        # what the workspace actually links rather than inheriting it.
        # spirv-tools: cherenkov-gpu's build script optimizes its precompiled
        # SPIR-V with spirv-opt on every non-Apple native target.
        packages="nasm libasound2-dev libva-dev libfontconfig1-dev libgbm-dev libegl-dev libxcb1-dev libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libgtk-4-dev libpipewire-0.3-dev libudev-dev spirv-tools"
        if [ "${{ inputs.runtime-fonts }}" = "true" ]; then
          packages="$packages fonts-noto-core fonts-noto-cjk"
        fi
        if [ "${{ inputs.gpu }}" = "true" ]; then
          packages="$packages mesa-vulkan-drivers libvulkan1"
        fi
        if [ -n "${{ inputs.gcc-version }}" ]; then
          packages="$packages gcc-${{ inputs.gcc-version }} g++-${{ inputs.gcc-version }}"
        fi
        if [ -n "${{ inputs.extra-packages }}" ]; then
          packages="$packages ${{ inputs.extra-packages }}"
        fi
        echo "packages=$packages" >> "$GITHUB_OUTPUT"

    # The mirror's throughput varies by orders of magnitude between runs
    # (#3439), so the downloaded archives are cached and apt fetches only
    # what the cache lacks. Archives, not installed files: dpkg still
    # installs every package. The key is the exact set of archives this
    # install resolves to against the refreshed index.
    - name: Resolve package archives
      id: archives
      shell: bash
      env:
        PACKAGES: ${{ steps.pkgs.outputs.packages }}
      run: |
        set -euo pipefail
        read -ra packages <<< "$PACKAGES"
        dir="$RUNNER_TEMP/apt-archives"
        mkdir -p "$dir/partial" "$RUNNER_TEMP/apt-empty/partial"
        uris="$(sudo apt-get --yes --print-uris -qq -o Dir::Cache::Archives="$RUNNER_TEMP/apt-empty" install "${packages[@]}" | sort)"
        prefix="apt-archives-${ImageOS}-$(dpkg --print-architecture)-"
        {
          echo "dir=$dir"
          echo "prefix=$prefix"
          echo "key=$prefix$(printf '%s' "$uris" | sha256sum | cut -d' ' -f1)"
        } >> "$GITHUB_OUTPUT"

    - name: Restore package archives
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.archives.outputs.dir }}
        key: ${{ steps.archives.outputs.key }}
        restore-keys: ${{ steps.archives.outputs.prefix }}

    - name: Install native dependencies
      shell: bash
      env:
        PACKAGES: ${{ steps.pkgs.outputs.packages }}
        ARCHIVES: ${{ steps.archives.outputs.dir }}
      run: |
        read -ra packages <<< "$PACKAGES"
        sudo DEBIAN_FRONTEND=noninteractive apt-get --yes -o Dir::Cache::Archives="$ARCHIVES" -o APT::Keep-Downloaded-Packages=true install "${packages[@]}"
        # apt leaves its lock and partial/ root-only; the cache save runs as
        # the runner user.
        sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"

    # Pull requests restore what dev and main pushes saved; they never save,
    # so cache capacity stays with the compile caches.
    - name: Save package archives
      if: steps.restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.archives.outputs.dir }}
        key: ${{ steps.archives.outputs.key }}

    - name: Verify native dependencies are installed
      shell: bash
      env:
        REQUESTED: ${{ steps.pkgs.outputs.packages }}
      run: |
        for package in $REQUESTED; do
          status="$(dpkg-query --show --showformat='${Status}' "$package")"
          if [ "$status" != "install ok installed" ]; then
            echo "::error::Package $package is not installed: $status"
            exit 1
          fi
        done
