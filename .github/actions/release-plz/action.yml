name: release-plz
description: >-
  Runs one release-plz command with the water-rs/release-plz build. The fork
  rewinds submodules when it checks historical commits out to compare packages
  with the registry (#313), which upstream release-plz-v0.3.161 does not;
  everything else mirrors what MarcoIeni/release-plz-action@v0.5 does around
  the binary.
inputs:
  command:
    description: "`release-pr` or `release`."
    required: true
outputs:
  report:
    description: >-
      release-plz's own JSON report of what it just did: `releases`, one entry
      per published package carrying the tag it created, for `release`; `prs`
      for `release-pr`.
    value: ${{ steps.run.outputs.report }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/cargo-semver-checks
    # Built from the fork at a pinned commit and cached by that commit, so
    # the compile is paid once per rev. Bump `rev` after rebasing the fork's
    # `waterui/commit-too-old-before-packaging` branch onto a newer upstream tag.
    - uses: taiki-e/cache-cargo-install-action@v3
      with:
        tool: release-plz
        git: https://github.com/water-rs/release-plz
        rev: cc554a52e97e0ee359e45c7801d770895247cf27
        locked: true
    - uses: release-plz/git-config@v0.1.2
    # `-o json` puts the report on stdout and leaves the progress log on
    # stderr, so the report is captured without swallowing anything a failure
    # would print. Asking release-plz what it tagged is the only reliable way
    # to know: the tags do not land on the commit this job checked out, and a
    # `git tag --points-at HEAD` guess is what skipped the CLI binary build
    # for 0.2.1 (#540).
    - name: Run release-plz ${{ inputs.command }}
      id: run
      shell: bash
      run: |
        set -euo pipefail
        report="${RUNNER_TEMP}/release-plz-${{ inputs.command }}.json"
        release-plz ${{ inputs.command }} \
          --git-token "${GITHUB_TOKEN}" \
          --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
          --forge github \
          -o json > "$report"
        printf 'report=%s\n' "$(jq -c '.' "$report")" >> "$GITHUB_OUTPUT"
        jq '.' "$report"
