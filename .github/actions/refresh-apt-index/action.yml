name: Refresh the Ubuntu APT index
description: >
  Refreshes the package index for Ubuntu's own archive and nothing else. The
  runner image also carries third-party sources (Google Chrome, Microsoft,
  the GitHub CLI) that no job here installs from, and a plain `apt-get update`
  fails the step whenever one of those mirrors serves a stale index — a
  nightly lost every Linux leg to a Chrome "Hash Sum mismatch" (#487). Every
  package this repository installs comes from the Ubuntu archive, so that is
  the only index worth resolving against.

runs:
  using: composite
  steps:
    - name: Refresh the Ubuntu package index
      shell: bash
      # Ubuntu 24.04 declares its archive in deb822 form at
      # `sources.list.d/ubuntu.sources`; 22.04 still uses the one-line
      # `sources.list`, and the runners here are both. Naming the file that is
      # not there resolves an empty index instead of failing, so apt then
      # reports every package as unlocatable and the install step aborts —
      # which is how the WPE runtime legs of the CLI release died.
      # The script lives beside this file so a composite action in this
      # directory tree can run it directly: a `uses: ./...` reference resolves
      # against the calling workflow's checkout, which is another repository
      # when this action is consumed as `water-rs/waterui/.github/actions/...@dev`.
      run: bash "${{ github.action_path }}/refresh.sh"
