name: Install current WARP
description: >
  Stages a pinned, hash-verified `d3d10warp.dll` from the NuGet
  `Microsoft.Direct3D.WARP` redistributable next to the executables that
  will load it. The Windows Server 2022 image's system WARP
  (`C:\Windows\System32\d3d10warp.dll` 10.0.20348.5386) misexecutes valid
  optimized DXIL — it stores the incremented loop phi where the shader
  stores the pre-increment value — while NuGet WARP 1.0.21 runs the same
  DXIL correctly (water-rs/waterui#3093).

inputs:
  into:
    description: >-
      Explicit directories that receive a copy of `d3d10warp.dll`, one per
      line, created when missing. D3D12 resolves `d3d10warp.dll` through the
      standard DLL search, where the executable's own directory wins over
      System32 — so the DLL must sit beside each executable that creates
      a wgpu device. Useful for standalone binary directories (`target/debug`
      for `CARGO_BIN_EXE_*`) or custom directory lists; for Cargo 1.100+
      test binaries (`<profile>/build/<pkg>/<hash>/out/`), compile with
      `--no-run` first and pass `profile-dirs` instead. Run this action
      after any step that restores or cleans the target directory: a
      `Swatinem/rust-cache` restore that is not a full match deletes every
      file directly in `target/debug` and every file in `deps` last written
      over a week ago, which the staged DLL is, since it keeps the
      package's timestamp.
    required: false
    default: ""
  profile-dirs:
    description: >-
      Cargo profile directories (for example `target/debug`), one per line,
      whose test binaries have already been compiled (`cargo nextest run
      --no-run` or `cargo test --no-run`). Stages `d3d10warp.dll` into each
      profile directory itself (for `CARGO_BIN_EXE_*` binaries), its `deps`
      subdirectory when present, and every `build/<pkg>/<hash>/out`
      subdirectory holding a compiled executable other than a Cargo build
      script. Fails if a profile directory is missing or holds no compiled
      test/binary executables.
    required: false
    default: ""
  cache:
    description: >-
      Whether the extracted DLL is restored from and saves to an Actions
      cache. "false" for e2e lanes, which keep no Actions cache.
    required: false
    default: "true"

outputs:
  dll-path:
    description: Full path to the staged NuGet `d3d10warp.dll` binary.
    value: ${{ steps.stage.outputs.dll-path }}

runs:
  using: composite
  steps:
    # Same exposure as every other tool download here (#1120): a NuGet
    # package GET plus a pinned content hash below. The key carries the
    # pinned package version; a hit skips the download, the hash check
    # and the extraction entirely. A version bump edits the URL, the
    # hash and the key together.
    - uses: actions/cache@v4
      id: cache
      if: inputs.cache == 'true'
      with:
        path: warp/d3d10warp.dll
        key: install-tool-v1-${{ runner.os }}-${{ runner.arch }}-warp@1.0.21
    - name: Download and verify Microsoft.Direct3D.WARP 1.0.21
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force warp | Out-Null
        Invoke-WebRequest `
          -Uri https://www.nuget.org/api/v2/package/Microsoft.Direct3D.WARP/1.0.21 `
          -OutFile warp\warp.nupkg
        $pinned = 'ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681'
        $actual = (Get-FileHash warp\warp.nupkg -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $pinned) {
          throw "Microsoft.Direct3D.WARP 1.0.21 SHA-256 mismatch: expected $pinned, got $actual"
        }
        # A .nupkg is a zip; the runner's bsdtar pulls the x64
        # redistributable straight out of build/native/bin.
        tar -xf warp\warp.nupkg -C warp build/native/bin/x64/d3d10warp.dll
        Move-Item warp\build\native\bin\x64\d3d10warp.dll warp\d3d10warp.dll
        Remove-Item -Recurse -Force warp\build, warp\warp.nupkg
    # The copy, not the download, is what every `into` entry shares: one
    # invocation can stage several executable directories. The printed
    # file version records in the log which WARP the tests actually ran
    # on.
    - name: Stage d3d10warp.dll next to the executables
      id: stage
      shell: pwsh
      env:
        INTO: ${{ inputs.into }}
        PROFILE_DIRS: ${{ inputs.profile-dirs }}
      run: |
        $ErrorActionPreference = 'Stop'
        $sourceDll = (Resolve-Path 'warp\d3d10warp.dll').Path
        Add-Content -Path $env:GITHUB_OUTPUT -Value "dll-path=$sourceDll"

        $targets = New-Object 'System.Collections.Generic.List[string]'
        $seen = New-Object 'System.Collections.Generic.HashSet[string]' ([System.StringComparer]::OrdinalIgnoreCase)
        $addTarget = {
          param([string]$path)
          $full = [System.IO.Path]::GetFullPath($path)
          if ($seen.Add($full)) {
            $targets.Add($full)
          }
        }

        foreach ($raw in ($env:INTO -split "`n")) {
          $dir = $raw.Trim()
          if (-not $dir) { continue }
          New-Item -ItemType Directory -Force $dir | Out-Null
          & $addTarget $dir
        }

        foreach ($raw in ($env:PROFILE_DIRS -split "`n")) {
          $profileDir = $raw.Trim()
          if (-not $profileDir) { continue }
          if (-not (Test-Path -LiteralPath $profileDir -PathType Container)) {
            throw "Cargo profile directory '$profileDir' does not exist; build tests with --no-run before calling install-warp."
          }

          & $addTarget $profileDir
          $depsDir = Join-Path $profileDir 'deps'
          $depsExes = @()
          if (Test-Path -LiteralPath $depsDir -PathType Container) {
            & $addTarget $depsDir
            $depsExes = @(Get-ChildItem -Path (Join-Path $depsDir '*.exe') -File -ErrorAction SilentlyContinue)
          }

          $buildRoot = Join-Path $profileDir 'build'
          $testOutDirs = @()
          if (Test-Path -LiteralPath $buildRoot -PathType Container) {
            $testOutDirs = @(
              Get-ChildItem -Path (Join-Path $buildRoot '*\*\out\*.exe') -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notin @('build_script_build.exe', 'build-script-build.exe') } |
                Select-Object -ExpandProperty DirectoryName -Unique
            )
          }

          if ($testOutDirs.Count -eq 0 -and $depsExes.Count -eq 0) {
            throw "No built test or binary executables found under '$buildRoot\*\*\out' or '$depsDir'; build tests with --no-run before calling install-warp."
          }

          foreach ($outDir in $testOutDirs) {
            & $addTarget $outDir
          }
        }

        if ($targets.Count -eq 0) {
          throw 'install-warp requires at least one directory in `into` or `profile-dirs`.'
        }

        foreach ($dir in $targets) {
          $dest = Join-Path $dir 'd3d10warp.dll'
          Copy-Item $sourceDll $dest -Force
          '{0}: {1}' -f $dest, (Get-Item $dest).VersionInfo.FileVersion
        }
