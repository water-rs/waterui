name: Metal toolchain
description: >-
  Makes sure Xcode's Metal toolchain is installed. shaderloom's build script
  turns every WGSL shader into a Metal library with `xcrun metal` while cargo
  builds filtrate, so a job that compiles a WaterUI app on macOS needs the
  toolchain even though the app it packages never links Metal sources itself.
  The macos-26 runner image ships Xcode 26 without the separately downloaded
  Metal toolchain; the action asks Xcode for the component's install state
  with `xcodebuild -showComponent MetalToolchain -json` and downloads it only
  when the query does not report it installed.
runs:
  using: composite
  steps:
    - name: Install the Metal toolchain when Xcode reports it missing
      shell: bash
      run: |
        set -euo pipefail
        status() {
          xcodebuild -showComponent MetalToolchain -json | jq --raw-output '.status // "unknown"'
        }
        installed() {
          case "$1" in
            installed | installedUpdateAvailable) ;;
            *) return 1 ;;
          esac
        }
        toolchain_status="$(status || true)"
        if ! installed "${toolchain_status}"; then
          xcodebuild -downloadComponent MetalToolchain
          toolchain_status="$(status || true)"
          if ! installed "${toolchain_status}"; then
            echo "::error::xcodebuild -downloadComponent MetalToolchain ran, but the Metal toolchain is still not installed (status: ${toolchain_status})."
            exit 1
          fi
        fi
        echo "Metal toolchain status: ${toolchain_status}"
