name: Install DirectX Shader Compiler
description: >
  Installs `dxc`, which `shaderloom` and `cherenkov-gpu`'s build script need
  to compile WGSL to DXIL for Windows targets and which neither the Windows
  nor the Linux runner image ships, then proves the binary answers
  `dxc --version` — the check the call sites used to spell out as a second
  step. The release and asset date are each declared once below.

inputs:
  release:
    description: DirectX Shader Compiler release tag.
    required: false
    default: v1.8.2505.1
  asset-date:
    description: Date stamp in the release's archive asset names.
    required: false
    default: 2025_07_14
  cache:
    description: >-
      Whether the installed binary is restored from and saved to an Actions
      cache. "false" for e2e lanes, which keep no Actions cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # tracel-ai's action is a bare `curl --retry 5` of a GitHub release
    # asset — the same exposure as every other tool download here
    # (#1120). The key carries the selected release and asset date; a hit skips the
    # download and the action entirely.
    - uses: actions/cache@v4
      id: cache
      if: inputs.cache == 'true'
      with:
        path: dxc
        key: install-tool-v1-${{ runner.os }}-${{ runner.arch }}-dxc@${{ inputs.release }}-${{ inputs.asset-date }}
    - name: Install DirectX Shader Compiler
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      with:
        dxc-release: ${{ inputs.release }}
        dxc-filename: dxc_${{ inputs.asset-date }}.zip
    # The same release's Linux build, for the Linux lanes that compile a
    # Windows target: `cherenkov-gpu`'s build script runs `dxc` on the host
    # (#2726). The archive is checked against the release's digest.
    - name: Install DirectX Shader Compiler (Linux)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        curl --retry 5 -sSLf -o dxc.tar.gz https://github.com/microsoft/DirectXShaderCompiler/releases/download/${{ inputs.release }}/linux_dxc_${{ inputs.asset-date }}.x86_64.tar.gz
        echo "f2213da1fc99dc8778c8823078e16ba97c7f80f86a1d4520ab1adf4b462bc48c  dxc.tar.gz" | sha256sum -c -
        mkdir -p dxc
        tar -xzf dxc.tar.gz -C dxc
        rm dxc.tar.gz
    # On a hit the zip never ran, so the PATH line the upstream step
    # writes is missing; add the same directory it would have.
    - name: Add dxc to PATH
      if: steps.cache.outputs.cache-hit == 'true' && runner.os == 'Windows'
      shell: bash
      run: cygpath --windows "$PWD/dxc" >> "$GITHUB_PATH"
    - name: Add dxc to PATH (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: echo "$PWD/dxc/bin" >> "$GITHUB_PATH"
    - name: Verify DirectX Shader Compiler
      shell: pwsh
      run: dxc --version
