name: MSRV
description: >
  Verifies the whole workspace compiles on the `rust-version` declared in
  `Cargo.toml` — the only leg that installs the declared toolchain (every
  other leg runs `stable` or a newer pin, and `clippy::incompatible_msrv`
  only sees std API stabilization versions). `rust-version` is a promise,
  and only compiling on the declared toolchain keeps it true.

# Shared between ci.yml's `MSRV` job — gated on the diff touching a
# toolchain boundary (`rust-version`, a Cargo.toml dependency section or
# Cargo.lock) — and nightly.yml's workspace-wide sweep. It lives in a
# composite action, not a reusable workflow: a `workflow_call` renames the
# reported status context to `MSRV / MSRV`, and `MSRV` is a required
# check — the context is a contract, so each caller runs this as an
# ordinary job of its own.
#
# Repo-internal only: `uses: ./...` inside a composite resolves against
# the *calling workflow's* checkout, so another repository consuming
# this action would fail to find its siblings.

runs:
  using: composite
  steps:
    # `stable` here only resolves the manifest and installs tools; the
    # compile below runs on the declared toolchain.
    - uses: ./.github/actions/setup-rust
      with:
        cache: "false"
    # The version comes from the manifest, not a literal in this file —
    # two sources of truth drift apart, which is the defect this leg exists
    # to close.
    - name: Install and pin the declared toolchain
      shell: bash
      run: |
        set -euo pipefail
        msrv="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "waterui") | .rust_version')"
        if ! [[ "$msrv" =~ ^[0-9]+\.[0-9]+ ]]; then
          echo "::error file=Cargo.toml::the waterui package must declare a major.minor rust-version (got '$msrv')"
          exit 1
        fi
        rustup toolchain install "$msrv" --profile minimal
        # rust-toolchain.toml sets channel = "stable", and the file wins
        # over `rustup default` — which is all dtolnay/rust-toolchain sets,
        # so pinning through it would compile on stable and verify nothing.
        # The environment variable is the override that beats the file.
        echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
        echo "MSRV=$msrv" >> "$GITHUB_ENV"
    # Proof, not assumption: the compiler this leg actually uses must equal
    # the declared version.
    - name: Check the pinned toolchain
      shell: bash
      run: |
        set -euo pipefail
        cargo --version
        version="$(rustc --version)"
        echo "$version"
        if ! [[ "$version" =~ ^rustc\ ${MSRV//./\\.}(\.|\ ) ]]; then
          echo "::error::the pinned compiler is not the declared rust-version $MSRV"
          exit 1
        fi
    - uses: ./.github/actions/setup-linux-deps
      with:
        runtime-fonts: "false"
    # A plain check under the pinned toolchain: the toolchain is already
    # installed and verified above, so no release-index lookup stands
    # between this leg and the compile.
    - name: Verify the workspace builds on the declared MSRV
      shell: bash
      run: |
        set -o pipefail
        if ! cargo check --locked --profile ci-check --workspace --exclude '*-example' --exclude waterui-apple --exclude cocoa-ui; then
          echo "::error::the workspace does not compile on the declared rust-version — either avoid the newer feature, or raise rust-version in [workspace.package] in Cargo.toml in the same pull request"
          exit 1
        fi
