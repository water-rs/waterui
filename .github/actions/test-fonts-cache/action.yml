name: Cache the Hydrolysis test fonts
description: >
  Restores and saves the fonts `backends/hydrolysis/test-fonts/install.py`
  builds, so the nextest `test-fonts` setup script finds every face beside
  the script and downloads nothing. The script verifies each cached face
  against its pinned SHA-256 and fails on any drift, so a restored entry is
  checked exactly like a fresh download. The key carries the script's hash,
  which holds every source pin and expected digest.

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: |
          backends/hydrolysis/test-fonts/*.ttf
          backends/hydrolysis/test-fonts/*.otf
        key: test-fonts-v1-${{ runner.os }}-${{ hashFiles('backends/hydrolysis/test-fonts/install.py') }}
