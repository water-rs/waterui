name: ffi-header
description: >-
  Regenerates `ffi/waterui.h` with cbindgen and checks the committed copies
  against it. Both callers — the pull-request gate and the dev-push cache
  warmer — go through here so they share one toolchain pin and one cache key;
  only the warmer passes `save: 'true'`.

inputs:
  save:
    description: >-
      Whether this run writes the cache it restores. `'true'` on pushes to
      `dev`, so pull requests read a warm cache without ever competing to
      write it.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The one place the header toolchain is named. The generator expands the
    # macro-generated exports through `cargo rustc -- -Zunpretty=expanded`, so
    # this is the only nightly in the repository — and it is a fixed date
    # rather than the channel, because rust-cache keys on the rustc version and
    # a moving `nightly` invalidates the cache below every single day.
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-09-09
        # The generator expands `waterui-ffi` once per shipped backend target
        # and unions the results, so every triple it names must be installed
        # or it fails. The host target's std rides along with the toolchain;
        # these are the rest.
        targets: aarch64-apple-ios, aarch64-linux-android, x86_64-unknown-linux-gnu
    # The expansion is a check-profile build of the `waterui-ffi` graph, whose
    # rmeta artifacts are a fraction of the 0.8 GB dev-profile tarball this job
    # used to measure. It gets its own key because it is the only nightly
    # consumer in the repository: sharing the stable jobs' `cargo-home` key
    # restored nothing, since the rustc version is part of what rust-cache
    # hashes.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ffi-header-${{ runner.os }}
        cache-targets: true
        save-if: ${{ inputs.save }}
        cache-on-failure: true
    # `+nightly-2026-09-09` is named rather than inherited: `rust-toolchain.toml`
    # pins the repository to stable and overrides what the action above sets, so
    # an ambient `cargo run` here would generate the header with the wrong
    # channel and the expansion would lose the macros.
    #
    # Two non-host expansions run `cc`/pkg-config probes against the target's
    # system libraries: the script stages the header sets and compiler shims
    # they read (nothing links — this is a check build), and `kotlinc` is what
    # the WaterKit build-script shims invoke for the Android expansion.
    - name: Provision cross-target expansion dependencies
      shell: bash
      run: |
        set -euo pipefail
        brew install kotlin pkgconf
        "$GITHUB_ACTION_PATH/provision-cross-target-deps.sh"
    - name: Regenerate the header
      shell: bash
      run: cargo +nightly-2026-09-09 run --manifest-path ffi/generator/Cargo.toml
    - name: Verify the committed header matches
      shell: bash
      run: |
        set -euo pipefail
        status=0
        check() {
          if ! git -C "$1" diff --exit-code -- "$2"; then
            echo "::error file=$2::$2 is stale; run 'cargo +nightly run --manifest-path ffi/generator/Cargo.toml' and commit the result"
            status=1
          fi
        }
        # Both native backends left the tree; each syncs its copy from
        # `ffi/waterui.h` in its own CI.
        check . ffi/waterui.h
        exit "$status"
