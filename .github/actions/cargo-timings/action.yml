name: Cargo timings

description: >-
  Makes every `cargo build`, `check`, `clippy`, `test`, `bench`, `doc`,
  `install`, `run`, `rustc` and `nextest run` of the rest of the job write a
  `--timings` report, and exports `WATER_CARGO_TIMINGS` so the builds behind
  `water build`, `water package` and `water run` do too. Cargo has no config
  key or environment variable for the flag, so a `cargo` shim goes first on
  PATH. Pair it with `upload-cargo-timings`, which publishes what the job
  wrote. Run it after the Rust toolchain is installed: it records the real
  cargo it finds.

runs:
  using: composite
  steps:
    - name: Route cargo through the timings shim
      shell: bash
      run: |
        set -euo pipefail
        # The marker doubles as "already installed": a second call would
        # record the shim itself as the real cargo.
        [[ -e "${RUNNER_TEMP}/cargo-timings-start" ]] && exit 0
        shim="${RUNNER_TEMP}/cargo-timings-shim"
        mkdir -p "${shim}"
        cp "${GITHUB_ACTION_PATH}/cargo" "${shim}/cargo"
        real="$(command -v cargo)"
        {
          echo "WATERUI_CARGO_REAL=${real}"
          echo "WATER_CARGO_TIMINGS=1"
        } >> "${GITHUB_ENV}"
        # Reports older than this marker belong to a restored cache or an
        # earlier job on a persistent runner, not to this job.
        touch "${RUNNER_TEMP}/cargo-timings-start"
        if [[ "${RUNNER_OS}" == Windows ]]; then
          # Shells outside bash resolve `cargo` through PATHEXT.
          printf '@"%s" "%%~dp0cargo" %%*\r\n' "$(cygpath -w "$(command -v bash)")" > "${shim}/cargo.cmd"
          cygpath -w "${shim}" >> "${GITHUB_PATH}"
        else
          echo "${shim}" >> "${GITHUB_PATH}"
        fi
