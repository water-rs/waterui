name: E2E Comparison Tools
description: Prepares GNU timeout for the bounded FLIP comparer build.

runs:
  using: composite
  steps:
    - name: Prepare GNU timeout
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: |
        set -euo pipefail
        if ! command -v gtimeout >/dev/null 2>&1; then
          brew install coreutils
        fi
        gtimeout --version
