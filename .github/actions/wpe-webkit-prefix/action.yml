name: Restore the WPE WebKit prefix
description: >-
  Looks up the WPE WebKit install prefix that build-webkit.sh produces in the
  GHCR store `ghcr.io/<owner>/wpe-webkit-prefix:<digest>` and, on a hit,
  unpacks it into `<work-directory>/runtime`, where build-webkit.sh's
  completion marker turns the multi-hour compile into a no-op. The digest
  covers every input the prefix depends on, so a hit is exactly the prefix
  this job would build. Leaves `oras` installed and logged in to ghcr.io, so
  the sibling `push` action can store a freshly built prefix from the same
  job.

inputs:
  runner:
    description: >-
      The `runs-on` label of the calling job. The prefix links against the
      runner image's libraries, so each image (one per architecture) has its
      own entry.
    required: true
  work-directory:
    description: The build-runtime.sh work directory the prefix lives under.
    required: true
  token:
    description: >-
      A token that can read the package: the job's GITHUB_TOKEN with
      `packages: read`, or `packages: write` in the job that pushes.
    required: true

outputs:
  reference:
    description: The prefix's full OCI reference, `ghcr.io/<owner>/wpe-webkit-prefix:<digest>`.
    value: ${{ steps.reference.outputs.reference }}
  hit:
    description: "`true` when the store held the prefix and it was unpacked, `false` on a miss."
    value: ${{ steps.probe.outputs.hit }}

runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v2.0.2
      with:
        version: 1.3.4

    # The digest covers exactly what the compiled prefix depends on: the
    # pinned version and tarball digest in source.toml, the CMake options and
    # dependency handling in build-webkit.sh, the dependency list in the
    # setup action files, the runner image and the CC/CXX toolchain — plus
    # this directory, because it defines the stored layout, and a stored
    # prefix must never be read back under a different one. Editing the shim
    # or packaging, anything outside build-webkit.sh, keeps the digest, so
    # such a change rebuilds only the shim.
    - id: reference
      shell: bash
      env:
        RUNNER_LABEL: ${{ inputs.runner }}
        INPUTS_HASH: ${{ hashFiles('components/platform/browser-wpe/runtime/source.toml', 'components/platform/browser-wpe/runtime/build-webkit.sh', '.github/actions/setup-linux-deps/action.yml', '.github/actions/refresh-apt-index/refresh.sh', '.github/actions/wpe-webkit-prefix/**') }}
      run: |
        set -euo pipefail
        : "${CC:?the calling job must select CC}" "${CXX:?the calling job must select CXX}" "${INPUTS_HASH:?no prefix input file matched}"
        digest="$(printf '%s\n' "$RUNNER_LABEL" "$CC" "$CXX" "$INPUTS_HASH" | sha256sum | cut -d ' ' -f 1)"
        repository="${GITHUB_REPOSITORY_OWNER,,}/wpe-webkit-prefix"
        {
          echo "repository=$repository"
          echo "tag=$digest"
          echo "reference=ghcr.io/$repository:$digest"
        } >> "$GITHUB_OUTPUT"

    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"

    # Asks the registry itself whether the manifest exists. `oras` reports
    # every failure as exit status 1, so it cannot tell a miss from an
    # authentication or network error; the distribution API answers a HEAD
    # with 404 for a manifest (or a whole package) that does not exist, and
    # anything other than 200 or 404 is a real failure that stops the job
    # instead of passing for a miss.
    - id: probe
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ steps.reference.outputs.repository }}
        TAG: ${{ steps.reference.outputs.tag }}
      run: |
        set -euo pipefail
        registry_token="$(
          curl --fail --silent --show-error --user "$GITHUB_ACTOR:$TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$REPOSITORY:pull" \
            | jq --raw-output --exit-status .token
        )"
        echo "::add-mask::$registry_token"
        status="$(
          curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $registry_token" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/$REPOSITORY/manifests/$TAG"
        )"
        case "$status" in
          200) echo "hit=true" >> "$GITHUB_OUTPUT"; echo "WebKit prefix ghcr.io/$REPOSITORY:$TAG: hit" ;;
          404) echo "hit=false" >> "$GITHUB_OUTPUT"; echo "WebKit prefix ghcr.io/$REPOSITORY:$TAG: miss" ;;
          *) echo "::error::probing ghcr.io/$REPOSITORY:$TAG answered HTTP $status"; exit 1 ;;
        esac

    - if: steps.probe.outputs.hit == 'true'
      shell: bash
      env:
        REFERENCE: ${{ steps.reference.outputs.reference }}
        WORK_DIRECTORY: ${{ inputs.work-directory }}
      run: |
        set -euo pipefail
        download="$RUNNER_TEMP/wpe-webkit-prefix"
        oras pull --output "$download" "$REFERENCE"
        mkdir -p "$WORK_DIRECTORY"
        tar --zstd --extract --file "$download/prefix.tar.zst" --directory "$WORK_DIRECTORY"
        rm -rf "$download"
