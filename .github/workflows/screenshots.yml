name: Generate Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'src/**'
      - 'components/**'
  workflow_dispatch:
    inputs:
      examples:
        description: 'Comma-separated list of examples to screenshot (empty = all)'
        required: false
        default: ''

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  screenshots:
    name: Generate Screenshots
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: screenshots-macos

      - name: Install water CLI
        run: cargo install --path cli

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Boot iOS Simulator
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "${DEVICE}" ]; then
            echo "::error::No available iPhone simulator found."
            exit 1
          fi
          echo "SIMULATOR_UDID=${DEVICE}" >> "${GITHUB_ENV}"
          xcrun simctl boot "${DEVICE}" || true
          xcrun simctl bootstatus "${DEVICE}" -b
          echo "Booted simulator: ${DEVICE}"

      - name: Discover Examples
        id: examples
        run: |
          if [ -n "${{ github.event.inputs.examples }}" ]; then
            # Use provided list
            EXAMPLES="${{ github.event.inputs.examples }}"
          else
            # Discover all examples with lib.rs
            EXAMPLES=$(find examples -name "lib.rs" -mindepth 2 -maxdepth 2 | xargs -I {} dirname {} | xargs -I {} basename {} | tr '\n' ',' | sed 's/,$//')
          fi
          echo "examples=$EXAMPLES" >> $GITHUB_OUTPUT
          echo "Discovered examples: $EXAMPLES"

      - name: Generate Screenshots
        run: |
          set -euo pipefail
          mkdir -p screenshots
          FAILED_EXAMPLES=()

          IFS=',' read -ra EXAMPLE_LIST <<< "${{ steps.examples.outputs.examples }}"
          for example in "${EXAMPLE_LIST[@]}"; do
            example=$(echo "$example" | xargs)  # trim whitespace
            if [ -z "$example" ]; then continue; fi

            echo "::group::Screenshot: $example"

            EXAMPLE_PATH="examples/$example"
            if [ ! -d "$EXAMPLE_PATH" ]; then
              echo "::error::Example $example not found."
              FAILED_EXAMPLES+=("$example")
              echo "::endgroup::"
              continue
            fi

            # Build and run on iOS Simulator
            echo "Building $example for iOS..."
            water build --platform ios --path "$EXAMPLE_PATH" || {
              echo "::error::Failed to build $example."
              FAILED_EXAMPLES+=("$example")
              echo "::endgroup::"
              continue
            }

            echo "Running $example on simulator..."
            RUN_LOG="screenshots/${example}-run.log"
            : > "$RUN_LOG"
            water run --platform ios --path "$EXAMPLE_PATH" --device "$SIMULATOR_UDID" > "$RUN_LOG" 2>&1 &
            APP_PID=$!

            # Poll for app readiness signal from `water run` output instead of fixed sleep.
            READY=0
            MAX_ATTEMPTS=45
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                echo "::error::water run exited before readiness for $example."
                tail -n 120 "$RUN_LOG" || true
                break
              fi

              if grep -q "Application started" "$RUN_LOG"; then
                READY=1
                break
              fi

              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "::error::Timed out waiting for app readiness for $example."
              tail -n 120 "$RUN_LOG" || true
              FAILED_EXAMPLES+=("$example")
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
              echo "::endgroup::"
              continue
            fi

            # Capture screenshot
            echo "Capturing screenshot..."
            water device capture --id "$SIMULATOR_UDID" --output "screenshots/${example}-ios.png" || {
              echo "::error::Failed to capture screenshot for $example."
              FAILED_EXAMPLES+=("$example")
            }

            # Terminate app
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true

            echo "::endgroup::"
          done

          echo "Generated screenshots:"
          ls -la screenshots/

          if [ "${#FAILED_EXAMPLES[@]}" -ne 0 ]; then
            echo "::error::Screenshot generation failed for: ${FAILED_EXAMPLES[*]}"
            exit 1
          fi

      - name: Setup Node.js (for wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Upload to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ASSETS_API_TOKEN }}
        run: |
          for screenshot in screenshots/*.png; do
            if [ -f "$screenshot" ]; then
              filename=$(basename "$screenshot")
              echo "Uploading $filename to R2..."
              wrangler r2 object put "assets/screenshots/$filename" --file "$screenshot" --remote
            fi
          done
          echo "Upload complete!"

      - name: Upload Artifacts (for PR review)
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
