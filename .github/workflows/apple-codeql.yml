name: Apple CodeQL

on:
  # Integration pushes only — a topic push used to analyze twice: once here
  # under `refs/heads/<topic>` and again through the open PR's
  # `pull_request` trigger under `refs/pull/<n>/merge`, in different
  # concurrency groups so nothing deduplicated it. Merged source still
  # lands through dev/main and every PR still scans its merge ref.
  push:
    branches: [main, dev]
    paths:
      - Package.swift
      - "backends/apple/Sources/**"
      - .github/workflows/apple-codeql.yml
  pull_request:
    branches: ["**"]
    paths:
      - Package.swift
      - "backends/apple/Sources/**"
      - .github/workflows/apple-codeql.yml
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: apple-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql-swift
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      - name: Build for CodeQL
        run: swift build --configuration debug

      - name: Analyze
        uses: github/codeql-action/analyze@v3
