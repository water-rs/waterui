name: Windows

# Measurement-only variant for #2726; this branch is never merged.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  CARGO_INCREMENTAL: 0

jobs:
  measure:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full-deps-opt0
            args: --workspace --exclude waterui-apple --exclude cocoa-ui --exclude waterui-dylib --exclude waterui-browser-cef --exclude '*-example'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache: "false"
      - uses: ./.github/actions/cargo-sources
      - uses: ./.github/actions/spirv-tools-windows
      - uses: ./.github/actions/install-dxc
      - uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest@0.9.145
          path: ~/.cargo/bin/cargo-nextest*
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/generate-scene-assets
        with:
          mode: full
      - name: Dependencies at opt-level 0
        shell: bash
        run: printf '[profile.dev.package."*"]\nopt-level = 0\n' >> .cargo/config.toml
      - name: Build test targets
        shell: bash
        run: |
          start=$(date +%s)
          eval cargo nextest run --locked --no-run --profile ci ${{ matrix.args }}
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))"
      - name: Run tests
        shell: bash
        run: |
          start=$(date +%s)
          eval cargo nextest run --locked --no-fail-fast --profile ci ${{ matrix.args }} || true
          echo "RUN_SECONDS=$(( $(date +%s) - start ))"
