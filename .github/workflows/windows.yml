name: Windows

# Measurement-only variant for #2726; this branch is never merged.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  CARGO_INCREMENTAL: 0

jobs:
  measure:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            args: --workspace --exclude waterui-apple --exclude cocoa-ui --exclude waterui-dylib --exclude waterui-browser-cef --exclude '*-example'
            config: ""
            archive: true
          - name: full-deps-opt0
            args: --workspace --exclude waterui-apple --exclude cocoa-ui --exclude waterui-dylib --exclude waterui-browser-cef --exclude '*-example'
            config: --config 'profile.dev.package."*".opt-level=0'
            archive: false
          - name: hydrolysis
            args: -p hydrolysis
            config: ""
            archive: false
          - name: cherenkov
            args: -p cherenkov -p cherenkov-gpu -p cherenkov-cpu -p cherenkov-oracle -p cherenkov-scene -p cherenkov-record -p cherenkov-shader
            config: ""
            archive: false
          - name: cli
            args: -p waterui-cli
            config: ""
            archive: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: ./.github/actions/cargo-sources
      - uses: ./.github/actions/spirv-tools-windows
      - uses: ./.github/actions/install-dxc
      - uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest@0.9.145
          path: ~/.cargo/bin/cargo-nextest*
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/generate-scene-assets
        with:
          mode: fonts
      - name: Build test targets
        shell: bash
        run: |
          start=$(date +%s)
          eval cargo test --locked --no-run --timings ${{ matrix.config }} ${{ matrix.args }}
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))"
      - name: Archive size
        if: matrix.archive
        shell: bash
        run: |
          start=$(date +%s)
          eval cargo nextest archive --locked ${{ matrix.args }} --archive-file nextest.tar.zst
          echo "ARCHIVE_SECONDS=$(( $(date +%s) - start ))"
          ls -l nextest.tar.zst
          du -sh target/debug/deps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.name }}
          path: target/cargo-timings/
          retention-days: 7
