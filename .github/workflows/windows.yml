name: Windows

# The Windows test leg is split out of `test.yml` because it needs platform-
# specific exclusions and compile-only coverage. It is still a required
# per-change signal: the workflow runs on the same branches and pull requests
# as the main CI workflow, and every verification command is gating.

on:
  # Integration branches only: a branch that also has a PR would otherwise run
  # the whole workflow twice for one commit.
  push:
    branches: [main, dev]
  pull_request:
    branches: ["**"]
  # Keep a daily default-branch run to catch hosted-runner and toolchain drift
  # even when the repository itself has not changed.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rust-cache is the only cache layer (see the note in ci.yml).
  CARGO_INCREMENTAL: 0
  WATERUI_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/test-artifacts

jobs:
  # Two jobs, not one: the lint passes used to run after the whole test build
  # in a single job, so clippy waited ~90 minutes behind nextest and the leg
  # was the last thing standing on every run (#347). Each job compiles its own
  # graph, but they run side by side, and the critical path is the test job
  # alone. Coverage is unchanged — every command below is one of the original
  # job's, split by kind, not dropped.
  test:
    name: windows-latest
    runs-on: windows-latest
    # Windows is the slowest platform and needs additional headroom for cold
    # hosted-runner builds while remaining a hard gate.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - name: Verify DirectX Shader Compiler
        run: dxc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-windows-latest
          # Only the integration branches write cache generations, as in
          # ci.yml and test.yml: a pull request reads them and saves nothing.
          # Every PR fingerprint used to mint its own 5 GB generation here,
          # and with the 10 GB repository cap that evicted the Test tarballs
          # a dev run had just written (#328).
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      # Four crates cannot be tested here, for reasons that are not bugs:
      #
      # waterui-dylib is the dynamic-link anchor — a Rust `dylib` on purpose, so
      # the preview system can share one copy of the framework across
      # dynamically loaded preview libraries. That exports every Rust symbol,
      # 290k of them, and a PE export table stops at 65535. The preview system
      # targets macOS, the iOS Simulator and Android, not Windows.
      #
      # waterui-browser-cef links cef_sandbox from a CEF binary distribution the
      # runner does not stage. It is still compiled in the lint job below,
      # through the crate's own `compile-only` feature, which its build script
      # honours ahead of `cef-runtime` for exactly this case — so Windows keeps
      # compile coverage of the backend without provisioning the SDK.
      #
      # The two CEF example crates inherit that problem one level down. They
      # select `waterui-browser-cef` with `webview`/`chromium` but not
      # `cef-runtime`, so its build script skips `native/windows_sandbox.cc`
      # while `runtime.rs` still declares the `waterui_cef_windows_sandbox_*`
      # externs under `cfg(windows)` — the crate compiles and then fails to
      # link. Every pass that links a test binary therefore excludes them, the
      # same way it excludes the backend itself; the clippy pass in the lint
      # job keeps them, because it checks without linking and the compile
      # coverage is worth having.
      #
      # One full-workspace pass under default features. A workspace-wide
      # `--all-features` pass is structurally impossible — `waterui-ffi`
      # enforces "exactly one ABI" with a `compile_error!` (ffi/src/lib.rs), so
      # enabling `c-api` and `android-jni` together can never build.
      - run: cargo nextest run --workspace --exclude waterui-dylib --exclude waterui-browser-cef --exclude webview-cef-example --exclude chromium-example --profile ci
      # nextest cannot run doctests, and this workspace has plenty of them.
      - run: cargo test --doc --workspace --exclude waterui-dylib --exclude waterui-browser-cef --exclude webview-cef-example --exclude chromium-example
      - name: Upload Test Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots-windows-latest
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Every crate's own optional features, in its own job so the test tarball
  # above holds one feature variant of the dependency graph instead of two
  # (#362): this job stores only `~/.cargo`, like macos-suites.
  #
  # Two passes, because the root crate cannot join a workspace-wide
  # `--all-features` here: that turns on `dynamic_linking`, which pulls in
  # `waterui-dylib`, and that crate exports 77k symbols against a PE export
  # table limit of 65535 — it cannot link on Windows, which is why the
  # workspace pass in `test` excludes it. So the root `waterui` crate runs on
  # its own under `--features all` (every feature but that one), and the rest
  # of the workspace runs under `--all-features` with the root and the dylib
  # excluded, plus the same four exclusions the Linux `all-features` job in
  # test.yml carries for crates whose feature sets are mutually exclusive by
  # construction (#276). The two excluded crates with platform-specific code
  # in their feature shapes run afterwards in the shapes they have.
  all-features:
    name: windows-latest (all features)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - name: Verify DirectX Shader Compiler
        run: dxc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-home-${{ runner.os }}
          cache-targets: false
          save-if: false
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Test (root crate, every feature but dynamic_linking)
        run: cargo nextest run --features all --profile ci
      - name: Test (all features, workspace)
        run: |
          cargo nextest run --workspace --all-features --profile ci `
            --exclude waterui `
            --exclude waterui-dylib `
            --exclude '*-example' `
            --exclude waterui-core `
            --exclude waterui-ffi `
            --exclude hydrolysis `
            --exclude waterui-browser-cef
      - name: Test (waterui-core, every stable feature)
        run: cargo nextest run -p waterui-core --features std,serde --profile ci
      - name: Test (hydrolysis, every portable feature)
        run: |
          cargo nextest run -p hydrolysis --profile ci `
            --features accessibility,inspector-signals,testing,web,winit
      - name: Upload Test Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots-windows-latest-all-features
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: windows-latest (lint)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Build scripts run under `cargo check` too, so the shader compiler has
      # to be present here as well as in the test job.
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - name: Verify DirectX Shader Compiler
        run: dxc --version
      # Writes the Windows `~/.cargo` tarball (see the cache budget note in
      # ci.yml); the target directory belongs to the test job above. This
      # block used to save a 2.2 GB target tarball on every pull request
      # fingerprint, ungated.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-home-${{ runner.os }}
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Compile the CEF backend without its binary distribution (see the test
      # job for why it cannot be linked here).
      - run: cargo check -p waterui-browser-cef --features compile-only
      # Windows-only code is invisible to every other leg: a `cfg(windows)` body
      # is compiled nowhere else, so a lint that fires only there reaches
      # nobody.
      - name: Clippy
        run: cargo clippy --workspace --exclude waterui-dylib --exclude waterui-browser-cef --all-targets -- -D warnings
