name: Windows

# Diagnostic for #2726, never merged: where a cherenkov GPU test's time goes
# on WARP (D3D12) versus lavapipe (Vulkan).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  probe:
    name: probe-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: ./.github/actions/cargo-sources
      - if: runner.os == 'Windows'
        uses: ./.github/actions/spirv-tools-windows
      - if: runner.os == 'Windows'
        uses: ./.github/actions/install-dxc
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-deps
        with:
          gpu: "true"
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/generate-scene-assets
        with:
          mode: fonts
      - name: Build probe
        shell: bash
        run: |
          printf '[profile.dev.package."*"]\nopt-level = 0\n' >> .cargo/config.toml
          cargo test --locked -p cherenkov-gpu --test zz_probe --no-run
      - name: Probe (three runs, separate processes)
        shell: bash
        run: |
          for i in 1 2 3; do
            PROBE_OUT="$PWD/probe-$i.txt" cargo test --locked -p cherenkov-gpu --test zz_probe -q -- --exact phases
            echo "--- run $i"; cat "probe-$i.txt"
          done
