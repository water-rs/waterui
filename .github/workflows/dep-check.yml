name: Dependency Check

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect project type
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "type=rust" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then
            echo "type=node" >> "$GITHUB_OUTPUT"
          elif [ -f Package.swift ]; then
            echo "type=swift" >> "$GITHUB_OUTPUT"
          else
            echo "type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        if: steps.detect.outputs.type == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.detect.outputs.type == 'rust'
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-edit
        if: steps.detect.outputs.type == 'rust'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Check Rust dependencies
        if: steps.detect.outputs.type == 'rust'
        run: |
          # `cargo upgrade --dry-run` resolves the workspace in place, so it
          # follows workspace inheritance and the submodule path dependencies
          # that `cargo outdated`'s temporary copy could not. It prints one
          # table per crate with something to bump and nothing otherwise; the
          # per-crate progress lines and its dry-run notes are not findings.
          cargo upgrade --dry-run --incompatible 2>&1 | tee upgrade.log \
            | grep -vE '^\s+Checking |^note: |^warning: aborting upgrade|^\s+(git|latest|local|pinned): ' \
            > outdated.txt || true
          cat outdated.txt
          # The command exits 0 in a dry run whether or not anything is outdated;
          # a resolver failure surfaces as `error:` text, which must fail the job
          # instead of being filed as the outdated list.
          if grep -q '^error' upgrade.log; then
            echo "cargo upgrade failed" >&2
            exit 1
          fi

      - name: Setup Node
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Check Node dependencies
        if: steps.detect.outputs.type == 'node'
        run: |
          npm install --ignore-scripts 2>/dev/null || true
          npm outdated --long 2>/dev/null > outdated.txt || true
          cat outdated.txt

      - name: Check Swift dependencies
        if: steps.detect.outputs.type == 'swift'
        run: |
          swift package show-dependencies 2>/dev/null > outdated.txt || echo "Unable to check Swift dependencies" > outdated.txt
          cat outdated.txt

      - name: Report
        if: steps.detect.outputs.type != 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "dependencies" --description "Dependency updates" --color "0075ca" 2>/dev/null || true

          if [ ! -s outdated.txt ]; then
            echo "No outdated dependencies"
            existing=$(gh issue list --label "dependencies" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              gh issue close "$existing" -c "All dependencies are up to date."
            fi
            exit 0
          fi

          content=$(cat outdated.txt)
          body=$(cat <<BODY
          ## Outdated Dependencies

          \`\`\`
          ${content}
          \`\`\`

          _Last checked: $(date -u +%Y-%m-%dT%H:%M:%SZ) · updated weekly_
          BODY
          )

          existing=$(gh issue list --label "dependencies" --state open --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue edit "$existing" --body "$body"
            echo "Updated issue #$existing"
          else
            gh issue create --title "Outdated dependencies" --body "$body" --label "dependencies"
            echo "Created tracking issue"
          fi
