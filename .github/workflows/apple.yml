name: Apple backend

# The per-change gate for the in-tree Apple backend (backends/apple:
# `waterui-apple`, Rust on objc2) and the thin Swift host package
# (backends/apple/Sources/WaterUI, published through the root Package.swift).
# Only changes that can affect the backend's build, tests, benches or lint
# outcome start it — every job draws from the org's macOS pool (20 of 60
# total slots). The backend consumes the in-tree component and foundation
# crates as workspace members, so those paths trigger this lane too: a
# foundation change must not merge while it breaks the Apple build.

permissions:
  contents: read
  pull-requests: read

on:
  # Integration branches only: a topic branch that also has a pull request
  # would otherwise run the job twice for one commit.
  push:
    branches: [main, dev]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Package.swift
      - ".swiftpm/**"
      - "backends/apple/**"
      - "backends/core/**"
      - "core/**"
      - "components/**"
      - "src/**"
      - "macros/**"
      - "ffi/**"
      - "testing/**"
      - "utils/**"
      - "facade.rs"
      - ".cargo/**"
      - ".config/**"
      - "rust-toolchain.toml"
      - ".periphery.yml"
      - .github/workflows/apple.yml
      - ".github/scripts/**"
      - ".github/actions/metal-toolchain/**"
      - ".github/actions/setup-rust/**"
      - ".github/actions/cargo-sources/**"
      - ".github/actions/retire-cargo-caches/**"
  pull_request:
    branches: ["**"]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Package.swift
      - ".swiftpm/**"
      - "backends/apple/**"
      - "backends/core/**"
      - "core/**"
      - "components/**"
      - "src/**"
      - "macros/**"
      - "ffi/**"
      - "testing/**"
      - "utils/**"
      - "facade.rs"
      - ".cargo/**"
      - ".config/**"
      - "rust-toolchain.toml"
      - ".periphery.yml"
      - .github/workflows/apple.yml
      - ".github/scripts/**"
      - ".github/actions/metal-toolchain/**"
      - ".github/actions/setup-rust/**"
      - ".github/actions/cargo-sources/**"
      - ".github/actions/retire-cargo-caches/**"

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same toolchain policy as ci.yml (#328): no compile wrapper and no
  # incremental artifacts on CI — a fresh runner can never reuse them, so
  # they only bloat the restored cache — and the per-change gate does not
  # pay for debuginfo it never reads. Measurement profiles that need them
  # (release metrics, benches) are set by their own jobs.
  RUSTC_WRAPPER: ""
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # The Swift legs (format/lint/ast-grep, the four build shapes, Periphery)
  # only run when a real Swift input moved: the host package manifest, the
  # adapter, the test/reference sources, or the lint configs. A Rust-only
  # change still gets every compile/lint check below — the skipped jobs
  # report neutral, which a required status accepts.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.filter.outputs.swift == 'true' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            swift:
              - "Package.swift"
              - ".swiftpm/**"
              - "backends/apple/**/*.swift"
              - "backends/apple/.swiftformat"
              - "backends/apple/.swiftlint.yml"
              - "backends/apple/.ci/**"
              - ".periphery.yml"
            workflows:
              - ".github/workflows/apple.yml"
              - ".github/actions/**"


  # None of the lint tools need macOS: swiftformat and ast-grep are pure source
  # tools, and the pinned swiftlint-static binary bundles SourceKit (which the
  # `unused_import` rule requires). Running on Ubuntu frees one slot of the
  # org's 20-slot macOS pool for every run. Tool versions are pinned in the
  # cache key; bump them there to upgrade.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: lint-tools
        with:
          path: backends/apple/.ci/bin
          key: lint-tools-v2-swiftlint-0.65.1-swiftformat-0.63.0-ast-grep-0.45.3
      - name: Install lint tools
        if: steps.lint-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p backends/apple/.ci/bin && cd backends/apple/.ci/bin
          curl -sSfL -o /tmp/swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          unzip -jo /tmp/swiftlint.zip swiftlint-static -d .
          mv swiftlint-static swiftlint
          curl -sSfL -o /tmp/swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat_linux.zip
          unzip -jo /tmp/swiftformat.zip -d .
          mv swiftformat_linux swiftformat
          curl -sSfL -o /tmp/ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.45.3/app-x86_64-unknown-linux-gnu.zip
          unzip -jo /tmp/ast-grep.zip -d .
          chmod +x swiftlint swiftformat sg ast-grep
      - uses: actions/cache/save@v4
        if: steps.lint-tools.outputs.cache-hit != 'true'
        with:
          path: backends/apple/.ci/bin
          key: ${{ steps.lint-tools.outputs.cache-primary-key }}
      # The lint configs live beside the source they cover; running from the
      # backend directory keeps their `included`/relative paths unambiguous.
      - run: echo "$PWD/backends/apple/.ci/bin" >> "$GITHUB_PATH"
      - name: SwiftFormat lint
        run: cd backends/apple && swiftformat . --lint --config .swiftformat
      - name: SwiftLint
        run: cd backends/apple && swiftlint lint --strict --config .swiftlint.yml
      - name: ast-grep
        run: ast-grep scan backends/apple/Sources backends/apple/Tests --inline-rules "$(cat backends/apple/.ci/sg/swift.yml)" --report-style short

  # The Swift side is the thin host adapter in backends/apple/Sources/WaterUI
  # — a single file that binds the backend's `waterui_apple_*` entry points
  # through `@_extern(c)`. There is no generated header to sync and no Swift
  # compilation conditions left: the component shapes the `WATERUI_MAP`/
  # `WATERUI_NO_GPU` legs used to cover are Cargo features now, compiled in
  # the Rust lane below, so this job builds the one remaining shape per
  # configuration. The repository-root Package.swift is the manifest.
  swift:
    name: swift (${{ matrix.configuration }})
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ matrix.configuration }}-${{ hashFiles('Package.swift', 'backends/apple/Sources/**', 'backends/apple/Tests/**', '.periphery.yml') }}
          restore-keys: swiftpm-${{ matrix.configuration }}-
      - name: Build
        run: >-
          swift build --configuration ${{ matrix.configuration }}
          -Xswiftc -warnings-as-errors
      # iOS legs: SwiftPM generates the `waterui-apple-host` workspace and
      # scheme on demand. Build it for the supported ARM64 simulator and
      # device destinations; `ONLY_ACTIVE_ARCH`/`ARCHS` keeps the simulator
      # leg from compiling the retired x86_64 iOS target. Both destinations
      # are build-only and debug-only: no simulator boots, the device leg
      # signs nothing, and release adds nothing a compile can observe.
      - name: Build (ios-simulator)
        if: matrix.configuration == 'debug'
        run: >-
          xcodebuild build -scheme waterui-apple-host
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/ios-sim
          ONLY_ACTIVE_ARCH=YES ARCHS=arm64
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Build (ios-device)
        if: matrix.configuration == 'debug'
        run: >-
          xcodebuild build -scheme waterui-apple-host
          -destination 'generic/platform=iOS'
          -derivedDataPath .build/ios-device
          ONLY_ACTIVE_ARCH=YES ARCHS=arm64
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          CODE_SIGNING_ALLOWED=NO
      # Lives inside this job rather than its own: a separate job cost a
      # whole macOS slot just to redo checkout and brew. Its scan build
      # lands in `.build` and stays cached.
      - name: Install Periphery
        if: matrix.configuration == 'debug'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install periphery
      - name: Run Periphery
        if: matrix.configuration == 'debug'
        run: periphery scan --config .periphery.yml

  # One job for every target: the three clippy passes, the feature shapes,
  # the tests and the bench compile share one checkout, one toolchain
  # install and one warm dependency graph — a matrix would pay the full
  # dependency build again on every leg. The iOS passes need the iOS SDK,
  # which only a macOS runner has. CARGO_BUILD_TARGET pins the host graph
  # to aarch64-apple-darwin so the untargeted steps build into the same
  # target dir the explicit clippy legs use; the iOS legs override it.
  rust:
    name: rust
    runs-on: macos-26
    permissions:
      contents: read
      # Retires superseded generations of only this job's two cache
      # families (cargo-sources-macOS-*, apple-target-macOS-ARM64-*) on
      # the job's own ref, then saves the replacement archives.
      actions: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      # This job is the only Apple cache writer (#328/#458 discipline) and
      # it writes two deliberately separate archives:
      #   * `cargo-sources` — only ~/.cargo/registry + ~/.cargo/git, keyed on
      #     the root lockfile. Source archives are toolchain-independent, so
      #     every Apple lane on every Rust toolchain restores this same key.
      #   * `apple-target` — only `target`, keyed on the ACTUAL installed
      #     rustc fingerprint + OS/arch + the root lockfile, so a toolchain
      #     roll can never restore a stale object set and a lockfile change
      #     only degrades to the prefix restore (cargo's own fingerprints
      #     then decide what rebuilds).
      # Both are saved on integration pushes to `dev` only, after every
      # check below has passed — pull requests and manual runs are
      # restore-only readers. Every other Apple lane restores the same
      # `cargo-sources` paths/key read-only and caches no `target`, so a
      # nightly or bench build can never evict this gate's compile cache.
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
          cache: "false"
      - name: Rust toolchain fingerprint
        id: rustc-fingerprint
        run: echo "hash=$(rustc -vV | shasum -a 256 | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
      - name: Restore Cargo sources
        id: cargo-sources
        uses: ./.github/actions/cargo-sources
      - name: Restore compiled target cache
        id: apple-target
        uses: actions/cache/restore@v4
        with:
          path: target
          key: apple-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc-fingerprint.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            apple-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc-fingerprint.outputs.hash }}-
      # cherenkov-gpu's build script compiles its shaders with `xcrun metal`
      # for every Apple target the clippy legs below check.
      - name: Metal toolchain
        uses: ./.github/actions/metal-toolchain
      - name: Format
        run: cargo fmt -p waterui-apple -p cocoa-ui -- --check
      # `native-test` is on for these legs because the `native`
      # test target is `required-features`-gated: without the feature
      # `--all-targets` silently skips it and none of the harness code is
      # linted. Production paths are unchanged — the feature only makes
      # the suite's support module exist.
      - name: Clippy (macOS)
        run: cargo clippy -p waterui-apple --all-targets --locked --features native-test -- -D warnings
      - name: Clippy (iOS)
        run: cargo clippy -p waterui-apple --all-targets --locked --features native-test --target aarch64-apple-ios -- -D warnings
      - name: Clippy (iOS simulator)
        run: cargo clippy -p waterui-apple --all-targets --locked --features native-test --target aarch64-apple-ios-sim -- -D warnings
      # `cocoa-ui` compiles inside the backend's graph, but a dependency is
      # never linted — its own `-D warnings` legs kept their standalone
      # coverage shape: `--all-targets` on the same three ARM64 targets.
      # `native-test` selects the `native` harness=false test target so
      # `--all-targets` keeps linting it.
      - name: Clippy (cocoa-ui, macOS)
        run: cargo clippy -p cocoa-ui --all-targets --locked --features native-test -- -D warnings
      - name: Clippy (cocoa-ui, iOS)
        run: cargo clippy -p cocoa-ui --all-targets --locked --features native-test --target aarch64-apple-ios -- -D warnings
      - name: Clippy (cocoa-ui, iOS simulator)
        run: cargo clippy -p cocoa-ui --all-targets --locked --features native-test --target aarch64-apple-ios-sim -- -D warnings
      # The component shapes the Swift `WATERUI_MAP`/`WATERUI_NO_GPU` legs
      # used to cover are Cargo features now (waterui#343 reasoned the same
      # way), so they lint under -D warnings like the production legs —
      # `cargo check` would let a warnings-only regression ship. `map`
      # pulls waterui-map + cocoa-ui/map.
      - name: Clippy (map)
        run: cargo clippy -p waterui-apple --locked --features map -- -D warnings
      # The no-GPU shape is the default component set minus the features
      # that depend on GPU support (`gpu_surface` and what requires it:
      # `applied_filter`, `view_effect`, `picture`, `resolved_gradient`).
      # The list is derived from the manifest's own `default` table rather
      # than a hardcoded copy, so a newly ported component joins the shape
      # automatically and only the GPU set is subtracted. `--no-default-features`
      # alone would disable every ported component — much weaker than the
      # old no-gpu leg.
      - name: Clippy (no GPU components)
        run: |
          features="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "waterui-apple") | .features.default[]' \
            | grep -vx -e gpu_surface -e applied_filter -e view_effect \
                -e picture -e resolved_gradient \
            | paste -sd, -)"
          echo "non-GPU feature set: ${features}"
          cargo clippy -p waterui-apple --locked \
            --no-default-features --features "${features}" -- -D warnings
      # The `apple-target` cache holds this directory for the next run; the
      # number is evidence for the repository's 10 GB budget review, not a
      # gate.
      - name: Target size
        run: du -sh target
      # Writer side of the two archives described above — reached only when
      # every check passed, on `dev`/`main` pushes only (the compiled-target
      # archive stays `dev`-only), and skipped when the exact key was already
      # restored (nothing new to publish). The retirement step runs BEFORE
      # the saves: a lockfile bump mints a new key, so the superseded
      # generations of this job's own two families on this exact ref are
      # deleted first — otherwise the save itself can evict a live,
      # unrelated cache while the stale generation sits under quota.
      - name: Retire superseded cache generations
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        uses: ./.github/actions/retire-cargo-caches
        with:
          families: cargo-sources-${{ runner.os }}-,apple-target-${{ runner.os }}-${{ runner.arch }}-
          primary-keys: ${{ steps.cargo-sources.outputs.cache-primary-key }}|${{ steps.apple-target.outputs.cache-primary-key }}
          # One live entry per cache purpose on this ref — the shared sweep
          # covers families no single job owns (install-tool pins, the
          # SwiftPM archives this workflow writes) (#1441).
          sweep: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The sources archive is writable from both integration branches:
      # caches are only visible to the ref that wrote them (plus its base
      # and the default branch), so a dev-only writer would leave every
      # `main` run cold. The target archive stays dev-only — a `main` run
      # cannot restore a dev cache through the prefix either, so the
      # release-line target cache remains explicitly cold unless a cache
      # written on `main` or the default branch exists.
      - name: Save Cargo sources
        if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.cargo-sources.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-sources
        with:
          operation: save
          primary-key: ${{ steps.cargo-sources.outputs.cache-primary-key }}
      - name: Save compiled target cache
        if: github.ref == 'refs/heads/dev' && steps.apple-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target
          key: ${{ steps.apple-target.outputs.cache-primary-key }}
      # Host-side tests and the bench compile live in the suite's
      # `host-native` job (apple-e2e.yml) — the dev-push gate here is format
      # plus compile/lint only.
