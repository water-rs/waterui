name: WPE Runtime

# Builds the self-contained WPE WebKit runtime the `water` CLI downloads for
# the browser-wpe backend. This is the path #609 deleted out of build-cli.yml,
# restored as its own workflow now that the four blockers in #155 are resolved.
#
# The build is a multi-hour from-source compile of WebKit, so it is never on
# the dev gate or the nightly critical path: it runs on demand, and on a
# `browser-wpe-runtime/v*` tag push, which is how a built runtime is
# published. A tag run ends by attaching the packaged runtime zips and the
# generated artifact manifest to a GitHub Release on that tag.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags: ["browser-wpe-runtime/v*"]
    branches: [dev]
    # GitHub restores caches only from the run's own ref or the default
    # branch, and every release tag is a new ref — so the WebKit prefix can
    # only ever be warm if it was saved from `dev`. A dev push that does not
    # touch one of the cache-key inputs changes nothing the key covers, so
    # it neither rewrites nor needs the cache.
    paths:
      - components/platform/browser-wpe/runtime/source.toml
      - components/platform/browser-wpe/runtime/build-webkit.sh
      - .github/actions/setup-linux-deps/action.yml
      - .github/actions/refresh-apt-index/refresh.sh
      - .github/workflows/browser-runtime-wpe.yml

concurrency:
  group: browser-runtime-wpe-${{ github.ref }}
  cancel-in-progress: true

env:
  # The persistent work directory build-runtime.sh builds inside; the cache
  # below restores its install prefix, nothing else.
  WPE_WORK_DIRECTORY: wpe-runtime

jobs:
  # Warms the WebKit prefix cache on `dev`, the only ref whose cache a
  # release tag can restore. Nothing else runs here: a miss builds and saves
  # the prefix, a hit stops after the restore. The runtime job below cannot
  # warm this entry — pushes on a tag or branch write under that ref, which
  # later tags cannot read.
  webkit-cache:
    name: Warm WebKit cache ${{ matrix.architecture }}
    if: github.ref == 'refs/heads/dev'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    # &compiler-env and &wpe-matrix are anchored here and aliased in the
    # runtime job below so the two jobs can never drift: every leg builds
    # the same WebKit under the same toolchain.
    env: &compiler-env
      CC: gcc-12
      CXX: g++-12
    strategy:
      fail-fast: false
      matrix:
        include: &wpe-matrix
          - architecture: x86_64
            runner: ubuntu-22.04
          - architecture: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      # WPE WebKit is a multi-hour from-source compile whose result depends
      # only on inputs this key covers: the pinned version and tarball digest
      # in source.toml, the CMake options and dependency handling in
      # build-webkit.sh, the dependency list in the setup action files, and
      # the runner image plus the CC/CXX toolchain this job selects. Editing
      # the shim or packaging — anything outside build-webkit.sh — rebuilds
      # only the shim. The prefix is the only cached output: the ~20 GB
      # build tree cannot fit the 10 GB cache quota and nothing downstream
      # of the install reads it. &webkit-key is anchored here and aliased in
      # the runtime job's restore, so the two jobs address the same entry.
      - uses: actions/cache/restore@v4
        id: webkit-cache
        with:
          path: ${{ env.WPE_WORK_DIRECTORY }}/runtime
          key: &webkit-key wpe-webkit-${{ matrix.runner }}-${{ env.CC }}-${{ env.CXX }}-${{ hashFiles('components/platform/browser-wpe/runtime/source.toml', 'components/platform/browser-wpe/runtime/build-webkit.sh', '.github/actions/setup-linux-deps/action.yml', '.github/actions/refresh-apt-index/refresh.sh') }}

      # gcc-12 is the only shared package the WebKit build needs; the rest of
      # its dependency list is installed by build-webkit.sh itself.
      - uses: ./.github/actions/setup-linux-deps
        with:
          gcc-version: "12"

      - name: Build WPE WebKit
        run: components/platform/browser-wpe/runtime/build-webkit.sh "${{ env.WPE_WORK_DIRECTORY }}"

      - uses: actions/cache/save@v4
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.WPE_WORK_DIRECTORY }}/runtime
          key: ${{ steps.webkit-cache.outputs.cache-primary-key }}

  runtime:
    name: Build WPE runtime ${{ matrix.architecture }}
    # Branch pushes exist only to warm the cache job above — the full
    # pipeline stays on dispatch and release tags.
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    # 22.04 is the declared artifact floor: `source.toml` sets
    # `maximum_glibc = "2.35"` and `build-runtime.sh` refuses to package
    # against a newer glibc, so the runner image cannot move. The image ships
    # GCC 11.4 while WebKit requires 12.2, so the job installs and selects GCC
    # 12 (`CC`/`CXX` are the overrides `build-runtime.sh` reads; it rejects
    # Clang outright). Jammy's archive carries gcc-12 12.3, so no toolchain
    # PPA is needed.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env: *compiler-env
    strategy:
      fail-fast: false
      matrix:
        include: *wpe-matrix
    steps:
      - uses: actions/checkout@v4

      # Same cache entry the warmer job above fills — see its comment for
      # what the key covers.
      - uses: actions/cache/restore@v4
        id: webkit-cache
        with:
          path: ${{ env.WPE_WORK_DIRECTORY }}/runtime
          key: *webkit-key

      - uses: ./.github/actions/setup-linux-deps
        with:
          gcc-version: "12"

      # Compiles WebKit and installs it into the work directory's prefix —
      # skipped inside the script when the cache restored a completed install.
      - name: Build WPE WebKit
        run: components/platform/browser-wpe/runtime/build-webkit.sh "${{ env.WPE_WORK_DIRECTORY }}"

      # Saves the install prefix the moment the WebKit build completes —
      # before the shim and packaging — so a later-stage failure can never
      # cost a multi-hour build its cache entry.
      - uses: actions/cache/save@v4
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.WPE_WORK_DIRECTORY }}/runtime
          key: ${{ steps.webkit-cache.outputs.cache-primary-key }}

      # Builds the bridge against a staging copy of the prefix and packages
      # the runtime zip with its .artifact.json metadata. build-runtime.sh
      # re-runs build-webkit.sh first, which the completion marker turns
      # into a no-op here.
      - name: Build self-contained WPE runtime
        run: components/platform/browser-wpe/runtime/build-runtime.sh runtime-artifacts "${{ env.WPE_WORK_DIRECTORY }}"

      - name: Upload WPE runtime
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-wpe-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            runtime-artifacts/*.zip
            runtime-artifacts/*.artifact.json

  # Two matrix legs feed one release, so publishing waits on both rather than
  # letting each attach half a manifest — the same reason the deleted
  # build-cli.yml made release-browser-runtime a separate job. Dispatch runs
  # stop at the artifacts above; only a tag gets a release.
  publish:
    name: Publish WPE runtime
    needs: runtime
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download browser runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: browser-runtime-wpe-*
          path: target/distrib
          merge-multiple: true

      - name: Generate browser runtime manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          python3 components/platform/browser-wpe/runtime/generate-manifest.py \
            --base-url "$BASE_URL" \
            --output target/distrib/browser-runtime-manifest.json \
            target/distrib/*.artifact.json
          find target/distrib -maxdepth 1 -name '*.artifact.json' -delete

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            target/distrib/*.zip
            target/distrib/browser-runtime-manifest.json
