name: Affected scope

# Computes what the PR/push gate must compile for a diff: the workspace
# packages the determinator (`determinator`, guppy's diff-driven package
# selection, comparing the base and head package graphs) marks as changed
# plus every reverse dependency a change could reach, resolved through the
# rules in .github/tools/affected/rules.toml. Prose selects nothing; an
# outside-package path no rule names selects everything; uncertainty
# always widens the gate instead of narrowing it.
#
# Callers pass the comparison base — a pull request's base sha or a push's
# `before` sha. Empty means "no diff": the whole workspace is in scope.

on:
  workflow_call:
    inputs:
      base:
        description: >
          Revision the diff is measured from (PR base sha, push `before`
          sha). Empty selects the whole workspace.
        type: string
        required: false
        default: ""
    outputs:
      packages:
        description: Space-separated package names, `workspace`, or empty.
        value: ${{ jobs.scope.outputs.packages }}
      package-args:
        description: The affected packages rendered as cargo `-p` flags.
        value: ${{ jobs.scope.outputs.package-args }}
      comment-only:
        description: >
          `true` when every changed .rs file's syntax tree is unchanged
          after comments, doc comments and doc attributes are removed.
        value: ${{ jobs.scope.outputs.comment-only }}
      msrv:
        description: >
          `true` when the diff can move the toolchain floor — a
          rust-version key, a dependency section, or Cargo.lock.
        value: ${{ jobs.scope.outputs.msrv }}
      test-assets:
        description: >
          `true` when a package whose test code needs a generated or
          installed asset — waterui-cli's `include_bytes!`d Roboto
          fixture, or the test fonts the styled suites resolve by
          family name — is in scope.
        value: ${{ jobs.scope.outputs.test-assets }}
      scene-assets:
        description: >
          `true` when cherenkov-oracle or cherenkov-gpu is in scope — the
          packages whose `--all-targets` compile `include_bytes!`s the
          generated Cherenkov scene fonts — so the scene tree must exist
          before the check.
        value: ${{ jobs.scope.outputs.scene-assets }}

jobs:
  scope:
    name: Affected scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
      package-args: ${{ steps.compute.outputs.package-args }}
      comment-only: ${{ steps.compute.outputs.comment-only }}
      msrv: ${{ steps.compute.outputs.msrv }}
      test-assets: ${{ steps.compute.outputs.test-assets }}
      scene-assets: ${{ steps.compute.outputs.scene-assets }}
    steps:
      - uses: actions/checkout@v4
        # The diff and the base revision's package graph both need the
        # history, so the checkout is complete.
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      # Reads the shared `cargo-sources` archive owned by this OS's single
      # writer job (lint in test.yml); read-only lanes never save. The
      # `cargo-home-*` rust-cache family this replaced had no writer at
      # all — every restore was a guaranteed miss on content identical to
      # this archive (#1441).
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # The determinator tool is in-tree, so no prebuilt release exists and
      # its ~1.5 min compile ran on every gate invocation. Cache the built
      # binary the way install-tool caches downloaded ones: an exact key on
      # everything the binary is built from — lockfile, manifest, main.rs
      # and rules.toml (baked in via `include_str!`) — and no restore-keys,
      # because a stale binary under a changed tool is worse than a rebuild.
      - uses: actions/cache@v4
        id: affected-tool
        with:
          path: .github/tools/affected/target/release/affected
          key: affected-tool-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/tools/affected/Cargo.lock', '.github/tools/affected/Cargo.toml', '.github/tools/affected/src/**', '.github/tools/affected/rules.toml') }}
      - name: Build the determinator tool
        if: steps.affected-tool.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path .github/tools/affected/Cargo.toml
      - uses: astral-sh/setup-uv@v6
      - name: Compute the affected set
        id: compute
        run: |
          if [ -z "${{ inputs.base }}" ]; then
            # No base to diff against: the whole workspace is in scope,
            # and MSRV keeps its signal rather than guessing it away.
            {
              echo "packages=workspace"
              echo "package-args="
              echo "comment-only=false"
              echo "msrv=true"
              echo "test-assets=true"
              echo "scene-assets=true"
            } >> "$GITHUB_OUTPUT"
          else
            uv run .github/scripts/affected.py --base "${{ inputs.base }}"
          fi
