name: debug-2158
on:
  push:
    branches: [debug/2158-metal-sim]
jobs:
  probe:
    if: false
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/metal-toolchain
      - name: Probe Metal simulator linking
        shell: bash
        run: |
          set +e +o pipefail
          xcodebuild -version
          xcrun -sdk iphonesimulator -f metal
          xcodebuild -showComponent MetalToolchain -json || true
          lib="$(dirname "$(xcrun -sdk iphonesimulator -f metal)")/../metal"
          find "$lib" -name 'libmetal_rt*' | sort
          src=.github/debug-2158/yuv_color.metal
          probe() {
            local label="$1"; shift
            rm -f p.air p.metallib
            if env "$@" -c -o p.air "$src" >c.log 2>&1 && \
               env $(printf '%s\n' "$@" | grep '=' ) xcrun --sdk iphonesimulator metallib p.air -o p.metallib >l.log 2>&1; then
              echo "PASS  $label"
            else
              echo "FAIL  $label"; grep -shE 'error|ERROR|sysroot' c.log l.log | cut -c1-300 | head -3
            fi
          }
          for std in ios-metal1.0 ios-metal2.0 ios-metal2.1 ios-metal2.4 metal3.0; do
            probe "std=$std" xcrun --sdk iphonesimulator metal -std=$std
            probe "std=$std IPHONEOS_DEPLOYMENT_TARGET=26.0" IPHONEOS_DEPLOYMENT_TARGET=26.0 xcrun --sdk iphonesimulator metal -std=$std
            probe "std=$std -target air64-apple-ios26.0-simulator" xcrun --sdk iphonesimulator metal -std=$std -target air64-apple-ios26.0-simulator
          done
          rm -f p.air; xcrun --sdk iphonesimulator metal -std=ios-metal1.0 -c -o p.air "$src" 2>/dev/null && xcrun --sdk iphonesimulator metal-objdump --macho --private-headers p.air 2>&1 | grep -iA4 'LC_BUILD_VERSION\|platform' | head -12 || true
          env | grep -i deployment || echo "no deployment target env"
  package:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - run: ./.github/scripts/setup-e2e.sh
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-ios-sim
          cache: "false"
      - uses: ./.github/actions/metal-toolchain
      - uses: ./.github/actions/cargo-sources
      - name: Build the water CLI
        run: cargo install --path cli --locked --root "${{ github.workspace }}/cli-bin" && echo "${{ github.workspace }}/cli-bin/bin" >> "$GITHUB_PATH"
      - name: Shim xcrun to record what build scripts see
        run: |
          mkdir -p "${{ github.workspace }}/shim"
          cat > "${{ github.workspace }}/shim/xcrun" <<'SHIM'
          #!/bin/bash
          {
            echo "xcrun $*"
            env | grep -E 'DEPLOYMENT_TARGET|^SDKROOT=|^TARGET=|^CARGO_PKG_NAME=' | sed 's/^/  /'
          } >> "${GITHUB_WORKSPACE}/xcrun-calls.log"
          exec /usr/bin/xcrun "$@"
          SHIM
          chmod +x "${{ github.workspace }}/shim/xcrun"
          echo "${{ github.workspace }}/shim" >> "$GITHUB_PATH"
      - name: Package video_player for iOS
        continue-on-error: true
        env:
          PLATFORM: ios
          EXAMPLES: video_player
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          WATERUI_DIR: ${{ github.workspace }}
          EXAMPLE_LOG_DIR: ${{ github.workspace }}/e2e-logs
          PACKAGE_OUT_DIR: ${{ github.workspace }}/packaged-ios
        run: ./.github/scripts/package-examples.sh
      - name: Show xcrun calls
        if: always()
        run: grep -B1 -A4 -E 'yuv_color|CARGO_PKG_NAME=waterkit-codec' xcrun-calls.log | head -60; echo ---; grep -c '^xcrun' xcrun-calls.log
