name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  WATERUI_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/test-artifacts

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform in one run. Cancelling the other two hides their
      # results, so a cross-platform break costs one round trip per platform.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nasm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm libasound2-dev libva-dev libfontconfig1-dev libgbm-dev libxcb1-dev libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libgtk-4-dev libpipewire-0.3-dev libudev-dev
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - name: Verify DirectX Shader Compiler
        if: runner.os == 'Windows'
        run: dxc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      # waterui-dylib is the dynamic-link anchor: it is a Rust `dylib` on
      # purpose, so the preview system can share one copy of the framework
      # across dynamically loaded preview libraries. That exports every Rust
      # symbol — 290k of them — and a PE export table stops at 65535. The
      # preview system targets macOS, the iOS Simulator and Android, not
      # Windows, so the anchor is simply not built there.
      - name: Select workspace members
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "WORKSPACE_EXCLUDES=--exclude waterui-dylib" >> "$GITHUB_ENV"
          else
            echo "WORKSPACE_EXCLUDES=" >> "$GITHUB_ENV"
          fi
      - shell: bash
        run: cargo nextest run --workspace $WORKSPACE_EXCLUDES --profile ci
      - shell: bash
        run: cargo nextest run --all-features --profile ci
      # nextest cannot run doctests, and this workspace has plenty of them.
      - shell: bash
        run: cargo test --doc --workspace $WORKSPACE_EXCLUDES
      - name: Upload Test Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots-${{ matrix.os }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
