name: Test

on:
  workflow_call:
    inputs:
      # `false` is the fast gate: format and default-features workspace clippy.
      # `true` is the nightly matrix: every test, example, doctest, platform,
      # optional-feature lint pass and the skill compile gate. Dev pushes
      # enter through dev.yml; pull requests keep the additional ABI and
      # dependency checks in ci.yml. Both callers use the same fast lint.
      full:
        type: boolean
        default: false
      # The affected-only scope, computed by affected.yml for the fast
      # callers (#458's follow-up): `workspace` sweeps everything as
      # before, a package list scopes check+clippy to those crates and
      # their reverse dependencies, and `comment-only` narrows it further
      # to rustdoc + clippy on the files' owners when no .rs syntax tree
      # changed. The nightly always sweeps (`full`).
      affected:
        type: string
        default: "workspace"
      package-args:
        type: string
        default: ""
      comment-only:
        type: boolean
        default: false
      test-assets:
        type: boolean
        default: true
      # `true` when a scoped package's `--all-targets` compile
      # `include_bytes!`s a generated Cherenkov scene font
      # (cherenkov-oracle, cherenkov-gpu, and cherenkov-cpu test targets),
      # so the fonts must exist before the check. The lint job asks only
      # for those fonts; jobs that run tests generate the corpus themselves.
      scene-assets:
        type: boolean
        default: true

# Narrow by default: callers may grant actions:write for the lint job's
# cache retirement, but every other job in this workflow keeps read-only
# GITHUB_TOKEN scope.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cargo/rustup retry network failures three times by default; ten
  # matches the budget install-action sets for its own downloads.
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # rust-cache and the install-tool binary caches are the only cache
  # layers (see the note in ci.yml).
  CARGO_INCREMENTAL: 0
  WATERUI_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/test-artifacts

# Parallel jobs instead of one serial leg per platform (#329), with the
# examples compiled once in their own job (#330). The cargo passes
# below used to run one after another inside a single job per OS, which put
# every clippy shape in front of the ubuntu tests and every macOS-only suite
# behind the macOS workspace run; the macOS leg was the critical path of every
# CI run.
#
# Two tiers (#379). Every all-features pass is a second `-C metadata` profile
# of the whole workspace that no cache can hold next to the default one, so
# it is a 35-40 minute cold build on every platform, every run, and it made
# every pull request a 60-70 minute wait whatever it changed. Those passes,
# the macOS platform and the macOS suites now run only when `full` is set,
# which `nightly.yml` does once a day against `dev`; a pull request and a
# push to `dev` run default-features clippy and format on Linux (#458).
# The complete default-feature tests and examples also belong to nightly;
# no test coverage is removed to shorten the per-change feedback loop.
jobs:
  # Lint before testing: it is the cheapest failure to produce, and the one a
  # contributor is most likely to hit, so it should not wait behind the whole
  # test run — nor should the test run wait behind it. Linux only; the macOS
  # CEF lint lives in `cef`, because that target refuses to compile anywhere
  # else.
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Retires superseded generations of only this job's two cache
      # families (cargo-sources-Linux-*, lint-target-Linux-X64-*) on its
      # own ref, then saves the replacement archives.
      actions: write
    # Pull requests keep the 10-minute gate. An integration push that misses
    # the exact `lint-target` key writes the archive every later run restores,
    # so it sweeps the whole workspace, cold after a stable toolchain roll;
    # it gets the room to finish instead of timing out unsaved.
    timeout-minutes: ${{ inputs.full && 90 || ((github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 30 || 10) }}
    steps:
      - uses: actions/checkout@v4
      # The fast gate owns the target-cache budget, including workspace check
      # artifacts. Only integration-branch fast runs write it, and only after
      # the workspace sweep, so the archive covers what a workspace-scope pull
      # request compiles; pull requests and the full nightly lint restore
      # without adding cache generations.
      # The check-only Cargo profile avoids optimizing build dependencies for
      # runtime speed when this job only needs their compiler output.
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache: "false"
      # Two deliberately separate archives (#328/#458): `cargo-sources` —
      # only ~/.cargo/registry + ~/.cargo/git keyed on the root lockfile,
      # shared read-only by every lane on this OS — and `lint-target`, only
      # `target`, keyed on the ACTUAL rustc fingerprint + OS/arch + the
      # lockfile so a toolchain roll can never restore a stale object set.
      # This job is the sole writer of both on integration pushes; every
      # other lane restores `cargo-sources` read-only and caches no target.
      - name: Rust toolchain fingerprint
        id: rustc-fingerprint
        run: echo "hash=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
      - name: Restore Cargo sources
        id: cargo-sources
        uses: ./.github/actions/cargo-sources
      - name: Restore lint target cache
        id: lint-target
        uses: actions/cache/restore@v4
        with:
          path: target
          key: lint-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc-fingerprint.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lint-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc-fingerprint.outputs.hash }}-
      # This run writes `lint-target` when it is a fast integration push that
      # missed the exact key. The archive it saves is restored by every
      # later run under that key, so it must hold the workspace sweep, not
      # just whatever this push's affected scope compiled.
      - name: Lint target cache writer
        id: writer
        run: echo "sweep=${{ !inputs.full && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.lint-target.outputs.cache-hit != 'true' }}" >> "${GITHUB_OUTPUT}"
      # The affected set as this Linux leg compiles it. `-p` and `--exclude`
      # are mutually exclusive, so the Apple-only crates are dropped from the
      # package arguments here — the macOS legs lint them. An Apple-only
      # scope therefore compiles nothing on Linux. `compiles` is exactly the
      # condition under which some cargo step below runs: each one is gated
      # on the full or workspace sweep, the writer sweep, or a package this
      # filtered set names.
      - name: Linux scope
        id: linux-scope
        env:
          PACKAGE_ARGS: ${{ inputs.package-args }}
          SWEEPS: ${{ inputs.full || inputs.affected == 'workspace' || steps.writer.outputs.sweep == 'true' }}
        run: |
          # `package-args` is affected.py's `-p <name>` pairs.
          read -ra words <<< "${PACKAGE_ARGS}"
          args=()
          for ((i = 0; i < ${#words[@]}; i += 2)); do
            case "${words[i + 1]}" in
              waterui-apple | cocoa-ui) ;;
              *) args+=("${words[i]}" "${words[i + 1]}") ;;
            esac
          done
          compiles=false
          if [ "${SWEEPS}" = true ] || [ "${#args[@]}" -gt 0 ]; then
            compiles=true
          fi
          {
            echo "args=${args[*]}"
            echo "compiles=${compiles}"
          } >> "${GITHUB_OUTPUT}"
      - name: Install native dependencies
        uses: ./.github/actions/setup-linux-deps
      # waterui-cli's `#[cfg(test)]` font-subsetting module `include_bytes!`s
      # the generated Roboto fixture — the repository stores it nowhere, and
      # `--all-targets` compiles the test modules, so it must exist first.
      # The composite also installs the test fonts the styled suites resolve
      # at run time; this gate never runs tests, so that half only matters
      # to the `full` callers that share the step.
      # The writer sweep lints the whole workspace with `--all-targets`
      # whatever the scope, so it needs every generated asset too.
      - name: Generate Hydrolysis test assets
        if: inputs.full || inputs['test-assets'] || steps.writer.outputs.sweep == 'true'
        uses: ./.github/actions/generate-test-assets
      # cherenkov-oracle, cherenkov-gpu, and cherenkov-cpu compile
      # `include_bytes!` of fonts only `scenes/tools/generate.py` writes;
      # `--all-targets` compiles them, so the fonts must exist first.
      # Corpus and perf are read at run time — this job never runs tests.
      - name: Generate Cherenkov scene assets
        if: inputs.full || inputs['scene-assets'] || steps.writer.outputs.sweep == 'true'
        uses: ./.github/actions/generate-scene-assets
        with:
          mode: fonts
      - name: Format
        run: cargo fmt --all -- --check
      # Workspace-wide under default features first: it is the cheapest of the
      # lint passes and the one every crate's normal build shape goes through.
      # `--all-targets` in the fast shape too: the gate runs no test, but a
      # `#[cfg(test)]` module or a `tests/` target that no longer compiles
      # must not wait for the nightly to be noticed.
      #
      # The fast gate sweeps only when the affected scope is `workspace` —
      # a change under no package's directory. A scoped diff gets check +
      # clippy on the determinator's set (changed crates plus every reverse
      # dependency that could rebuild differently); a comment-only diff
      # narrows to rustdoc + clippy on the owning crates alone.
      - name: Clippy (workspace)
        if: inputs.full || inputs.affected == 'workspace' || steps.writer.outputs.sweep == 'true'
        # waterui-apple / cocoa-ui compile only on Apple hosts; the macOS legs carry them.
        run: cargo clippy --locked --profile ci-check --workspace --exclude '*-example' --exclude waterui-apple --exclude cocoa-ui --all-targets -- -D warnings
      - name: Check and clippy (affected packages)
        if: inputs.full == false && inputs['comment-only'] == false && inputs.affected != 'workspace' && steps.writer.outputs.sweep != 'true' && steps.linux-scope.outputs.args != ''
        env:
          LINUX_ARGS: ${{ steps.linux-scope.outputs.args }}
        run: |
          read -ra args <<< "${LINUX_ARGS}"
          cargo check --locked --profile ci-check "${args[@]}" --all-targets
          cargo clippy --locked --profile ci-check "${args[@]}" --all-targets -- -D warnings
      - name: Clippy and rustdoc (comment-only owners)
        if: inputs.full == false && inputs['comment-only'] == true && steps.linux-scope.outputs.args != ''
        env:
          LINUX_ARGS: ${{ steps.linux-scope.outputs.args }}
        run: |
          read -ra args <<< "${LINUX_ARGS}"
          cargo clippy --locked --profile ci-check "${args[@]}" --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps "${args[@]}"
      # Filters and their portable description without the GPU stack: no other
      # pass builds `effects` with `gpu` off, so a GPU item leaking into the
      # description would otherwise go unnoticed until a non-GPU target built it.
      # Library only: `--all-targets` builds the dev-dependencies, whose
      # `waterui` turns `gpu` back on through feature unification.
      - name: Clippy (graphics effects without gpu)
        if: inputs.full || inputs.affected == 'workspace' || steps.writer.outputs.sweep == 'true' || contains(inputs.affected, 'waterui-graphics')
        run: cargo clippy --locked --profile ci-check -p waterui-graphics --no-default-features --features effects -- -D warnings
      # filtrate with the wgpu stack off: its `webgl` feature (a deliberate
      # compile_error off wasm32) is the only GPU runtime the crate has, so
      # this is the shared filter core in the shape non-GPU embedders
      # consume it — the leg the cherenkov repository's `check` job ran
      # (`-p filtrate --no-default-features`, moved in with the tree
      # (#1449)). On the scoped gate it fires whenever a `filtrate*`
      # package is in scope.
      - name: Clippy (filtrate without wgpu)
        if: inputs.full || inputs.affected == 'workspace' || steps.writer.outputs.sweep == 'true' || contains(inputs.affected, 'filtrate')
        run: cargo clippy --locked --profile ci-check -p filtrate --no-default-features --all-targets -- -D warnings
      # The scene crate's `generator` feature compiles the corpus-writing
      # binaries (`generate-corpus`, `prepare-fonts`) that every scene
      # consumer's assets come from; the cherenkov repository kept a
      # dedicated leg because a generator-only lint break cannot hide
      # behind the default-feature pass.
      - name: Clippy (cherenkov-scene generator)
        if: inputs.full || inputs.affected == 'workspace' || steps.writer.outputs.sweep == 'true' || contains(inputs.affected, 'cherenkov-scene')
        run: cargo clippy --locked --profile ci-check -p cherenkov-scene --all-targets --features generator -- -D warnings
      # Then every crate's own optional features. This pass used to be
      # `cargo clippy --all-targets --all-features`, with neither `-p` nor
      # `--workspace`: the root manifest carries both `[workspace]` and
      # `[package]`, so cargo narrowed it to the root `waterui` crate, and a
      # backend's own non-default features were linted only where the root
      # happened to enable them. Nothing in CI compiled gtk's
      # `webkitgtk` or the browsers' engine features at all (#261).
      #
      # `--workspace --all-features` covers all of those — except
      # `waterui-apple` (ARM-Apple-only objc2 code plus a `native` suite that
      # needs provisioned reference metrics; `apple.yml` owns it). Three other
      # crates cannot
      # join it, because `--all-features` asks for feature sets that are
      # mutually exclusive by construction; each is excluded here and linted
      # below in the shapes it actually has. Every one of the three is still
      # linted under its default features by the workspace pass above, and the
      # steps share this job's target dir, so each is an increment on a graph
      # that is already built.
      # filtrate and cherenkov-bench join the exclusion set (#1449):
      # `filtrate/webgl` is an intentional `compile_error!` off wasm32
      # (the wasm job lints it where it is legal), and `cherenkov-bench`'s
      # `skia-metal` is Apple-only — the `cherenkov-corpus`/`cherenkov-metal`
      # jobs lint every bench adapter feature in its own shape, so nothing
      # is lost to the exclusion.
      - name: Clippy (all features, workspace)
        if: inputs.full
        run: |
          cargo clippy --locked --profile ci-check --workspace --all-targets --all-features \
            --exclude '*-example' \
            --exclude waterui-apple \
            --exclude cocoa-ui \
            --exclude waterui-core \
            --exclude waterui-ffi \
            --exclude waterui-browser-cef \
            --exclude filtrate \
            --exclude cherenkov-bench \
            -- -D warnings
      # `waterui-core`'s `nightly` feature turns on `feature(never_type)`, which
      # is a hard E0554 on the stable channel this job pins. Everything else the
      # crate has, it gets here.
      - name: Clippy (waterui-core, every stable feature)
        if: inputs.full
        run: cargo clippy --locked --profile ci-check -p waterui-core --all-targets --features std,serde -- -D warnings
      # `waterui-ffi` selects its ABI with mutually exclusive features and
      # `ffi/src/lib.rs` turns `c-api` + `android-jni` into a `compile_error!`.
      # This is the `c-api` half with every optional C surface a runtime build
      # can carry; the `android-jni` half is the `Android FFI` job in ci.yml,
      # and the compile-only `cef-header` shape is the `cef` job below.
      - name: Clippy (waterui-ffi, C ABI surfaces)
        if: inputs.full
        run: cargo clippy --locked --profile ci-check -p waterui-ffi --all-targets --features map,chromium,webview-cef -- -D warnings
      # `compile-only` swaps in CEF's `dox` stubs and stops the build script
      # downloading the distribution that `cef-runtime` — and the `real_engine`
      # test target — need, so the two can never be enabled together. This is
      # the runtime shape, which nothing else lints: the macOS `real-engine`
      # pass has no `chromium`, and its `cef-header` pass is `compile-only`.
      # `real-engine` stays off here because that test target is macOS-only;
      # `--all-targets` skips it for want of its required feature.
      - name: Clippy (waterui-browser-cef, CEF runtime)
        if: inputs.full
        run: cargo clippy --locked --profile ci-check -p waterui-browser-cef --all-targets --features chromium,webview -- -D warnings
      # The feature combination Hydrolysis's own CI swept (#1428): the
      # all-features pass above covers the superset, but a feature interaction
      # that only this set compiles — webview-system stays off because its
      # WKWebView bridge exists on macOS alone — would regress invisibly
      # otherwise. The bare check is the other half of that contract: call
      # sites a feature gates out rot under every enabled leg.
      #
      # `default = []`, so the default-feature affected pass compiles none of
      # the `accessibility`-gated tests; the fast gate runs this leg too
      # whenever the scope can reach Hydrolysis, or they lint only nightly
      # (#2047). Measured at 27 s on top of the default-feature graph.
      - name: Clippy (hydrolysis, checked feature set)
        if: inputs.full || inputs.affected == 'workspace' || steps.writer.outputs.sweep == 'true' || contains(inputs.affected, 'hydrolysis')
        run: cargo clippy --locked --profile ci-check -p hydrolysis --all-targets --features accessibility,inspector-signals,testing,web,winit -- -D warnings
      - name: Check (hydrolysis, no features)
        if: inputs.full
        run: cargo check --locked --profile ci-check -p hydrolysis --no-default-features --lib
      # The cli's own CI ran a no-default-features check on every change
      # (water-rs/cli ci.yml): `default` bundles svg-icons+preview,
      # and nothing else in this workspace compiles the bare shape.
      - name: Check (waterui-cli, no default features)
        if: inputs.full || contains(inputs.affected, 'waterui-cli')
        run: cargo check --locked --profile ci-check -p waterui-cli --no-default-features --all-targets
      # The waterui skill's snippet compile gate: every rust fence in
      # .claude/skills/waterui is transcribed into .claude/skills/waterui/skill_snippets
      # and must keep compiling. The non-default feature exposes the test/bench
      # transcriptions to the compiler without registering runnable tests —
      # they address elements that do not exist by design and must never run.
      - name: Skill snippet compile gate
        if: inputs.full
        run: cargo check --locked --profile ci-check -p skill_snippets --all-targets --features compile-gate-tests
      # Every cargo step above writes `target`, so it exists exactly when
      # one of them ran; a run that compiled and left none fails here.
      - name: Target size
        if: steps.linux-scope.outputs.compiles == 'true'
        run: du -sh target
      # Retirement runs after every check has passed and BEFORE the saves:
      # a lockfile bump mints a new key, so the superseded generations of
      # this job's own two families on this exact ref are deleted first —
      # otherwise the save itself can evict a live, unrelated cache while
      # the stale generation sits under quota. Ref-scoped family prefixes
      # only: pull-request caches, other families, and other workspaces are
      # never touched; API failures fail the step, they are not swallowed.
      - name: Retire superseded cache generations
        if: ${{ !inputs.full && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
        uses: ./.github/actions/retire-cargo-caches
        with:
          families: cargo-sources-${{ runner.os }}-,lint-target-${{ runner.os }}-${{ runner.arch }}-
          primary-keys: ${{ steps.cargo-sources.outputs.cache-primary-key }}|${{ steps.lint-target.outputs.cache-primary-key }}
          # One live entry per cache purpose on this ref — the shared sweep
          # covers families no single job owns (install-tool pins, apt
          # packages, in-tree tool builds) (#1441).
          sweep: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Save Cargo sources
        if: ${{ !inputs.full && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.cargo-sources.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/cargo-sources
        with:
          operation: save
          primary-key: ${{ steps.cargo-sources.outputs.cache-primary-key }}
      - name: Save lint target cache
        if: steps.writer.outputs.sweep == 'true'
        uses: actions/cache/save@v4
        with:
          path: target
          key: ${{ steps.lint-target.outputs.cache-primary-key }}

  # The crates whose wasm-only paths nothing else compiles.
  #
  # Every other leg builds them for the host, where everything under
  # `cfg(target_arch = "wasm32")` is compiled out — so the browser build rotted
  # through three unrelated breakages before anyone pointed a compiler at it
  # (#408). `waterui-media` reads local photos through the waterkit file
  # system there. The web runner that
  # used to lead this list is Hydrolysis', and its own repository lints it for
  # wasm32 (#480).
  #
  # It lints rather than merely compiles, so `cfg(target_arch = "wasm32")` code
  # is held to the same bar as every other target (#413).
  #
  # This target-specific pass runs nightly alongside the other platform
  # shapes (#458). The fast gate retains default-feature host clippy; the
  # nightly still checks the actual wasm-only code.
  wasm:
    name: wasm32
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Cargo caps lints for registry dependencies, so this holds the workspace
      # crates — and only them — to the same "no new warnings" bar as the host
      # lint pass. It reaches further than the trailing `-- -D warnings` below,
      # which only covers the packages named with `-p`.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache: "false"
      # Reads the shared `cargo-sources` archive written by the `lint`
      # job in this file; read-only lanes never save.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # Build scripts and proc macros still compile for the host even when
      # every library target is wasm, and this graph reaches the ones that need
      # native headers.
      - name: Install native dependencies
        uses: ./.github/actions/setup-linux-deps
      # cherenkov-gpu's browser test and cherenkov-cpu's `--all-targets`
      # compile `include_bytes!` of the generated fonts. This job only
      # lints; nothing here reads the corpus or the perf scenes.
      - name: Generate Cherenkov scene assets
        uses: ./.github/actions/generate-scene-assets
        with:
          mode: fonts
      # `waterkit-dialog` is a registry crate now (its browser backend is
      # linted for wasm32 in water-rs/waterkit's own CI), so cargo caps its
      # lints; only the workspace crate is named here. Hydrolysis's `web`
      # feature is its browser runner — it used to be linted for wasm32 in the
      # hydrolysis repository's own CI and moved in with the tree (#1428).
      - name: Lint the wasm32-only paths
        run: |
          cargo clippy --locked --profile ci-check --target wasm32-unknown-unknown \
            -p waterui-media \
            -- -D warnings
          cargo clippy --locked --profile ci-check --target wasm32-unknown-unknown \
            -p hydrolysis --features web \
            -- -D warnings
          # The bare build is a separate gate: every feature off selects a
          # third of the backend's `cfg(feature)` surface that `web` never
          # compiles — call sites a feature gates out rot silently otherwise.
          cargo clippy --locked --profile ci-check --target wasm32-unknown-unknown \
            -p hydrolysis --no-default-features \
            -- -D warnings
      # The wasm32 legs the cherenkov repository's `wasm` job ran
      # (#1449). filtrate's `webgl` feature is a deliberate
      # `compile_error` off wasm32, so the all-features pass is the only
      # way the WebGL executor gets linted anywhere. cherenkov-gpu's
      # browser test target compiles the WebGPU surface code nothing on
      # the host can see, cherenkov-cpu is the whole CPU backend's wasm
      # shape, and cherenkov's own pass lints the engine crate's wasm
      # test targets.
      - name: Clippy (Cherenkov wasm32 legs)
        run: |
          cargo clippy --locked --profile ci-check --target wasm32-unknown-unknown \
            -p filtrate --all-features \
            -- -D warnings
          cargo clippy --locked --profile ci-check --target wasm32-unknown-unknown \
            -p cherenkov-gpu --lib --test browser \
            -- -D warnings
          cargo clippy --locked --profile ci-check --target wasm32-unknown-unknown \
            -p cherenkov-cpu --all-targets \
            -- -D warnings
          cargo clippy --locked --profile ci-check --target wasm32-unknown-unknown \
            -p cherenkov --all-targets \
            -- -D warnings

  # The workspace test run, per platform, also carrying the doctests that
  # share its build. It is the single longest leg in CI and everything else
  # overlaps it. The all-features pass is `all-features` below on Linux and
  # `macos-all-features` on macOS.
  test:
    name: ${{ matrix.os }}
    if: inputs.full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # Report every platform in one run. Cancelling the other hides its
      # results, so a cross-platform break costs one round trip per platform.
      fail-fast: false
      matrix:
        # Windows is kept in its own workflow because it needs platform-
        # specific exclusions and compile-only CEF coverage; `nightly.yml`
        # calls it beside this one. This job runs only when `full` is set, so
        # both platforms are always in the matrix.
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v4
      # The nightly test profiles restore only Cargo sources. Their multi-GB
      # target archives previously occupied the cache budget while every dev
      # push cold-compiled clippy. The frequent lint gate now owns that budget;
      # these daily runs keep every test without evicting its check artifacts.
      # `artifact_symbols` tests build a wasm rlib fixture: the web
      # backend's metadata is read from a wasm32 artifact, so every leg
      # that runs waterui-cli's suite needs the target installed.
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache: "false"
      # Reads the shared `cargo-sources` archive — the `lint` job
      # writes it on Linux, apple.yml's rust job on macOS; read-only
      # lanes never save.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # GPU snapshot tests run in this job, so this leg needs the Vulkan ICD
      # loader (mesa-vulkan-drivers/libvulkan1) on top of the base package
      # list — that's what lets llvmpipe/lavapipe stand in for a real GPU on
      # a headless Linux runner.
      - name: Install native dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-deps
        with:
          gpu: "true"
      - uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest@0.9.145
          path: ~/.cargo/bin/cargo-nextest*
      # nextest runs the hydrolysis and styled test targets: they resolve
      # the test font families through system font discovery and read the
      # generated live-photo fixture — the repository stores none of it.
      # Runs on both OSes: the macOS leg needs the same fonts installed.
      - name: Generate Hydrolysis test assets
        uses: ./.github/actions/generate-test-assets
      # Cherenkov's test targets both embed (`include_bytes!`) and read
      # the generated scene fonts, and the corpus tests read scenes/corpus
      # at runtime; the tree is generated, not committed.
      - name: Generate Cherenkov scene assets
        uses: ./.github/actions/generate-scene-assets
        with:
          mode: full
      # The stow pilot (#1145): the release binary installs and wires
      # RUSTC_WRAPPER plus the cc/CMAKE launchers through the job
      # environment, so the workspace's dependency closure resolves from
      # the signed edge cache — preheated for these targets in
      # water-rs/stow#90 — instead of a cold compile every night. An
      # unreachable edge falls back to plain cargo rather than failing
      # the job.
      - uses: water-rs/stow@main
      # One full-workspace pass under default features. Every crate's own
      # optional features are the `all-features` job below (Linux) and
      # `macos-all-features` (macOS). The `trybuild_*` macro contract tests run
      # only here — each shells out to a fixture build that does not depend on
      # the outer feature set, so the all-features passes and coverage skip
      # them (see below).
      - run: cargo nextest run --locked --workspace --exclude '*-example' --exclude waterui-apple --exclude cocoa-ui --profile ci
      # nextest cannot run doctests, and this workspace has plenty of them.
      - run: cargo test --locked --doc --workspace --exclude '*-example' --exclude waterui-apple --exclude cocoa-ui
      # Hydrolysis's macOS WKWebView bridge (#1428). `webview-system` is the
      # one feature no Linux leg can carry — it compiles only where WKWebView
      # exists — and the suite is `harness = false` (WKWebView is
      # MainThreadOnly while libtest runs test bodies on worker threads), so
      # `cargo test` drives the binary on the real process main thread.
      - name: Test (hydrolysis WKWebView real engine)
        if: runner.os == 'macOS'
        run: cargo test --locked -p hydrolysis --features webview-system,winit --test real_engine_macos
      # The pilot's hit/miss evidence (#1145): the shim accumulates per-crate
      # counters in its stats db during the builds above, and `stow status`
      # prints them — it only shows them when the project config exists, so
      # `stow setup` writes the disposable copy first. Runs after a failure
      # too, so a red run still reports how much of the closure hit.
      - name: stow hit ratio
        if: always()
        run: |
          stow setup
          stow status
      - name: Upload Test Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots-${{ matrix.os }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Every crate's own optional features, run. This pass used to be
  # `cargo nextest run --locked --all-features` inside the `test` job, with neither
  # `-p` nor `--workspace`: the root manifest carries both `[workspace]` and
  # `[package]`, so cargo narrowed it to the root `waterui` crate, and a
  # backend crate's tests behind its own optional features — the
  # browsers' engine features — ran nowhere
  # (#276, the test-side twin of
  # #261). It is its own job for the same reason the clippy sweep is a
  # separate step: a second feature variant of the dependency graph is a
  # second codegen of most of the workspace, and it overlaps the workspace
  # pass here instead of queueing behind it.
  #
  # Same three exclusions as the clippy sweep in `lint`, for the same reason:
  # `--all-features` asks those crates for feature sets that are mutually
  # exclusive by construction. Each is run below in the shapes it actually
  # has, sharing this job's target dir.
  #
  # `skill_snippets` is a fifth, on every platform: its `compile-gate-tests`
  # feature registers the skill's `#[waterui::test]` transcriptions as test
  # targets that address elements which do not exist by design and must never
  # run, and its `dev` feature turns on `waterui/dynamic_linking`. The lint
  # job compiles that crate in the shape it is meant to be compiled in.
  all-features:
    name: ubuntu-latest (all features)
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Restore-only reader of the shared Linux `~/.cargo` tarball (see the
      # cache budget note in ci.yml).
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache: "false"
      # Reads the shared `cargo-sources` archive written by the `lint`
      # job in this file; read-only lanes never save.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # GPU snapshot tests run under these features too, so this leg needs
      # the Vulkan ICD loader the way `test` does.
      - name: Install native dependencies
        uses: ./.github/actions/setup-linux-deps
        with:
          gpu: "true"
      - uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest@0.9.145
          path: ~/.cargo/bin/cargo-nextest*
      - name: Generate Hydrolysis test assets
        uses: ./.github/actions/generate-test-assets
      # nextest runs the Cherenkov CPU and GPU tests, which read
      # scenes/corpus. cherenkov-bench is excluded from this pass.
      - name: Generate Cherenkov scene assets
        uses: ./.github/actions/generate-scene-assets
        with:
          mode: full
      # The `trybuild_*` binaries each drive a cold fixture build of the
      # framework that is independent of the outer feature set; they already
      # ran once in the default-features `test` job on this OS, so this pass
      # skips them while keeping the rest of the two crates' tests.
      - name: Test (all features, workspace)
        run: |
          cargo nextest run --locked --workspace --all-features --profile ci \
            --exclude '*-example' \
            --exclude waterui-apple \
            --exclude cocoa-ui \
            --exclude waterui-core \
            --exclude waterui-ffi \
            --exclude waterui-browser-cef \
            --exclude skill_snippets \
            --exclude filtrate \
            --exclude cherenkov-bench \
            -E 'not binary(/^trybuild_/)'
      # `nightly` is `feature(never_type)`, a hard E0554 on stable.
      - name: Test (waterui-core, every stable feature)
        run: cargo nextest run --locked -p waterui-core --features std,serde --profile ci
      # Hydrolysis's doctests under the feature set its own CI ran (#1428);
      # nextest cannot enumerate doc tests, so this is a `cargo test` pass.
      - name: Test (hydrolysis doc tests)
        run: cargo test --locked --doc -p hydrolysis --features accessibility,inspector-signals,testing,web,winit
      # The `c-api` half with every optional C surface a runtime build can
      # carry; `android-jni` is the `Android FFI` job in ci.yml.
      - name: Test (waterui-ffi, C ABI surfaces)
        run: cargo nextest run --locked -p waterui-ffi --features map,chromium,webview-cef --profile ci
      # The CEF runtime shape; `compile-only` and `real-engine` exclude it.
      - name: Test (waterui-browser-cef, CEF runtime)
        run: cargo nextest run --locked -p waterui-browser-cef --features chromium,webview --profile ci
      - name: Upload Test Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots-ubuntu-latest-all-features
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The macOS all-features pass: every crate's own optional features, with the
  # same exclusions as the Linux `all-features` job (see there). It used to
  # share a serial `macos-suites` job with the doctests and the CEF legs; the
  # three have nothing in common but the platform, so each is its own job and
  # the doctests moved into `test`, whose build they share.
  macos-all-features:
    name: macos-latest (all features)
    if: inputs.full
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Restore-only (#1441): this job only runs in the nightly (`full`),
      # and nightly jobs save no cache entries of their own — the 10 GB
      # budget belongs to the gate. The macOS `~/.cargo` tarball stays
      # whatever the last gate-side write left.
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache: "false"
      # Reads the shared `cargo-sources` archive written by the Apple
      # gate's rust job (apple.yml); read-only lanes never save.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      - uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest@0.9.145
          path: ~/.cargo/bin/cargo-nextest*
      # The all-features pass runs the styled test targets too; they
      # resolve the installed test-font families by name — the repository
      # stores none of them.
      - name: Generate Hydrolysis test assets
        uses: ./.github/actions/generate-test-assets
      # `--all-features` runs the cherenkov-bench tests that read
      # scenes/corpus and scenes/perf, along with the CPU and GPU corpus tests.
      - name: Generate Cherenkov scene assets
        uses: ./.github/actions/generate-scene-assets
        with:
          mode: full
      # Of the excluded crates, `waterui-core`'s stable feature shape runs
      # below; the FFI C surfaces and the CEF runtime shape are
      # host-independent and the Linux job covers them, and the compile-only
      # `cef-header` shape is the `cef` job. The `trybuild_*` macro contract
      # tests ran already in `test` on this OS; see there. `filtrate` is
      # excluded for `webgl`'s off-wasm `compile_error!` — the wasm job
      # lints it where it is legal; `cherenkov-bench/skia-metal` is legal
      # here and stays in the pass.
      - name: Test (all features, workspace)
        run: |
          cargo nextest run --locked --workspace --all-features --profile ci \
            --exclude '*-example' \
            --exclude waterui-apple \
            --exclude cocoa-ui \
            --exclude waterui-core \
            --exclude waterui-ffi \
            --exclude waterui-browser-cef \
            --exclude skill_snippets \
            --exclude filtrate \
            -E 'not binary(/^trybuild_/)'
      - name: Test (waterui-core, every stable feature)
        run: cargo nextest run --locked -p waterui-core --features std,serde --profile ci
      - name: Upload Test Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots-macos-all-features
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The macOS-only CEF legs. The web view bridge has broken three times in
  # ways no Rust-side test could see, so these drive a real Chromium. CEF is a
  # prebuilt distribution `cef-dll-sys` downloads while building the crate.
  # macOS only, because CEF requires its browser process to live in an
  # application bundle; the test stages one and the target does not compile on
  # the other platforms.
  #
  # This was the tail of `macos-suites`, sharing the workspace build the
  # all-features pass had already paid for. Splitting it out pays a second
  # build of just the CEF subtree in exchange for taking it off the critical
  # path: the clippy pass and the real-engine test overlap the macOS test jobs
  # instead of queueing behind a 35-40 minute all-features compile.
  cef:
    name: cef (macos-latest)
    if: inputs.full
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Restore-only reader of the shared macOS `~/.cargo` tarball — nightly
      # legs save nothing of their own (#1441). clippy is
      # needed by the CEF real-engine target, which cannot be linted on Linux
      # because CEF requires a macOS application bundle.
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache: "false"
      # Reads the shared `cargo-sources` archive written by the Apple
      # gate's rust job (apple.yml); read-only lanes never save.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # The same step also lints the FFI crate's compile-only CEF C ABI, which
      # no other leg reaches: the Linux all-features passes exclude
      # `waterui-ffi` for its ABI `compile_error!` and lint the `cef-runtime`
      # shape instead, and `cef-header` is the mutually exclusive
      # `compile-only` one. macOS is also the only leg that sees its
      # `#[cfg(target_os = "macos")]` entry points at all, and the compile-only
      # feature set buys the lint without a CEF runtime download.
      - name: Lint the CEF targets
        run: |
          cargo clippy --locked --profile ci-check -p waterui-browser-cef --features real-engine --all-targets -- -D warnings
          cargo clippy --locked --profile ci-check -p waterui-ffi --features cef-header --all-targets -- -D warnings
      # The clippy in `macos-lint` compiles waterui-cli's `#[cfg(test)]`
      # modules, which `include_bytes!` the generated Roboto fixture — and
      # the real-engine run resolves the installed test fonts by family
      # name.
      - name: Generate Hydrolysis test assets
        uses: ./.github/actions/generate-test-assets
      # The macOS host lint legs for hydrolysis's `cfg(target_os =
      # "macos")` code — `webview-system`'s WKWebView bridge is the entry
      # point no other leg sees — and waterui-cli's Apple-side plumbing.
      # The fast gate's `macos` job below calls the same composite, so the
      # two legs can never drift on the commands.
      - name: Clippy (macOS host crates)
        uses: ./.github/actions/macos-lint
      # `cargo test` rather than nextest: CEF's browser process has to own the
      # main thread, libtest runs test bodies on spawned ones, so the target is
      # `harness = false` and nextest cannot enumerate it.
      - name: Run the CEF real-engine tests
        run: cargo test --locked -p waterui-browser-cef --features real-engine --test real_engine
      - name: Upload Test Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots-cef
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The 36 example crates, once per platform (#330). They used to be workspace
  # members in every pass above, so each example was compiled under every
  # clippy shape and again for the tests; here they get the passes they
  # actually need — lint, tests, doctests — and nothing else builds them.
  # Linux lints them; macOS never did (its leg ran no clippy on the
  # workspace), and that stays as it was.
  examples:
    name: examples (${{ matrix.os }})
    if: inputs.full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Gated on `full` like `test` above, so both platforms always run.
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache: "false"
      # Reads the shared `cargo-sources` archive — the `lint` job
      # writes it on Linux, apple.yml's rust job on macOS; read-only
      # lanes never save.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # Examples carry GPU snapshot tests too, so the Linux leg needs the same
      # Vulkan ICD loader the `test` job installs.
      - name: Install native dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-deps
        with:
          gpu: "true"
      - uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest@0.9.145
          path: ~/.cargo/bin/cargo-nextest*
      # Examples that dev-depend on waterui-testing run styled tests, which
      # resolve the installed test-font families through system font
      # discovery — the repository stores none of them.
      - name: Generate Hydrolysis test assets
        uses: ./.github/actions/generate-test-assets
      - name: Clippy (examples)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --profile ci-check -p '*-example' --all-targets -- -D warnings
      - run: cargo nextest run --locked -p '*-example' --profile ci
      - run: cargo test --locked --doc -p '*-example'
      - name: Upload Test Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots-examples-${{ matrix.os }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Hydrolysis's Android leg (#1428). `runner::android` is
  # `cfg(target_os = "android")`-gated, so no host leg ever compiles it;
  # linting the target instead of building it needs no NDK — every
  # dependency it reaches is pure Rust. Both feature extremes, as its own CI
  # ran them: the checked set proves `winit` stays inert on Android, and the
  # bare pass catches call sites a feature gates out.
  #
  # The nightly sweeps it under `full`; the fast gate also runs it when the
  # affected scope can reach the crate — `hydrolysis` or one of its reverse
  # dependencies in the package set — so the Android runner cannot regress
  # between nightlies (#1582).
  hydrolysis-android:
    name: aarch64-linux-android
    if: inputs.full || inputs.affected == 'workspace' || contains(inputs.affected, 'hydrolysis')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android
          components: clippy
          cache: "false"
      # Reads the shared `cargo-sources` archive owned by this OS's single
      # writer job (the lint lane above); read-only lanes never save. The
      # `cargo-home-*` rust-cache family this replaced had no writer at
      # all — every restore was a guaranteed miss on content identical to
      # this archive (#1441).
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # Build scripts still run on the host; cherenkov-gpu's optimizes its
      # precompiled SPIR-V with spirv-opt on every non-Apple native target.
      - name: Install native dependencies
        uses: ./.github/actions/setup-linux-deps
      - run: cargo clippy --locked --profile ci-check -p hydrolysis --target aarch64-linux-android --features accessibility,inspector-signals,testing,web,winit -- -D warnings
      - run: cargo clippy --locked --profile ci-check -p hydrolysis --target aarch64-linux-android --no-default-features -- -D warnings

  # The Android host library's own lint (`warningsAsErrors`): the Kotlin
  # half of the Android runner, which no cargo pass reaches (#2047), plus
  # the `preview` module's instrumentation the CLI drives for
  # `water preview --platform android` (#2216). Lint itself needs no Rust
  # build — it analyses the Kotlin sources against `compileSdk` — so it
  # runs beside the cross-target clippy above on the same scope. The job
  # also assembles the generated preview-host app: the CLI's
  # `render_preview_host` example renders the composite through the
  # library's own host resolution — the same preparation `water preview`
  # renders the managed host with — into
  # `backends/hydrolysis/android-preview-host` (never committed), then
  # `:app:assembleDebug` compiles it against the in-tree host checkout —
  # the only place the generated app's Kotlin↔Gradle wiring is checked.
  # The embedded-library composite gets the same treatment, rendered by
  # `render_embedded_library`, published to the runner's mavenLocal and
  # compiled against by a consumer app.
  # The CLI renders both, so a CLI-only change runs the job too, but
  # only the renders and the assembles: no CLI change reaches the host's
  # Kotlin, so the host lint and its Gradle setup run only when the scope
  # reaches Hydrolysis. The wrapper JARs are not committed (the CLI
  # materializes them), so each build installs the distribution its own
  # wrapper pins: the host's for the lint, the rendered app's — the Gradle
  # users run — for the assemble. The host's Robolectric unit tests run
  # only in the nightly (`full`): the push gate is format, compile and lint.
  hydrolysis-android-host:
    name: Hydrolysis Android host lint
    if: inputs.full || inputs.affected == 'workspace' || contains(inputs.affected, 'hydrolysis') || contains(inputs.affected, 'waterui-cli')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backends/hydrolysis/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle version pinned by the host wrapper
        id: host-gradle-version
        if: inputs.full || inputs.affected == 'workspace' || contains(inputs.affected, 'hydrolysis')
        run: |
          version="$(sed -n 's|^distributionUrl=.*/gradle-\(.*\)-bin\.zip$|\1|p' gradle/wrapper/gradle-wrapper.properties)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.full || inputs.affected == 'workspace' || contains(inputs.affected, 'hydrolysis')
        with:
          gradle-version: ${{ steps.host-gradle-version.outputs.version }}
      - name: Lint the host, gpu and preview modules
        if: inputs.full || inputs.affected == 'workspace' || contains(inputs.affected, 'hydrolysis')
        run: gradle :host:lintDebug :gpu:lintDebug :preview:lintDebug
      - name: Host unit tests
        if: inputs.full
        run: gradle :host:testDebugUnitTest
      - uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache: "false"
      # Reads the shared `cargo-sources` archive the lint lane owns on
      # Linux, like every other read-only lane — the render example
      # compiles waterui-cli once.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # The project is generated, never hand-written: `examples/form` is on
      # this checkout's `waterui_path`, so the library resolves the in-tree
      # host and the app's `minSdk` and JDK level from it. The render
      # reaches none of the CLI's optional features, so it builds without
      # the defaults.
      - name: Render the generated preview-host app
        working-directory: ${{ github.workspace }}
        run: cargo run --locked --profile ci-check -p waterui-cli --no-default-features --example render_preview_host -- examples/form backends/hydrolysis/android-preview-host
      - name: Gradle version pinned by the rendered wrapper
        id: app-gradle-version
        working-directory: backends/hydrolysis/android-preview-host
        run: |
          version="$(sed -n 's|^distributionUrl=.*/gradle-\(.*\)-bin\.zip$|\1|p' gradle/wrapper/gradle-wrapper.properties)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.app-gradle-version.outputs.version }}
      - name: Assemble the generated preview-host app
        working-directory: backends/hydrolysis/android-preview-host
        run: gradle :app:assembleDebug
      # The embedded library: `render_embedded_library` renders the Gradle
      # composite `water build` assembles for an embedded project (no Rust
      # build — the AAR carries no native library here) and reports its
      # coordinates, host version and Gradle tasks as JSON. The tasks
      # publish the host modules and assemble and publish the library to
      # this runner's mavenLocal; a consumer app then compiles the mount
      # call `water build` prints against the published coordinate, which
      # checks the composite, the substitution, the POM's `api`
      # dependencies and the generated `WaterUi` signatures together. Both
      # Gradle builds share the rendered wrapper's distribution set up above.
      - name: Render the generated embedded library
        id: embedded-library
        working-directory: ${{ github.workspace }}
        run: |
          library="$(cargo run --locked --profile ci-check -p waterui-cli --no-default-features --example render_embedded_library -- examples/form backends/hydrolysis/android-embedded-library)"
          {
            echo "host-version=$(jq -r .host_version <<<"$library")"
            echo "tasks=$(jq -r '.gradle_tasks | join(" ")' <<<"$library")"
            echo "coordinate=$(jq -r '"\(.group):\(.artifact):\(.version)"' <<<"$library")"
            echo "min-sdk=$(jq -r .min_sdk <<<"$library")"
          } >> "$GITHUB_OUTPUT"
      - name: Assemble and publish the generated embedded library
        working-directory: backends/hydrolysis/android-embedded-library
        env:
          WATERUI_HYDROLYSIS_HOST_VERSION: ${{ steps.embedded-library.outputs.host-version }}
        run: gradle ${{ steps.embedded-library.outputs.tasks }}
      - name: Compile an app consuming the embedded library
        working-directory: cli/tests/fixtures/android-embedded-consumer
        run: gradle :app:compileDebugKotlin -PwateruiLibrary=${{ steps.embedded-library.outputs.coordinate }} -PwateruiMinSdk=${{ steps.embedded-library.outputs.min-sdk }}

  # Hydrolysis's Windows leg, beside the Android one for the same reason:
  # `cfg(target_os = "windows")` code — the winit platform's cursor,
  # monitor and extended-style calls — is compiled nowhere else. The
  # nightly's `windows.yml` lints the workspace natively with default
  # features, and `winit` is not one of them, so cross-checking the target
  # on ubuntu is the only coverage this code gets — none until now, which
  # is how it accumulated 16 warnings (#1886). Linting needs no Windows
  # SDK: every dependency it reaches is a type check, not a link.
  #
  # The nightly sweeps it under `full`; the fast gate also runs it when the
  # affected scope can reach the crate, like the Android leg above.
  hydrolysis-windows:
    name: x86_64-pc-windows-msvc
    if: inputs.full || inputs.affected == 'workspace' || contains(inputs.affected, 'hydrolysis')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
          cache: "false"
      # Reads the shared `cargo-sources` archive owned by this OS's single
      # writer job; read-only lanes never save, so they cannot evict caches.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # Build scripts still run on the host; cherenkov-gpu's optimizes its
      # precompiled SPIR-V with spirv-opt on every non-Apple native target.
      - name: Install native dependencies
        uses: ./.github/actions/setup-linux-deps
      - run: cargo clippy --locked --profile ci-check -p hydrolysis --features winit --target x86_64-pc-windows-msvc -- -D warnings

  # The macOS host legs beside the cross-target ones above (#2143): the
  # Linux lint compiles `cfg(target_os = "macos")` code away, so a
  # macOS-only lint break in hydrolysis or waterui-cli used to surface
  # only in the nightly's `cef` job. Same commands through the shared
  # `macos-lint` composite; the nightly keeps them in `cef`, where they
  # share the CEF leg's runner — running them here too under `full`
  # would pay a second macOS slot for an identical pass.
  macos:
    name: aarch64-apple-darwin
    if: inputs.full == false && (inputs.affected == 'workspace' || contains(inputs.affected, 'hydrolysis') || contains(inputs.affected, 'waterui-cli'))
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache: "false"
      # Reads the shared `cargo-sources` archive written by the Apple
      # gate's rust job (apple.yml); read-only lanes never save.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # `--all-targets` compiles waterui-cli's `#[cfg(test)]` modules,
      # which `include_bytes!` the generated Roboto fixture — the
      # repository stores it nowhere.
      - name: Generate Hydrolysis test assets
        if: inputs['test-assets']
        uses: ./.github/actions/generate-test-assets
      - name: Clippy (macOS host crates)
        uses: ./.github/actions/macos-lint
        with:
          hydrolysis: ${{ inputs.affected == 'workspace' || contains(inputs.affected, 'hydrolysis') }}
          waterui-cli: ${{ inputs.affected == 'workspace' || contains(inputs.affected, 'waterui-cli') }}

  # ── Cherenkov engine legs (#1449) ──────────────────────────────────────
  # The checks water-rs/cherenkov's `ci.yml` ran on every pull request,
  # moved in with the tree. The CPU corpus comparison owns `bench-corpus`,
  # the Metal adapters own `bench-macos-metal`, and the NDK build owns
  # `bench-android`. All three are `full`-only: they are the engine's
  # correctness surface — oracle-compared renders, feature-matrix lint
  # and target builds — not per-change compile gates, matching where the
  # rest of the nightly's non-lint checks live (#379/#458).

  # The corpus comparison: every generated scene rendered on the CPU
  # adapters against the oracle's f64 reference, plus the lint of every
  # bench adapter feature in combination and alone. The scene tree is
  # generated, not committed, so the fonts and corpus this renders come
  # from the pinned sources every machine fetches.
  cherenkov-corpus:
    name: cherenkov corpus (CPU adapters)
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache: "false"
      # Restore-only reader of the shared Linux cargo-sources archive
      # (the lint job writes it); nightly lanes save nothing.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # skia-safe's prebuilt Linux binaries link the system freetype and
      # fontconfig, which the runner does not ship (fontconfig is in the
      # shared list, freetype is this job's extra). The cherenkov adapter
      # tests render on lavapipe, which needs the Vulkan loader and Mesa
      # drivers the `gpu` flag adds.
      - name: Install native dependencies
        uses: ./.github/actions/setup-linux-deps
        with:
          gpu: "true"
          extra-packages: libfreetype-dev
      - uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest@0.9.145
          path: ~/.cargo/bin/cargo-nextest*
      - uses: ./.github/actions/install-tool
        with:
          tool: cargo-hack@0.6.45
          path: ~/.cargo/bin/cargo-hack*
      - name: Generate Cherenkov scene assets
        uses: ./.github/actions/generate-scene-assets
        with:
          mode: full
      # The bench adapters are all feature-gated, so the default-feature
      # clippy in `lint` never compiles them — lint them here, on the
      # dependency graph this job already warms.
      - name: Clippy / all adapter features together
        run: |
          cargo clippy --locked --profile ci-check -p cherenkov-bench --all-targets \
            --features vello-classic,vello-hybrid,vello-cpu,skia,cherenkov,cherenkov-cpu -- -D warnings
      # `skia-metal` is Apple-only; every other adapter must lint alone.
      - name: Clippy / each adapter feature alone
        run: |
          cargo hack clippy --locked -p cherenkov-bench --each-feature \
            --exclude-features skia-metal --all-targets -- -D warnings
      - name: Bench adapter tests (cherenkov, cherenkov-cpu)
        run: cargo nextest run --locked -p cherenkov-bench --features cherenkov,cherenkov-cpu --no-tests=pass
      - run: cargo build --locked --release -p cherenkov-bench --features vello-cpu,skia
      # The oracle reference depends only on the scene; build it once for
      # both passes below (#218).
      - name: Render the corpus reference
        run: |
          ./target/release/cherenkov-bench reference \
            --corpus graphics/cherenkov/scenes/corpus --out-dir graphics/cherenkov/out/reference
      - name: Render the corpus on CPU adapters
        run: |
          set -euo pipefail
          for engine in vello-cpu skia-cpu; do
            ./target/release/cherenkov-bench render --engine "$engine" \
              --corpus graphics/cherenkov/scenes/corpus --out-dir "graphics/cherenkov/out/$engine" \
              --reference graphics/cherenkov/out/reference
          done
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob('graphics/cherenkov/out/*/render-*.json')
          # Every corpus scene produces a report (metrics or unsupported).
          scenes = {json.load(open(f))['scene'] for f in files}
          corpus = {p.split('/')[-2] for p in glob.glob('graphics/cherenkov/scenes/corpus/*/scene.json')}
          missing = corpus - scenes
          assert not missing, f'scenes without a report: {missing}'
          measured = [f for f in files if 'metrics' in json.load(open(f))]
          assert measured, 'no metrics JSON produced'
          for f in files:
              d = json.load(open(f))
              assert 'info' in d and d['info']['crate_version'], f'{f} lacks provenance'
          print(f'{len(files)} reports ({len(measured)} measured) across {len(scenes)} scenes')
          PY

  # The Metal side: Skia Metal, Vello classic and hybrid on a real Apple
  # GPU, the map-scene frame measure that hangs on no Linux adapter, and
  # the presentation corpus — srgb-hw, srgb-shader and linear-p3 — the
  # leg that keeps the presentation pass honest against the oracle.
  cherenkov-metal:
    name: cherenkov corpus (Metal adapters)
    if: inputs.full
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache: "false"
      # Restore-only reader of the shared macOS cargo-sources archive
      # (apple.yml's rust job writes it); nightly lanes save nothing.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      - name: Generate Cherenkov scene assets
        uses: ./.github/actions/generate-scene-assets
        with:
          mode: full
      - name: Clippy / Metal adapter features
        run: |
          cargo clippy --locked --profile ci-check -p cherenkov-bench --all-targets \
            --features skia-metal,vello-classic,vello-hybrid,cherenkov,cherenkov-cpu -- -D warnings
      - run: cargo build --locked --release -p cherenkov-bench --features skia-metal,vello-classic,vello-hybrid,cherenkov
      # Many timed frames of the map scene on a Metal device: the workload
      # that used to hang the render thread on Apple GPUs.
      - name: Measure the map scene on Metal
        run: |
          set -euo pipefail
          mkdir -p graphics/cherenkov/out/map-only
          cp -R graphics/cherenkov/scenes/perf/map graphics/cherenkov/out/map-only/map
          RUST_LOG=info,cherenkov_gpu=debug ./target/release/cherenkov-bench measure \
            --engine cherenkov --corpus graphics/cherenkov/out/map-only --frames 20 --warmup 5 --out graphics/cherenkov/out/measure-metal
      # #218: the oracle's f64 reference depends only on the scene, so the
      # six passes below share one parallel render instead of each
      # recomputing it; `render --reference` verifies the scene inputs
      # still match the cached file.
      - name: Render the corpus reference
        run: |
          ./target/release/cherenkov-bench reference \
            --corpus graphics/cherenkov/scenes/corpus --out-dir graphics/cherenkov/out/reference
      - name: Render the corpus on Metal adapters
        run: |
          set -euo pipefail
          for engine in skia-metal vello-classic vello-hybrid; do
            ./target/release/cherenkov-bench render --engine "$engine" \
              --corpus graphics/cherenkov/scenes/corpus --out-dir "graphics/cherenkov/out/$engine" \
              --reference graphics/cherenkov/out/reference
          done
          python3 - <<'PY'
          import glob, json
          files = glob.glob('graphics/cherenkov/out/*/render-*.json')
          # Every corpus scene produces a report (metrics or unsupported).
          scenes = {json.load(open(f))['scene'] for f in files}
          corpus = {p.split('/')[-2] for p in glob.glob('graphics/cherenkov/scenes/corpus/*/scene.json')}
          missing = corpus - scenes
          assert not missing, f'scenes without a report: {missing}'
          measured = [f for f in files if 'metrics' in json.load(open(f))]
          assert measured, 'no metrics JSON produced'
          for f in files:
              d = json.load(open(f))
              assert 'info' in d and d['info']['crate_version'], f'{f} lacks provenance'
          print(f'{len(files)} reports ({len(measured)} measured) across {len(scenes)} scenes')
          PY
      # #100: the corpus through the real presentation pass, one run per
      # output kind, compared to the oracle's matching presentation.
      - name: Render the presentation corpus
        run: |
          set -euo pipefail
          for kind in srgb-hw srgb-shader linear-p3; do
            ./target/release/cherenkov-bench render --engine cherenkov \
              --present "$kind" --corpus graphics/cherenkov/scenes/corpus \
              --out-dir "graphics/cherenkov/out/present-$kind" --reference graphics/cherenkov/out/reference
          done
          python3 - <<'PY'
          import glob, json
          files = glob.glob('graphics/cherenkov/out/present-*/render-*.json')
          scenes = {json.load(open(f))['scene'] for f in files}
          corpus = {p.split('/')[-2] for p in glob.glob('graphics/cherenkov/scenes/corpus/*/scene.json')}
          missing = corpus - scenes
          assert not missing, f'scenes without a report: {missing}'
          measured = [f for f in files if 'metrics' in json.load(open(f))]
          assert measured, 'no metrics JSON produced'
          for f in files:
              d = json.load(open(f))
              # An unsupported scene is presented nowhere; it names the missing feature instead.
              assert d.get('present') or d.get('unsupported'), f'{f} lacks the presentation record'
          print(f'{len(files)} presentation reports ({len(measured)} measured)')
          PY

  # The Android build: the whole bench binary and the Vulkan
  # external-frame device test cross-compiled for aarch64. The cherenkov
  # repository ran this on NDK r27d; that pin moves in with the tree
  # rather than riding the workspace default, which tracks the CLI's
  # toolchain check.
  cherenkov-android:
    name: cherenkov aarch64-linux-android
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android
          cache: "false"
      # Restore-only reader of the shared Linux cargo-sources archive.
      - name: Restore Cargo sources
        uses: ./.github/actions/cargo-sources
      # The bench binary and the Vulkan external-frame test are built, not
      # run. Corpus and perf scenes are read only when those programs
      # execute, so this job does not need them.
      - name: Install native dependencies
        uses: ./.github/actions/setup-linux-deps
      # cherenkov-gpu's build script optimizes its precompiled SPIR-V with
      # the NDK's bundled spirv-opt on Android targets, so the toolchain
      # setup probes for it; the NDK pin is the r27d cherenkov's own CI
      # built against, not the workspace default.
      - name: Set up the Android NDK toolchain
        uses: ./.github/actions/setup-android-ndk
        with:
          ndk-version: r27d
          spirv-tools: "true"
      - uses: ./.github/actions/install-tool
        with:
          tool: cargo-ndk@4.1.2
          path: ~/.cargo/bin/cargo-ndk*
      - name: Generate Cherenkov scene assets
        uses: ./.github/actions/generate-scene-assets
        with:
          mode: fonts
      - name: Build cherenkov-bench for aarch64-linux-android
        run: |
          cargo ndk --target aarch64-linux-android --platform 30 \
            build --release -p cherenkov-bench \
            --features vello-classic,vello-hybrid,skia,cherenkov,cherenkov-cpu
          ls -l target/aarch64-linux-android/release/cherenkov-bench
      # The Vulkan external-frame device test (#166) runs on a Pixel 9
      # Pro over adb; CI builds and archives the prebuilt binary.
      - name: Build the Vulkan external-frame test for aarch64-linux-android
        run: |
          cargo ndk --target aarch64-linux-android --platform 30 \
            build --release -p cherenkov-gpu --test vulkan_external_android
          ls target/aarch64-linux-android/release/deps/vulkan_external_android-*
      - uses: actions/upload-artifact@v4
        with:
          name: vulkan-external-android-tests
          path: target/aarch64-linux-android/release/deps/vulkan_external_android-*
          if-no-files-found: error
