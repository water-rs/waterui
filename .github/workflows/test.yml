name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: 0
  WATERUI_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/test-artifacts

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # The Windows leg rotted while compilation was broken and currently has 25
    # known-failing tests across independent defect classes — tracked in
    # https://github.com/water-rs/waterui/issues/152. It reports but does not
    # gate until that issue is closed; remove `experimental` there, not here.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      # Report every platform in one run. Cancelling the other two hides their
      # results, so a cross-platform break costs one round trip per platform.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: true
          - os: macos-latest
            experimental: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # GPU snapshot tests run in this job, so this leg needs the Vulkan ICD
      # loader (mesa-vulkan-drivers/libvulkan1) on top of the base package
      # list — that's what lets llvmpipe/lavapipe stand in for a real GPU on
      # a headless Linux runner.
      - name: Install native dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-deps
        with:
          gpu: "true"
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - name: Verify DirectX Shader Compiler
        if: runner.os == 'Windows'
        run: dxc --version
      - uses: mozilla/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      # Two crates cannot build in the Windows job, for reasons that are not
      # bugs:
      #
      # waterui-dylib is the dynamic-link anchor — a Rust `dylib` on purpose, so
      # the preview system can share one copy of the framework across
      # dynamically loaded preview libraries. That exports every Rust symbol,
      # 290k of them, and a PE export table stops at 65535. The preview system
      # targets macOS, the iOS Simulator and Android, not Windows.
      #
      # waterui-browser-cef links cef_sandbox from a CEF binary distribution the
      # runner does not stage. It is still compiled below, through the crate's
      # own `compile-only` feature, which its build script honours ahead of
      # `cef-runtime` for exactly this case — so Windows keeps compile coverage
      # of the backend without provisioning the SDK.
      - name: Select workspace members
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "WORKSPACE_EXCLUDES=--exclude waterui-dylib --exclude waterui-browser-cef" >> "$GITHUB_ENV"
          else
            echo "WORKSPACE_EXCLUDES=" >> "$GITHUB_ENV"
          fi
      # One full-workspace pass under default features. A workspace-wide
      # `--all-features` pass is structurally impossible here — hydrolysis
      # enforces "exactly one WebView engine" with a `compile_error!`
      # (backends/hydrolysis/src/lib.rs), so enabling `webview-system` and
      # `webview-cef` together can never build. The old second pass that
      # *looked* workspace-wide (`cargo nextest run --all-features`) never was:
      # the root manifest has both `[workspace]` and `[package]`, so without
      # `--workspace` cargo narrowed it to the root `waterui` crate — the only
      # crate whose features are all mutually compatible.
      - shell: bash
        run: cargo nextest run --workspace $WORKSPACE_EXCLUDES --profile ci
      # The root crate's feature-gated re-export surface, with every feature
      # on. Root-crate-only scope is intentional (see above); most of the
      # build is shared with the workspace pass, so this increment is cheap.
      - shell: bash
        run: cargo nextest run --all-features --profile ci
      # Compile the CEF backend on Windows without its binary distribution.
      - if: runner.os == 'Windows'
        shell: bash
        run: cargo check -p waterui-browser-cef --features compile-only
      # nextest cannot run doctests, and this workspace has plenty of them.
      - shell: bash
        run: cargo test --doc --workspace $WORKSPACE_EXCLUDES
      - name: Upload Test Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots-${{ matrix.os }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
