name: Version boundary

# Release pull requests (`release-plz-*`) publish bumped versions to crates.io,
# so a release PR carrying breaking changes requires the `release` label to
# record that a human intended that version boundary. Regular feature and fix
# pull requests into `main` do not bump crate versions or publish immediately,
# so they pass without the label.

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` are not in the default trigger set; they must be
    # listed so that applying the `release` label re-runs this check.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  breaking-gate:
    name: Breaking changes need the release label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: startsWith(github.head_ref, 'release-plz-')
        with:
          fetch-depth: 0

      - name: Scan pull-request commits for breaking markers
        if: startsWith(github.head_ref, 'release-plz-')
        id: scan
        run: |
          set -euo pipefail
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          if git log --format='%s%n%b' "$range" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:'; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
            git log --format='::warning::%h %s' "$range" | grep -E '!:' || true
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Block the merge without the release label
        if: startsWith(github.head_ref, 'release-plz-') && steps.scan.outputs.breaking == 'true' && !contains(github.event.pull_request.labels.*.name, 'release')
        run: |
          echo "::error title=Version boundary::This release pull request carries breaking changes, and merging it publishes a new minor release. Add the 'release' label to record that this merge is the intended version boundary."
          exit 1
