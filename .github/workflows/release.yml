name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    env:
      GIT_AUTHOR_NAME: "github-actions[bot]"
      GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
      GIT_COMMITTER_NAME: "github-actions[bot]"
      GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
      WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    outputs:
      cli_tag: ${{ steps.cli_tag.outputs.cli_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Ensure local branch context
        shell: bash
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse HEAD)"
          CURRENT_BRANCH="$(git symbolic-ref -q --short HEAD || true)"
          if [[ -n "${CURRENT_BRANCH}" ]]; then
            echo "Using branch ${CURRENT_BRANCH} at ${HEAD_SHA}"
            exit 0
          fi

          TARGET_BRANCH="${WORKFLOW_HEAD_BRANCH:-main}"
          echo "Detached HEAD detected at ${HEAD_SHA}; creating local branch ${TARGET_BRANCH}."
          git checkout -q -B "${TARGET_BRANCH}" "${HEAD_SHA}"

      - name: Preflight release invariants
        shell: bash
        run: |
          set -euo pipefail

          MISSING_PATHS=()
          while IFS= read -r dep_path; do
            if [[ -z "${dep_path}" ]]; then
              continue
            fi
            if [[ ! -e "${dep_path}" ]]; then
              MISSING_PATHS+=("${dep_path}")
            fi
          done < <(sed -nE 's/.*path[[:space:]]*=[[:space:]]*"(\.\.[^"]*)".*/\1/p' Cargo.toml | sort -u)

          if [[ ${#MISSING_PATHS[@]} -gt 0 ]]; then
            echo "::error::Missing sibling path dependencies referenced by Cargo.toml: ${MISSING_PATHS[*]}"
            echo "::error::Failing fast because a fresh checkout is not self-contained."
            echo "::error::Check out the sibling repositories or replace these path dependencies with published versions."
            exit 1
          fi

          BROKEN_COMMITS=()
          while IFS= read -r sha; do
            if ! git cat-file -e "${sha}:Cargo.toml" 2>/dev/null; then
              continue
            fi

            # Detect historical commits that reference `derive` in workspace members
            # without containing derive/Cargo.toml.
            if ! git show "${sha}:Cargo.toml" 2>/dev/null | awk '
              BEGIN { in_members = 0 }
              /^[[:space:]]*members[[:space:]]*=[[:space:]]*[[]/ { in_members = 1 }
              in_members { print }
              in_members && /]/ { exit }
            ' | grep -q '"derive"'; then
              continue
            fi

            if git cat-file -e "${sha}:derive/Cargo.toml" 2>/dev/null; then
              continue
            fi

            BROKEN_COMMITS+=("$sha")
          done < <(git rev-list --reverse HEAD)

          if [[ ${#BROKEN_COMMITS[@]} -gt 0 ]]; then
            echo "::error::Found historical commits with missing derive workspace member."
            echo "::error::release-plz will fail when traversing these commits. Commit list:"
            printf '%s\n' "${BROKEN_COMMITS[@]}"
            echo "::error::Fix repository history or configure a release baseline before running this workflow."
            exit 1
          fi

          echo "Release preflight checks passed."
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.45, release-plz@0.3.150
      - name: Run release-plz
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "-- Running release-plz release-pr --"
          release-plz release-pr \
            --git-token "${GITHUB_TOKEN}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --config release-plz.toml
          echo "-- Running release-plz release --"
          release-plz release \
            --git-token "${GITHUB_TOKEN}" \
            --config release-plz.toml

      - name: Detect released CLI tag
        id: cli_tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin main

          EVENT_SHA="${{ github.event.workflow_run.head_sha }}"
          MAIN_SHA="$(git rev-parse origin/main)"

          find_cli_tag() {
            local sha="$1"
            git tag --points-at "${sha}" | grep '^cli-v' | sort -V | tail -n 1 || true
          }

          echo "Event SHA: ${EVENT_SHA}"
          echo "Main  SHA: ${MAIN_SHA}"

          CLI_TAG="$(find_cli_tag "${EVENT_SHA}")"
          if [[ -n "${CLI_TAG}" ]]; then
            echo "Found cli tag on event SHA: ${CLI_TAG}"
          fi

          if [[ -z "${CLI_TAG}" && "${MAIN_SHA}" != "${EVENT_SHA}" ]]; then
            CLI_TAG="$(find_cli_tag "${MAIN_SHA}")"
            if [[ -n "${CLI_TAG}" ]]; then
              echo "Found cli tag on main SHA: ${CLI_TAG}"
            fi
          fi

          # If the workflow_run SHA (or main SHA) is a merge commit, release-plz might tag the
          # merged commit (typically the 2nd parent) instead of the merge commit itself.
          if [[ -z "${CLI_TAG}" ]]; then
            CANDIDATE_TAGS=()

            check_merge_parents() {
              local sha="$1"
              local parents
              parents="$(git show -s --format=%P "${sha}" || true)"
              if [[ -z "${parents}" ]]; then
                return 0
              fi

              # Only consider non-first parents to avoid re-triggering on previous main commits.
              local parent_count
              parent_count="$(wc -w <<<"${parents}" | tr -d ' ')"
              if [[ "${parent_count}" -lt 2 ]]; then
                return 0
              fi

              local non_first
              non_first="${parents#* }"
              echo "SHA ${sha} is a merge commit; checking non-first parent(s): ${non_first}"

              local p tag
              for p in ${non_first}; do
                tag="$(find_cli_tag "${p}")"
                if [[ -n "${tag}" ]]; then
                  echo "Found cli tag on merge parent ${p}: ${tag}"
                  CANDIDATE_TAGS+=("${tag}")
                fi
              done
            }

            check_merge_parents "${EVENT_SHA}"
            if [[ "${MAIN_SHA}" != "${EVENT_SHA}" ]]; then
              check_merge_parents "${MAIN_SHA}"
            fi

            if [[ ${#CANDIDATE_TAGS[@]} -gt 0 ]]; then
              CLI_TAG="$(printf '%s\n' "${CANDIDATE_TAGS[@]}" | sort -V | tail -n 1)"
              echo "Selected cli tag from merge parent(s): ${CLI_TAG}"
            fi
          fi

          echo "cli_tag=${CLI_TAG}" >> "$GITHUB_OUTPUT"
          if [[ -n "${CLI_TAG}" ]]; then
            echo "Detected CLI tag: ${CLI_TAG}"
          else
            echo "No cli-v* tag found on ${EVENT_SHA} (or origin/main ${MAIN_SHA})."
          fi

  build-cli:
    name: Build waterui-cli binaries
    needs: release-plz
    if: needs.release-plz.result == 'success' && needs.release-plz.outputs.cli_tag != ''
    uses: ./.github/workflows/build-cli.yml
    with:
      tag: ${{ needs.release-plz.outputs.cli_tag }}
    secrets:
      HOMEBREW_PAT: ${{ secrets.HOMEBREW_PAT }}
