name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release unpublished packages
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    outputs:
      cli_tag: ${{ steps.cli_tag.outputs.cli_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # `cargo publish` verifies each package by building it with its default
      # features, so the native libraries the workspace links have to be here
      # as they are in the test workflow: without them the Linux-only
      # `cros-libva` build script, reached through `waterkit-codec`, fails the
      # `waterui-image` verify build on the missing `libva-dev`.
      - uses: ./.github/actions/setup-linux-deps
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Detect CLI release tag
        id: cli_tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          CLI_TAG="$(git tag --points-at HEAD | grep '^waterui-cli-v' | sort -V | tail -n 1 || true)"

          echo "cli_tag=${CLI_TAG}" >> "$GITHUB_OUTPUT"
          if [[ -n "${CLI_TAG}" ]]; then
            echo "Detected CLI tag: ${CLI_TAG}"
          else
            echo "No waterui-cli-v* tag found on HEAD."
          fi

  release-pr:
    name: Prepare the next release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    concurrency:
      group: release-plz-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # The same native libraries as above: computing the next versions also
      # builds the workspace's metadata against every crate's dependencies.
      - uses: ./.github/actions/setup-linux-deps
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-cli:
    name: Build waterui-cli binaries
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.cli_tag != ''
    uses: ./.github/workflows/build-cli.yml
    with:
      tag: ${{ needs.release.outputs.cli_tag }}
    secrets:
      HOMEBREW_PAT: ${{ secrets.HOMEBREW_PAT }}
