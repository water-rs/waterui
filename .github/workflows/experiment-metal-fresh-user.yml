name: experiment metal fresh user

# The nightly `CLI fresh user / macOS` leg through its first build, with the
# CLI under test from this branch.
on:
  push:
    branches: [fix/fresh-user-macos-metal]

permissions:
  contents: read

jobs:
  fresh-user:
    name: CLI fresh user / macOS (doctor + build)
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: ""
      E2E_USER: watere2e
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (CLI build host)
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Install the CLI under test
        shell: bash
        run: cargo install --locked --path cli

      - name: Provision fresh user + rustup bootstrap (macOS)
        shell: bash
        run: |
          set -euo pipefail
          pass="$(openssl rand -base64 24)Zx9!"
          echo "::add-mask::$pass"
          sudo dscl . -create "/Users/$E2E_USER"
          sudo dscl . -create "/Users/$E2E_USER" UserShell /bin/bash
          sudo dscl . -create "/Users/$E2E_USER" RealName "CLI E2E"
          sudo dscl . -create "/Users/$E2E_USER" UniqueID 601
          sudo dscl . -create "/Users/$E2E_USER" PrimaryGroupID 20
          sudo dscl . -create "/Users/$E2E_USER" NFSHomeDirectory "/Users/$E2E_USER"
          sudo dscl . -passwd "/Users/$E2E_USER" "$pass"
          sudo dscl . -append /Groups/admin GroupMembership "$E2E_USER"
          sudo createhomedir -c -u "$E2E_USER"
          sudo chmod -R a+rX "$GITHUB_WORKSPACE"
          p="$GITHUB_WORKSPACE"; while [ "$p" != "/" ]; do sudo chmod o+x "$p"; p="$(dirname "$p")"; done
          sudo chown -R "$E2E_USER":admin "$(brew --prefix)" "$(brew --repository)"
          sudo -u "$E2E_USER" -H bash -lc 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --no-modify-path'
          sudo install -o "$E2E_USER" -g admin -m 0755 "$CARGO_HOME/bin/water" "/Users/$E2E_USER/.cargo/bin/water"

      - name: Doctor, scaffold and build as the fresh user
        shell: bash
        run: |
          set -euo pipefail
          sudo -u "$E2E_USER" -H env WATERUI_SRC="$GITHUB_WORKSPACE" bash -s <<'SCRIPT'
          set -uo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$HOME"
          fail() { echo "::error::$*"; exit 1; }
          export WATERUI_DISABLE_SCCACHE=1
          unset RUSTC_WRAPPER CARGO_BUILD_RUSTC_WRAPPER
          echo "--- xcrun metal before doctor"
          xcrun metal --version && fail "the fresh user already resolves the Metal Toolchain: the probe exercises nothing"
          water doctor 2>&1 | tee doctor-before.log
          grep -q '\[fixable\]' doctor-before.log || fail "doctor found nothing fixable"
          water doctor --fix --yes 2>&1 | tee doctor-fix.log
          if grep -q 'Failed to install' doctor-fix.log; then
            fail "doctor --fix reported failed installs"
          fi
          xcrun metal --version >/dev/null || fail "Metal Toolchain still missing after doctor --fix --yes"
          water doctor 2>&1 | tee doctor-after.log
          git config --global --add safe.directory '*'
          water create e2eapp --waterui-path "$WATERUI_SRC" 2>&1 || fail "water create failed"
          (cd e2eapp && water build --platform macos --backend apple --yes 2>&1) || fail "water build failed"
          SCRIPT
