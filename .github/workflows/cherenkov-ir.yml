name: Cherenkov CPU instructions

# The Callgrind instruction-count gate `graphics/cherenkov/AGENTS.md`
# requires for CPU-side engine changes, in two legs that run in parallel:
# the GPU engine's lower/encode on Lavapipe, and the CPU backend's frame at
# one worker per rayon pool. It runs on every pull request that
# touches the engine, and by dispatch for any pair of revisions. The
# baseline is the merge base of `base` and `head`. A pull request is
# measured as merged into dev, against the dev commit it merges into, so a
# branch that predates a dev fix the gate host needs is still measurable:
#   gh workflow run cherenkov-ir.yml -f head=refs/pull/<number>/merge
# It reports the result and is not a required check.
on:
  workflow_dispatch:
    inputs:
      head:
        description: Candidate revision (SHA, branch, or refs/pull/<number>/merge)
        required: true
        type: string
      base:
        description: Baseline revision; the gate measures against its merge base with head
        required: false
        default: origin/dev
        type: string
  pull_request:
    branches: [dev]
    paths:
      - graphics/cherenkov/**
      - .github/workflows/cherenkov-ir.yml

permissions:
  contents: read

jobs:
  # The kernels job's trigger: a pull request touching the CPU backend.
  # paths-filter cannot see what a workflow edit reaches, so this file
  # always counts as a change.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cpu: ${{ steps.filter.outputs.cpu }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpu:
              - 'graphics/cherenkov/cpu/**'
              - '.github/workflows/cherenkov-ir.yml'

  instructions:
    name: instructions (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        leg: [gpu, cpu]
    # A newer push to the same pull request supersedes the running measurement.
    concurrency:
      group: cherenkov-ir-${{ matrix.leg }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: ./.github/actions/cargo-sources
      - uses: ./.github/actions/setup-linux-deps
        with:
          gpu: ${{ matrix.leg == 'gpu' }}
          extra-packages: valgrind
      # Every measurement script's unit suite: the gate's cover both legs,
      # and the layer's test needs the Vulkan headers only the GPU leg
      # installs.
      - name: Test the measurement scripts and the gate's Vulkan layer
        if: matrix.leg == 'gpu'
        run: python3 -m unittest discover -s graphics/cherenkov/bench/scripts -p 'test_*.py'
      - uses: ./.github/actions/generate-scene-assets
        with:
          mode: full
      - name: Build, profile and compare
        timeout-minutes: 45
        env:
          # A pull request's merge commit is measured against its first
          # parent, the dev commit it merges into.
          IR_BASE: ${{ inputs.base || format('{0}^1', github.sha) }}
          IR_HEAD: ${{ inputs.head || github.sha }}
        run: >-
          python3 graphics/cherenkov/bench/scripts/ir_gate.py ab --leg ${{ matrix.leg }}
          --base "$IR_BASE" --head "$IR_HEAD"
          --work "$RUNNER_TEMP/cherenkov-ir" --out ir-results
      - name: Summarize
        if: always() && hashFiles('ir-results/comparison.md') != ''
        run: cat ir-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve provenance and every collected profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cherenkov-ir-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ir-results/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

  # The span kernels' Callgrind gate: each case's instruction count on
  # the merge commit against the dev commit it merges into (the merge
  # commit's first parent), at most +1% Ir per case. A case new at head
  # has no baseline and is reported, not failed. The wall-clock benches
  # are compiled here but never run — a shared runner cannot time them.
  kernels:
    name: kernels
    needs: changes
    if: >-
      always() && (github.event_name != 'pull_request'
      || needs.changes.outputs.cpu == 'true')
    runs-on: ubuntu-24.04
    # A newer push to the same pull request supersedes the running measurement.
    concurrency:
      group: cherenkov-ir-kernels-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: ./.github/actions/cargo-sources
      - uses: ./.github/actions/setup-linux-deps
        with:
          extra-packages: valgrind
      # Every bench target builds; kernels_wall is compiled, never run.
      - name: Compile the crate and the benches under the kernels' feature
        run: cargo clippy -p cherenkov-cpu --all-targets --features testing -- -D warnings
      # gungraun-runner must match the gungraun library exactly; the
      # lockfile records it.
      - name: The lockfile's gungraun version
        id: runner
        run: >-
          echo "version=$(cargo metadata --format-version 1 --locked
          | jq -r '.packages[] | select(.name == "gungraun") | .version')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@${{ steps.runner.outputs.version }}
      # A pull request's merge commit is measured against its first
      # parent, the dev commit it merges into; a dispatch resolves its
      # inputs' merge base. Revisions the checkout does not hold are
      # fetched from origin, as ir_gate.py does.
      - name: Resolve the measurement pair
        id: pair
        env:
          IR_BASE: ${{ inputs.base || format('{0}^1', github.sha) }}
          IR_HEAD: ${{ inputs.head || github.sha }}
        run: |
          fetch_rev() {
            if ! git rev-parse --verify --quiet --end-of-options "$1^{commit}" >/dev/null; then
              git fetch --no-tags origin "$1" >&2
              git rev-parse --verify 'FETCH_HEAD^{commit}'
            else
              git rev-parse --verify --end-of-options "$1^{commit}"
            fi
          }
          head=$(fetch_rev "$IR_HEAD")
          base=$(git merge-base "$(fetch_rev "$IR_BASE")" "$head")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Measure the merge base
        id: baseline
        run: |
          git checkout "${{ steps.pair.outputs.base }}"
          if cargo metadata --format-version 1 --no-deps \
            | jq -e '[.packages[] | select(.name == "cherenkov-cpu") \
                | .targets[] | select(.name == "kernels_ir" and (.kind | index("bench") != null))] \
                | length > 0' >/dev/null; then
            cargo bench -p cherenkov-cpu --features testing --bench kernels_ir -- --save-baseline=dev
            echo "saved=1" >> "$GITHUB_OUTPUT"
          else
            echo "cherenkov-cpu has no kernels_ir bench at the merge base; the gate runs without a baseline"
          fi
      - name: Measure the merge commit and gate
        run: |
          git checkout "${{ steps.pair.outputs.head }}"
          if [ "${{ steps.baseline.outputs.saved }}" = "1" ]; then
            cargo bench -p cherenkov-cpu --features testing --bench kernels_ir -- --baseline=dev --callgrind-limits='ir=1%'
          else
            cargo bench -p cherenkov-cpu --features testing --bench kernels_ir
          fi
      - name: Upload gungraun's output directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cherenkov-ir-kernels-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/gungraun/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
