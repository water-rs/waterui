name: Dev CI

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      base:
        description: >
          Optional revision the affected-scope diff is measured from —
          normally a push's `before` sha or a pull request's base. Empty
          scopes the whole workspace.
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Queue, never cancel in progress: the lint job of a push that misses the
# exact `lint-target` key is the cache writer, a cold workspace sweep of
# about twelve minutes, and merges landing faster than that cancelled every
# writer mid-sweep or mid-save, so no archive existed for the pull requests
# after a lockfile change (#2338). The group still keeps one queued run and
# drops the ones a newer push supersedes, so only the newest pending push is
# checked after the running one.
concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The diff scopes the compile: on a push it is `github.event.before`;
  # a dispatch without a base sweeps the workspace.
  scope:
    name: Affected scope
    uses: ./.github/workflows/affected.yml
    with:
      base: ${{ github.event_name == 'push' && github.event.before || github.event.inputs.base }}
  lint:
    needs: scope
    uses: ./.github/workflows/test.yml
    # The lint job's cache-retirement step needs actions:write on its own
    # families; nothing else in the called workflow gains a broader token.
    permissions:
      contents: read
      actions: write
    with:
      full: false
      affected: ${{ needs.scope.outputs.packages }}
      package-args: ${{ needs.scope.outputs.package-args }}
      comment-only: ${{ needs.scope.outputs.comment-only == 'true' }}
      test-assets: ${{ needs.scope.outputs.test-assets == 'true' }}
      scene-assets: ${{ needs.scope.outputs.scene-assets == 'true' }}
