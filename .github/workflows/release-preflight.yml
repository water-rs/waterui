name: Release preflight

# Guards the one failure this repository cannot undo: publishing a version
# whose number already exists on crates.io while its contents have moved on.
# crates.io versions are immutable, so a missed bump ships a crate that no
# longer matches what consumers compile against.
#
# release-plz already runs this check when it prepares a release PR. This job
# exists because that is exactly what lapsed once: with no working path from
# the release branch, release-pr never ran, and `filtrate-core 0.1.0` was
# rewritten in place while a different 0.1.0 stayed live on crates.io.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver:
    name: Local API vs published baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # cargo-semver-checks builds rustdoc for the real crate, so this job needs
      # the same native libraries a normal build does — without them it dies in
      # `khronos-egl`'s build script and reports nothing about the API at all.
      - uses: ./.github/actions/setup-linux-deps
      # cargo-semver-checks pins the baseline to an exact version, so it needs a
      # published version that still resolves. A crate can be in the index with
      # every version yanked — which is where `waterui` sits, 0.2.0 and 0.2.1
      # both being withdrawn for not compiling — and then the baseline cannot be
      # selected at all. Ask the index for an unyanked version rather than for
      # the crate's mere existence.
      - id: baseline
        run: |
          set -euo pipefail
          if curl -sfL https://index.crates.io/wa/te/waterui \
               | grep -q '"yanked":false'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No unyanked waterui on crates.io; this release establishes the baseline."
          fi
      - if: steps.baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
