// Registers a `waterUiMinSdk` task on every Android library module, printing
// its `android.defaultConfig.minSdk` as `WATERUI_MIN_SDK=<level>` so CI can
// hold the runtime's declared floor to the framework's
// `package.metadata.waterui.android-min-api-level` — obtained from Gradle's
// own evaluation, never by scraping the build script.
allprojects { project ->
    project.plugins.withId("com.android.library") {
        project.tasks.register("waterUiMinSdk") {
            it.doLast {
                println("WATERUI_MIN_SDK=" + project.extensions.getByName("android").defaultConfig.minSdk)
            }
        }
    }
}
