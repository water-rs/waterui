[package]
name = "nextest-fixtures"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0 OR MIT"
description = "Checks the nextest setup-script rules against the workspace package graph"

[dependencies]
camino = "1"
guppy = "0.17"
nextest-filtering = "0.22"
nextest-metadata = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"

# Standalone: the root workspace excludes .github, so this tool builds with
# its own lockfile and never joins the graph it measures.
[workspace]
