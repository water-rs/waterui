[package]
name = "waterui-core"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Core functionality for the WaterUI framework"
keywords = ["ui", "core", "framework", "waterui"]
categories = ["gui"]
# `build.rs` exports the enabled framework feature markers to direct dependents
# as `DEP_WATERUI_FEATURES`, so backends and style crates implement exactly the
# components the application enabled without depending on the `waterui` facade.
links = "waterui"

[dependencies]
suiteki.workspace = true
smallvec.workspace = true
nami.workspace = true
waterui-contract.workspace = true
waterui-easing.workspace = true
waterui-frame-rate = { workspace = true, features = ["nami"] }
waterui-macros.workspace = true
waterui-meta.workspace = true

[dependencies.anyhow]
version = "1.0"
default-features = false

[dependencies.thiserror]
version = "2.0.20"
default-features = false

[dependencies.num-traits]
version = "0.2"
default-features = false

[dependencies.serde]
version = "1.0"
optional = true
default-features = false
features = ["derive"]


[features]
default = ["std"]
std = ["anyhow/std", "thiserror/std", "nami/std"]
nightly = []
serde = ["dep:serde", "suiteki/serde", "waterui-easing/serde"]
# Build strategy: erase views before entering generic framework and backend
# dispatch so application edits do not re-monomorphize them. Off by default;
# the CLI selects it for debug development builds, never in release.
erased-dispatch = []
# Marker features mirroring `waterui`'s facade feature table so `core/build.rs`
# exports every enabled framework feature to direct dependents as
# `DEP_WATERUI_FEATURES` without requiring a dependency on the `waterui` facade.
form = []
link = []
avatar = []
cpu-time = []
list = []
table = []
navigation = []
menu = []
calendar = []
color-picker = []
date-picker = []
file-picker = []
multi-date-picker = []
picker = []
secure-field = []
slider = []
stepper = []
text-field = []
toggle = []
validation = []
locale-datetime = []
locale-list = []
locale-relative-time = []
gpu = []
cpu = []
effects = []
highlight = []
inspector = []
inspector-signals = []
dialog = []
snackbar = []
assets = []
image = []
video = []
remote = []
video-gpu = []
webview = []
map = []
widgets = []
ts = []
ts-ota = []
navigation-restoration = []
flow-markdown = []
markdown-math = []
haptics = []
capture = []
canvas = []
chart = []
barcode = []
particle = []
all = [
    "avatar",
    "cpu-time",
    "link",
    "list",
    "table",
    "navigation",
    "menu",
    "calendar",
    "color-picker",
    "date-picker",
    "file-picker",
    "multi-date-picker",
    "picker",
    "secure-field",
    "slider",
    "stepper",
    "text-field",
    "toggle",
    "validation",
    "capture",
    "canvas",
    "chart",
    "barcode",
    "particle",
    "haptics",
    "std",
    "gpu",
    "highlight",
    "locale-datetime",
    "locale-list",
    "locale-relative-time",
    "inspector",
    "inspector-signals",
    "assets",
    "image",
    "webview",
    "map",
    "flow-markdown",
    "video-gpu",
    "navigation-restoration",
    "snackbar",
    "dialog",
    "remote",
]

[lints]
workspace = true
