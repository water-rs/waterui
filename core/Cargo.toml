[package]
name = "waterui-core"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Core functionality for the WaterUI framework"
keywords = ["ui", "core", "framework", "waterui"]
categories = ["gui"]

[dependencies]
suiteki.workspace = true
smallvec.workspace = true
nami.workspace = true
waterui-contract.workspace = true
waterui-easing.workspace = true
waterui-macros.workspace = true
waterui-meta.workspace = true

[dependencies.anyhow]
version = "1.0"
default-features = false

[dependencies.thiserror]
version = "2.0.20"
default-features = false

[dependencies.num-traits]
version = "0.2"
default-features = false

[dependencies.serde]
version = "1.0"
optional = true
default-features = false
features = ["derive"]


[features]
default = ["std"]
std = ["anyhow/std", "thiserror/std", "nami/std"]
nightly = []
serde = ["dep:serde", "suiteki/serde"]
# Build strategy: erase views before entering generic framework and backend
# dispatch so application edits do not re-monomorphize them. Off by default;
# the CLI selects it for debug development builds, never in release.
erased-dispatch = []

[lints]
workspace = true
