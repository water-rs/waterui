[package]
name = "waterui-backend-core"
version = "0.1.0"
edition.workspace = true
authors = ["Lexo Liu"]
license.workspace = true
rust-version.workspace = true
readme = "../../README.md"
repository = "https://github.com/water-rs/waterui"
description = "Core backend infrastructure shared by WaterUI backends"
keywords = ["ui", "backend", "waterui", "gui", "framework"]
categories = ["gui"]

[dependencies]
waterui = { version = "0.2.1", path = "../..", default-features = false }
waterui-core.workspace = true
waterui-controls.workspace = true
waterui-form.workspace = true
waterui-graphics.workspace = true
waterui-layout.workspace = true
waterui-text.workspace = true
nami.workspace = true
tracing.workspace = true
kurbo.workspace = true
peniko.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[lints]
workspace = true
