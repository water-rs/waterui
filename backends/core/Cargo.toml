[package]
name = "waterui-backend-core"
version = "0.5.2"
edition.workspace = true
authors = ["Lexo Liu"]
license.workspace = true
rust-version.workspace = true
readme = "../../README.md"
repository = "https://github.com/water-rs/waterui"
description = "Core backend infrastructure shared by WaterUI backends"
keywords = ["ui", "backend", "waterui", "gui", "framework"]
categories = ["gui"]

[features]
default = ["gestures"]
# Gesture recognition state machines; pulls the `waterui` facade where the
# gesture event types are defined.
gestures = ["dep:waterui"]
# Anchored-overlay window-space placement shared by every backend; pulls the
# `waterui` facade where `AnchorPlacement` and the overlay metadata are defined.
overlay = ["dep:waterui"]
# The `WATERUI_LOG` / `RUST_LOG` filter every backend's subscriber shares;
# pulls `tracing-subscriber`.
log = ["dep:tracing-subscriber"]

[dependencies]
waterui = { version = "0.5.2", path = "../..", default-features = false, optional = true }
waterui-core.workspace = true
waterui-layout.workspace = true
nami.workspace = true
num-traits = { version = "0.2", default-features = false }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter"], optional = true }
kurbo.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[lints]
workspace = true
