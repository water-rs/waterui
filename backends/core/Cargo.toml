[package]
name = "waterui-backend-core"
version = "0.5.2"
edition.workspace = true
authors = ["Lexo Liu"]
license.workspace = true
rust-version.workspace = true
readme = "../../README.md"
repository = "https://github.com/water-rs/waterui"
description = "Core backend infrastructure shared by WaterUI backends"
keywords = ["ui", "backend", "waterui", "gui", "framework"]
categories = ["gui"]

[features]
default = ["gestures", "runtime"]
# Gesture recognition state machines.
gestures = []
# Application, window, termination, task executor, and resource runtime
# primitives shared by the facade and every backend.
runtime = [
    "dep:suiteki",
    "dep:waterui-locale",
    "dep:waterui-resources",
    "dep:executor-core",
    "dep:native-executor",
    "dep:thiserror",
    "dep:waterui-macros",
]
# Anchored-overlay window-space placement shared by every backend.
overlay = []
# The `WATERUI_LOG` / `RUST_LOG` filter every backend's subscriber shares;
# pulls `tracing-subscriber`.
log = ["dep:tracing-subscriber"]
# Build strategy propagated from `waterui/erased-dispatch`.
erased-dispatch = ["waterui-core/erased-dispatch", "waterui-layout/erased-dispatch"]
# Optional component contract gates propagated from `waterui-internal` (or
# enabled directly when checking `waterui-backend-core` standalone).
capture = ["dep:waterui-capture", "waterui-core/capture"]
cpu-time = ["runtime", "dep:cpu-time", "waterui-core/cpu-time"]
image = ["runtime", "dep:waterui-media", "waterui-core/image"]
inspector = ["runtime", "dep:waterui-inspector-runtime", "waterui-core/inspector"]
inspector-signals = ["inspector", "waterui-inspector-runtime/signals", "waterui-core/inspector-signals"]
form = ["dep:waterui-form", "waterui-core/form"]
calendar = ["form", "waterui-form/calendar", "waterui-core/calendar"]
color-picker = ["form", "waterui-form/color-picker", "waterui-core/color-picker"]
date-picker = ["form", "waterui-form/date-picker", "waterui-core/date-picker"]
file-picker = ["form", "waterui-form/file-picker", "waterui-core/file-picker"]
multi-date-picker = ["calendar", "waterui-form/multi-date-picker", "waterui-core/multi-date-picker"]
picker = ["form", "waterui-form/picker", "waterui-core/picker"]
secure-field = ["form", "waterui-form/secure-field", "waterui-core/secure-field"]
validation = ["form", "text-field", "waterui-form/validation", "waterui-core/validation"]
navigation = ["dep:waterui-navigation", "waterui-core/navigation"]
video = ["dep:waterui-video", "waterui-core/video"]
webview = ["dep:waterui-webview", "waterui-core/webview"]
map = ["dep:waterui-map", "waterui-core/map"]
avatar = ["waterui-controls/avatar", "waterui-core/avatar"]
highlight = ["waterui-text/highlight", "waterui-core/highlight"]
link = ["waterui-controls/link", "waterui-core/link"]
list = ["waterui-controls/list", "waterui-core/list"]
table = ["list", "waterui-controls/table", "waterui-core/table"]
menu = ["waterui-controls/menu", "waterui-core/menu"]
slider = ["waterui-controls/slider", "waterui-core/slider"]
stepper = ["waterui-controls/stepper", "waterui-core/stepper"]
text-field = ["menu", "waterui-controls/text-field", "waterui-core/text-field"]
toggle = ["waterui-controls/toggle", "waterui-core/toggle"]
dialog = ["waterui-controls/dialog", "waterui-core/dialog"]
snackbar = ["waterui-controls/snackbar", "waterui-core/snackbar"]
canvas = ["waterui-core/canvas"]
effects = ["waterui-graphics/effects", "waterui-core/effects"]
gpu = ["effects", "waterui-graphics/gpu", "waterui-core/gpu"]
cpu = ["effects", "waterui-graphics/cpu", "waterui-core/cpu"]

[dependencies]
waterui-structural-transition.workspace = true
waterui-accessibility.workspace = true
waterui-interaction.workspace = true
waterui-core.workspace = true
waterui-layout.workspace = true
waterui-shape.workspace = true
waterui-text.workspace = true
waterui-graphics = { workspace = true, default-features = false }
waterui-controls.workspace = true
waterui-meta.workspace = true
waterui-capture = { workspace = true, optional = true }
waterui-form = { workspace = true, optional = true }
waterui-navigation = { workspace = true, optional = true }
waterui-video = { workspace = true, optional = true }
waterui-webview = { workspace = true, optional = true }
waterui-map = { workspace = true, optional = true }
waterui-media = { workspace = true, optional = true }
waterui-locale = { workspace = true, optional = true }
waterui-resources = { workspace = true, optional = true }
waterui-macros = { workspace = true, optional = true }
suiteki = { workspace = true, optional = true }
executor-core = { workspace = true, optional = true }
native-executor = { workspace = true, optional = true }
thiserror = { version = "2.0.21", default-features = false, optional = true }
nami.workspace = true
num-traits = { version = "0.2", default-features = false }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter"], optional = true }
kurbo.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
waterui-inspector-runtime = { workspace = true, optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
cpu-time = { workspace = true, optional = true }

[dev-dependencies]
waterui-capture.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

[lints]
workspace = true
