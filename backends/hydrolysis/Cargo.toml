[package]
name = "hydrolysis"
version = "0.3.1"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Self-drawn backend for WaterUI, rendering through Cherenkov on the GPU or the CPU"
keywords = ["ui", "graphics", "gpu", "waterui", "cherenkov"]
categories = ["gui", "graphics"]

[dependencies]
hydrolysis-style.workspace = true
waterui-core.workspace = true
waterui-frame-rate.workspace = true
waterui-interaction.workspace = true
waterui-structural-transition.workspace = true
thiserror.workspace = true
tracing.workspace = true
nami.workspace = true
waterui-shape.workspace = true
waterui-layout.workspace = true
waterui-controls.workspace = true
waterui-form = { workspace = true, optional = true }
waterkit-clipboard = { workspace = true, optional = true }
waterui-locale.workspace = true
# `std` for `Url::from_file_path`, the OS file-drop path.
waterui-url = { workspace = true, features = ["std"] }
# The Android WebView bridge's per-call result token. Only the
# `webview-system` protocol uses it; the test build repeats it as a
# dev-dependency.
getrandom = { workspace = true, optional = true }
# The theme contract's drawing vocabulary (`Recorder`, `Paint`,
# `MaterialRegistry`) and the chrome terms the mount installs per member
# (`MaterialScope`/`MaterialCapture`/`Live`, water-rs/waterui#1788). Style
# packages record through it, never through a render engine.
cherenkov-record.workspace = true
kurbo.workspace = true
peniko = { version = "0.6", optional = true }
# `imageops::resize` fits a decoded image to the engine's image limits
# before registration (water-rs/waterui#1806): the decode-quality resample
# belongs to the ingest path, not the engine. Pixel ops only — no codecs.
image = { version = "0.25", default-features = false }
# The HWUI target reads a registered font's bounds and variation axes
# (`head`, `fvar`, `avar`) without the shaping engine skrifa carries.
read-fonts = { version = "0.45.1", default-features = false, features = ["std"], optional = true }
lru = { workspace = true, optional = true }
executor-core.workspace = true
rustc-hash.workspace = true
unicode-segmentation = { version = "1.13", optional = true }
async-task = "4.7"
native-executor.workspace = true
keyboard-types.workspace = true
# `serde` lets the Android host push the merged accesskit tree to its
# accessibility provider as JSON (src/runner/android/accessibility.rs).
accesskit = { version = "0.25", optional = true, features = ["serde"] }
# No facade features forced here: `build.rs` reads `DEP_WATERUI_FEATURES` so
# `dialog`, `effects`, `gpu`, `canvas`, and other facade features stay under
# the application's control.
waterui = { workspace = true }
waterui-graphics = { workspace = true, features = ["effects", "text", "input"] }
# `engine` (selected by `gpu` and `cpu`) for the `parley` font context the
# Cherenkov painters build and install into the environment; the faces come
# from the resource loader and the system source `parley/system` provides, so
# `system-fonts` is not needed. HWUI draws text through the platform's
# `StaticLayout` and links none of it.
waterui-text.workspace = true

# The Cherenkov engine and its two render backends. Every painter is a
# feature on every target: `gpu` selects `cherenkov-gpu` and `wgpu`, `cpu`
# selects `cherenkov-cpu`, and a build with both renders on the GPU when the
# host has a usable hardware adapter and on the CPU otherwise. A `cpu`-only
# build links no `wgpu`.
cherenkov = { workspace = true, optional = true }
cherenkov-gpu = { workspace = true, optional = true }
cherenkov-cpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
# `complex-scripts` ships the ICU4X segmentation dictionaries (CJ plus the
# Southeast-Asian scripts) inside the one parley build: this runner owns the
# `LayoutContext`, and without them its word segmenter logs `No segmentation
# model for complex script` per CJK run on every layout pass.
parley = { workspace = true, features = ["system", "complex-scripts"], optional = true }
# Glyph outline bounds for the measured-frame-must-cover-ink contract (#237):
# parley's advance metrics stop at the pen advance, so the measure path reads
# the real outline extents with this crate's own skrifa over the raw font
# bytes; no typed value crosses to parley's font stack.
skrifa = { version = "0.48", optional = true }
# `Emoji`/`Emoji_Presentation` sets for the emoji-cluster ranges shaping must
# route through the `emoji` generic family first.
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
# CLDR likely-subtags (`LocaleExpander`): the script an Android platform
# face's bare language tag is written in — see
# `text/parley_engine/android_fonts::fallback_keys`.
icu_locale = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
# Blocks on the wgpu adapter and device requests of the GPU painter.
pollster = { workspace = true, optional = true }

# Hosted content (Apple, Android and the web, the `hydrolysis_hosted` targets)
# follows the occlusion rects through a watcher set, as does the web
# platform's surface; no other target compiles either.
# The GPU vector map as the realization of `Map` (the `map-gpu` feature).
waterui-map-gpu = { workspace = true, optional = true }

# Desktop browser engines for standard `WebView`.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
waterui-browser-cef = { workspace = true, optional = true }

[target.'cfg(any(target_vendor = "apple", target_os = "android", target_arch = "wasm32"))'.dependencies]
waterui-watcher-set = { workspace = true, optional = true }

# The winit runner and its companion crates: desktop only. Android's
# Activity belongs to the Kotlin host, and winit's `android-activity` can
# only build once an application picks an activity backend — nothing in
# this library may — and on iOS the `cocoa-ui` UIKit host owns the
# application, so the dependency edge does not exist for either target at
# all. The `winit` feature still exists there and means nothing.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
winit = { version = "0.30", optional = true }
ui-events-winit = { workspace = true, optional = true }
accesskit_winit = { version = "0.34.1", optional = true }
# Decodes the CLI-staged window icon (always written as 8-bit RGBA PNG) —
# only the winit runner reads one.
png = { version = "0.18", optional = true }
waterui-assets = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
# Software presentation buffer for desktop windows rendered through
# `cherenkov-cpu` (`SoftwareWindowSurface` and `WinitRasterSurface`).
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"], optional = true }
raw-window-handle = { version = "0.6", default-features = false, optional = true }

# The iOS host, under the GPU painter it presents through: `cocoa-ui` owns
# `UIApplicationMain`, the scene delegate, the input view, the frame clock
# and the main queue; Hydrolysis implements the window around them.
# `cocoa-ui` re-exports the objc2 UIKit stack it was built on, so none of
# those crates is named here. `accesskit_ios` adapts the accessibility tree
# onto the input view and is the iOS leg of the `accessibility` feature.
[target.'cfg(target_os = "ios")'.dependencies]
cocoa-ui = { path = "../apple/cocoa-ui", version = "0.1.0", default-features = false, features = ["tracing"], optional = true }
# The WaterUI menu to native menu projection, shared with the Apple backend: the
# iPadOS main menu and its `UIKeyCommand`s are built through it (the `menu`
# feature).
waterui-apple-menu = { workspace = true, optional = true }
accesskit_ios = { version = "0.2.2", default-features = false, optional = true }
# Routes a panic's message and location through `tracing`, so it reaches the
# unified log on a device whose stderr nothing reads.
tracing-panic = { workspace = true, optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Non-Android builds link `waterui-backend-core` only when a runtime painter
# (`gpu` or `cpu`) is enabled; Android links it unconditionally so plugin crates
# using `AndroidContent` / `AndroidView` can depend on `hydrolysis` with
# `default-features = false`.
waterui-backend-core = { workspace = true, default-features = false, optional = true }

# The GPU video player realizing `Video` off the web (the `video-gpu`
# feature); the web realizes it with the page's `<video>` element.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { workspace = true, optional = true }
waterui-inspector-protocol = { workspace = true, optional = true }
waterui-video-gpu = { workspace = true, optional = true }

[build-dependencies]
askama = { version = "0.16", default-features = false, features = ["derive", "std"], optional = true }
cfg_aliases = "0.2.2"

# Termination signals for the windowed desktop runner. No windowing system
# delivers SIGINT/SIGTERM/SIGHUP (or the Windows console close events) to winit,
# so the runner installs its own watcher on every desktop target it builds for:
# `signal-hook` on Unix — src/runner/termination.rs, gated on
# `any(hydrolysis_winit, test)`, so the pair is optional under the `winit`
# feature and repeated as dev-dependencies for the test build — and `ctrlc`
# for the Windows console control events.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
signal-hook = { version = "0.4", default-features = false, features = ["iterator"], optional = true }
libc = { version = "0.2", optional = true }

# The termination child-process suite compiles the module in test builds
# without the `winit` feature, so the optional pair above is repeated here
# unconditionally for tests.
[target.'cfg(all(unix, not(target_os = "android")))'.dev-dependencies]
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
ctrlc = { version = "3.5", features = ["termination"], optional = true }

# Explicit ProMotion opt-in on macOS: a CADisplayLink created from the winit
# window's NSView declares the 120Hz frame-rate demand (see
# platform/macos_display_link.rs). All of these are already in winit's own
# dependency graph.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
cookie = { version = "0.18", optional = true }
futures = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSAnimation",
    "NSAppearance",
    "NSApplication",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-foundation = { workspace = true, optional = true, features = [
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSHTTPCookie",
    "NSKeyValueObserving",
    "NSNotification",
    "NSObject",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSURLError",
    "NSURLRequest",
    "NSURLResponse",
] }
objc2-quartz-core = { version = "0.3", optional = true, features = [
    "CALayer",
    "CADisplayLink",
    "CAFrameRateRange",
    "CAMetalLayer",
    "CAShapeLayer",
    "objc2-core-graphics",
] }
objc2-web-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKBackForwardList",
    "WKContentWorld",
    "WKFrameInfo",
    "WKSecurityOrigin",
    "WKHTTPCookieStore",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKScriptMessage",
    "WKScriptMessageHandlerWithReply",
    "WKURLSchemeHandler",
    "WKURLSchemeTask",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }

# The native app menu-bar surface (`App::menu_bar`): waterkit-menu builds the
# real NSMenu on NSApp.mainMenu (macOS) and a Win32 HMENU on the window's HWND
# (Windows). See src/platform/native_menu_bar.rs.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
waterkit-menu = { workspace = true, optional = true }
# Each bar's `events()` stream is a `futures::Stream`; the event pump drains
# it with a noop waker once per event-loop pass.
futures = { workspace = true, optional = true }

# Window placement (water-rs/waterui#1302): X11 reads the pointer position and
# `_NET_WORKAREA` over the connection winit already holds — borrowed through
# the raw display handle, never a second connection. `x11-dl`'s `xlib_xcb`
# module turns the Xlib backend's `Display*` into its `xcb_connection_t`.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android", target_os = "emscripten", target_os = "redox"))))'.dependencies]
x11-dl = { version = "2.21", optional = true }
# `allow-unsafe-code` exposes `xcb_ffi`, which 0.14 gates behind it: the
# runner wraps the `xcb_connection_t` winit already owns.
x11rb = { version = "0.14", features = ["allow-unsafe-code"], optional = true }
# `ext-background-effect-v1` blur behind a Wayland window, bound on the
# `wl_display` winit already owns — borrowed through the raw display handle,
# never a second connection. `staging` carries the ext-* protocols, and
# wayland-client's `system` feature turns on wayland-backend's
# `client_system`, which `Backend::from_foreign_display` and
# `ObjectId::from_ptr` need — winit happens to enable it, but the borrow
# must not rely on that. Both crates track the versions winit 0.30 already
# pulls in.
wayland-client = { version = "0.31", features = ["system"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }

# The XDG desktop portal's `org.freedesktop.appearance color-scheme` feed for
# the winit runner (`org.freedesktop.portal.Settings` `ReadOne` plus the
# `SettingChanged` signal) — winit reports no theme on X11 or Wayland. See
# src/platform/linux_appearance.rs. The version tracks the one atspi and
# mpris-server already pull in; `async-io` is the socket driver, and the
# client polls its futures on the runner's local executor so the event loop
# never blocks on D-Bus. `futures-core` names the `Stream` trait the signal
# subscription is consumed through.
[target.'cfg(target_os = "linux")'.dependencies]
waterui-browser-wpe = { workspace = true, optional = true }
zbus = { version = "5.19", default-features = false, features = ["async-io"], optional = true }
futures-core = { version = "0.3", optional = true }

# `GetCursorPos` / `GetMonitorInfoW` for `MonitorSelector::Pointer` and
# `visible_frame`, `WS_EX_NOACTIVATE` for `Activation::Never`,
# `DwmGetWindowAttribute(DWMWA_CLOAKED)` for hidden-window occlusion,
# `DwmSetWindowAttribute(DWMWA_SYSTEMBACKDROP_TYPE)` and
# `DwmExtendFrameIntoClientArea` for the behind-window material's acrylic
# backdrop, `RtlGetVersion` for the build floor that gates it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `waterkit-menu::MenuBar::attach` takes the `windows` crate's `HWND` — a
# different type from `windows-sys`'s alias.
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_DirectComposition",
] }

# The native menu bar's test creates real windows for its bars to attach to.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# The Android host's JNI boundary (see src/runner/android/): `ndk` with
# `api-level-33` binds the NDK symbols of the framework's API floor, `libc`
# carries the eventfd the main-Looper executor wakes on, and `android_logger`
# + `tracing-log` route `tracing` into logcat.
[target.'cfg(target_os = "android")'.dependencies]
waterui-backend-core = { workspace = true, default-features = false }
jni.workspace = true
ndk = { version = "0.9.0", features = ["nativewindow", "api-level-33"] }
# The application `Context` for service crates that resolve it through
# `ndk_context::android_context` — waterkit-clipboard's Android backend
# panics without it; published once in `nativeCreateSession`.
ndk-context = { version = "0.1", optional = true }
libc = "0.2"
# A pure-HWUI build (`--no-default-features --features hwui`,
# water-rs/waterui#1811) selects the platform painter and links none of the
# Cherenkov engine dependencies above; with `gpu` it composes (the painter is
# HWUI, the GPU crates stand by for hosted GPU content).
android_logger = { version = "0.15", optional = true }
waterui-assets-core = { workspace = true, optional = true }
tracing-log = { version = "0.2", optional = true }
# The accessibility tree publish and the platform-view placement set cross JNI
# as JSON.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
# The published payload's `contentTypes` map serializes `ContentType`
# (camelCase names) — the provider maps each onto `HintConstants`.
waterui-controls = { workspace = true, features = ["serde"] }
# The system `WebView` bridge's one-shot completions (`run_javascript`,
# `call_async_javascript`, `get_cookies`) are `futures::channel::oneshot`.
futures = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm32 has no stderr: without a hook a panic reaches the page as a bare
# `RuntimeError: unreachable`, its message and location lost.
console_error_panic_hook = { version = "0.1", optional = true }
# The web runner fetches its fonts while the GPU device comes up; `join!` and
# `join_all` are the whole of what it needs from futures.
futures = { workspace = true, optional = true }
js-sys = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# The `video` feature's realization of the two video leaves.
waterui-video = { workspace = true, optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Response",
    "CompositionEvent",
    "CssStyleDeclaration",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "KeyboardEvent",
    "MediaQueryList",
    "Navigator",
    "Node",
    "PointerEvent",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
# The recording tests lower through the engine's `testing::Null` backend:
# its events report every registration and release, and the image-budget
# test sets the image limits it reports.
cherenkov = { workspace = true, features = ["testing"] }
# The crate's own test targets need the `accessibility` and `testing`
# feature APIs — the headless runtimes' `new_for_tests` constructors, the
# merged-tree queries and `testing::TestStyle` — and a dev-dependency on the
# package itself is what turns them on for test builds (water-rs/waterui#1673).
hydrolysis = { workspace = true, features = ["accessibility", "inspector", "testing", "all-controls"] }
# `runner::tests` exercises `SignalExt::debounce`, which lives behind `nami/timer`.
nami = { workspace = true, features = ["timer"] }
# The HWUI target's unit tests read font metrics on the host as well.
read-fonts = { version = "0.45.1", default-features = false, features = ["std"] }
# The `hwui::kotlin` tests verify the generated Kotlin wire constants from the Rust
# definitions.
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
# The tests' `MirrorTarget` implements `Queue`, whose `ChangeSet` the engine
# crate does not re-export.
cherenkov-record.workspace = true
waterui-navigation.workspace = true
# The #210 regression test drives a real `ReactiveImage`: its handle's `set`
# is the same call the decode pipeline makes when an image lands.
waterui-image.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The protocol tests compose the async-call script on the host too —
# repeats the optional `webview-system` edge above.
getrandom.workspace = true
toml.workspace = true
jiff.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
waterui = { workspace = true, features = ["canvas", "capture", "dialog", "effects", "flow-markdown", "gpu", "map", "snackbar", "video-gpu", "webview"] }
base64 = "0.23"
# The font-collection tests stage a resource root of their own — a real
# directory, since the loader reads one from the filesystem.
tempfile = "3.27"
# Tolerance assertions for computed geometry and animation values in tests.
approx = "0.5"
executor-core = { workspace = true, features = ["async-executor"] }
tiny_http = "0.12"
# The macOS real-engine suite's harness: it lists its scenarios the way
# nextest asks and runs each one on the process main thread.
libtest-mimic = "0.8.2"
# The macOS real-engine suite drives the shared mirrored-state case.
waterui-webview = { workspace = true, features = ["conformance"] }
# Two crates that only exist to let the segmentation test see what it asserts
# about: `icu_provider/logging` routes ICU4X data warnings through `log`
# instead of the `eprintln` shim debug builds get otherwise, and `tracing-log`
# bridges those records into the `tracing` subscriber the test captures. With
# `complex-scripts` on the parley dep, no warning may be emitted at all.
icu_provider = { version = "2.3", features = ["logging"] }
tracing-log = "0.2"
# Drives the text-measure and dispatch benches.
divan = "0.1"
# Counts the dispatch bench's instructions (`benches/dispatch/ir.rs`); its
# Callgrind runner does not compile for wasm32, and the version matches
# `cherenkov-cpu`'s so one `gungraun-runner` serves both.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gungraun = "=0.20.0"

# The text-measure bench rides the real layout path; `harness = false` hands
# the binary's `main` to divan.
[[bench]]
name = "text_measure"
harness = false
required-features = ["testing"]

# The dispatch workloads (`benches/dispatch/workloads.rs`): wall-clock time
# and allocations under divan here, instruction counts under gungraun in
# `dispatch_ir`.
[[bench]]
name = "dispatch"
path = "benches/dispatch/main.rs"
harness = false
required-features = ["testing"]

[[bench]]
name = "dispatch_ir"
path = "benches/dispatch/ir.rs"
harness = false
required-features = ["testing"]

# `WKWebView` is `MainThreadOnly` and libtest runs tests on worker threads, so
# the macOS real-engine suite owns its `main` and pumps the main run loop.
[[test]]
name = "real_engine_macos"
harness = false
required-features = ["webview-system", "winit"]

[features]
menu = ["hydrolysis-style/menu", "waterui/menu", "dep:waterui-apple-menu"]
calendar = ["hydrolysis-style/calendar", "waterui/calendar"]
color-picker = ["hydrolysis-style/color-picker", "waterui/color-picker", "dep:waterui-form"]
date-picker = ["calendar", "stepper", "menu", "hydrolysis-style/date-picker", "waterui/date-picker", "dep:waterui-form"]
file-picker = ["hydrolysis-style/file-picker", "waterui/file-picker"]
multi-date-picker = ["calendar", "hydrolysis-style/multi-date-picker", "waterui/multi-date-picker"]
picker = ["menu", "hydrolysis-style/picker", "waterui/picker", "dep:waterui-form"]
secure-field = ["menu", "hydrolysis-style/secure-field", "waterui/secure-field", "dep:waterui-form", "dep:unicode-segmentation"]
slider = ["hydrolysis-style/slider", "waterui/slider"]
stepper = ["hydrolysis-style/stepper", "waterui/stepper"]
text-field = ["menu", "hydrolysis-style/text-field", "waterui/text-field", "dep:unicode-segmentation"]
toggle = ["hydrolysis-style/toggle", "waterui/toggle"]
validation = ["text-field", "hydrolysis-style/validation", "waterui/validation"]
list = ["hydrolysis-style/list", "waterui/list"]
table = ["list", "hydrolysis-style/table", "waterui/table"]
navigation = ["text-field", "hydrolysis-style/navigation", "waterui/navigation"]
all-controls = ["menu", "calendar", "color-picker", "date-picker", "file-picker", "multi-date-picker", "picker", "secure-field", "slider", "stepper", "text-field", "toggle", "validation", "list", "table", "navigation"]
default = ["gpu", "all-controls"]
accessibility = ["dep:accesskit", "dep:accesskit_ios", "dep:serde_json"]
testing = []
# Per-frame CPU/GPU stage timing: wgpu timestamp queries around the
# layer-content and compositor submits plus the CPU stage split the window
# pump measures.
frame-profile = []
# The Cherenkov GPU painter and its GPU-content surface: the `cherenkov`
# engine crates, `wgpu`, the parley text engine, and the framework's GPU
# component vocabulary (`GpuView`, `ExternalFrame`, `waterui_graphics::gpu`).
# A pure HWUI build (`--no-default-features --features hwui`) links none of
# it, while `hwui` + `gpu` keeps the HWUI painter with the GPU crates present
# for hosted content (water-rs/waterui#1812).
gpu = [
    "dep:android_logger",
    "dep:cherenkov",
    "dep:cherenkov-gpu",
    "dep:lru",
    "dep:ndk-context",
    "dep:peniko",
    "dep:serde_json",
    "dep:tracing-log",
    "dep:tracing-subscriber",
    "dep:unicode-segmentation",
    "dep:wgpu",
    "dep:pollster",
    "dep:waterkit-clipboard",
    "dep:waterui-assets-core",
    "waterui-backend-core/gestures",
    "waterui-backend-core/overlay",
    "waterui-backend-core/log",
    "dep:waterui-watcher-set",
    "dep:cocoa-ui",
    "dep:tracing-panic",
    "waterui/gpu",
    "waterui-graphics/gpu",
    "dep:parley",
    "dep:skrifa",
    "dep:icu_properties",
    "dep:icu_locale",
    "waterui-text/engine",
]
# The Cherenkov CPU painter: `cherenkov-cpu`'s multi-core SIMD rasterizer and
# the same parley text stack, with no `wgpu` in the graph. Views that need a
# GPU device (`GpuView`, which the GPU video player renders through, and
# `ExternalFrameView`) panic at mount on it. Shader paints (`ShaderPaintView`
# and `FlowingGradient`), a theme's backdrop shaders and a filtered view's
# filter run on the CPU backend's lane executor. With `gpu` as well, both the offscreen runtime and
# the desktop `winit` runner render on the GPU when adapter selection finds a
# usable hardware adapter and fall back to the CPU otherwise (`winit` presents
# CPU frames through `softbuffer`).
cpu = [
    "dep:cherenkov",
    "dep:cherenkov-cpu",
    "dep:lru",
    "dep:ndk-context",
    "dep:peniko",
    "dep:tracing-subscriber",
    "dep:unicode-segmentation",
    "cherenkov-cpu/shaders",
    "dep:waterkit-clipboard",
    "dep:waterui-assets-core",
    "waterui-backend-core/gestures",
    "waterui-backend-core/overlay",
    "waterui-backend-core/log",
    "waterui/cpu",
    "waterui-graphics/cpu",
    "dep:parley",
    "dep:raw-window-handle",
    "dep:skrifa",
    "dep:softbuffer",
    "dep:icu_properties",
    "dep:icu_locale",
    "waterui-text/engine",
]
# Development inspector endpoint and frame/tree recorders, enabled by the CLI
# for development sessions (`water run` / `water preview`).
inspector = ["waterui/inspector", "dep:waterui-inspector-protocol", "dep:tracing-subscriber"]
inspector-signals = ["inspector", "waterui/inspector-signals"]
# The HWUI render target (Android only): the retained layer tree recorded
# into `RenderNode` display lists through one command buffer per frame, and
# text laid out and drawn by the platform's `StaticLayout`
# (water-rs/waterui#1811). On other targets the feature selects nothing; the
# subsystem still compiles for tests.
hwui = [
    "dep:askama",
    "dep:android_logger",
    "dep:lru",
    "dep:ndk-context",
    "dep:peniko",
    "dep:read-fonts",
    "dep:serde_json",
    "dep:tracing-log",
    "dep:tracing-subscriber",
    "dep:waterkit-clipboard",
    "waterui-backend-core/gestures",
    "waterui-backend-core/overlay",
    "waterui-backend-core/log",
]
# The GPU video player as the realization of `Video` and `VideoPlayer` off the
# web, with its Android decoder plane
# (`AndroidVideoSurfaceHost`). The CLI enables it for an application that
# selects `waterui/video-gpu`.
video-gpu = ["gpu", "dep:waterui-video-gpu", "waterui/video"]
# The GPU vector map as the realization of `Map`: this backend bridges no
# platform map. The CLI enables it for an application that links
# `waterui-map-gpu`.
map-gpu = ["gpu", "dep:waterui-map-gpu", "waterui/map"]
# The platform's own web engine: `WKWebView` on macOS, an `<iframe>` on the web,
# each hosted on a compositor plane, and `android.webkit.WebView` on Android,
# mounted as a platform-view instance. Mutually exclusive with `webview-cef` and
# `webview-wpe`.
webview-system = [
    "waterui/webview",
    "dep:block2",
    "dep:cookie",
    "dep:futures",
    "dep:getrandom",
    "dep:objc2-web-kit",
    "dep:serde_json",
    "web-sys?/HtmlIFrameElement",
    "web-sys?/MouseEvent",
    "web-sys?/PointerEventInit",
    "web-sys?/WheelEventInit",
]
# The bundled CEF engine as the realization of `WebView` on macOS, Linux, and
# Windows. Mutually exclusive with `webview-system` and `webview-wpe`.
webview-cef = [
    "gpu",
    "waterui/webview",
    "dep:waterui-browser-cef",
    "waterui-browser-cef?/webview",
]
# The bundled WPE WebKit engine as the realization of `WebView` on Linux.
# Mutually exclusive with `webview-system` and `webview-cef`.
webview-wpe = [
    "gpu",
    "waterui/webview",
    "dep:waterui-browser-wpe",
    "waterui-browser-wpe?/webview",
]
winit = [
    "accessibility",
    "dep:winit",
    "dep:ui-events-winit",
    "dep:accesskit_winit",
    "dep:ctrlc",
    "dep:png",
    "dep:waterui-assets",
    "dep:signal-hook",
    "dep:libc",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-quartz-core",
    "dep:futures",
    "menu",
    "dep:waterkit-menu",
    "dep:windows",
    "dep:x11-dl",
    "dep:x11rb",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:windows-sys",
    "dep:futures-core",
    "dep:zbus",
]
# The browser's `<video>` element as the web realization of `Video` and
# `VideoPlayer`. Only a wasm32 `web` build has it; elsewhere the feature
# selects nothing. The CLI enables it for an application that uses video.
video = [
    "dep:waterui-video",
    "waterui/video",
    "web-sys?/HtmlMediaElement",
    "web-sys?/HtmlTrackElement",
    "web-sys?/HtmlVideoElement",
    "web-sys?/MediaError",
    "web-sys?/MouseEvent",
    "web-sys?/PointerEventInit",
    "web-sys?/TextTrack",
    "web-sys?/TextTrackList",
    "web-sys?/TextTrackMode",
    "web-sys?/TimeRanges",
    "web-sys?/VideoPlaybackQuality",
    "web-sys?/WheelEventInit",
]
web = [
    "accessibility",
    "dep:console_error_panic_hook",
    "dep:futures",
    "dep:serde_json",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:waterui-watcher-set",
    "dep:web-sys",
]

