[package]
name = "hydrolysis"
version = "0.3.1"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "GPU-required self-drawn backend for WaterUI"
keywords = ["ui", "graphics", "gpu", "waterui", "cherenkov"]
categories = ["gui", "graphics"]

[dependencies]
waterui-core.workspace = true
thiserror.workspace = true
waterui-assets.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
nami.workspace = true
waterui-icon.workspace = true
waterui-shape.workspace = true
waterui-map.workspace = true
waterui-webview.workspace = true
# Hosted content follows the occlusion rects through a watcher set.
waterui-watcher-set.workspace = true
waterui-layout.workspace = true
waterui-controls.workspace = true
waterui-form.workspace = true
waterui-backend-core = { workspace = true, features = ["gestures", "overlay"] }
waterkit-clipboard.workspace = true
waterui-locale.workspace = true
# `std` for `Url::from_file_path`, the OS file-drop path.
waterui-url = { workspace = true, features = ["std"] }
# The Android WebView bridge's per-call result token. Only the
# `webview-system` protocol uses it; the test build repeats it as a
# dev-dependency.
getrandom = { workspace = true, optional = true }
# The theme contract's drawing vocabulary (`Recorder`, `Paint`,
# `MaterialRegistry`) and the chrome terms the mount installs per member
# (`MaterialScope`/`MaterialCapture`/`Live`, water-rs/waterui#1788). Style
# packages record through it, never through a render engine.
cherenkov-record.workspace = true
kurbo.workspace = true
peniko = "0.6"
# `imageops::resize` fits a decoded image to the engine's image limits
# before registration (water-rs/waterui#1806): the decode-quality resample
# belongs to the ingest path, not the engine. Pixel ops only — no codecs.
image = { version = "0.25", default-features = false }
# The HWUI target reads a registered font's bounds and variation axes
# (`head`, `fvar`, `avar`) without the shaping engine skrifa carries.
read-fonts = { version = "0.45.1", default-features = false, features = ["std"], optional = true }
lru.workspace = true
executor-core.workspace = true
rustc-hash.workspace = true
unicode-segmentation = "1.13"
async-task = "4.7"
native-executor.workspace = true
keyboard-types.workspace = true
# `serde` lets the Android host push the merged accesskit tree to its
# accessibility provider as JSON (src/runner/android/accessibility.rs).
accesskit = { version = "0.25", optional = true, features = ["serde"] }
waterui-inspector-protocol.workspace = true

# The winit runner and its companion crates: desktop only. Android's
# Activity belongs to the Kotlin host, and winit's `android-activity` can
# only build once an application picks an activity backend — nothing in
# this library may — so the dependency edge does not exist for the Android
# target at all. The `winit` feature still exists there and means nothing.
#
# The Cherenkov GPU stack lives here unconditionally: off-Android targets
# have exactly one painter, so the `gpu` feature selects it only on Android
# (where the entries below are optional) and is a no-op elsewhere.
[target.'cfg(not(target_os = "android"))'.dependencies]
winit = { version = "0.30", optional = true }
ui-events-winit = { workspace = true, optional = true }
accesskit_winit = { version = "0.34.1", optional = true }
# Decodes the CLI-staged window icon (always written as 8-bit RGBA PNG) —
# only the winit runner reads one.
png = { version = "0.18", optional = true }
cherenkov.workspace = true
cherenkov-gpu.workspace = true
wgpu.workspace = true
waterui = { workspace = true, features = ["dialog", "gpu", "inspector"] }
waterui-graphics = { workspace = true, features = ["gpu"] }
# `engine` for the `parley` font context this runner builds and installs into
# the environment; the faces come from the resource loader and the system
# source `parley/system` provides, so `system-fonts` is not needed.
waterui-text = { workspace = true, features = ["engine"] }
# `complex-scripts` ships the ICU4X segmentation dictionaries (CJ plus the
# Southeast-Asian scripts) inside the one parley build: this runner owns the
# `LayoutContext`, and without them its word segmenter logs `No segmentation
# model for complex script` per CJK run on every layout pass.
parley = { workspace = true, features = ["system", "complex-scripts"] }
# Glyph outline bounds for the measured-frame-must-cover-ink contract (#237):
# parley's advance metrics stop at the pen advance, so the measure path reads
# the real outline extents with this crate's own skrifa over the raw font
# bytes; no typed value crosses to parley's font stack.
skrifa = "0.48"
# `Emoji`/`Emoji_Presentation` sets for the emoji-cluster ranges shaping must
# route through the `emoji` generic family first.
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
# CLDR likely-subtags (`LocaleExpander`): the script an Android platform
# face's bare language tag is written in — see
# `text/parley_engine/android_fonts::fallback_keys`.
icu_locale = { version = "2.3", default-features = false, features = ["compiled_data"] }
pollster.workspace = true

[build-dependencies]
cfg_aliases = "0.2.2"

# Termination signals for the windowed desktop runner. No windowing system
# delivers SIGINT/SIGTERM/SIGHUP (or the Windows console close events) to winit,
# so the runner installs its own watcher on every desktop target it builds for:
# `signal-hook` on Unix — src/runner/termination.rs, gated on
# `any(hydrolysis_winit, test)`, so the pair is optional under the `winit`
# feature and repeated as dev-dependencies for the test build — and `ctrlc`
# for the Windows console control events.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
signal-hook = { version = "0.4", default-features = false, features = ["iterator"], optional = true }
libc = { version = "0.2", optional = true }

# The termination child-process suite compiles the module in test builds
# without the `winit` feature, so the optional pair above is repeated here
# unconditionally for tests.
[target.'cfg(all(unix, not(target_os = "android")))'.dev-dependencies]
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
ctrlc = { version = "3.5", features = ["termination"], optional = true }

# Explicit ProMotion opt-in on macOS: a CADisplayLink created from the winit
# window's NSView declares the 120Hz frame-rate demand (see
# platform/macos_display_link.rs). All of these are already in winit's own
# dependency graph.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
cookie = { version = "0.18", optional = true }
futures = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSAnimation",
    "NSAppearance",
    "NSApplication",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-foundation = { workspace = true, optional = true, features = [
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSHTTPCookie",
    "NSKeyValueObserving",
    "NSNotification",
    "NSObject",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSURLError",
    "NSURLRequest",
    "NSURLResponse",
] }
objc2-quartz-core = { version = "0.3", optional = true, features = [
    "CALayer",
    "CADisplayLink",
    "CAFrameRateRange",
    "CAMetalLayer",
    "CAShapeLayer",
    "objc2-core-graphics",
] }
objc2-web-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKBackForwardList",
    "WKContentWorld",
    "WKFrameInfo",
    "WKSecurityOrigin",
    "WKHTTPCookieStore",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKScriptMessage",
    "WKScriptMessageHandlerWithReply",
    "WKURLSchemeHandler",
    "WKURLSchemeTask",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }
serde_json = { workspace = true, optional = true }

# The native app menu-bar surface (`App::menu_bar`): waterkit-menu builds the
# real NSMenu on NSApp.mainMenu (macOS) and a Win32 HMENU on the window's HWND
# (Windows). See src/platform/native_menu_bar.rs.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
waterkit-menu = { workspace = true, optional = true }
# Each bar's `events()` stream is a `futures::Stream`; the event pump drains
# it with a noop waker once per event-loop pass.
futures = { workspace = true, optional = true }

# Window placement (water-rs/waterui#1302): X11 reads the pointer position and
# `_NET_WORKAREA` over the connection winit already holds — borrowed through
# the raw display handle, never a second connection. `x11-dl`'s `xlib_xcb`
# module turns the Xlib backend's `Display*` into its `xcb_connection_t`.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android", target_os = "emscripten", target_os = "redox"))))'.dependencies]
x11-dl = { version = "2.21", optional = true }
# `allow-unsafe-code` exposes `xcb_ffi`, which 0.14 gates behind it: the
# runner wraps the `xcb_connection_t` winit already owns.
x11rb = { version = "0.14", features = ["allow-unsafe-code"], optional = true }
# `ext-background-effect-v1` blur behind a Wayland window, bound on the
# `wl_display` winit already owns — borrowed through the raw display handle,
# never a second connection. `staging` carries the ext-* protocols, and
# wayland-client's `system` feature turns on wayland-backend's
# `client_system`, which `Backend::from_foreign_display` and
# `ObjectId::from_ptr` need — winit happens to enable it, but the borrow
# must not rely on that. Both crates track the versions winit 0.30 already
# pulls in.
wayland-client = { version = "0.31", features = ["system"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }

# The XDG desktop portal's `org.freedesktop.appearance color-scheme` feed for
# the winit runner (`org.freedesktop.portal.Settings` `ReadOne` plus the
# `SettingChanged` signal) — winit reports no theme on X11 or Wayland. See
# src/platform/linux_appearance.rs. The version tracks the one atspi and
# mpris-server already pull in; `async-io` is the socket driver, and the
# client polls its futures on the runner's local executor so the event loop
# never blocks on D-Bus. `futures-core` names the `Stream` trait the signal
# subscription is consumed through.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io"], optional = true }
futures-core = { version = "0.3", optional = true }

# `GetCursorPos` / `GetMonitorInfoW` for `MonitorSelector::Pointer` and
# `visible_frame`, `WS_EX_NOACTIVATE` for `Activation::Never`,
# `DwmGetWindowAttribute(DWMWA_CLOAKED)` for hidden-window occlusion,
# `DwmSetWindowAttribute(DWMWA_SYSTEMBACKDROP_TYPE)` and
# `DwmExtendFrameIntoClientArea` for the behind-window material's acrylic
# backdrop, `RtlGetVersion` for the build floor that gates it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `waterkit-menu::MenuBar::attach` takes the `windows` crate's `HWND` — a
# different type from `windows-sys`'s alias.
windows = { workspace = true, optional = true, features = ["Win32_Foundation"] }

# The native menu bar's test creates real windows for its bars to attach to.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# The Android host's JNI boundary (see src/runner/android/): `ndk` with
# `api-level-31` binds the NDK symbols of the framework's API floor, `libc`
# carries the eventfd the main-Looper executor wakes on, and `android_logger`
# + `tracing-log` route `tracing` into logcat.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk = { version = "0.9.0", features = ["nativewindow", "api-level-31"] }
# The application `Context` for service crates that resolve it through
# `ndk_context::android_context` — waterkit-clipboard's Android backend
# panics without it; published once in `nativeCreateSession`.
ndk-context = "0.1"
libc = "0.2"
# The Cherenkov GPU stack on Android is optional: a pure-HWUI build
# (`--no-default-features --features hwui`, water-rs/waterui#1811) selects
# the platform painter and never links a GPU engine, a wgpu device or the
# parley text stack — HWUI draws text through the platform's `StaticLayout`.
# The `gpu` feature turns every entry here on; with `hwui` it composes
# (the painter is HWUI, the GPU crates stand by for hosted GPU content).
cherenkov = { workspace = true, optional = true }
cherenkov-gpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
# `raw-window-handle` is only the GPU attachment's `AndroidDisplay` impl.
raw-window-handle = { version = "0.6", optional = true }
waterui = { workspace = true, features = ["dialog", "inspector", "effects"] }
# `effects`, never `gpu` by itself: the `Filtered`/`filtrate` recipe
# vocabulary resolves under every painter (the HWUI mount names its
# refusal); the GPU halves arrive with the `gpu` feature.
waterui-graphics = { workspace = true, features = ["effects"] }
waterui-text.workspace = true
parley = { workspace = true, features = ["system", "complex-scripts"], optional = true }
skrifa = { version = "0.48", optional = true }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_locale = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
pollster = { workspace = true, optional = true }
android_logger = "0.15"
tracing-log = "0.2"
# The accessibility tree publish and the platform-view placement set cross JNI
# as JSON.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The published payload's `contentTypes` map serializes `ContentType`
# (camelCase names) — the provider maps each onto `HintConstants`.
waterui-controls = { workspace = true, features = ["serde"] }
# The system `WebView` bridge's one-shot completions (`run_javascript`,
# `call_async_javascript`, `get_cookies`) are `futures::channel::oneshot`.
futures = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm32 has no stderr: without a hook a panic reaches the page as a bare
# `RuntimeError: unreachable`, its message and location lost.
console_error_panic_hook = { version = "0.1", optional = true }
# The web runner fetches its fonts while the GPU device comes up; `join!` and
# `join_all` are the whole of what it needs from futures.
futures = { workspace = true, optional = true }
js-sys = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# The `video` feature's realization of the two video leaves.
waterui-video = { workspace = true, optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Response",
    "CompositionEvent",
    "CssStyleDeclaration",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "KeyboardEvent",
    "MediaQueryList",
    "Navigator",
    "Node",
    "PointerEvent",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
# The recording tests lower through the engine's `testing::Null` backend:
# its events report every registration and release, and the image-budget
# test sets the image limits it reports.
cherenkov = { workspace = true, features = ["testing"] }
# The crate's own test targets need the `accessibility` and `testing`
# feature APIs — the headless runtimes' `new_for_tests` constructors, the
# merged-tree queries and `testing::TestStyle` — and a dev-dependency on the
# package itself is what turns them on for test builds (water-rs/waterui#1673).
hydrolysis = { workspace = true, features = ["accessibility", "testing"] }
# The renderer itself knows nothing about `Canvas`: it resolves to a
# `SceneView` before it reaches layout. The tests still author canvases, which
# is what keeps that resolution honest.
waterui-canvas.workspace = true
# The HWUI target's unit tests read font metrics on the host as well.
read-fonts = { version = "0.45.1", default-features = false, features = ["std"] }
# The `hwui::kotlin` test renders the Kotlin wire constants from the Rust
# definitions.
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
# The tests' `MirrorTarget` implements `Queue`, whose `ChangeSet` the engine
# crate does not re-export.
cherenkov-record.workspace = true
waterui-navigation.workspace = true
# The #210 regression test drives a real `ReactiveImage`: its handle's `set`
# is the same call the decode pipeline makes when an image lands.
waterui-image.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The protocol tests compose the async-call script on the host too —
# repeats the optional `webview-system` edge above.
getrandom.workspace = true
toml.workspace = true
jiff.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
waterui = { workspace = true, features = ["dialog", "flow-markdown", "gpu", "snackbar", "video-gpu"] }
base64 = "0.23"
# The font-collection tests stage a resource root of their own — a real
# directory, since the loader reads one from the filesystem.
tempfile = "3.27"
# Tolerance assertions for computed geometry and animation values in tests.
approx = "0.5"
executor-core = { workspace = true, features = ["async-executor"] }
tiny_http = "0.12"
# The macOS real-engine suite drives the shared mirrored-state case.
waterui-webview = { workspace = true, features = ["conformance"] }
# Two crates that only exist to let the segmentation test see what it asserts
# about: `icu_provider/logging` routes ICU4X data warnings through `log`
# instead of the `eprintln` shim debug builds get otherwise, and `tracing-log`
# bridges those records into the `tracing` subscriber the test captures. With
# `complex-scripts` on the parley dep, no warning may be emitted at all.
icu_provider = { version = "2.3", features = ["logging"] }
tracing-log = "0.2"
# Drives the text-measure bench (`benches/text_measure.rs`).
divan = "0.1"
# The text-measure bench rides the real layout path; `harness = false` hands
# the binary's `main` to divan.
[[bench]]
name = "text_measure"
harness = false
required-features = ["testing"]

# `WKWebView` is `MainThreadOnly` and libtest runs tests on worker threads, so
# the macOS real-engine suite owns its `main` and pumps the main run loop.
[[test]]
name = "real_engine_macos"
harness = false
required-features = ["webview-system", "winit"]

[features]
default = ["gpu"]
gles = ["gpu", "wgpu/gles", "cherenkov-gpu/gles", "waterui/gles", "waterui-graphics/gles"]
accessibility = ["dep:accesskit"]
testing = []
# Per-frame CPU/GPU stage timing: wgpu timestamp queries around the
# layer-content and compositor submits plus the CPU stage split the window
# pump measures. The `testing` adapter selection is what lets the profiler
# exercise a software adapter for bring-up on a host without a GPU.
frame-profile = ["testing"]
# The Cherenkov GPU painter and its GPU-content surface: the `cherenkov`
# engine crates, `wgpu`, the parley text engine, and the framework's GPU
# component vocabulary (`GpuView`, `ExternalFrame`, `waterui_graphics::gpu`).
# On Android the edges are optional and this feature selects them — a pure
# HWUI build (`--no-default-features --features hwui`) links none of it,
# while `hwui` + `gpu` keeps the HWUI painter with the GPU crates present
# for hosted content (water-rs/waterui#1812). Off Android the GPU stack is
# unconditional and the feature is a no-op.
gpu = [
    "dep:cherenkov",
    "dep:cherenkov-gpu",
    "dep:wgpu",
    "dep:parley",
    "dep:skrifa",
    "dep:icu_properties",
    "dep:icu_locale",
    "dep:pollster",
    "dep:raw-window-handle",
    "waterui/gpu",
    "waterui-graphics/gpu",
    "waterui-text/engine",
]
inspector-signals = ["waterui/inspector-signals"]
# The HWUI render target (Android only): the retained layer tree recorded
# into `RenderNode` display lists through one command buffer per frame, and
# text laid out and drawn by the platform's `StaticLayout`
# (water-rs/waterui#1811). On other targets the feature selects nothing; the
# subsystem still compiles for tests.
hwui = ["dep:read-fonts"]
# The platform's own web engine: `WKWebView` on macOS, an `<iframe>` on the web,
# each hosted on a compositor plane, and `android.webkit.WebView` on Android,
# mounted as a platform-view instance. Every other engine is a crate the
# application links and installs; this backend never names one.
webview-system = [
    "dep:block2",
    "dep:cookie",
    "dep:futures",
    "dep:getrandom",
    "dep:objc2-web-kit",
    "dep:serde_json",
    "web-sys?/HtmlIFrameElement",
    "web-sys?/MouseEvent",
    "web-sys?/PointerEventInit",
    "web-sys?/WheelEventInit",
]
winit = [
    "accessibility",
    "dep:winit",
    "dep:ui-events-winit",
    "dep:accesskit_winit",
    "dep:ctrlc",
    "dep:png",
    "dep:signal-hook",
    "dep:libc",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-quartz-core",
    "dep:futures",
    "dep:waterkit-menu",
    "dep:windows",
    "dep:x11-dl",
    "dep:x11rb",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:windows-sys",
    "dep:futures-core",
    "dep:zbus",
]
# The browser's `<video>` element as the web realization of `Video` and
# `VideoPlayer`. Only a wasm32 `web` build has it; elsewhere the feature
# selects nothing. The CLI enables it for an application that uses video.
video = [
    "dep:waterui-video",
    "web-sys?/HtmlMediaElement",
    "web-sys?/HtmlTrackElement",
    "web-sys?/HtmlVideoElement",
    "web-sys?/MediaError",
    "web-sys?/MouseEvent",
    "web-sys?/PointerEventInit",
    "web-sys?/TextTrack",
    "web-sys?/TextTrackList",
    "web-sys?/TextTrackMode",
    "web-sys?/TimeRanges",
    "web-sys?/VideoPlaybackQuality",
    "web-sys?/WheelEventInit",
]
web = [
    "accessibility",
    "dep:console_error_panic_hook",
    "dep:futures",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[lints]
workspace = true

# cargo-machete: these entries exist to switch features on, not to be named
# in code — `waterui-url/std` exposes `Url::from_file_path` for the OS
# file-drop tests, and `icu_provider/logging` routes ICU4X data warnings
# through `log`.
[package.metadata.cargo-machete]
ignored = ["cfg_aliases", "waterui-url", "icu_provider"]
