[package]
name = "hydrolysis"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
waterui-core.workspace = true
waterui = { version = "0.2.1", path = "../..", default-features = false, features = ["gpu"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nami.workspace = true
waterui-graphics = { workspace = true, features = ["gpu"] }
shaderloom.workspace = true
waterui-canvas.workspace = true
waterui-text.workspace = true
waterui-icon.workspace = true
waterui-shape.workspace = true
waterui-video-gpu.workspace = true
waterui-map.workspace = true
waterui-map-gpu.workspace = true
waterui-webview.workspace = true
waterui-layout = { workspace = true, features = ["parallel"] }
waterui-controls.workspace = true
waterui-form.workspace = true
waterui-backend-core = { workspace = true, features = ["widgets", "gestures"] }
waterkit-clipboard.workspace = true
waterui-locale.workspace = true
vello.workspace = true
parley = { workspace = true, features = ["system"] }
wgpu.workspace = true
rayon = "1.12"
pollster.workspace = true
executor-core.workspace = true
rustc-hash.workspace = true
async-task = "4.7"
native-executor.workspace = true
winit = { version = "0.30", optional = true }
accesskit = { version = "0.24", optional = true }
accesskit_winit = { version = "0.33.2", optional = true }

[build-dependencies]
cfg_aliases = "0.2.2"
waterui-build-support.workspace = true

# Explicit ProMotion opt-in on macOS: a CADisplayLink created from the winit
# window's NSView declares the 120Hz frame-rate demand (see
# platform/macos_display_link.rs). All of these are already in winit's own
# dependency graph.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSResponder",
    "NSView",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSRunLoop",
    "NSString",
] }
objc2-quartz-core = { version = "0.3", optional = true, features = [
    "CADisplayLink",
    "CAFrameRateRange",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-time = "1"
web-sys = { version = "0.3", optional = true, features = [
    "Response",
    "CompositionEvent",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Node",
    "PointerEvent",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
waterui = { path = "../..", default-features = false, features = ["flow-markdown", "gpu"] }

[features]
default = []
accessibility = ["dep:accesskit"]
testing = []
winit = [
    "accessibility",
    "dep:winit",
    "dep:accesskit_winit",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-quartz-core",
]
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
[package.metadata.cargo-machete]
ignored = ["cfg_aliases", "waterui-backend-core"]
