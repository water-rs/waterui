[package]
name = "hydrolysis"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
waterui-core.workspace = true
waterui = { version = "0.2.1", path = "../..", default-features = false, features = ["gpu"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nami.workspace = true
waterui-graphics = { workspace = true, features = ["gpu"] }
shaderloom.workspace = true
waterui-canvas.workspace = true
waterui-text.workspace = true
waterui-icon.workspace = true
waterui-shape.workspace = true
waterui-video-gpu.workspace = true
waterui-map.workspace = true
waterui-map-gpu.workspace = true
waterui-webview = { workspace = true, optional = true }
waterui-chromium = { workspace = true, optional = true }
waterui-browser-cef = { workspace = true, optional = true }
waterui-layout = { workspace = true, features = ["parallel"] }
waterui-controls.workspace = true
waterui-form.workspace = true
waterui-backend-core = { workspace = true, features = ["widgets", "gestures"] }
waterkit-clipboard.workspace = true
waterui-locale.workspace = true
vello.workspace = true
parley = { workspace = true, features = ["system"] }
wgpu.workspace = true
rayon = "1.12"
pollster.workspace = true
executor-core.workspace = true
rustc-hash.workspace = true
async-task = "4.7"
native-executor.workspace = true
winit = { version = "0.30", optional = true }
accesskit = { version = "0.24", optional = true }
accesskit_winit = { version = "0.33.2", optional = true }

[build-dependencies]
cfg_aliases = "0.2.2"
waterui-build-support.workspace = true

# Explicit ProMotion opt-in on macOS: a CADisplayLink created from the winit
# window's NSView declares the 120Hz frame-rate demand (see
# platform/macos_display_link.rs). All of these are already in winit's own
# dependency graph.
[target.'cfg(target_os = "macos")'.dependencies]
base64 = { version = "0.22", optional = true }
block2 = { version = "0.6", optional = true }
cookie = { version = "0.18", optional = true }
ctrlc = { version = "3.5", features = ["termination"] }
futures = { workspace = true, optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSAnimation",
    "NSResponder",
    "NSView",
    "objc2-quartz-core",
] }
objc2-core-graphics = { version = "0.3", optional = true, features = ["CGPath"] }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSHTTPCookie",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
] }
objc2-quartz-core = { version = "0.3", optional = true, features = [
    "CALayer",
    "CADisplayLink",
    "CAFrameRateRange",
    "CAMetalLayer",
    "CAShapeLayer",
    "objc2-core-graphics",
] }
objc2-web-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKBackForwardList",
    "WKHTTPCookieStore",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKScriptMessage",
    "WKScriptMessageHandler",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
waterui-browser-wpe = { workspace = true, optional = true }
xkeysym = "0.2.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-time = "1"
web-sys = { version = "0.3", optional = true, features = [
    "Response",
    "CompositionEvent",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Node",
    "PointerEvent",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
waterui = { path = "../..", default-features = false, features = ["flow-markdown", "gpu"] }

[features]
default = []
accessibility = ["dep:accesskit"]
testing = []
webview-default = [
    "dep:waterui-webview",
    "dep:waterui-browser-wpe",
    "waterui-browser-wpe/webview",
    "dep:base64",
    "dep:block2",
    "dep:cookie",
    "dep:futures",
    "dep:objc2-web-kit",
    "dep:serde_json",
]
webview-system = [
    "dep:waterui-webview",
    "dep:base64",
    "dep:block2",
    "dep:cookie",
    "dep:futures",
    "dep:objc2-web-kit",
    "dep:serde_json",
]
webview-wpe = [
    "dep:waterui-webview",
    "dep:waterui-browser-wpe",
    "waterui-browser-wpe/webview",
]
webview-cef = [
    "dep:waterui-webview",
    "dep:waterui-browser-cef",
    "waterui-browser-cef/cef-runtime",
    "waterui-browser-cef/webview",
]
chromium = [
    "dep:waterui-chromium",
    "dep:waterui-browser-cef",
    "waterui-browser-cef/cef-runtime",
    "waterui-browser-cef/chromium",
]
winit = [
    "accessibility",
    "dep:winit",
    "dep:accesskit_winit",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-graphics",
    "dep:objc2-foundation",
    "dep:objc2-quartz-core",
]
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
[package.metadata.cargo-machete]
ignored = ["cfg_aliases", "waterui-backend-core"]
