# Perfetto config for bench/android rounds. Substitute ${DURATION_MS} before
# piping to `perfetto --txt -c -`.
#
# Imported from android-backend scripts/ci/e2e.py PERFETTO_CONFIG at the
# toolchain-lock revision, with the `android.surfaceflinger.frametimeline`
# data source added: window FrameMetrics measures the decor window and misses
# a GPU SurfaceView's presentation, so section 6's frame coverage requires
# actual per-surface present timestamps.
duration_ms: ${DURATION_MS}
buffers { size_kb: 65536 fill_policy: DISCARD }
data_sources { config {
  name: "linux.ftrace"
  ftrace_config {
    ftrace_events: "sched/sched_switch"
    ftrace_events: "sched/sched_wakeup"
    ftrace_events: "sched/sched_waking"
    ftrace_events: "sched/sched_process_exit"
    ftrace_events: "sched/sched_process_free"
    ftrace_events: "power/cpu_frequency"
    ftrace_events: "power/cpu_idle"
    ftrace_events: "mm_event/mm_event_record"
    atrace_categories: "am"
    atrace_categories: "wm"
    atrace_categories: "view"
    atrace_categories: "gfx"
    atrace_categories: "dalvik"
    atrace_categories: "binder_driver"
    atrace_categories: "binder_lock"
    atrace_apps: "*"
  }
} }
data_sources { config {
  name: "android.surfaceflinger.frametimeline"
} }
data_sources { config { name: "linux.process_stats"
  process_stats_config { scan_all_processes_on_start: true } } }
data_sources { config { name: "android.packages_list" } }
