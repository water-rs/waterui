# bench/android/suite.toml — the frozen fixture inventory for the Android
# benchmark harness (water-rs/hydrolysis#246, step 1).
#
# This file enumerates every fixture and dogfood screen android-backend's CI
# actually runs — every waterui example with a runnable `src/lib.rs`,
# INCLUDING the entries CI leaves at default policy — resolved against the
# pinned source revisions in toolchain-lock.json. It is the harness's single
# source of truth: run.py consumes this file, not android-backend's manifest.
#
# Fixture entry schema:
#
#   source          path of the fixture inside the pinned waterui checkout
#   package         application/bundle id the built APK installs as
#   mode            "verify" | "smoke" | "skip" — resolved CI policy
#   reason          required for smoke/skip; the CI-recorded justification
#   golden          path under bench/android/ to the baseline frame, or none
#   compose_twin    "registered" — a hand-written MD3 twin exists in
#                   reference/ — or "missing" (an explicit unfinished entry;
#                   section 6 of the plan requires a twin per fixture)
#   parity_budget   pixel-diffraction bound for the twin comparison; only
#                   present when compose_twin = "registered"
#   parity_budget_source   "blessed" (recorded in parity-budgets.json) or
#                   "default" (the strict fallback fraction)
#   role            "fixture" (default), "dogfood" (a whole app CI dogfoods),
#                   or "stress" (the load driver)
#   env             extra WATERUI_* intent env the fixture receives
#   settle_timeout_seconds / poll_interval_ms / pixel_tolerance /
#   max_diff_fraction   per-fixture overrides of [defaults]
#
# Every fixture implicitly also receives the shared launch env listed under
# [defaults.env] exactly as CI applies it.
#
# Result-schema note: run.py emits one JSON object per
# (backend, painter, fixture, script, round) carrying the full identity the
# plan's section 6 requires — backend, painter, app/screen/script, source and
# build revisions, environment, and the round index — plus the per-metric
# samples collected that round. compare.py pairs those rounds.

[provenance]
# The revisions this inventory was frozen from. The lock file carries the
# per-file hashes; these commits are the human-readable anchor.
android_backend = { repository = "water-rs/android-backend", revision = "ebaf59f04b987474ba099e62c94a288b189726cf" }
waterui = { repository = "water-rs/waterui", revision = "1b80ef536b547838e676c4ee04e74c78e78aa94d", branch = "dev" }
hydrolysis = { repository = "water-rs/hydrolysis", revision = "4a34cf9acf44218d496c43ecdee008f8f5eeabd7", branch = "dev" }

[defaults]
# android-backend e2e/manifest.json "defaults" block, verbatim.
settle_timeout_seconds = 25
poll_interval_ms = 400
pixel_tolerance = 8
max_diff_fraction = 0.005

# Applied to every example by CI: the generated MainActivity forwards these as
# waterui.env.* intent extras (Os.setenv before the native library loads).
[defaults.env]
WATERUI_DISABLE_DYNAMIC_COLORS = "1"

# ---------------------------------------------------------------------------
# skip — the two documented unsupported examples. Preserving these is
# required: introducing another skip is not parity, and removing a documented
# one would silently shrink the inventory.
# ---------------------------------------------------------------------------

[fixtures.chromium]
source = "examples/chromium"
package = "dev.waterui.examples.chromium"
mode = "skip"
reason = "CEF has no Android realization; the example cannot function on an emulator"
compose_twin = "missing"

[fixtures.webview-cef]
source = "examples/webview-cef"
package = "dev.waterui.examples.webviewcef"
mode = "skip"
reason = "CEF has no Android realization; the example cannot function on an emulator"
compose_twin = "missing"

