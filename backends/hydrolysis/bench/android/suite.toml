# ---------------------------------------------------------------------------
# Unfinished entries — the plan's acceptance for step 1 makes missing Compose
# twins explicit. Every fixture whose compose_twin = "missing" appears here,
# grouped by the section-6 family the finished reference must cover. An entry
# is complete when a twin is registered in reference/ AND its parity budget
# is recorded (or deliberately set to the strict default).
# ---------------------------------------------------------------------------

[unfinished.compose_twins]
# verify-mode fixtures missing a twin (twin + parity budget required):
verify = [
    "anchored_overlay", "drag_drop", "edge_layout", "edge_list", "edge_text",
    "flow_markdown", "icons", "locale", "markdown", "media_picker",
    "navigation", "shape", "snackbar",
]
# smoke-mode fixtures missing a twin (matching actions still required):
smoke = [
    "animation", "filter", "gallery", "gradient", "map", "multi_window",
    "reminders", "reply", "starfield", "stress", "video_player",
    "waterkit_camera_filters", "webview",
]
# skip-mode fixtures: their missing twins are recorded but blocked — the
# fixture itself has no Android realization, so twin work cannot run.
skip = ["chromium", "webview-cef"]

# Section-6 coverage the finished reference must add on top of the seven
# registered twins: the remaining core fixture screens in light/dark, CJK and
# RTL; a deterministic 1,000-row list stress case; the editing suite
# (single/multiline, password, selection, CJK composition, scrolling editor,
# keyboard/inset transitions); navigation/animation transition matching; the
# same local WebView document and native video/View embedding twins; and
# dogfood flows for Reply, gallery and the other CI dogfood apps (not merely
# launch screenshots).
