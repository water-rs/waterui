[package]
name = "waterui-gtk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GTK4 backend for WaterUI"

[dependencies]
waterui.workspace = true
waterui-core.workspace = true
waterui-backend-core.workspace = true
waterui-layout.workspace = true
waterui-navigation.workspace = true
waterui-text.workspace = true
waterui-controls.workspace = true
waterui-graphics.workspace = true
waterui-form.workspace = true
waterui-media.workspace = true
waterui-webview.workspace = true
nami.workspace = true
tracing.workspace = true

gtk4.workspace = true
gdk4.workspace = true
glib.workspace = true
cairo-rs.workspace = true
gdk-pixbuf = "0.20"

# GPU surface dependencies (wgpu is required for graphics views & filters).
wgpu.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gdk4-macos = { version = "0.9" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSView", "NSWindow"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-core-graphics"] }

[features]
default = []
webkitgtk = []

[lints]
workspace = true
