[package]
name = "waterui-gtk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GTK4 backend for WaterUI"

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
waterui.workspace = true
waterui-core.workspace = true
waterui-backend-core.workspace = true
waterui-layout.workspace = true
waterui-navigation.workspace = true
waterui-text.workspace = true
waterui-icon.workspace = true
waterui-controls.workspace = true
waterui-graphics.workspace = true
waterui-shape.workspace = true
waterui-form.workspace = true
waterui-media.workspace = true
waterui-webview.workspace = true
nami.workspace = true
tracing.workspace = true
executor-core.workspace = true
native-executor.workspace = true

gtk4 = { workspace = true, features = ["v4_6"] }
gdk4 = { workspace = true, features = ["v4_6"] }
glib.workspace = true
cairo-rs.workspace = true
gdk-pixbuf = "0.20"
base64 = "0.22"

# GPU surface dependencies (wgpu is required for graphics views & filters).
wgpu.workspace = true
glow = "0.16"
libloading = "0.9"
pollster.workspace = true

[features]
default = []
webkitgtk = []

[lints]
workspace = true
