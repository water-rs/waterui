[package]
name = "waterui-gtk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GTK4 backend for WaterUI"

[dependencies]
waterui.workspace = true
waterui-core.workspace = true
waterui-backend-core.workspace = true
waterui-layout.workspace = true
waterui-navigation.workspace = true
waterui-text.workspace = true
waterui-controls.workspace = true
waterui-graphics.workspace = true
waterui-form.workspace = true
waterui-media.workspace = true
nami.workspace = true
tracing.workspace = true

gtk4.workspace = true
gdk4.workspace = true
glib.workspace = true
cairo-rs.workspace = true
gdk-pixbuf = "0.20"

# GPU surface dependencies
wgpu = { workspace = true, optional = true }
wgpu-hal = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
epoxy = { version = "0.1", optional = true }
libloading = { version = "0.9", optional = true }

# Platform-specific GDK backends for GPU surface
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gdk4-x11 = { version = "0.9", optional = true }
gdk4-wayland = { version = "0.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
gdk4-macos = { version = "0.9", optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:wgpu-hal", "dep:glow", "dep:pollster", "dep:raw-window-handle", "dep:epoxy", "dep:libloading"]
x11 = ["gpu", "dep:gdk4-x11"]
wayland = ["gpu", "dep:gdk4-wayland"]
macos = ["gpu", "dep:gdk4-macos"]

[lints]
workspace = true
