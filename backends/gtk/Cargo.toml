[package]
name = "waterui-gtk"
version = "0.1.0"
edition.workspace = true
authors = ["Lexo Liu"]
license.workspace = true
rust-version.workspace = true
readme = "../../README.md"
repository = "https://github.com/water-rs/waterui"
description = "GTK4 backend for WaterUI"
keywords = ["ui", "gtk", "waterui", "gui", "backend"]
categories = ["gui"]

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
waterui.workspace = true
waterui-core.workspace = true
waterui-backend-core = { workspace = true, features = ["widgets", "gestures"] }
waterui-layout.workspace = true
waterui-navigation.workspace = true
waterui-text.workspace = true
waterui-icon.workspace = true
waterui-controls.workspace = true
waterui-graphics = { workspace = true, features = ["gpu"] }
waterui-shape.workspace = true
waterui-form.workspace = true
waterui-media.workspace = true
waterui-webview.workspace = true
nami.workspace = true
tracing.workspace = true
executor-core.workspace = true
futures.workspace = true
native-executor.workspace = true

gtk4 = { workspace = true, features = ["v4_6"] }
gdk4 = { workspace = true, features = ["v4_6"] }
glib.workspace = true
cairo-rs.workspace = true
gdk-pixbuf = "0.22"
base64 = "0.22"
serde_json = "1.0"

# GPU surface dependencies (wgpu is required for graphics views & filters).
wgpu.workspace = true
glow = "0.18"
libloading = "0.9"

[build-dependencies]
pkg-config = "0.3"

[features]
default = []
webkitgtk = []

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["cairo-rs", "gdk-pixbuf", "pkg-config", "waterui-media"]
