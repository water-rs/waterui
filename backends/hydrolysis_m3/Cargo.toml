[package]
name = "hydrolysis-m3"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
material-color-utils = { version = "0.1.3", default-features = false }
num-traits = { version = "0.2", default-features = false }
vello.workspace = true
waterui = { version = "0.3.0", path = "../..", default-features = false, features = ["snackbar"] }
waterui-backend-core = { workspace = true, features = ["widgets", "gestures"] }
waterui-core.workspace = true
waterui-controls.workspace = true
waterui-form.workspace = true
waterui-graphics = { workspace = true, features = ["gpu"] }

[dev-dependencies]
pollster.workspace = true
# The theme itself draws into the scene directly; only the shape gallery test
# authors a canvas.
waterui-canvas = { path = "../../components/visual/canvas" }
waterui-testing = { path = "../../testing" }

[package.metadata.waterui.assets]

[[package.metadata.waterui.assets.font]]
name = "Roboto"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK JP"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/06_NotoSansCJKjp.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK KR"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/07_NotoSansCJKkr.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK SC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/08_NotoSansCJKsc.zip"

[[package.metadata.waterui.assets.font]]
name = "Noto Sans CJK TC"
remote_path = "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/09_NotoSansCJKtc.zip"

[lints]
workspace = true
