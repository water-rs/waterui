[package]
name = "hydrolysis-style"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Renderer-independent style and widget-theme contract for Hydrolysis"
keywords = ["ui", "theme", "style", "waterui", "hydrolysis"]
categories = ["gui", "graphics"]

[dependencies]
cherenkov-record.workspace = true
kurbo.workspace = true
nami.workspace = true
waterui-controls.workspace = true
waterui-core.workspace = true
waterui-graphics.workspace = true
waterui-interaction.workspace = true
waterui-layout.workspace = true
waterui-navigation = { workspace = true, optional = true }
waterui-shape.workspace = true
waterui-text.workspace = true

[features]
default = ["all-controls"]
all-controls = [
    "menu",
    "calendar",
    "color-picker",
    "date-picker",
    "file-picker",
    "multi-date-picker",
    "picker",
    "secure-field",
    "slider",
    "stepper",
    "text-field",
    "toggle",
    "validation",
    "list",
    "table",
    "navigation",
]
menu = ["waterui-controls/menu", "waterui-core/menu"]
calendar = ["waterui-core/calendar"]
color-picker = ["waterui-core/color-picker"]
date-picker = ["calendar", "stepper", "menu", "waterui-core/date-picker"]
file-picker = ["waterui-core/file-picker"]
multi-date-picker = ["calendar", "waterui-core/multi-date-picker"]
picker = ["menu", "waterui-core/picker"]
secure-field = ["menu", "waterui-core/secure-field"]
slider = ["waterui-controls/slider", "waterui-core/slider"]
stepper = ["waterui-controls/stepper", "waterui-core/stepper"]
text-field = ["menu", "waterui-controls/text-field", "waterui-core/text-field"]
toggle = ["waterui-controls/toggle", "waterui-core/toggle"]
validation = ["text-field", "waterui-core/validation"]
list = ["waterui-controls/list", "waterui-core/list"]
table = ["list", "waterui-controls/table", "waterui-core/table"]
navigation = ["text-field", "dep:waterui-navigation", "waterui-core/navigation"]

[dev-dependencies]
approx = "0.5"

[lints]
workspace = true
