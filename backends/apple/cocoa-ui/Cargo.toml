[package]
name = "cocoa-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/water-rs/waterui"
readme = "README.md"
# In-tree workspace crate — platform backend policy publishes nothing from
# this repository; crates.io resolution stays on the standalone upstream.
publish = false
description = "A safe, idiomatic Rust API over AppKit and UIKit, built on objc2"
keywords = ["appkit", "uikit", "objc2", "macos", "ios"]
categories = ["gui", "os::macos-apis", "api-bindings"]

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin", "aarch64-apple-ios"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }

[features]
# The `MapKit` surface (`map` module) carries the `MapKit` framework link
# through `objc2-map-kit`; opt-in so apps without a map link none of it.
map = ["dep:objc2-map-kit", "dep:objc2-core-location"]
# The `AVFoundation`/`AVKit` surface (`avkit` module) carries the media
# framework links through the `objc2-av-*` family; opt-in so apps without
# media playback compile and link none of it. `objc2-av-kit` only exists on
# `macOS` (`AVPlayerView`), where `avkit.rs` uses it.
avkit = ["dep:objc2-av-foundation", "dep:objc2-core-media", "dep:objc2-av-kit"]
# The `WebKit` surface (`web_kit` module) carries the `WebKit` and `Security`
# framework links; opt-in so apps without a web view link neither.
webview = ["dep:objc2-web-kit", "dep:objc2-security"]
# Harness-only reach for `tests/native`: compiles the doc(hidden)
# test-support entry points that touch implementation-private surfaces
# (`accessory_overlay_window_for_test`), never part of a production build.
native-test = []

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
