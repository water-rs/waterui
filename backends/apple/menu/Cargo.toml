[package]
name = "waterui-apple-menu"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Projects WaterUI menus onto the native menu tree of cocoa-ui, for the Apple and Hydrolysis hosts"
keywords = ["menu", "appkit", "uikit"]
categories = ["gui"]

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
waterui-controls = { workspace = true, features = ["menu"] }
waterui-core.workspace = true
nami.workspace = true
tracing.workspace = true
cocoa-ui = { path = "../cocoa-ui", version = "0.1.0", default-features = false }
