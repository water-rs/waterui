[package]
name = "waterui-dew"
version = "0.1.0"
edition.workspace = true
authors = ["Lexo Liu"]
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/water-rs/waterui"
description = "Dew: WaterUI's embedded-first CPU rendering backend"
keywords = ["ui", "backend", "waterui", "embedded", "gui"]
categories = ["gui", "embedded"]

[features]
default = ["system-fonts", "progress", "host", "gestures"]
# Host-side surfaces: the in-memory framebuffer (`BufferDisplay`), the
# reference `HostBoard`, and PNG snapshot export. Firmware builds
# (default-features = false) drop them along with the PNG encoder they pull
# in — a flash image has no use for either.
host = ["vello_cpu/png"]
# Embedded-device simulator: a desktop window standing in for the panel of
# an embedded device, running the full dew pipeline natively (winit + softbuffer).
embedded-simulator = [
    "host",
    "dep:winit",
    "dep:softbuffer",
    "dep:executor-core",
    "dep:native-executor",
    # The simulator owns a winit loop, so it drives the same cooperative
    # executor the firmware entry point uses.
    "dep:async-executor",
]
# ESP-IDF runtime entry: a complete firmware main-loop for ESP32-class
# chips; generated harnesses call `espidf::run` and nothing else.
espidf = [
    "dep:esp-idf-svc",
    "dep:log",
    "dep:waterui",
    "dep:executor-core",
    "dep:native-executor",
    "native-executor/polyfill",
    "dep:async-executor",
]
# Desktop font enumeration; firmware targets disable this and register
# bundled fonts into the parley FontContext instead.
system-fonts = ["parley/system"]
# Interaction metadata: `Metadata<GestureObserver>` (tap / long-press / drag /
# pinch / rotate) and `Metadata<OnEvent>` (hover enter / move / exit). The
# recognizer state machines come from `waterui-backend-core`, which pulls the
# `waterui` facade the gesture event payloads are defined in — the same reason
# `progress` is gated. A firmware build that drops this feature keeps a
# pointer-driven UI (buttons, toggles, sliders, tabs all route through
# `PointerRouter`); what it loses is the `.gesture(...)` / `.on_hover(...)`
# modifier surface, and a view carrying that metadata fails fast in dispatch
# rather than rendering as if the handler were wired.
gestures = ["waterui-backend-core/gestures"]
# The Progress widget's config type lives in the `waterui` facade crate,
# which pulls the visual component stack (and thus a GPU graphics build).
# Gating it keeps the lean firmware graph (default-features = false) free of
# the facade; desktop and simulator builds enable it by default.
progress = ["dep:waterui"]

[dependencies]
accesskit = "0.24"
waterui-core.workspace = true
waterui-backend-core.workspace = true
waterui-controls.workspace = true
waterui-graphics.workspace = true
waterui-layout.workspace = true
# Navigation is `no_std` and pulls no renderer of its own, so it stays in the
# lean firmware graph: a device with two screens needs a way between them.
waterui-navigation.workspace = true
# Default features off: the shape crate's default is a wgpu-backed morph
# renderer, and dew's graph is GPU-free by design.
waterui-shape = { workspace = true, default-features = false }
waterui-text.workspace = true
nami.workspace = true
# FrameWork and ChipBudget serialize into the performance report. The
# workspace pins serde without default features, which suits a firmware graph.
serde = { workspace = true, features = ["derive"] }
parley = { workspace = true, features = ["libm"] }
kurbo.workspace = true
peniko.workspace = true
skrifa.workspace = true
# Default features deliberately off: they include the PNG encoder, which
# only the host-side snapshot surface needs — see the `host` feature.
vello_cpu = { workspace = true, features = [
    "std",
    "text",
    "u8_pipeline",
    "f32_pipeline",
] }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
executor-core = { workspace = true, optional = true }
native-executor = { workspace = true, optional = true }
async-executor = { version = "1", optional = true }
log = { version = "0.4", optional = true }
waterui = { version = "0.3.0", path = "../..", default-features = false, optional = true }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "0.52", optional = true }

[dev-dependencies]
waterui-testing = { path = "../../testing" }
# The theme installation API (`Theme`, `ColorSettings`, `FontSettings`) and the
# authoring prelude every test view tree is written in live in the facade
# crate, and nothing below it exposes them. The library reaches the facade only
# through the optional `progress` feature, so without this entry the test
# targets compile in exactly one feature shape — the default one — and the
# firmware shape's tests do not build at all. Tests are host-side and never
# enter a flash image, so depending on the facade here costs the firmware graph
# nothing.
waterui = { path = "../..", default-features = false }
# Scene content, for the tests that prove `Scene2D` drawings render on dew's
# CPU rasterizer unchanged. Test-only on purpose: dew draws a scene through
# the engine-neutral contract and never needs to know which component produced
# it, so the library gains no component dependency. These crates currently ask
# `waterui-graphics` for its `gpu` feature (`CanvasImage` decodes through it),
# which is why they are confined to dev-dependencies — the firmware graph,
# built from the library alone, stays GPU-free.
waterui-canvas = { path = "../../components/visual/canvas" }
waterui-svg.workspace = true
# The component issue #180 is actually about: an interactive chart wraps its
# canvas in `Metadata<GestureObserver>` and `Metadata<OnEvent>`, and every one
# of those wrappers used to abort dew's dispatch. Test-only, like the scene
# crates above and for the same reason.
waterui-chart = { path = "../../components/data/chart" }
fearless_simd = { version = "0.4", features = ["force_support_fallback"] }
executor-core.workspace = true
native-executor.workspace = true
# The performance simulation emits its report as serialized TOML rather than
# hand-concatenated lines.
toml = "1.1.3"

# Every integration test declares the feature shape it needs, the way the
# simulator example does. `host` buys the in-memory framebuffer (`HostBoard`,
# `BufferDisplay`) and the PNG snapshot entry these tests inspect; `progress`
# buys the Progress widget's config type, without which dew has no handler to
# dispatch a progress bar to. A test that needs neither — `fallback_probe`, the
# scalar-rasterizer probe — is left to auto-discovery and runs in every shape,
# firmware included.
[[test]]
name = "accessibility"
required-features = ["host"]

[[test]]
name = "dispatch_views"
required-features = ["host"]

[[test]]
name = "form_render"
required-features = ["host", "progress"]

[[test]]
name = "interaction_metadata"
required-features = ["host", "gestures"]

[[test]]
name = "interaction_without_gestures"
required-features = ["host", "system-fonts"]

[[test]]
name = "navigation_render"
required-features = ["host"]

[[test]]
name = "scene_render"
required-features = ["host"]

[[test]]
name = "shape_render"
required-features = ["host"]

[[test]]
name = "smoke_frame"
required-features = ["host"]

[[test]]
name = "tabs_render"
required-features = ["host"]

# The embedded simulation models a panel bus and a flash-bundled font, so it
# wants no host surface at all — only the payment-progress bar its work and
# memory budgets are calibrated around. It is the one integration test that
# runs in the firmware shape (`--no-default-features --features progress`),
# which is the point of it.
[[test]]
name = "vending_performance"
required-features = ["progress"]

[[example]]
name = "watch_sim"
required-features = ["embedded-simulator"]

[lints]
workspace = true
