[package]
name = "waterui-macros"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Macro for WaterUI"
keywords = ["macro", "derive", "ui"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full", "visit-mut"] }
icu_locale_core = { version = "2.2", features = ["alloc"] }
icu_locid = "2.0"
icu_locid_transform = "2.0"
toml = "1.1"
proc-macro-crate = "3"

[dev-dependencies]
hydrolysis-m3.workspace = true
trybuild = "1.0"
# The JavaScript-bridge macros expand against `::waterui::webview`, which is not
# a default feature; their doc examples cannot compile without it.
waterui = { workspace = true, features = ["webview"] }
waterui-testing.workspace = true

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["icu_locid", "icu_locid_transform"]
