[package]
name = "waterui-macros"
version = "0.5.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Macro for WaterUI"
keywords = ["macro", "derive", "ui"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
widgets = ["dep:serde_json"]

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0.9", default-features = false, features = ["parsing", "printing", "proc-macro", "full", "visit-mut"] }
icu_locale_core = { version = "2.3", features = ["alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
toml = "1.1.8"
proc-macro-crate = "3"
# A TypeScript property name is an ECMAScript IdentifierName, whose character
# classes are the Unicode ID_Start/ID_Continue sets; syn already links this.
unicode-ident = "1"

[dev-dependencies]
trybuild = "1.0"
# The JavaScript-bridge macros expand against `::waterui::webview`, which is not
# a default feature; their doc examples cannot compile without it.
waterui = { path = "..", features = ["webview"] }
waterui-testing = { path = "../testing" }

[lints]
workspace = true
