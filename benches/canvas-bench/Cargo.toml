[package]
name = "canvas_bench"
version = "0.1.0"
edition = "2024"
authors = ["lexoliu"]

[lib]
crate-type = ["lib"]

[profile.release]
# Performance benchmark: optimize for speed, matching a release-tuned app.
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

[features]
dev = ["waterui/dynamic_linking"]
# Video playback. Off by default: it links the framework's video stack, which
# on Linux needs VA-API 1.19+ and PipeWire 0.3.65+ to build. Enable it when the
# app uses video: `cargo build --features media`, or add it to `default`.
media = ["waterui/media"]

[dependencies.waterui]
path = "../.."
default-features = false
features = ["gpu"]

[target.'cfg(not(any(target_arch = "wasm32", target_os = "espidf")))'.dependencies.waterui]
path = "../.."
default-features = false
features = ["gpu"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
cocoa-ui = { path = "../../backends/apple/cocoa-ui" }
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFDate"] }
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSRunLoop", "NSValue"] }
objc2-metal = { version = "0.3", features = ["MTLDevice"] }
objc2-quartz-core = { version = "0.3", features = ["CADisplayLink", "CAFrameRateRange", "objc2-core-foundation"] }

